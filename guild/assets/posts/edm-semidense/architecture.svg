<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 760" width="1060" height="760">
  <defs>
    <style>
      .font-base { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 12.5px; fill: #4B5563; }
      .stage-title { font-size: 14px; font-weight: 700; }
      .box-title { font-size: 13px; font-weight: 700; }
      .box-sub { font-size: 11.2px; }
      .dim-text { font-size: 10.8px; font-family: Consolas, "Courier New", "Microsoft YaHei", monospace; }
      .edge-label { font-size: 10.8px; font-weight: 600; fill: #374151; }
      .legend-text { font-size: 11.5px; fill: #374151; }
    </style>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#2783DE"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#46A171"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#D5803B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect x="0" y="0" width="1060" height="760" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="530" y="34" text-anchor="middle" class="font-base title">EDM（Efficient Deep Feature Matching）端到端全链路架构图</text>
  <text x="530" y="56" text-anchor="middle" class="font-base subtitle">深而窄主干下沉至 1/32 尺度 → 相关性注入模块 (CIM) 渐进聚合至 1/8 → 高效粗匹配 → 轻量双向轴回归细匹配 (ABRHead)</text>

  <!-- ==================== STAGE (a): Feature Extraction ==================== -->
  <rect x="24" y="76" width="256" height="328" rx="12" fill="#F8FBFF" stroke="#B5CFE9" stroke-width="1.5"/>
  <text x="152" y="100" text-anchor="middle" class="font-base stage-title" fill="#153B60">(a) 特征提取 · 深而窄 ResNet-18</text>

  <!-- Input Pair -->
  <rect x="42" y="114" width="220" height="48" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="152" y="135" text-anchor="middle" class="font-base box-title" fill="#111827">输入图像对 I^A, I^B</text>
  <text x="152" y="152" text-anchor="middle" class="font-base dim-text" fill="#4B5563">[B, C_in, H, W]（如 640×480）</text>

  <line x1="152" y1="162" x2="152" y2="178" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

  <!-- Multi-scale Feature Pyramid -->
  <rect x="42" y="180" width="220" height="28" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.2"/>
  <text x="152" y="198" text-anchor="middle" class="font-base dim-text" fill="#153B60">1/2 尺度 · [B, 32, H/2, W/2]</text>

  <rect x="42" y="216" width="220" height="28" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.2"/>
  <text x="152" y="234" text-anchor="middle" class="font-base dim-text" fill="#153B60">1/4 尺度 · [B, 64, H/4, W/4]</text>

  <rect x="42" y="252" width="220" height="40" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="2"/>
  <text x="152" y="269" text-anchor="middle" class="font-base box-title" fill="#153B60">1/8 局部特征 F_f^A, F_f^B</text>
  <text x="152" y="285" text-anchor="middle" class="font-base dim-text" fill="#153B60">[B, 128, H/8, W/8]（IL-2 与细匹配复用）</text>

  <rect x="42" y="300" width="220" height="36" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="152" y="316" text-anchor="middle" class="font-base box-title" fill="#153B60">1/16 局部特征</text>
  <text x="152" y="330" text-anchor="middle" class="font-base dim-text" fill="#153B60">[B, 256, H/16, W/16]（送入 IL-1）</text>

  <rect x="42" y="344" width="220" height="44" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="2"/>
  <text x="152" y="363" text-anchor="middle" class="font-base box-title" fill="#153B60">1/32 深度特征 F_d^A, F_d^B</text>
  <text x="152" y="380" text-anchor="middle" class="font-base dim-text" fill="#153B60">[B, 256, H/32, W/32]（全局语义）</text>

  <!-- ==================== STAGE (b): CIM ==================== -->
  <rect x="308" y="76" width="356" height="328" rx="12" fill="#F6FBF8" stroke="#B3CFC0" stroke-width="1.5"/>
  <text x="486" y="100" text-anchor="middle" class="font-base stage-title" fill="#1F5138">(b) 相关性注入模块（CIM）</text>

  <!-- IL-2 (top) -->
  <rect x="328" y="116" width="316" height="68" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.8"/>
  <text x="486" y="137" text-anchor="middle" class="font-base box-title" fill="#1F5138">注入层 IL-2（1/16 → 1/8 上采样融合）</text>
  <text x="486" y="155" text-anchor="middle" class="font-base box-sub" fill="#1F5138">CBA 门控注入 1/8 局部特征 + 全局残差 + DWConv3×3</text>
  <text x="486" y="173" text-anchor="middle" class="font-base dim-text" fill="#1F5138">输出粗特征 F_c^A, F_c^B · [B, C_c, H/8, W/8]</text>

  <!-- IL-1 (middle) -->
  <rect x="328" y="212" width="316" height="64" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="486" y="233" text-anchor="middle" class="font-base box-title" fill="#1F5138">注入层 IL-1（1/32 → 1/16 上采样融合）</text>
  <text x="486" y="251" text-anchor="middle" class="font-base box-sub" fill="#1F5138">CBA 生成细节权重 × 1/16 局部特征 + CB 全局特征</text>
  <text x="486" y="267" text-anchor="middle" class="font-base dim-text" fill="#1F5138">经 DWConv3×3 抗混叠 · [B, 256, H/16, W/16]</text>

  <!-- Transformer (bottom) -->
  <rect x="328" y="306" width="316" height="82" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="2"/>
  <text x="486" y="328" text-anchor="middle" class="font-base box-title" fill="#1F5138">交替 Self &amp; Cross Attention × L（L = 2）</text>
  <text x="486" y="346" text-anchor="middle" class="font-base box-sub" fill="#1F5138">查询-键归一化注意力 QKNA（s = 20）+ 2D RoPE</text>
  <text x="486" y="364" text-anchor="middle" class="font-base dim-text" fill="#1F5138">Token 仅 M/16 = (H/32)·(W/32)（640×480 仅 300 个）</text>
  <text x="486" y="380" text-anchor="middle" class="font-base dim-text" fill="#1F5138">输出全局相关性特征 · [B, 256, H/32, W/32]</text>

  <!-- Internal CIM arrows (bottom-up) -->
  <line x1="486" y1="306" x2="486" y2="278" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <line x1="486" y1="212" x2="486" y2="186" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Connections from Stage (a) to Stage (b) -->
  <!-- 1/32 -> Transformer -->
  <path d="M 262 366 L 326 366" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <!-- 1/16 -> IL-1 -->
  <path d="M 262 318 L 292 318 L 292 244 L 326 244" fill="none" stroke="#2783DE" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <!-- 1/8 -> IL-2 -->
  <path d="M 262 272 L 284 272 L 284 150 L 326 150" fill="none" stroke="#2783DE" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- ==================== STAGE (c): Coarse Matching ==================== -->
  <rect x="692" y="76" width="344" height="328" rx="12" fill="#F6FBF8" stroke="#B3CFC0" stroke-width="1.5"/>
  <text x="864" y="100" text-anchor="middle" class="font-base stage-title" fill="#1F5138">(c) 高效粗匹配（Coarse Matching）</text>

  <!-- Flatten & Similarity -->
  <rect x="712" y="116" width="304" height="58" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="864" y="137" text-anchor="middle" class="font-base box-title" fill="#1F5138">展平与内积相似度矩阵 S</text>
  <text x="864" y="154" text-anchor="middle" class="font-base dim-text" fill="#1F5138">Flatten → [B, M, C_c], M = (H/8)·(W/8)</text>
  <text x="864" y="168" text-anchor="middle" class="font-base dim-text" fill="#1F5138">S = &lt;F̃_c^A(i), F̃_c^B(j)&gt; / τ · [B, M, M]</text>

  <line x1="864" y1="174" x2="864" y2="194" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- Efficient Dual-Softmax -->
  <rect x="712" y="196" width="304" height="62" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.8"/>
  <text x="864" y="216" text-anchor="middle" class="font-base box-title" fill="#1F5138">高效 Dual-Softmax → 概率矩阵 P_c</text>
  <text x="864" y="233" text-anchor="middle" class="font-base box-sub" fill="#1F5138">仅算一次指数 Z = exp(S)，避免重复指数运算</text>
  <text x="864" y="249" text-anchor="middle" class="font-base dim-text" fill="#1F5138">P_c = (Z / ‖Z_row‖_1) ⊙ (Z / ‖Z_col‖_1)</text>

  <line x1="864" y1="258" x2="864" y2="278" stroke="#D5803B" stroke-width="1.6" marker-end="url(#arrow-orange)"/>

  <!-- Row-Max Top-K Filtering -->
  <rect x="712" y="280" width="304" height="64" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.8"/>
  <text x="864" y="300" text-anchor="middle" class="font-base box-title" fill="#70401C">行最大 + Top-K + 阈值 θ_c 筛选</text>
  <text x="864" y="318" text-anchor="middle" class="font-base box-sub" fill="#70401C">替代互近邻 MNN · 固定形状支持小批量/TensorRT</text>
  <text x="864" y="334" text-anchor="middle" class="font-base dim-text" fill="#70401C">θ_c = 5e-2 → 输出 K 对粗匹配索引与网格中心</text>

  <!-- Training-only Coarse Loss -->
  <rect x="712" y="356" width="304" height="34" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="864" y="377" text-anchor="middle" class="font-base box-sub" fill="#70401C">仅训练：Focal Loss L_c（α=0.25, γ=2, λ_c=1.0）</text>

  <!-- Arrow from IL-2 to Stage (c) -->
  <path d="M 644 150 L 710 150" fill="none" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- ==================== ROUTING CORRIDOR (Row 1 -> Row 2) ==================== -->
  <!-- F_f from Stage (a) 1/8 goes down along left edge into Stage (d) Box d1 -->
  <path d="M 42 272 L 12 272 L 12 552 L 42 552" fill="none" stroke="#2783DE" stroke-width="1.6" marker-end="url(#arrow-blue)"/>
  <rect x="18" y="413" width="112" height="20" rx="4" fill="#FFFFFF"/>
  <text x="74" y="427" text-anchor="middle" class="font-base edge-label" fill="#153B60">1/8 主干 F_f^A, F_f^B</text>

  <!-- F_c from IL-2 routed down to Stage (d) Box d1 -->
  <path d="M 664 150 L 678 150 L 678 424 L 140 424 L 140 494" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <rect x="330" y="413" width="176" height="20" rx="4" fill="#FFFFFF"/>
  <text x="418" y="427" text-anchor="middle" class="font-base edge-label" fill="#1F5138">粗特征 F_c^A, F_c^B（与 F_f 逐元素相加）</text>

  <!-- Coarse Match indices from Stage (c) to Box d1 AND Coarse centers to Box d4 -->
  <path d="M 864 344 L 864 436 L 195 436 L 195 494" fill="none" stroke="#D5803B" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrow-orange)"/>
  <rect x="556" y="426" width="150" height="18" rx="4" fill="#FFFFFF"/>
  <text x="631" y="439" text-anchor="middle" class="font-base edge-label" fill="#70401C">粗匹配索引 indices</text>

  <!-- Coarse Match grid centers to Box d4 -->
  <path d="M 960 344 L 960 486" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <rect x="880" y="414" width="160" height="20" rx="4" fill="#FFFFFF"/>
  <text x="960" y="428" text-anchor="middle" class="font-base edge-label" fill="#422578">粗匹配中心坐标 P^A, P^B</text>

  <!-- ==================== STAGE (d): Fine Matching ==================== -->
  <rect x="24" y="452" width="1012" height="246" rx="12" fill="#FFFBF7" stroke="#EBC9A6" stroke-width="1.5"/>
  <text x="530" y="476" text-anchor="middle" class="font-base stage-title" fill="#70401C">(d) 细匹配 · 轻量双向轴回归头（ABRHead · 直接在 1/8 特征隐式回归，告别 1/2 高分热图）</text>

  <!-- d1: Feature Fusion & Indexing -->
  <rect x="44" y="496" width="194" height="114" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="141" y="518" text-anchor="middle" class="font-base box-title" fill="#153B60">1/8 细特征融合与索引</text>
  <text x="141" y="538" text-anchor="middle" class="font-base box-sub" fill="#153B60">F_f ⊕ F_c（逐元素和）</text>
  <text x="141" y="558" text-anchor="middle" class="font-base box-sub" fill="#153B60">按粗匹配 indices 提取对应特征</text>
  <text x="141" y="578" text-anchor="middle" class="font-base dim-text" fill="#153B60">展平为 F^A, F^B · [K, C]</text>
  <text x="141" y="598" text-anchor="middle" class="font-base box-sub" fill="#2783DE">无 FPN 上采样至 1/2 开销</text>

  <line x1="238" y1="553" x2="262" y2="553" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow-dark)"/>

  <!-- d2: Bidirectional Encoding & Merge -->
  <rect x="264" y="496" width="212" height="114" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.6"/>
  <text x="370" y="518" text-anchor="middle" class="font-base box-title" fill="#70401C">双向对偶构造与 MLP 合并</text>
  <text x="370" y="538" text-anchor="middle" class="font-base dim-text" fill="#70401C">Query: [F^A, F^B] → Query MLP</text>
  <text x="370" y="556" text-anchor="middle" class="font-base dim-text" fill="#70401C">Ref:   [F^B, F^A] → Ref MLP</text>
  <text x="370" y="576" text-anchor="middle" class="font-base box-sub" fill="#70401C">沿特征维 Concat → Merge MLP</text>
  <text x="370" y="596" text-anchor="middle" class="font-base dim-text" fill="#70401C">单次推理产出 2K 组双向细特征</text>

  <line x1="476" y1="553" x2="500" y2="553" stroke="#D5803B" stroke-width="1.6" marker-end="url(#arrow-orange)"/>

  <!-- d3: X/Y ABRHead -->
  <rect x="502" y="490" width="234" height="126" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="2"/>
  <text x="619" y="512" text-anchor="middle" class="font-base box-title" fill="#70401C">X 轴 / Y 轴回归头（ABRHead）</text>
  <text x="619" y="532" text-anchor="middle" class="font-base box-sub" fill="#70401C">双独立线性层 → 各降至 N + 1 维 (N=16)</text>
  <text x="619" y="552" text-anchor="middle" class="font-base dim-text" fill="#70401C">N 维 → soft-argmax → 偏移 Δ_x, Δ_y</text>
  <text x="619" y="571" text-anchor="middle" class="font-base dim-text" fill="#70401C">1 维 → sigmoid → 标准差 σ_x, σ_y</text>
  <text x="619" y="592" text-anchor="middle" class="font-base box-sub" fill="#70401C">SCC 隐式编码 8×8 网格（0.5px/箱）</text>
  <text x="619" y="608" text-anchor="middle" class="font-base box-sub" fill="#70401C">天然约束窗口边界，消除越界外点</text>

  <!-- Training-only RLE Loss under d3 -->
  <line x1="619" y1="616" x2="619" y2="632" stroke="#D5803B" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#arrow-orange)"/>
  <rect x="502" y="634" width="234" height="50" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="619" y="654" text-anchor="middle" class="font-base box-title" fill="#70401C">仅训练：Normalizing Flow + RLE Loss</text>
  <text x="619" y="673" text-anchor="middle" class="font-base box-sub" fill="#70401C">λ_f = 0.2 · 推理完全移除流模型（0 开销）</text>

  <line x1="736" y1="553" x2="760" y2="553" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- d4: Fine Filtering & Final Output -->
  <rect x="762" y="490" width="256" height="126" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
  <text x="890" y="512" text-anchor="middle" class="font-base box-title" fill="#422578">细匹配筛选 &amp; 最终亚像素输出</text>
  <text x="890" y="534" text-anchor="middle" class="font-base dim-text" fill="#422578">置信度 P_f = 1 - (σ_x + σ_y) / 2</text>
  <text x="890" y="554" text-anchor="middle" class="font-base box-sub" fill="#422578">双向配对中择优（留 P_f 更高 / σ 更小）</text>
  <text x="890" y="574" text-anchor="middle" class="font-base box-sub" fill="#422578">过滤条件：P_f &gt; θ_f（θ_f = 1e-6）</text>
  <text x="890" y="596" text-anchor="middle" class="font-base box-title" fill="#422578">粗网格中心 + (Δ_x, Δ_y) → 最终匹配</text>

  <!-- Performance Badge under d4 -->
  <rect x="762" y="634" width="256" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="890" y="654" text-anchor="middle" class="font-base box-title" fill="#111827">ScanNet 640×480 推理性能（RTX 3090）</text>
  <text x="890" y="673" text-anchor="middle" class="font-base dim-text" fill="#374151">10.2M 参数 · 72.6G FLOPs · 16.7ms (TRT 6.72ms)</text>

  <!-- Summary Tip Box under d1-d2 -->
  <rect x="44" y="634" width="432" height="50" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
  <text x="260" y="654" text-anchor="middle" class="font-base box-title" fill="#111827">四阶段全链路提速亮点（对比 EfficientLoFTR，640×480）</text>
  <text x="260" y="673" text-anchor="middle" class="font-base box-sub" fill="#374151">提取 -56.1% · 变换 -34.5% · 粗匹配 -70.4% · 细匹配 -76.6% → 总体快 2.3×</text>

  <!-- ==================== Legend ==================== -->
  <g transform="translate(155, 716)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
    <text x="24" y="13" class="font-base legend-text">输入 / 统计摘要</text>

    <rect x="148" y="0" width="16" height="16" rx="3" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.2"/>
    <text x="172" y="13" class="font-base legend-text">主干特征提取</text>

    <rect x="284" y="0" width="16" height="16" rx="3" fill="#E8F1EC" stroke="#46A171" stroke-width="1.2"/>
    <text x="308" y="13" class="font-base legend-text">相关性建模与粗匹配</text>

    <rect x="462" y="0" width="16" height="16" rx="3" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2"/>
    <text x="486" y="13" class="font-base legend-text">筛选 / 细回归 / 训练损失</text>

    <rect x="660" y="0" width="16" height="16" rx="3" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="684" y="13" class="font-base legend-text">最终亚像素输出</text>
  </g>
</svg>
