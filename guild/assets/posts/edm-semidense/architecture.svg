<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="385" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 1：EDM（高效无检测器匹配）整体工作流程</text>
  <text x="480" y="62" text-anchor="middle" class="sub">深而窄主干 → 1/32 深层交互再注入 1/8 → 单次指数极速粗配 → 双向 1D 轴回归精修</text>

  <rect x="24" y="94" width="186" height="236" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="117" y="122" text-anchor="middle" class="h" fill="#1E3A8A">① 深而窄骨干</text>
  <rect x="42" y="144" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="117" y="170" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">减通道 ResNet-18</text>
  <text x="117" y="192" text-anchor="middle" class="s">通道窄省带宽，靠深保语义</text>
  <rect x="42" y="230" width="150" height="72" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="117" y="256" text-anchor="middle" class="b" fill="#1E40AF" font-weight="700">提 1/8、1/16、1/32</text>
  <text x="117" y="278" text-anchor="middle" class="s">无需昂贵的 1/2 特征图！</text>

  <line x1="210" y1="212" x2="244" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <rect x="250" y="94" width="222" height="236" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="361" y="122" text-anchor="middle" class="h" fill="#166534">② 相关性注入 CIM</text>
  <rect x="268" y="144" width="186" height="72" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="361" y="170" text-anchor="middle" class="b" fill="#15803D" font-weight="700">在 1/32 算全局交互</text>
  <text x="361" y="192" text-anchor="middle" class="s">词元极少，QKNA 闪电跑完</text>
  <rect x="268" y="230" width="186" height="72" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="361" y="256" text-anchor="middle" class="b" fill="#14532D" font-weight="700">门控注入层（IL）</text>
  <text x="361" y="278" text-anchor="middle" class="s">把全局相关性逐级喂回 1/8</text>

  <line x1="472" y1="212" x2="506" y2="212" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="512" y="94" width="194" height="236" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="609" y="122" text-anchor="middle" class="h" fill="#9A3412">③ 极速粗匹配</text>
  <rect x="530" y="144" width="158" height="72" rx="8" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.5"/>
  <text x="609" y="170" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">单次指数双 Softmax</text>
  <text x="609" y="192" text-anchor="middle" class="s">exp 只算一遍，省一半开销</text>
  <rect x="530" y="230" width="158" height="72" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
  <text x="609" y="256" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">行最大 + Top-K</text>
  <text x="609" y="278" text-anchor="middle" class="s">干掉耗时的双向 MNN</text>

  <line x1="706" y1="212" x2="740" y2="212" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <rect x="746" y="94" width="190" height="236" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="841" y="122" text-anchor="middle" class="h" fill="#5B21B6">④ 双向轴回归精修</text>
  <rect x="764" y="144" width="154" height="72" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="841" y="170" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">ABRHead 1D 轴预测</text>
  <text x="841" y="192" text-anchor="middle" class="s">避开 2D 高分辨率热力图</text>
  <rect x="764" y="230" width="154" height="72" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="841" y="256" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">不确定度 σ 过滤</text>
  <text x="841" y="278" text-anchor="middle" class="s">极速输出精准亚像素点对</text>

  <text x="480" y="364" text-anchor="middle" class="s">专为低延迟工程部署打磨，全算子规整，原生支持 ONNX / TensorRT 极速推理</text>

</svg>