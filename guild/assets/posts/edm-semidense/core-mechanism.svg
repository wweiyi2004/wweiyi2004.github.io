<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：相关性注入模块（CIM）——为什么把交互搬到 1/32 再往下“喂”？</text>
  <text x="480" y="62" text-anchor="middle" class="sub">避开在 1/8 大图上反复跑 Transformer：在 1/32 极速算完全局，再逐级门控注入局部细节</text>

  <!-- Left: Traditional -->
  <rect x="28" y="88" width="380" height="270" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="218" y="118" text-anchor="middle" class="h" fill="#991B1B">✗ 传统做法：在 1/8 大图硬扛多层注意力</text>
  <rect x="66" y="144" width="304" height="114" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="218" y="176" text-anchor="middle" class="h" fill="#DC2626">1/8 特征图（60×80 = 4800 格）</text>
  <text x="218" y="204" text-anchor="middle" class="b" fill="#991B1B">每一层都要处理 4800 个词元</text>
  <text x="218" y="232" text-anchor="middle" class="s" fill="#7F1D1D">显存带宽和注意力延迟成为整网最大瓶颈</text>
  <text x="218" y="302" text-anchor="middle" class="b" fill="#991B1B">算力大头全消耗在了高分辨率全局交互上</text>

  <!-- Right: EDM CIM -->
  <rect x="430" y="88" width="502" height="270" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="681" y="118" text-anchor="middle" class="h" fill="#166534">✓ EDM CIM：深层 1/32 算全局 → 门控注入层（IL）逐级回传</text>

  <!-- Pyramid steps top to bottom -->
  <rect x="462" y="138" width="438" height="54" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="681" y="162" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">1/32 最深层（仅 15×20 = 300 格！缩小 16 倍）</text>
  <text x="681" y="182" text-anchor="middle" class="s" fill="#1E40AF">在此极速跑 QKNA 全局自/交叉注意力，拿满跨图语义！</text>

  <line x1="681" y1="192" x2="681" y2="214" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <text x="772" y="208" class="s" fill="#15803D" font-weight="700">门控注入（IL）</text>

  <rect x="462" y="218" width="438" height="48" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.6"/>
  <text x="681" y="247" text-anchor="middle" class="b" fill="#14532D" font-weight="700">1/16 中层：Sigmoid 门控融合深层全局上下文 + 中层局部细节</text>

  <line x1="681" y1="266" x2="681" y2="288" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <text x="772" y="282" class="s" fill="#15803D" font-weight="700">再门控注入（IL）</text>

  <rect x="462" y="292" width="438" height="48" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.8"/>
  <text x="681" y="321" text-anchor="middle" class="b" fill="#166534" font-weight="700">1/8 粗匹配层：零重型 Transformer，直接获得全局相关性！</text>

</svg>