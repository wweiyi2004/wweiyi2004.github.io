      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：几何 + 3 字节 RGB——为什么加一点颜色就能让精度翻倍？</text>
  <text x="480" y="62" text-anchor="middle" class="sub">纯几何骨架面对对称场景极易撞脸；补上 3 字节 RGB（比描述子小 300 倍）瞬间打破对称歧义</text>

  <rect x="28" y="88" width="424" height="260" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="240" y="118" text-anchor="middle" class="h" fill="#991B1B">✗ 传统纯几何无描述子（如 GoMatch）</text>
  <rect x="58" y="140" width="166" height="110" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="141" y="162" text-anchor="middle" class="s" fill="#475569">左边桌角点阵</text>
  <circle cx="102" cy="192" r="6" fill="#64748B"/><circle cx="141" cy="180" r="6" fill="#64748B"/><circle cx="178" cy="196" r="6" fill="#64748B"/><circle cx="141" cy="224" r="6" fill="#64748B"/>
  <text x="240" y="200" text-anchor="middle" class="h" fill="#DC2626">≈</text>
  <rect x="256" y="140" width="166" height="110" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="339" y="162" text-anchor="middle" class="s" fill="#475569">右边桌角点阵</text>
  <circle cx="300" cy="192" r="6" fill="#64748B"/><circle cx="339" cy="180" r="6" fill="#64748B"/><circle cx="376" cy="196" r="6" fill="#64748B"/><circle cx="339" cy="224" r="6" fill="#64748B"/>
  <text x="240" y="286" text-anchor="middle" class="b" fill="#7F1D1D">几何形状完全对称，光看光秃秃的坐标根本分不清！</text>
  <text x="240" y="314" text-anchor="middle" class="s" fill="#991B1B">导致大量对称误匹配，PnP 定位精度骤降</text>

  <rect x="488" y="88" width="444" height="260" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="710" y="118" text-anchor="middle" class="h" fill="#166534">✓ DGC-GNN：欧氏距离/夹角 + 独立 RGB 颜色编码</text>
  <rect x="518" y="140" width="174" height="110" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="605" y="162" text-anchor="middle" class="s" fill="#9A3412" font-weight="700">红棕色木桌角</text>
  <circle cx="566" cy="192" r="7" fill="#B45309"/><circle cx="605" cy="180" r="7" fill="#D97706"/><circle cx="642" cy="196" r="7" fill="#B45309"/><circle cx="605" cy="224" r="7" fill="#92400E"/>
  <text x="710" y="200" text-anchor="middle" class="h" fill="#16A34A">≠</text>
  <rect x="728" y="140" width="174" height="110" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="815" y="162" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">蓝灰色铁架角</text>
  <circle cx="776" cy="192" r="7" fill="#2563EB"/><circle cx="815" cy="180" r="7" fill="#60A5FA"/><circle cx="852" cy="196" r="7" fill="#2563EB"/><circle cx="815" cy="224" r="7" fill="#1E40AF"/>
  <text x="710" y="286" text-anchor="middle" class="b" fill="#14532D">• 位置与颜色【分开编码再融合】，光照漂移不毁几何</text>
  <text x="710" y="314" text-anchor="middle" class="b" fill="#14532D">• 仅占 3 字节且稀疏点反演 SSIM 极低，依然保护隐私！</text>

</svg>