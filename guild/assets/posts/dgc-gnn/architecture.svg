<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 1：DGC-GNN 无描述子 2D-3D 匹配整体工作流程</text>
  <text x="480" y="62" text-anchor="middle" class="sub">彻底不存高维视觉描述子：只靠 2D 视线 / 3D 坐标 + 3 字节 RGB，经全局到局部图网络输出位姿</text>

  <rect x="24" y="94" width="194" height="236" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="121" y="122" text-anchor="middle" class="h" fill="#1E293B">① 几何 + 颜色独立编码</text>
  <rect x="42" y="144" width="158" height="72" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="121" y="170" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">2D 视线向量 + RGB</text>
  <text x="121" y="192" text-anchor="middle" class="s">内参反投影消除焦距差异</text>
  <rect x="42" y="230" width="158" height="72" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="121" y="256" text-anchor="middle" class="b" fill="#15803D" font-weight="700">3D 地图点 + RGB</text>
  <text x="121" y="278" text-anchor="middle" class="s">位置与颜色分开编码再融</text>

  <line x1="218" y1="212" x2="250" y2="212" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <rect x="256" y="94" width="214" height="236" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="363" y="122" text-anchor="middle" class="h" fill="#1E3A8A">② 全局几何引导图</text>
  <rect x="274" y="144" width="178" height="72" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="363" y="170" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">K-Means 聚出粗簇</text>
  <text x="363" y="192" text-anchor="middle" class="s">保留稀疏点云宏观轮廓</text>
  <rect x="274" y="230" width="178" height="72" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="363" y="256" text-anchor="middle" class="b" fill="#1E40AF" font-weight="700">距离 + 三元组夹角编码</text>
  <text x="363" y="278" text-anchor="middle" class="s">严格刚体旋转不变！</text>

  <line x1="470" y1="212" x2="502" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <rect x="508" y="94" width="214" height="236" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="615" y="122" text-anchor="middle" class="h" fill="#166534">③ 局部聚类匹配</text>
  <rect x="526" y="144" width="178" height="72" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="615" y="170" text-anchor="middle" class="b" fill="#15803D" font-weight="700">两级层次化聚类注意力</text>
  <text x="615" y="192" text-anchor="middle" class="s">把全局引导广播回细点</text>
  <rect x="526" y="230" width="178" height="72" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="615" y="256" text-anchor="middle" class="b" fill="#14532D" font-weight="700">可微最优传输匹配</text>
  <text x="615" y="278" text-anchor="middle" class="s">输出初始 2D-3D 候选对</text>

  <line x1="722" y1="212" x2="754" y2="212" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="760" y="94" width="176" height="236" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="848" y="122" text-anchor="middle" class="h" fill="#5B21B6">④ 外点剔除与定位</text>
  <rect x="778" y="144" width="140" height="72" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="848" y="170" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">外点剔除网络</text>
  <text x="848" y="192" text-anchor="middle" class="s">过滤高噪声假对应</text>
  <rect x="778" y="230" width="140" height="72" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="848" y="256" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">PnP + RANSAC</text>
  <text x="848" y="278" text-anchor="middle" class="s">解出 6-DoF 相机位姿</text>

  <text x="480" y="366" text-anchor="middle" class="s">相比此前 SOTA 纯几何无描述子方法（GoMatch），DGC-GNN 直接将定位精度翻了一倍</text>

</svg>