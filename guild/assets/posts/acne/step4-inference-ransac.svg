<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 404" width="980" height="404">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="404" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 5：推理大反转——为何纯净 ACNe 直出打赢“硬接 RANSAC”？</text>
  <text x="490" y="62" text-anchor="middle" class="sub">保留连续全局相对权重直接跑加权八点法，比二值硬截断再塞进 RANSAC 既快又准（室内高出近 10 个点）</text>

  <!-- Left Card: Pure ACNe (Recommended) -->
  <rect x="28" y="88" width="450" height="244" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="253" y="116" text-anchor="middle" class="h" fill="#166534">✓ 推荐：纯净 ACNe + 加权八点法</text>

  <!-- Mini box 1: continuous weights -->
  <rect x="48" y="132" width="186" height="112" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="141" y="153" text-anchor="middle" class="b" fill="#166534" font-weight="700">保留连续相对权重 w</text>
  <!-- 4 ranked bars -->
  <text x="60" y="176" class="s" fill="#374151">①</text>
  <rect x="78" y="165" width="90" height="13" rx="3" fill="#16A34A"/>
  <text x="176" y="176" class="mono" font-size="12" fill="#15803D">0.64</text>

  <text x="60" y="196" class="s" fill="#374151">②</text>
  <rect x="78" y="185" width="48" height="13" rx="3" fill="#4ADE80"/>
  <text x="134" y="196" class="mono" font-size="12" fill="#15803D">0.31</text>

  <text x="60" y="216" class="s" fill="#374151">③</text>
  <rect x="78" y="205" width="14" height="13" rx="3" fill="#BBF7D0"/>
  <text x="98" y="216" class="mono" font-size="12" fill="#64748B">0.05</text>

  <text x="60" y="236" class="s" fill="#94A3B8">④</text>
  <rect x="78" y="225" width="4" height="13" rx="2" fill="#CBD5E1"/>
  <text x="88" y="236" class="mono" font-size="12" fill="#94A3B8">0.001</text>

  <line x1="236" y1="188" x2="266" y2="188" stroke="#16A34A" stroke-width="2.4" marker-end="url(#arr-green)"/>

  <!-- Mini box 2: Weighted 8-pt -->
  <rect x="272" y="132" width="186" height="112" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="365" y="156" text-anchor="middle" class="b" fill="#166534" font-weight="700">一步加权八点法</text>
  <text x="365" y="182" text-anchor="middle" class="s" fill="#374151">一次 9×9 矩阵特征分解</text>
  <text x="365" y="204" text-anchor="middle" class="s" fill="#15803D" font-weight="700">确定性输出 · 零随机波动</text>
  <text x="365" y="226" text-anchor="middle" class="s" fill="#6B7280">整体 O(N) 线性复杂度</text>

  <!-- Score strip -->
  <rect x="48" y="260" width="410" height="54" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.4"/>
  <text x="253" y="283" text-anchor="middle" class="b" fill="#14532D" font-weight="700">mAP@20°：室外 .638（冠军）｜ 室内 .428（冠军）</text>
  <text x="253" y="303" text-anchor="middle" class="s" fill="#166534">完整保留“谁是顶梁柱、谁只是凑数”的全局排序信息</text>

  <!-- Right Card: ACNe + RANSAC (Pitfall) -->
  <rect x="502" y="88" width="450" height="244" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="727" y="116" text-anchor="middle" class="h" fill="#991B1B">✗ 踩坑：硬接 RANSAC 后处理</text>

  <!-- Mini box 1: Hard threshold -->
  <rect x="522" y="132" width="186" height="112" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="615" y="153" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">被迫丢弃全局权重！</text>
  <!-- Equal binary bars -->
  <text x="534" y="176" class="s" fill="#374151">①</text>
  <rect x="552" y="165" width="76" height="13" rx="3" fill="#F87171"/>
  <text x="636" y="176" class="s" fill="#991B1B">平等 = 1</text>

  <text x="534" y="196" class="s" fill="#374151">②</text>
  <rect x="552" y="185" width="76" height="13" rx="3" fill="#F87171"/>
  <text x="636" y="196" class="s" fill="#991B1B">平等 = 1</text>

  <text x="534" y="216" class="s" fill="#374151">③</text>
  <rect x="552" y="205" width="76" height="13" rx="3" fill="#F87171"/>
  <text x="636" y="216" class="s" fill="#991B1B">平等 = 1</text>

  <text x="534" y="236" class="s" fill="#94A3B8">④</text>
  <rect x="552" y="225" width="4" height="13" rx="2" fill="#CBD5E1"/>
  <text x="564" y="236" class="s" fill="#94A3B8">截断丢弃 (= 0)</text>

  <line x1="710" y1="188" x2="740" y2="188" stroke="#DC2626" stroke-width="2.4" marker-end="url(#arr-red)"/>

  <!-- Mini box 2: RANSAC loop -->
  <rect x="746" y="132" width="186" height="112" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="839" y="156" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">RANSAC 随机采样</text>
  <text x="839" y="182" text-anchor="middle" class="s" fill="#374151">仅用局部 w &gt; 0 硬筛</text>
  <text x="839" y="204" text-anchor="middle" class="s" fill="#DC2626" font-weight="700">白扔全局相对重要度</text>
  <text x="839" y="226" text-anchor="middle" class="s" fill="#6B7280">多轮抽样且有随机波动</text>

  <!-- Score strip -->
  <rect x="522" y="260" width="410" height="54" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="727" y="283" text-anchor="middle" class="b" fill="#7F1D1D" font-weight="700">mAP@20°：室外 .590（↓4.8）｜ 室内 .329（↓9.9）</text>
  <text x="727" y="303" text-anchor="middle" class="s" fill="#991B1B">室内弱纹理场景暴跌近 10 个点，强套 RANSAC 反而帮倒忙</text>

  <!-- Bottom callout -->
  <rect x="28" y="346" width="924" height="44" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="490" y="373" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">推理预处理避坑：测试时开启「双向一致性检查 ✓」，但关闭「Lowe 比率检验 ✗」（避免误杀内点限制网络发挥）</text>
</svg>