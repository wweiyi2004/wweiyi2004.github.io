<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 404" width="980" height="404">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="404" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 1：ACNe 整体工作流程（宏观全景）</text>
  <text x="490" y="62" text-anchor="middle" class="sub">输入无序候选点对（无需相机内参）→ K 层注意力残差块逐层过滤外点 → 加权八点法直出基础矩阵</text>

  <!-- Stage 1: Input -->
  <rect x="24" y="92" width="186" height="256" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="117" y="120" text-anchor="middle" class="h" fill="#1E293B">① 输入候选点对</text>

  <!-- Mini Image A & B -->
  <rect x="42" y="136" width="150" height="62" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="54" y="153" class="s" fill="#1D4ED8" font-weight="700">左图</text>
  <rect x="42" y="228" width="150" height="62" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="54" y="245" class="s" fill="#15803D" font-weight="700">右图</text>

  <!-- Outlier dashed red match lines -->
  <line x1="76" y1="184" x2="170" y2="250" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  <line x1="166" y1="158" x2="72" y2="274" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  <line x1="126" y1="186" x2="176" y2="278" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.8"/>
  <!-- Inlier solid green match lines -->
  <line x1="88" y1="164" x2="94" y2="258" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="120" y1="158" x2="128" y2="254" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="150" y1="176" x2="154" y2="270" stroke="#16A34A" stroke-width="2.2"/>

  <!-- Dots -->
  <circle cx="88" cy="164" r="4.8" fill="#16A34A"/><circle cx="94" cy="258" r="4.8" fill="#16A34A"/>
  <circle cx="120" cy="158" r="4.8" fill="#16A34A"/><circle cx="128" cy="254" r="4.8" fill="#16A34A"/>
  <circle cx="150" cy="176" r="4.8" fill="#16A34A"/><circle cx="154" cy="270" r="4.8" fill="#16A34A"/>
  <circle cx="76" cy="184" r="4.5" fill="#EF4444"/><circle cx="170" cy="250" r="4.5" fill="#EF4444"/>
  <circle cx="166" cy="158" r="4.5" fill="#EF4444"/><circle cx="72" cy="274" r="4.5" fill="#EF4444"/>
  <circle cx="126" cy="186" r="4.5" fill="#EF4444"/><circle cx="176" cy="278" r="4.5" fill="#EF4444"/>

  <text x="117" y="314" text-anchor="middle" class="b" font-weight="700">N 对无序坐标 (N×4)</text>
  <text x="117" y="334" text-anchor="middle" class="s" fill="#DC2626">常含 80%+ 误匹配外点</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="220" x2="248" y2="220" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Stacked ARB -->
  <rect x="254" y="92" width="256" height="256" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="382" y="120" text-anchor="middle" class="h" fill="#1E3A8A">② K 层注意力残差块 (ARB)</text>

  <rect x="270" y="138" width="194" height="54" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="367" y="160" text-anchor="middle" class="h" fill="#1D4ED8">共享感知机 MLP</text>
  <text x="367" y="180" text-anchor="middle" class="s">逐点独立提特征，不看邻居</text>

  <line x1="367" y1="192" x2="367" y2="212" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="270" y="216" width="194" height="58" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="367" y="239" text-anchor="middle" class="h" fill="#047857">ACN 加权归一化 + GN</text>
  <text x="367" y="260" text-anchor="middle" class="s">唯一上下文通道 · 剔除外点</text>

  <!-- Residual skip connection -->
  <path d="M 466 154 H 492 V 252 H 472" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <circle cx="492" cy="204" r="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="492" y="209" text-anchor="middle" class="h" fill="#2563EB">+</text>

  <rect x="270" y="296" width="224" height="34" rx="17" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="382" y="318" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">堆叠 K=12 层 · 模拟 IRLS 迭代</text>

  <!-- Arrow 2->3 -->
  <line x1="510" y1="220" x2="548" y2="220" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Final Attention Head -->
  <rect x="554" y="114" width="178" height="212" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="643" y="142" text-anchor="middle" class="h" fill="#065F46">③ 最终双路权重头</text>

  <rect x="572" y="158" width="142" height="48" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="643" y="178" text-anchor="middle" class="b" fill="#065F46" font-weight="700">局部 Sigmoid</text>
  <text x="643" y="196" text-anchor="middle" class="s">判“像不像内点”</text>

  <text x="643" y="225" text-anchor="middle" class="h" fill="#059669">×</text>

  <rect x="572" y="234" width="142" height="48" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="643" y="254" text-anchor="middle" class="b" fill="#065F46" font-weight="700">全局 Softmax</text>
  <text x="643" y="272" text-anchor="middle" class="s">排“全图谁最关键”</text>

  <text x="643" y="308" text-anchor="middle" class="s" fill="#065F46" font-weight="700">相乘归一化 → 权重 w</text>

  <!-- Arrow 3->4 -->
  <line x1="732" y1="220" x2="770" y2="220" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Output -->
  <rect x="776" y="92" width="180" height="256" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="866" y="120" text-anchor="middle" class="h" fill="#5B21B6">④ 几何求解输出</text>

  <rect x="794" y="136" width="144" height="86" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <!-- Clean inlier matches -->
  <line x1="818" y1="156" x2="824" y2="202" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="856" y1="152" x2="862" y2="200" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="894" y1="162" x2="898" y2="206" stroke="#16A34A" stroke-width="2.2"/>
  <circle cx="818" cy="156" r="5" fill="#16A34A"/><circle cx="824" cy="202" r="5" fill="#16A34A"/>
  <circle cx="856" cy="152" r="5" fill="#16A34A"/><circle cx="862" cy="200" r="5" fill="#16A34A"/>
  <circle cx="894" cy="162" r="5" fill="#16A34A"/><circle cx="898" cy="206" r="5" fill="#16A34A"/>
  <!-- Crossed out outliers -->
  <circle cx="920" cy="154" r="4.5" fill="#CBD5E1"/>
  <line x1="915" y1="149" x2="925" y2="159" stroke="#EF4444" stroke-width="1.8"/>
  <line x1="925" y1="149" x2="915" y2="159" stroke="#EF4444" stroke-width="1.8"/>
  <circle cx="810" cy="208" r="4.5" fill="#CBD5E1"/>
  <line x1="805" y1="203" x2="815" y2="213" stroke="#EF4444" stroke-width="1.8"/>
  <line x1="815" y1="203" x2="805" y2="213" stroke="#EF4444" stroke-width="1.8"/>

  <line x1="866" y1="222" x2="866" y2="244" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>

  <rect x="794" y="248" width="144" height="54" rx="8" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="866" y="270" text-anchor="middle" class="h" fill="#5B21B6">加权八点法</text>
  <text x="866" y="290" text-anchor="middle" class="s" fill="#4C1D95">直出 3×3 基础矩阵 F̂</text>

  <text x="866" y="330" text-anchor="middle" class="s" fill="#5B21B6" font-weight="700">确定性输出 · 无需 RANSAC</text>

  <text x="490" y="382" text-anchor="middle" class="s">全链路严格置换等变且复杂度仅 O(N)：同一套主干换个轻量输出头，还能直接做直线拟合与 2D/3D 点云分类</text>
</svg>