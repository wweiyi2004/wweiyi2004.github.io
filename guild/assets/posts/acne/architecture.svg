<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 770" width="1060" height="770">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#46A171" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D5803B" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2783DE" />
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 13px; fill: #4B5563; }
      .section-title { font-size: 14px; font-weight: 700; fill: #1F2937; }
      .node-title-gray { font-size: 13px; font-weight: 700; fill: #111827; }
      .node-sub-gray { font-size: 11px; fill: #374151; }
      .node-title-blue { font-size: 13px; font-weight: 700; fill: #153B60; }
      .node-sub-blue { font-size: 11px; fill: #1E4E79; }
      .node-title-green { font-size: 13px; font-weight: 700; fill: #1F5138; }
      .node-sub-green { font-size: 11px; fill: #266445; }
      .node-title-orange { font-size: 13px; font-weight: 700; fill: #70401C; }
      .node-sub-orange { font-size: 11px; fill: #8A4F22; }
      .node-title-purple { font-size: 13px; font-weight: 700; fill: #422578; }
      .node-sub-purple { font-size: 11px; fill: #553294; }
      .dim-tag { font-size: 11px; font-weight: 600; fill: #374151; }
      .small-note { font-size: 11px; fill: #4B5563; }
    </style>
  </defs>

  <!-- Pure white background -->
  <rect x="0" y="0" width="1060" height="770" fill="#FFFFFF" />

  <!-- Title Header -->
  <text x="530" y="34" text-anchor="middle" class="title">ACNe 整体端到端架构与张量维度流转图</text>
  <text x="530" y="56" text-anchor="middle" class="subtitle">以宽基线双目几何估计（基础矩阵求解）为例：K = 12 层 ARB，通道数 C = 128，严格置换等变设计</text>

  <!-- ==================== BAND 1: End-to-End Pipeline ==================== -->
  <rect x="20" y="72" width="1020" height="200" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.2" />
  <text x="36" y="96" class="section-title">① 端到端主干流程（宽基线双目匹配：输入 N 对无序候选点 → 输出权重 w 与基础矩阵 F̂）</text>

  <!-- Node 1: Input -->
  <rect x="36" y="122" width="136" height="86" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6" />
  <text x="104" y="146" text-anchor="middle" class="node-title-gray">候选匹配点云 P</text>
  <text x="104" y="165" text-anchor="middle" class="node-sub-gray">两图坐标 (x₁,y₁,x₂,y₂)</text>
  <text x="104" y="182" text-anchor="middle" class="node-sub-gray">按图像尺寸归一化</text>
  <rect x="52" y="190" width="104" height="16" rx="4" fill="#E5E7EB" />
  <text x="104" y="202" text-anchor="middle" class="dim-tag">[B, N, D=4]</text>

  <!-- Arrow 1->2 -->
  <line x1="172" y1="165" x2="202" y2="165" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Node 2: F_in -->
  <rect x="205" y="128" width="110" height="74" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.6" />
  <text x="260" y="152" text-anchor="middle" class="node-title-blue">输入感知机 Fᵢₙ</text>
  <text x="260" y="170" text-anchor="middle" class="node-sub-blue">共享 1×1 线性升维</text>
  <text x="260" y="188" text-anchor="middle" class="dim-tag">[B, N, 128]</text>

  <!-- Arrow 2->3 -->
  <line x1="315" y1="165" x2="345" y2="165" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)" />

  <!-- Node 3: K x ARB Backbone Container -->
  <rect x="348" y="112" width="248" height="106" rx="8" fill="#F0F7FF" stroke="#2783DE" stroke-width="1.5" stroke-dasharray="5,3" />
  <text x="472" y="130" text-anchor="middle" class="node-title-blue">堆叠 K 个注意力残差块 (K × ARB)</text>

  <rect x="360" y="140" width="60" height="48" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5" />
  <text x="390" y="162" text-anchor="middle" class="node-title-blue">ARB 1</text>
  <text x="390" y="178" text-anchor="middle" class="node-sub-blue">2×ACN</text>

  <line x1="420" y1="164" x2="438" y2="164" stroke="#2783DE" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <rect x="441" y="140" width="60" height="48" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5" />
  <text x="471" y="162" text-anchor="middle" class="node-title-blue">ARB 2</text>
  <text x="471" y="178" text-anchor="middle" class="node-sub-blue">2×ACN</text>

  <text x="513" y="169" text-anchor="middle" class="node-title-blue">…</text>

  <rect x="524" y="140" width="60" height="48" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5" />
  <text x="554" y="162" text-anchor="middle" class="node-title-blue">ARB K</text>
  <text x="554" y="178" text-anchor="middle" class="node-sub-blue">K=12</text>

  <text x="472" y="208" text-anchor="middle" class="node-sub-blue">全程维持特征维度 [B, N, 128]</text>

  <!-- Arrow 3->4 -->
  <line x1="596" y1="165" x2="626" y2="165" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="611" y="156" text-anchor="middle" class="dim-tag">O</text>

  <!-- Node 4: Final Attention Weight Head -->
  <rect x="629" y="122" width="128" height="86" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6" />
  <text x="693" y="145" text-anchor="middle" class="node-title-green">最终权重头 W_ω</text>
  <text x="693" y="164" text-anchor="middle" class="node-sub-green">w_local ⊙ w_global</text>
  <text x="693" y="180" text-anchor="middle" class="node-sub-green">再做 L1 归一化 η(·)</text>
  <rect x="647" y="188" width="92" height="16" rx="4" fill="#D1E7DC" />
  <text x="693" y="200" text-anchor="middle" class="dim-tag">w: [B, N]</text>

  <!-- Arrow 4->5 -->
  <line x1="757" y1="165" x2="787" y2="165" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)" />

  <!-- Node 5: Weighted 8-point -->
  <rect x="790" y="122" width="114" height="86" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.6" />
  <text x="847" y="147" text-anchor="middle" class="node-title-orange">加权八点法</text>
  <text x="847" y="165" text-anchor="middle" class="node-sub-orange">可微无参求解</text>
  <text x="847" y="181" text-anchor="middle" class="node-sub-orange">g(P, w)</text>
  <text x="847" y="198" text-anchor="middle" class="dim-tag">最小特征向量</text>

  <!-- Arrow 5->6 -->
  <line x1="904" y1="165" x2="930" y2="165" stroke="#D5803B" stroke-width="1.6" marker-end="url(#arrow-orange)" />

  <!-- Node 6: Output F_hat -->
  <rect x="933" y="122" width="94" height="86" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.6" />
  <text x="980" y="148" text-anchor="middle" class="node-title-purple">基础矩阵 F̂</text>
  <text x="980" y="167" text-anchor="middle" class="node-sub-purple">[B, 3, 3]</text>
  <text x="980" y="185" text-anchor="middle" class="node-sub-purple">→ 相对位姿</text>
  <text x="980" y="200" text-anchor="middle" class="node-sub-purple">(R, t)</text>

  <!-- Skip line from P to Weighted 8-point -->
  <path d="M 104 208 L 104 248 L 847 248 L 847 212" fill="none" stroke="#9CA3AF" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)" />
  <rect x="392" y="237" width="235" height="20" rx="4" fill="#FFFFFF" />
  <text x="510" y="251" text-anchor="middle" class="small-note">原始归一化点对坐标 P 直接送入加权八点法</text>

  <!-- ==================== BAND 2: ARB & ACN Internal Zoom-In ==================== -->
  <!-- Left Panel: ARB Internal Structure -->
  <rect x="20" y="288" width="465" height="252" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.2" />
  <text x="36" y="312" class="section-title">② 单个注意力残差块 (ARB) 内部结构</text>

  <!-- Input f -->
  <rect x="34" y="400" width="52" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="60" y="419" text-anchor="middle" class="node-title-gray">f</text>
  <text x="60" y="435" text-anchor="middle" class="node-sub-gray">N×128</text>

  <!-- Shortcut path -->
  <path d="M 60 400 L 60 348 L 403 348 L 403 402" fill="none" stroke="#2783DE" stroke-width="1.6" marker-end="url(#arrow-blue)" />
  <rect x="172" y="336" width="122" height="20" rx="4" fill="#FAFAFA" />
  <text x="233" y="350" text-anchor="middle" class="node-sub-blue">残差恒等捷径 (Skip)</text>

  <!-- Main residual path -->
  <line x1="86" y1="422" x2="104" y2="422" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="107" y="394" width="60" height="56" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5" />
  <text x="137" y="416" text-anchor="middle" class="node-title-blue">F^{k,0}</text>
  <text x="137" y="434" text-anchor="middle" class="node-sub-blue">感知机</text>

  <line x1="167" y1="422" x2="181" y2="422" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="184" y="394" width="54" height="56" rx="6" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6" />
  <text x="211" y="419" text-anchor="middle" class="node-title-green">ACN</text>
  <text x="211" y="435" text-anchor="middle" class="node-sub-green">归一化</text>

  <line x1="238" y1="422" x2="252" y2="422" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="255" y="394" width="60" height="56" rx="6" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5" />
  <text x="285" y="416" text-anchor="middle" class="node-title-blue">F^{k,1}</text>
  <text x="285" y="434" text-anchor="middle" class="node-sub-blue">感知机</text>

  <line x1="315" y1="422" x2="329" y2="422" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="332" y="394" width="54" height="56" rx="6" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6" />
  <text x="359" y="419" text-anchor="middle" class="node-title-green">ACN</text>
  <text x="359" y="435" text-anchor="middle" class="node-sub-green">归一化</text>

  <line x1="386" y1="422" x2="390" y2="422" stroke="#4B5563" stroke-width="1.5" />

  <!-- Add Circle -->
  <circle cx="403" cy="422" r="14" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.6" />
  <text x="403" y="427" text-anchor="middle" class="node-title-blue">+</text>

  <line x1="417" y1="422" x2="430" y2="422" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Output f' -->
  <rect x="433" y="400" width="40" height="44" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="453" y="426" text-anchor="middle" class="node-title-gray">f'</text>

  <!-- ARB Note Box -->
  <rect x="34" y="472" width="437" height="54" rx="6" fill="#E5F2FC" stroke="#93C5FD" stroke-width="1" />
  <text x="48" y="493" class="node-sub-blue">• 每个感知机逐点独立运行且参数跨点共享（类似 1×1 卷积 + ReLU）。</text>
  <text x="48" y="513" class="node-sub-blue">• ACN 是点与点之间交换上下文的唯一通道，严格保证置换等变性。</text>

  <!-- Right Panel: ACN Internal Structure -->
  <rect x="500" y="288" width="540" height="252" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.2" />
  <text x="516" y="312" class="section-title">③ 核心模块：注意力上下文归一化 (ACN) 内部拆解</text>

  <!-- ACN Input f -->
  <rect x="514" y="408" width="48" height="46" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="538" y="428" text-anchor="middle" class="node-title-gray">f</text>
  <text x="538" y="444" text-anchor="middle" class="node-sub-gray">N×C</text>

  <!-- Split lines from f -->
  <path d="M 562 431 L 578 431 L 578 358 L 598 358" fill="none" stroke="#46A171" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 562 431 L 578 431 L 578 431 L 598 431" fill="none" stroke="#46A171" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 562 431 L 578 431 L 578 504 L 802 504 L 802 478" fill="none" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Global Attention Branch -->
  <rect x="601" y="330" width="124" height="54" rx="7" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5" />
  <text x="663" y="352" text-anchor="middle" class="node-title-green">全局分支 W_global</text>
  <text x="663" y="370" text-anchor="middle" class="node-sub-green">Linear + Softmax (跨 N)</text>

  <!-- Local Attention Branch -->
  <rect x="601" y="404" width="124" height="54" rx="7" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5" />
  <text x="663" y="426" text-anchor="middle" class="node-title-green">局部分支 W_local</text>
  <text x="663" y="444" text-anchor="middle" class="node-sub-green">Linear + Sigmoid (逐点)</text>

  <!-- Merge arrows into Hadamard + L1 -->
  <path d="M 725 357 L 758 357 L 758 377" fill="none" stroke="#46A171" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <path d="M 725 431 L 758 431 L 758 411" fill="none" stroke="#46A171" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="742" y="350" text-anchor="middle" class="node-sub-green">w_g</text>
  <text x="742" y="445" text-anchor="middle" class="node-sub-green">w_l</text>

  <!-- Multiply + L1 norm Circle -->
  <circle cx="758" cy="394" r="15" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6" />
  <text x="758" y="399" text-anchor="middle" class="node-title-green">⊙</text>
  <text x="758" y="422" text-anchor="middle" class="small-note">再 L1 归一化</text>

  <!-- Arrow w into N_ACN -->
  <path d="M 773 394 L 802 394 L 802 406" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <text x="790" y="388" text-anchor="middle" class="node-title-green">w</text>

  <!-- N_ACN Box -->
  <rect x="774" y="409" width="96" height="66" rx="7" fill="#E8F1EC" stroke="#46A171" stroke-width="1.8" />
  <text x="822" y="431" text-anchor="middle" class="node-title-green">N_ACN(f; w)</text>
  <text x="822" y="449" text-anchor="middle" class="node-sub-green">(f − μ_w) ⊘ σ_w</text>
  <text x="822" y="465" text-anchor="middle" class="node-sub-green">加权均值/标准差</text>

  <!-- Arrow N_ACN -> GN -->
  <line x1="870" y1="442" x2="888" y2="442" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Group Norm Box -->
  <rect x="891" y="412" width="76" height="60" rx="7" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5" />
  <text x="929" y="436" text-anchor="middle" class="node-title-blue">GroupNorm</text>
  <text x="929" y="454" text-anchor="middle" class="node-sub-blue">32 组 (替 BN)</text>

  <!-- Arrow GN -> Output -->
  <line x1="967" y1="442" x2="984" y2="442" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="987" y="418" width="40" height="48" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="1007" y="446" text-anchor="middle" class="node-title-gray">f̂</text>

  <!-- Note below ACN -->
  <text x="518" y="527" class="small-note">注：训练双目任务时，中间层 w_local 可接辅助 BCE 监督；w_global 全程不加显式监督，由网络自发学习相对权重。</text>

  <!-- ==================== BAND 3: Task Heads & Loss Summary ==================== -->
  <!-- Left Box: Multi-task Heads -->
  <rect x="20" y="556" width="510" height="196" rx="10" fill="#FAFAFA" stroke="#E5E7EB" stroke-width="1.2" />
  <text x="36" y="580" class="section-title">④ 统一主干适配三类任务（共享同一套 ACNe 架构）</text>

  <!-- Task 1 -->
  <rect x="36" y="596" width="152" height="140" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
  <rect x="36" y="596" width="152" height="28" rx="8" fill="#E5F2FC" />
  <text x="112" y="615" text-anchor="middle" class="node-title-blue">鲁棒直线拟合</text>
  <text x="112" y="644" text-anchor="middle" class="node-sub-gray">输入: [N, 2]，K = 6</text>
  <text x="112" y="666" text-anchor="middle" class="node-sub-gray">头: 权重网络 → w</text>
  <text x="112" y="688" text-anchor="middle" class="node-sub-gray">构造加权协方差 C_w</text>
  <text x="112" y="710" text-anchor="middle" class="node-title-purple">最小特征向量 → 直线 θ</text>

  <!-- Task 2 -->
  <rect x="199" y="596" width="152" height="140" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
  <rect x="199" y="596" width="152" height="28" rx="8" fill="#E8F1EC" />
  <text x="275" y="615" text-anchor="middle" class="node-title-green">2D/3D 点云分类</text>
  <text x="275" y="644" text-anchor="middle" class="node-sub-gray">MNIST: D=2, K=3</text>
  <text x="275" y="666" text-anchor="middle" class="node-sub-gray">ModelNet40: PointNet+ACN</text>
  <text x="275" y="688" text-anchor="middle" class="node-sub-gray">加权池化 v = μ_w(O)</text>
  <text x="275" y="710" text-anchor="middle" class="node-title-purple">Softmax → 类别概率</text>

  <!-- Task 3 -->
  <rect x="362" y="596" width="152" height="140" rx="8" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.2" />
  <rect x="362" y="596" width="152" height="28" rx="8" fill="#EDE9FE" />
  <text x="438" y="615" text-anchor="middle" class="node-title-purple">宽基线双目估计</text>
  <text x="438" y="644" text-anchor="middle" class="node-sub-gray">输入: [N, 4]，K = 12</text>
  <text x="438" y="666" text-anchor="middle" class="node-sub-gray">头: 权重网络 → w</text>
  <text x="438" y="688" text-anchor="middle" class="node-sub-gray">直接送入加权八点法</text>
  <text x="438" y="710" text-anchor="middle" class="node-title-purple">输出基础矩阵 F̂</text>

  <!-- Right Box: Stereo Training Loss -->
  <rect x="546" y="556" width="494" height="196" rx="10" fill="#FFFDF9" stroke="#F3D5B5" stroke-width="1.3" />
  <text x="562" y="580" class="section-title">⑤ 宽基线双目训练总损失 L(ω) = α L_F + β L_final + γ L_mid</text>

  <!-- Loss 1 -->
  <rect x="562" y="596" width="462" height="42" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.3" />
  <text x="576" y="614" class="node-title-orange">1. 基础矩阵几何损失（权重 α = 0.1，第 20k 步后启用）</text>
  <text x="576" y="631" class="node-sub-orange">min_{+/-} || F̂ ± F* ||_F² —— 解决基础矩阵正负号等价性问题</text>

  <!-- Loss 2 -->
  <rect x="562" y="646" width="462" height="42" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.3" />
  <text x="576" y="664" class="node-title-orange">2. 最终局部注意力分类损失（权重 β = 1.0）</text>
  <text x="576" y="681" class="node-sub-orange">E[ H(y, w_local) ] —— 对称极线距离阈值生成真值内点标签 y，用 BCE 监督</text>

  <!-- Loss 3 -->
  <rect x="562" y="696" width="462" height="42" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.3" />
  <text x="576" y="714" class="node-title-orange">3. 中间层局部注意力辅助监督（权重 γ = 1.0，可选但增益稳定）</text>
