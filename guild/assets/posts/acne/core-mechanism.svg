<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 416" width="980" height="416">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="416" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 2：核心机制——为什么普通 CN 怕外点，ACN 怎么破局？</text>
  <text x="490" y="62" text-anchor="middle" class="sub">普通 CN 对所有点一视同仁（等权最小二乘）；ACN 借鉴 IRLS，用动态权重把外点请出均值和标准差</text>

  <!-- Left Panel: Standard CN -->
  <rect x="28" y="88" width="410" height="254" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="233" y="116" text-anchor="middle" class="h" fill="#991B1B">✗ 普通 CN：等权平均，统计中心被外点绑架</text>

  <rect x="48" y="132" width="370" height="154" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <!-- True inlier line -->
  <line x1="68" y1="266" x2="268" y2="154" stroke="#86EFAC" stroke-width="2.2" stroke-dasharray="5,4"/>
  <text x="60" y="154" class="s" fill="#15803D" font-weight="700">真实内点分布</text>
  <!-- Inflated variance ellipse -->
  <ellipse cx="272" cy="212" rx="134" ry="62" fill="#EF4444" fill-opacity="0.08" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="6,4"/>
  <circle cx="304" cy="148" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="344" cy="152" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="386" cy="150" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="398" cy="182" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="362" cy="180" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="324" cy="174" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="274" cy="198" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="388" cy="202" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="398" cy="260" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="366" cy="268" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="322" cy="270" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="274" cy="268" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="228" cy="264" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="186" cy="272" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="348" cy="260" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="242" cy="270" r="5.2" fill="#EF4444" opacity="0.88"/>
  <circle cx="86" cy="256" r="5.6" fill="#16A34A"/>
  <circle cx="118" cy="238" r="5.6" fill="#16A34A"/>
  <circle cx="150" cy="220" r="5.6" fill="#16A34A"/>
  <circle cx="182" cy="202" r="5.6" fill="#16A34A"/>
  <circle cx="214" cy="184" r="5.6" fill="#16A34A"/>
  <circle cx="246" cy="166" r="5.6" fill="#16A34A"/>
  <!-- Biased mean marker + pill -->
  <line x1="296" y1="205" x2="310" y2="219" stroke="#991B1B" stroke-width="3"/>
  <line x1="310" y1="205" x2="296" y2="219" stroke="#991B1B" stroke-width="3"/>
  <rect x="234" y="224" width="142" height="24" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.3"/>
  <text x="305" y="240" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">均值 μ 偏到噪声堆！</text>

  <text x="233" y="308" text-anchor="middle" class="b" fill="#7F1D1D">所有点话语权都是 1/N → 均值 μ 严重偏移</text>
  <text x="233" y="328" text-anchor="middle" class="s" fill="#991B1B">标准差 σ 被噪声撑爆，真实内点被压缩挤在角落</text>

  <!-- Center Bridge -->
  <rect x="446" y="156" width="88" height="48" rx="10" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="490" y="177" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">借鉴 IRLS</text>
  <text x="490" y="195" text-anchor="middle" class="s" fill="#C2410C">动态加权</text>
  <line x1="448" y1="224" x2="532" y2="224" stroke="#EA580C" stroke-width="2.8" marker-end="url(#arr-orange)"/>
  <text x="490" y="248" text-anchor="middle" class="s" fill="#9A3412" font-weight="700">外点 w ≈ 0</text>

  <!-- Right Panel: ACN -->
  <rect x="542" y="88" width="410" height="254" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="747" y="116" text-anchor="middle" class="h" fill="#166534">✓ ACNe 的 ACN：按权重统计，精准锁死内点</text>

  <rect x="562" y="132" width="370" height="154" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <!-- True inlier line -->
  <line x1="582" y1="266" x2="782" y2="154" stroke="#4ADE80" stroke-width="2.2" stroke-dasharray="5,4"/>
  <!-- Tight weighted variance ellipse aligned to inliers -->
  <ellipse cx="680" cy="211" rx="104" ry="20" transform="rotate(-29 680 211)" fill="#22C55E" fill-opacity="0.14" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="6,4"/>
  <circle cx="818" cy="148" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="858" cy="152" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="900" cy="150" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="912" cy="182" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="876" cy="180" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="838" cy="174" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="788" cy="198" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="902" cy="202" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="912" cy="260" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="880" cy="268" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="836" cy="270" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="788" cy="268" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="742" cy="264" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="700" cy="272" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="862" cy="260" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="756" cy="270" r="3.6" fill="#FCA5A5" opacity="0.55"/>
  <circle cx="600" cy="256" r="6.5" fill="#16A34A" stroke="#DCFCE7" stroke-width="2"/>
  <circle cx="632" cy="238" r="6.5" fill="#16A34A" stroke="#DCFCE7" stroke-width="2"/>
  <circle cx="664" cy="220" r="6.5" fill="#16A34A" stroke="#DCFCE7" stroke-width="2"/>
  <circle cx="696" cy="202" r="6.5" fill="#16A34A" stroke="#DCFCE7" stroke-width="2"/>
  <circle cx="728" cy="184" r="6.5" fill="#16A34A" stroke="#DCFCE7" stroke-width="2"/>
  <circle cx="760" cy="166" r="6.5" fill="#16A34A" stroke="#DCFCE7" stroke-width="2"/>
  <!-- Accurate weighted mean marker + pill -->
  <circle cx="680" cy="211" r="7.5" fill="#FFFFFF" stroke="#15803D" stroke-width="2.5"/>
  <circle cx="680" cy="211" r="3.2" fill="#15803D"/>
  <rect x="574" y="140" width="154" height="24" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.3"/>
  <text x="651" y="156" text-anchor="middle" class="s" fill="#14532D" font-weight="700">加权均值 μ_w 落在线上</text>
  <line x1="664" y1="164" x2="677" y2="201" stroke="#16A34A" stroke-width="1.5" stroke-dasharray="3,2"/>

  <rect x="782" y="218" width="138" height="24" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="851" y="234" text-anchor="middle" class="s" fill="#64748B">外点 w≈0（踢出统计）</text>

  <text x="747" y="308" text-anchor="middle" class="b" fill="#14532D">加权统计 μ_w、σ_w 只听内点的，坐标系对齐内点</text>
  <text x="747" y="328" text-anchor="middle" class="s" fill="#166534">外点特征不被清零而是甩在远处，下一层更好切分</text>

  <!-- Bottom crisp callout -->
  <rect x="28" y="356" width="924" height="46" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="490" y="384" text-anchor="middle" class="b" fill="#1E3A8A" font-weight="700">关键洞察：ACN 不是拿权重去乘特征图清零，而是用权重重新定义归一化原点 μ_w 与尺度 σ_w，逐层把外点清场！</text>
</svg>