    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="404" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 3：双路注意力打配合——4 点具体数值手算一遍</text>
  <text x="490" y="62" text-anchor="middle" class="sub">局部 Sigmoid 判断“像不像内点”，全局 Softmax 跨点竞争“谁最关键”，相乘再 ℓ₁ 归一化得出最终话语权</text>

  <!-- Column headers -->
  <text x="220" y="102" text-anchor="middle" class="h" fill="#1D4ED8">① 局部 Sigmoid（独立）</text>
  <text x="446" y="102" text-anchor="middle" class="h" fill="#15803D">② 全局 Softmax（竞争）</text>
  <text x="762" y="102" text-anchor="middle" class="h" fill="#6D28D9">③ 最终权重 w（相乘再 ℓ₁ 归一化）</text>

  <text x="150" y="145" text-anchor="end" class="b" fill="#15803D" font-weight="700">点① 优质内点</text>
  <rect x="168" y="122" width="104" height="38" rx="6" fill="#2563EB" stroke="#CBD5E1" stroke-width="1"/>
  <text x="220" y="145" text-anchor="middle" class="mono" font-size="14" fill="#FFFFFF">0.92</text>
  <rect x="394" y="122" width="104" height="38" rx="6" fill="#16A34A" stroke="#CBD5E1" stroke-width="1"/>
  <text x="446" y="145" text-anchor="middle" class="mono" font-size="14" fill="#FFFFFF">0.58</text>
  <rect x="582" y="122" width="84" height="38" rx="6" fill="#7C3AED" stroke="#CBD5E1" stroke-width="1"/>
  <text x="624" y="145" text-anchor="middle" class="mono" font-size="14" fill="#FFFFFF">0.643</text>
  <rect x="678" y="128" width="142" height="26" rx="5" fill="#7C3AED"/>
  <text x="830" y="145" class="b" fill="#15803D" font-weight="700">64.3%（绝对主力）</text>
  <text x="150" y="191" text-anchor="end" class="b" fill="#2563EB" font-weight="700">点② 普通内点</text>
  <rect x="168" y="168" width="104" height="38" rx="6" fill="#3B82F6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="220" y="191" text-anchor="middle" class="mono" font-size="14" fill="#FFFFFF">0.85</text>
  <rect x="394" y="168" width="104" height="38" rx="6" fill="#4ADE80" stroke="#CBD5E1" stroke-width="1"/>
  <text x="446" y="191" text-anchor="middle" class="mono" font-size="14" fill="#064E3B">0.30</text>
  <rect x="582" y="168" width="84" height="38" rx="6" fill="#8B5CF6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="624" y="191" text-anchor="middle" class="mono" font-size="14" fill="#FFFFFF">0.307</text>
  <rect x="678" y="174" width="68" height="26" rx="5" fill="#8B5CF6"/>
  <text x="756" y="191" class="b" fill="#2563EB" font-weight="700">30.7%（稳定辅助）</text>
  <text x="150" y="237" text-anchor="end" class="b" fill="#C2410C" font-weight="700">点③ 模糊边界</text>
  <rect x="168" y="214" width="104" height="38" rx="6" fill="#DBEAFE" stroke="#CBD5E1" stroke-width="1"/>
  <text x="220" y="237" text-anchor="middle" class="mono" font-size="14" fill="#1E40AF">0.40</text>
  <rect x="394" y="214" width="104" height="38" rx="6" fill="#DCFCE7" stroke="#CBD5E1" stroke-width="1"/>
  <text x="446" y="237" text-anchor="middle" class="mono" font-size="14" fill="#166534">0.10</text>
  <rect x="582" y="214" width="84" height="38" rx="6" fill="#EDE9FE" stroke="#CBD5E1" stroke-width="1"/>
  <text x="624" y="237" text-anchor="middle" class="mono" font-size="14" fill="#5B21B6">0.048</text>
  <rect x="678" y="220" width="12" height="26" rx="5" fill="#C4B5FD"/>
  <text x="700" y="237" class="b" fill="#4B5563" font-weight="400">4.8%（弱化边缘）</text>
  <text x="150" y="283" text-anchor="end" class="b" fill="#DC2626" font-weight="700">点④ 明显外点</text>
  <rect x="168" y="260" width="104" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="220" y="283" text-anchor="middle" class="mono" font-size="14" fill="#64748B">0.05</text>
  <rect x="394" y="260" width="104" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="446" y="283" text-anchor="middle" class="mono" font-size="14" fill="#64748B">0.02</text>
  <rect x="582" y="260" width="84" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="624" y="283" text-anchor="middle" class="mono" font-size="14" fill="#64748B">0.001</text>
  <rect x="678" y="266" width="4" height="26" rx="5" fill="#CBD5E1"/>
  <text x="692" y="283" class="b" fill="#4B5563" font-weight="400">0.1%（彻底静音）</text>

  <!-- Multiply symbol & arrow -->
  <text x="333" y="218" text-anchor="middle" font-size="28" font-weight="700" fill="#475569">×</text>

  <line x1="510" y1="210" x2="568" y2="210" stroke="#7C3AED" stroke-width="2.6" marker-end="url(#arr-purple)"/>
  <text x="539" y="196" text-anchor="middle" class="s" fill="#6D28D9" font-weight="700">÷ 0.83</text>

  <!-- Column footers -->
  <text x="220" y="318" text-anchor="middle" class="s" fill="#1D4ED8">点①与点②得分接近</text>
  <text x="446" y="318" text-anchor="middle" class="s" fill="#15803D">四项之和 = 1.00，拉开档次</text>
  <text x="762" y="318" text-anchor="middle" class="s" fill="#6D28D9" font-weight="700">点① + 点② 共占 95.0% 统计话语权</text>

  <!-- Bottom callout -->
  <rect x="34" y="336" width="912" height="52" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="490" y="358" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">消融实锤：单加局部 Sigmoid 涨 +9.6 点，单加全局 Softmax 狂涨 +15.8 点（最大功臣）！</text>
  <text x="490" y="378" text-anchor="middle" class="b" fill="#9A3412">两者相乘再做 ℓ₁ 归一化，外点④被双重压制到 0.1%，且全程不引入额外融合参数、严格保持置换等变。</text>
</svg>