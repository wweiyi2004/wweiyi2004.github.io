<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：为什么要把 ERP 全景网格投影到“单位球面 3D 坐标”？</text>
  <text x="480" y="62" text-anchor="middle" class="sub">ERP 摊平后两极严重拉伸、左右接缝撕裂；一搬回单位球面 S²，两大畸变瞬间迎刃而解</text>

  <!-- Left: ERP 2D distortion -->
  <rect x="28" y="88" width="424" height="270" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="240" y="118" text-anchor="middle" class="h" fill="#991B1B">✗ 摊平的 2D ERP 矩形：两大畸变坑</text>
  <rect x="64" y="138" width="352" height="128" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <!-- Top stretched pole bar -->
  <rect x="76" y="148" width="328" height="26" rx="4" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="240" y="166" text-anchor="middle" class="s" fill="#DC2626" font-weight="700">北极（天花板）横向拉长几十倍！cosθ → 0</text>
  <!-- Left & right seam dots -->
  <circle cx="84" cy="208" r="7" fill="#2563EB"/><text x="98" y="212" font-size="11.5" fill="#1D4ED8" font-weight="700">−180° 左边界</text>
  <line x1="186" y1="208" x2="294" y2="208" stroke="#EF4444" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="240" y="199" text-anchor="middle" font-size="11.5" fill="#DC2626">被硬生生撕开</text>
  <circle cx="396" cy="208" r="7" fill="#2563EB"/><text x="382" y="212" text-anchor="end" font-size="11.5" fill="#1D4ED8" font-weight="700">+180° 右边界</text>
  <rect x="76" y="232" width="328" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444"/>
  <text x="240" y="249" text-anchor="middle" class="s" fill="#DC2626" font-weight="700">南极（地板）同样严重拉伸</text>
  <text x="240" y="302" text-anchor="middle" class="b" fill="#7F1D1D">直接用 2D 坐标 (u, v) 做位置编码与匹配会彻底失真</text>

  <!-- Right: Unit Sphere -->
  <rect x="488" y="88" width="444" height="270" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="710" y="118" text-anchor="middle" class="h" fill="#166534">✓ 搬回单位球面 3D 坐标 s = (x, y, z)</text>
  <rect x="520" y="138" width="380" height="128" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <!-- Clean sphere drawing -->
  <circle cx="628" cy="212" r="44" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <ellipse cx="628" cy="212" rx="44" ry="15" fill="none" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="4,3"/>
  <ellipse cx="628" cy="212" rx="18" ry="44" fill="none" stroke="#60A5FA" stroke-width="1.5"/>
  <circle cx="628" cy="168" r="5" fill="#16A34A"/><text x="628" y="157" text-anchor="middle" class="s" fill="#15803D" font-weight="700">北极回归一点</text>
  <circle cx="672" cy="212" r="6" fill="#2563EB"/><text x="692" y="206" class="s" fill="#1D4ED8" font-weight="700">±180° 无缝重合!</text>
  <text x="758" y="236" text-anchor="middle" class="mono" font-size="12" fill="#166534">‖s‖₂ = 1</text>
  <text x="710" y="300" text-anchor="middle" class="b" fill="#14532D">• 球面 3D 位置编码天然连续，无缝接轨左右边界</text>
  <text x="710" y="326" text-anchor="middle" class="b" fill="#14532D">• 极点拉伸被真实三维夹角完全消除</text>

</svg>