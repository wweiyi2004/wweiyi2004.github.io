<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 1：全景 EDM（CVPR 2025）球面稠密匹配整体流程</text>
  <text x="480" y="62" text-anchor="middle" class="sub">原生面向 360° ERP 全景图：不再切 6 张立方体贴图，全程在单位球面几何上完成粗匹配与精修</text>

  <rect x="24" y="94" width="194" height="236" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="121" y="122" text-anchor="middle" class="h" fill="#1E293B">① ERP 全景输入</text>
  <rect x="42" y="144" width="158" height="72" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="121" y="170" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">两张 360° 全景图</text>
  <text x="121" y="192" text-anchor="middle" class="s">整图直输，保留全视野</text>
  <rect x="42" y="230" width="158" height="72" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="121" y="256" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">随机方位角旋转增强</text>
  <text x="121" y="278" text-anchor="middle" class="s">左右循环平移零黑边</text>

  <line x1="218" y1="212" x2="250" y2="212" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <rect x="256" y="94" width="214" height="236" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="363" y="122" text-anchor="middle" class="h" fill="#1E3A8A">② 球面空间对齐 SSAM</text>
  <rect x="274" y="144" width="178" height="72" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="363" y="170" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">球面 3D 位置编码</text>
  <text x="363" y="192" text-anchor="middle" class="s">网格 → 单位球坐标 (x,y,z)</text>
  <rect x="274" y="230" width="178" height="72" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="363" y="256" text-anchor="middle" class="b" fill="#1E40AF" font-weight="700">核化高斯过程粗匹配</text>
  <text x="363" y="278" text-anchor="middle" class="s">直接预测单位球粗方向 ŝ^B</text>

  <line x1="470" y1="212" x2="502" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <rect x="508" y="94" width="222" height="236" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="619" y="122" text-anchor="middle" class="h" fill="#166534">③ 测地线流逐级精修</text>
  <rect x="526" y="144" width="186" height="72" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="619" y="170" text-anchor="middle" class="b" fill="#15803D" font-weight="700">球面 ↔ ERP 双向转换</text>
  <text x="619" y="192" text-anchor="middle" class="s">跨左右边界自然环形回绕</text>
  <rect x="526" y="230" width="186" height="72" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="619" y="256" text-anchor="middle" class="b" fill="#14532D" font-weight="700">沿球面大圆弧更新残差</text>
  <text x="619" y="278" text-anchor="middle" class="s">赤道与两极角度步长一致</text>

  <line x1="730" y1="212" x2="762" y2="212" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="768" y="94" width="168" height="236" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="852" y="122" text-anchor="middle" class="h" fill="#5B21B6">④ 球面稠密输出</text>
  <rect x="784" y="146" width="136" height="70" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="852" y="172" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">单位球对应场</text>
  <text x="852" y="194" text-anchor="middle" class="s">余弦角损失端到端训</text>
  <rect x="784" y="230" width="136" height="72" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="852" y="256" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">360° 相机位姿</text>
  <text x="852" y="278" text-anchor="middle" class="s">Matterport3D 暴涨</text>

  <text x="480" y="366" text-anchor="middle" class="s">相比透视稠密匹配器直接跑全景图，AUC@5° 在 Matterport3D 提升 +26.72，在 Stanford2D3D 提升 +42.62</text>

</svg>