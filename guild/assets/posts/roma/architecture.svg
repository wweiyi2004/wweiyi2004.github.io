<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 1：RoMa 整体工作流程（双路解耦 + 粗分类细精修）</text>
  <text x="480" y="62" text-anchor="middle" class="sub">冻结 DINOv2 扛极端跨视角语义 + 专训 VGG19 扛像素级定位，两头解耦互不打架</text>

  <rect x="24" y="92" width="212" height="240" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="130" y="120" text-anchor="middle" class="h" fill="#1E3A8A">① 双路特征解耦编码</text>
  <rect x="40" y="138" width="180" height="78" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="130" y="164" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">🔒 冻结 DINOv2 (1/14)</text>
  <text x="130" y="186" text-anchor="middle" class="s">只负责粗语义（防过拟合）</text>
  <text x="130" y="204" text-anchor="middle" class="s" fill="#15803D">昼夜/跨季/大视角极稳</text>
  <rect x="40" y="230" width="180" height="82" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="130" y="256" text-anchor="middle" class="b" fill="#1E40AF" font-weight="700">专训 VGG19 金字塔</text>
  <text x="130" y="278" text-anchor="middle" class="s">1/8 → 1/4 → 1/2 → 1/1</text>
  <text x="130" y="298" text-anchor="middle" class="s" fill="#1D4ED8">只负责细精修精准定位</text>

  <line x1="236" y1="178" x2="272" y2="178" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="236" y1="272" x2="516" y2="272" stroke="#3B82F6" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-blue)"/>

  <rect x="278" y="92" width="214" height="164" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="385" y="120" text-anchor="middle" class="h" fill="#166534">② 全局粗匹配解码器</text>
  <rect x="296" y="138" width="178" height="46" rx="7" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="385" y="166" text-anchor="middle" class="b" fill="#15803D" font-weight="700">GP 核匹配 + 无位置编码 ViT</text>
  <rect x="296" y="194" width="178" height="46" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="385" y="216" text-anchor="middle" class="b" fill="#14532D" font-weight="700">64×64 锚点分类转回归</text>
  <text x="385" y="233" text-anchor="middle" class="s">输出粗 Warp + 置信度</text>

  <line x1="492" y1="178" x2="516" y2="178" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="522" y="92" width="206" height="240" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="625" y="120" text-anchor="middle" class="h" fill="#9A3412">③ 5 级多尺度精修</text>
  <rect x="540" y="140" width="170" height="74" rx="8" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.5"/>
  <text x="625" y="166" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">s=14 → 8 → 4 → 2 → 1</text>
  <text x="625" y="188" text-anchor="middle" class="s">每级预测残差 ΔW 与 Δp</text>
  <text x="625" y="205" text-anchor="middle" class="s">级间梯度截断（解耦训练）</text>
  <rect x="540" y="230" width="170" height="80" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
  <text x="625" y="256" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">广义 Charbonnier 损失</text>
  <text x="625" y="278" text-anchor="middle" class="s">温柔截断粗误差离群点</text>
  <text x="625" y="297" text-anchor="middle" class="s">专心打磨亚像素精度</text>

  <line x1="728" y1="212" x2="758" y2="212" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <rect x="764" y="92" width="172" height="240" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="850" y="120" text-anchor="middle" class="h" fill="#5B21B6">④ 输出与均衡采样</text>
  <rect x="780" y="142" width="140" height="72" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="850" y="168" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">全图稠密 Warp</text>
  <text x="850" y="190" text-anchor="middle" class="s">每个像素坐标 + 置信度</text>
  <rect x="780" y="230" width="140" height="80" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="850" y="256" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">KDE 均衡采样</text>
  <text x="850" y="278" text-anchor="middle" class="s">防扎堆，均匀取万点</text>
  <text x="850" y="297" text-anchor="middle" class="s">送 RANSAC 稳估位姿</text>

  <text x="480" y="366" text-anchor="middle" class="s">透视图双视图匹配的精度天花板：在 WxBS 极端宽基线与 IMC2022 基准上大幅领先</text>

</svg>