<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 900" width="1080" height="900" role="img" aria-label="RoMa 核心机制图解：分类回归多模态建模与广义 Charbonnier 鲁棒损失">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; fill: #4B5563; }
      .sec-head { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 15px; font-weight: 700; }
      .card-title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .txt { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 12px; fill: #1F2937; }
      .txt-sm { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 11px; fill: #4B5563; }
      .mono { font-family: Consolas, "Courier New", "Microsoft YaHei", monospace; font-size: 11.5px; font-weight: 600; }
      .badge { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 11px; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6B7280" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#46A171" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D5803B" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1080" height="900" fill="#FFFFFF" />

  <!-- Main Header -->
  <text x="540" y="34" text-anchor="middle" class="title">RoMa 核心机制连环画：粗阶段“分类实现回归” × 精阶段“广义 Charbonnier 鲁棒回归”</text>
  <text x="540" y="55" text-anchor="middle" class="subtitle">核心思想：粗匹配与精细细化的概率分布形态截然不同，必须“因地制宜”地分别建模与设计损失函数</text>

  <!-- ==================== PART A ==================== -->
  <rect x="26" y="72" width="1028" height="398" rx="12" fill="#F6FBF8" stroke="#A7D4BC" stroke-width="1.5" />
  <rect x="42" y="84" width="388" height="28" rx="6" fill="#E8F1EC" stroke="#46A171" stroke-width="1.2" />
  <text x="54" y="103" class="sec-head" fill="#1F5138">机制一：粗匹配为何要“以分类实现回归”？（三步看懂）</text>

  <!-- Panel A1 -->
  <rect x="42" y="124" width="308" height="330" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.3" />
  <rect x="54" y="134" width="284" height="26" rx="5" fill="#F3F4F6" />
  <text x="196" y="152" text-anchor="middle" class="card-title" fill="#111827">步骤 1：运动边界导致条件分布“双峰”</text>

  <!-- Schematic of scale-space diffusion & bimodal conditional distribution -->
  <g transform="translate(64, 174)">
    <!-- Axes -->
    <line x1="20" y1="126" x2="250" y2="126" stroke="#374151" stroke-width="1.4" marker-end="url(#arr-gray)" />
    <line x1="20" y1="126" x2="20" y2="8" stroke="#374151" stroke-width="1.4" marker-end="url(#arr-gray)" />
    <text x="242" y="142" class="txt-sm">x^B（目标坐标）</text>
    <text x="28" y="16" class="txt-sm">q(x^B | x^A; s)</text>

    <!-- Bimodal curve (two Gaussian peaks) -->
    <path d="M 24 125 C 42 125, 55 120, 68 80 C 78 44, 86 24, 94 24 C 102 24, 110 44, 120 82 C 128 112, 134 118, 144 118 C 154 118, 160 112, 168 88 C 176 58, 184 44, 192 44 C 200 44, 208 58, 218 92 C 228 120, 238 125, 250 125"
          fill="#E5F2FC" fill-opacity="0.7" stroke="#2783DE" stroke-width="2.2" />

    <!-- Peak labels -->
    <circle cx="94" cy="24" r="4" fill="#2783DE" />
    <text x="94" y="16" text-anchor="middle" class="badge" fill="#153B60">峰 1（前景物体）</text>

    <circle cx="192" cy="44" r="4" fill="#2783DE" />
    <text x="196" y="34" text-anchor="middle" class="badge" fill="#153B60">峰 2（背景墙面）</text>

    <!-- L2 Mean trap -->
    <line x1="141" y1="126" x2="141" y2="66" stroke="#D5803B" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="141" cy="118" r="5" fill="#FBEBDE" stroke="#D5803B" stroke-width="2" />
    <rect x="88" y="64" width="108" height="36" rx="5" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" />
    <text x="142" y="79" text-anchor="middle" class="badge" fill="#70401C">传统 L2 回归预测</text>
    <text x="142" y="94" text-anchor="middle" class="txt-sm" fill="#70401C">落在两峰中间空谷!</text>
  </g>

  <text x="58" y="342" class="txt">在粗尺度 s 下，尺度空间高斯模糊</text>
  <text x="58" y="360" class="mono" fill="#153B60">q(x^A,x^B;s) = N(0,s²I) * p(x^A,x^B;0)</text>
  <text x="58" y="380" class="txt">会让前景/背景交界的“运动边界”出现</text>
  <text x="58" y="398" class="txt"><tspan font-weight="700" fill="#153B60">多模态条件分布</tspan>。若用 L2 回归直接预测</text>
  <text x="58" y="416" class="txt">单一坐标，模型会被迫取均值，落到</text>
  <text x="58" y="434" class="txt">两个真值都不在的错误空地上。</text>

  <!-- Arrow A1 -> A2 -->
  <path d="M 350 288 L 376 288" fill="none" stroke="#46A171" stroke-width="2.2" marker-end="url(#arr-green)" />

  <!-- Panel A2 -->
  <rect x="380" y="124" width="320" height="330" rx="9" fill="#FFFFFF" stroke="#46A171" stroke-width="1.5" />
  <rect x="392" y="134" width="296" height="26" rx="5" fill="#E8F1EC" />
  <text x="540" y="152" text-anchor="middle" class="card-title" fill="#1F5138">步骤 2：离散成 64×64 锚点概率网格</text>

  <!-- Stylized 8x8 grid representing 64x64 anchors -->
  <g transform="translate(454, 172)">
    <rect x="0" y="0" width="160" height="140" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.2" />
    <!-- Grid cells: 8 cols (20px) x 7 rows (20px) -->
    <!-- Peak 1 cluster around (2,2) -->
    <rect x="40" y="40" width="20" height="20" fill="#46A171" fill-opacity="0.92" />
    <rect x="20" y="40" width="20" height="20" fill="#46A171" fill-opacity="0.45" />
    <rect x="60" y="40" width="20" height="20" fill="#46A171" fill-opacity="0.55" />
    <rect x="40" y="20" width="20" height="20" fill="#46A171" fill-opacity="0.40" />
    <rect x="40" y="60" width="20" height="20" fill="#46A171" fill-opacity="0.35" />

    <!-- Peak 2 cluster around (5,4) -->
    <rect x="100" y="80" width="20" height="20" fill="#2783DE" fill-opacity="0.72" />
    <rect x="80" y="80" width="20" height="20" fill="#2783DE" fill-opacity="0.28" />
    <rect x="120" y="80" width="20" height="20" fill="#2783DE" fill-opacity="0.28" />
    <rect x="100" y="60" width="20" height="20" fill="#2783DE" fill-opacity="0.25" />
    <rect x="100" y="100" width="20" height="20" fill="#2783DE" fill-opacity="0.22" />

    <!-- Grid lines -->
    <g stroke="#D1D5DB" stroke-width="0.9">
      <line x1="20" y1="0" x2="20" y2="140" /><line x1="40" y1="0" x2="40" y2="140" />
      <line x1="60" y1="0" x2="60" y2="140" /><line x1="80" y1="0" x2="80" y2="140" />
      <line x1="100" y1="0" x2="100" y2="140" /><line x1="120" y1="0" x2="120" y2="140" />
      <line x1="140" y1="0" x2="140" y2="140" />
      <line x1="0" y1="20" x2="160" y2="20" /><line x1="0" y1="40" x2="160" y2="40" />
      <line x1="0" y1="60" x2="160" y2="60" /><line x1="0" y1="80" x2="160" y2="80" />
      <line x1="0" y1="100" x2="160" y2="100" /><line x1="0" y1="120" x2="160" y2="120" />
    </g>

    <!-- Highlight peak labels -->
    <text x="50" y="54" text-anchor="middle" class="badge" fill="#FFFFFF">k*</text>
    <text x="110" y="94" text-anchor="middle" class="badge" fill="#FFFFFF">次峰</text>
    <text x="80" y="156" text-anchor="middle" class="txt-sm">I^B 图像平面（均匀划分 K=64×64=4096 锚点）</text>
  </g>

  <text x="396" y="346" class="txt">解码器 D_θ 直接输出 4096 个锚点的概率</text>
  <text x="396" y="365" class="mono" fill="#1F5138">p(x^B|x^A) = Σ_k π_k(x^A) · U(m_k)</text>
  <text x="396" y="385" class="txt">• 锚点网格紧贴铺满、不重叠无空隙；</text>
  <text x="396" y="404" class="txt">• 主峰与次峰可<tspan font-weight="700" fill="#1F5138">同时保有高概率</tspan>，不互拉；</text>
  <text x="396" y="423" class="txt">• 训练时用 KL 散度（即交叉熵）监督离</text>
  <text x="396" y="441" class="txt">  真值最近的锚点索引 k† = argmin ‖m_k-x‖。</text>

  <!-- Arrow A2 -> A3 -->
  <path d="M 700 288 L 726 288" fill="none" stroke="#46A171" stroke-width="2.2" marker-end="url(#arr-green)" />

  <!-- Panel A3 -->
  <rect x="730" y="124" width="308" height="330" rx="9" fill="#FFFFFF" stroke="#46A171" stroke-width="1.5" />
  <rect x="742" y="134" width="284" height="26" rx="5" fill="#E8F1EC" />
  <text x="884" y="152" text-anchor="middle" class="card-title" fill="#1F5138">步骤 3：ToWarp 局部 Softargmax 解码</text>

  <!-- Zoomed 3x3 cross N4 neighborhood -->
  <g transform="translate(809, 174)">
    <!-- 3x3 grid, cell=50px -->
    <!-- Corners (ignored) -->
    <rect x="0" y="0" width="50" height="50" fill="#F3F4F6" stroke="#D1D5DB" />
    <rect x="100" y="0" width="50" height="50" fill="#F3F4F6" stroke="#D1D5DB" />
    <rect x="0" y="100" width="50" height="50" fill="#F3F4F6" stroke="#D1D5DB" />
    <rect x="100" y="100" width="50" height="50" fill="#F3F4F6" stroke="#D1D5DB" />
    <text x="25" y="29" text-anchor="middle" class="txt-sm">忽略</text>
    <text x="125" y="29" text-anchor="middle" class="txt-sm">忽略</text>
    <text x="25" y="129" text-anchor="middle" class="txt-sm">忽略</text>
    <text x="125" y="129" text-anchor="middle" class="txt-sm">忽略</text>

    <!-- 4-neighbors (N4) -->
    <rect x="50" y="0" width="50" height="50" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5" />
    <text x="75" y="22" text-anchor="middle" class="badge" fill="#1F5138">上邻域</text>
    <text x="75" y="38" text-anchor="middle" class="mono" fill="#1F5138">π=0.14</text>

    <rect x="50" y="100" width="50" height="50" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5" />
    <text x="75" y="122" text-anchor="middle" class="badge" fill="#1F5138">下邻域</text>
    <text x="75" y="138" text-anchor="middle" class="mono" fill="#1F5138">π=0.06</text>

    <rect x="0" y="50" width="50" height="50" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5" />
    <text x="25" y="72" text-anchor="middle" class="badge" fill="#1F5138">左邻域</text>
    <text x="25" y="88" text-anchor="middle" class="mono" fill="#1F5138">π=0.10</text>

    <rect x="100" y="50" width="50" height="50" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5" />
    <text x="125" y="72" text-anchor="middle" class="badge" fill="#1F5138">右邻域</text>
    <text x="125" y="88" text-anchor="middle" class="mono" fill="#1F5138">π=0.20</text>

    <!-- Center k* -->
    <rect x="50" y="50" width="50" height="50" fill="#46A171" stroke="#1F5138" stroke-width="1.8" />
    <text x="75" y="69" text-anchor="middle" class="badge" fill="#FFFFFF">峰值 k*</text>
    <text x="75" y="86" text-anchor="middle" class="mono" fill="#FFFFFF">π=0.50</text>

    <!-- Sub-bin decoded point -->
    <circle cx="84" cy="70" r="5" fill="#FBEBDE" stroke="#D5803B" stroke-width="2" />
  </g>

  <text x="746" y="346" class="txt">送入细化器前，需要一个确定的粗形变场：</text>
  <text x="746" y="365" class="mono" fill="#1F5138">Ŵ = Σ_{i∈N_4(k*)} π_i m_i / Σ π_i</text>
  <text x="746" y="385" class="txt">① 先用 argmax 锁定主峰 k*，彻底摆脱</text>
  <text x="746" y="403" class="txt">   远处次峰的拉扯（不跨峰求平均）；</text>
  <text x="746" y="421" class="txt">② 只在 k* 及其上下左右 5 格内加权平均，</text>
  <text x="746" y="439" class="txt">   拿回<tspan font-weight="700" fill="#70401C">亚网格连续精度</tspan>（橙色圆点）。</text>

  <!-- ==================== PART B ==================== -->
  <rect x="26" y="486" width="1028" height="392" rx="12" fill="#FFFBF7" stroke="#EBC19B" stroke-width="1.5" />
  <rect x="42" y="498" width="445" height="28" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" />
  <text x="54" y="517" class="sec-head" fill="#70401C">机制二：细化阶段为何改用广义 Charbonnier 鲁棒回归？</text>

  <!-- Panel B1: Accurate Gradient Curve Plot -->
  <rect x="42" y="538" width="536" height="324" rx="9" fill="#FFFFFF" stroke="#D5803B" stroke-width="1.4" />
  <rect x="54" y="548" width="512" height="26" rx="5" fill="#FBEBDE" />
  <text x="310" y="566" text-anchor="middle" class="card-title" fill="#70401C">损失梯度 ∂L/∂x 对比（精准还原论文图 4 行为特征）</text>

  <!-- Plot coordinates: origin at (310, 706); x in [-10,10] -> [100, 520] (21px per unit); y in [-2, 2] -> [796, 616] (45px per unit) -->
  <g>
    <!-- Subtle grid -->
    <g stroke="#F3F4F6" stroke-width="1">
      <line x1="100" y1="616" x2="520" y2="616" />
      <line x1="100" y1="661" x2="520" y2="661" />
      <line x1="100" y1="751" x2="520" y2="751" />
      <line x1="100" y1="796" x2="520" y2="796" />
      <line x1="152.5" y1="600" x2="152.5" y2="806" />
      <line x1="205" y1="600" x2="205" y2="806" />
      <line x1="257.5" y1="600" x2="257.5" y2="806" />
      <line x1="362.5" y1="600" x2="362.5" y2="806" />
      <line x1="415" y1="600" x2="415" y2="806" />
      <line x1="467.5" y1="600" x2="467.5" y2="806" />
    </g>

    <!-- Local high-precision shaded band near x=0 -->
    <rect x="284" y="606" width="52" height="196" fill="#E8F1EC" fill-opacity="0.55" />
    <text x="310" y="602" text-anchor="middle" class="badge" fill="#1F5138">局部内点区</text>

    <!-- Axes -->
    <line x1="90" y1="706" x2="536" y2="706" stroke="#374151" stroke-width="1.4" marker-end="url(#arr-gray)" />
    <line x1="310" y1="812" x2="310" y2="594" stroke="#374151" stroke-width="1.4" marker-end="url(#arr-gray)" />
    <text x="542" y="710" class="txt-sm">误差 x</text>
    <text x="318" y="598" class="txt-sm">梯度 ∂L/∂x</text>

    <!-- Tick labels -->
    <text x="100" y="722" text-anchor="middle" class="txt-sm">-10</text>
    <text x="205" y="722" text-anchor="middle" class="txt-sm">-5</text>
    <text x="415" y="722" text-anchor="middle" class="txt-sm">+5</text>
    <text x="520" y="722" text-anchor="middle" class="txt-sm">+10</text>
    <text x="297" y="665" text-anchor="end" class="txt-sm">+1</text>
    <text x="297" y="755" text-anchor="end" class="txt-sm">-1</text>

    <!-- L2 gradient: linear slope through 0, clipped at plot top/bottom (+/-2 at x=+/-2) -->
    <line x1="268" y1="796" x2="352" y2="616" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="6 4" />

    <!-- L1 gradient: step function at +/-1 -->
    <polyline points="100,751 309,751 311,661 520,661" fill="none" stroke="#2783DE" stroke-width="2" />

    <!-- Generalized Charbonnier (alpha=0.5) gradient: y = 1.65 * x / (x^2 + 0.5)^0.75 (peaks near +/-0.9, decays as |x|^(-1/2)) -->
    <path d="M 100 729 L 130 732 L 160 736 L 190 742 L 220 750 L 250 762 L 272 775 L 285 782 L 293 777 L 300 756 L 306 728 L 310 706 L 314 684 L 320 656 L 327 635 L 335 630 L 348 637 L 370 650 L 400 662 L 430 670 L 460 676 L 490 680 L 520 683"
          fill="none" stroke="#D5803B" stroke-width="3" />

    <!-- Annotations on plot -->
    <text x="364" y="622" class="badge" fill="#6B7280">L2 梯度（外点爆炸）</text>
    <text x="462" y="655" class="badge" fill="#2783DE">L1 梯度（恒为±1）</text>
    <text x="436" y="698" class="badge" fill="#D5803B">Charbonnier (α=0.5)</text>
    <text x="436" y="786" text-anchor="middle" class="txt-sm" fill="#70401C">大误差外点：梯度按 |x|^(-1/2) → 0 衰减</text>
    <path d="M 455 770 L 478 692" fill="none" stroke="#D5803B" stroke-width="1.2" stroke-dasharray="3 2" marker-end="url(#arr-orange)" />
  </g>

  <text x="60" y="832" class="txt">• <tspan font-weight="700" fill="#1F5138">局部（内点）</tspan>：梯度光滑且近似线性（类似 L2），细化器可稳定收敛到亚像素级精度；</text>
  <text x="60" y="851" class="txt">• <tspan font-weight="700" fill="#70401C">全局（外点）</tspan>：若粗匹配初始值偏太远，梯度自动衰减趋零，防止噪声外点把网络带偏。</text>

  <!-- Panel B2: Formula & Stage Comparison -->
  <rect x="596" y="538" width="442" height="324" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.3" />
  <rect x="608" y="548" width="418" height="26" rx="5" fill="#F3F4F6" />
  <text x="817" y="566" text-anchor="middle" class="card-title" fill="#111827">粗匹配 vs 精细细化：两套范式精准分工</text>

  <!-- Formula box -->
  <rect x="612" y="586" width="410" height="66" rx="7" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" />
  <text x="817" y="606" text-anchor="middle" class="badge" fill="#70401C">精细尺度 i ∈ {0, 1, 2, 3} 广义 Charbonnier 回归项</text>
  <text x="817" y="627" text-anchor="middle" class="mono" fill="#70401C">L_reg(i) = ( ‖ μ_θ(x_i^A, Ŵ_{i+1}) - x_i^B ‖² + s )^(1/4)</text>
  <text x="817" y="644" text-anchor="middle" class="txt-sm" fill="#70401C">其中尺度参数 s = 2^i · c，论文取 c = 0.03（粗糙层级容忍度更大）</text>

  <!-- Structured 2-column comparison table -->
  <g transform="translate(612, 666)">
    <!-- Table Header -->
    <rect x="0" y="0" width="90" height="28" fill="#F3F4F6" stroke="#D1D5DB" />
    <rect x="90" y="0" width="160" height="28" fill="#E8F1EC" stroke="#46A171" />
    <rect x="250" y="0" width="160" height="28" fill="#FBEBDE" stroke="#D5803B" />
    <text x="45" y="19" text-anchor="middle" class="badge" fill="#111827">对比维度</text>
    <text x="170" y="19" text-anchor="middle" class="badge" fill="#1F5138">粗全局匹配阶段</text>
    <text x="330" y="19" text-anchor="middle" class="badge" fill="#70401C">精细细化阶段</text>

    <!-- Row 1 -->
    <rect x="0" y="28" width="90" height="36" fill="#FFFFFF" stroke="#D1D5DB" />
    <rect x="90" y="28" width="160" height="36" fill="#FFFFFF" stroke="#D1D5DB" />
    <rect x="250" y="28" width="160" height="36" fill="#FFFFFF" stroke="#D1D5DB" />
    <text x="45" y="50" text-anchor="middle" class="badge" fill="#374151">分布形态</text>
    <text x="170" y="50" text-anchor="middle" class="txt">多模态（运动边界模糊）</text>
    <text x="330" y="50" text-anchor="middle" class="txt">局部单模态 + 偶发外点</text>

    <!-- Row 2 -->
    <rect x="0" y="64" width="90" height="36" fill="#F9FAFB" stroke="#D1D5DB" />
