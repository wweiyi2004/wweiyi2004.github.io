<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：以分类实现回归——为什么粗阶段绝不能直接做 L2 坐标回归？</text>
  <text x="480" y="62" text-anchor="middle" class="sub">面对两个长得一模一样的拱门（多模态歧义），L2 回归会算出“中间空墙”，而锚点分类能保住双峰</text>

  <!-- Left: Direct L2 regression fails -->
  <rect x="28" y="88" width="428" height="270" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="242" y="118" text-anchor="middle" class="h" fill="#991B1B">✗ 直接 L2 坐标回归：被平均到“空墙”上！</text>
  <rect x="54" y="138" width="376" height="128" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <!-- Two identical arches -->
  <path d="M 90 236 L 90 194 A 34 28 0 0 1 158 194 L 158 236 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="124" y="255" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">拱门1 (50%)</text>
  <path d="M 326 236 L 326 194 A 34 28 0 0 1 394 194 L 394 236 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="360" y="255" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">拱门2 (50%)</text>
  <!-- Wrong middle dot -->
  <circle cx="242" cy="202" r="9" fill="#DC2626"/>
  <text x="242" y="176" text-anchor="middle" class="b" fill="#DC2626" font-weight="700">L2 预测均值 = 空墙 ✗</text>
  <text x="242" y="296" text-anchor="middle" class="b" fill="#7F1D1D">为了最小化平方误差期望，网络被迫输出两峰正中间</text>
  <text x="242" y="324" text-anchor="middle" class="s" fill="#991B1B">结果两边都不沾，粗匹配彻底失灵</text>

  <!-- Right: Classification + ToWarp -->
  <rect x="484" y="88" width="448" height="270" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="708" y="118" text-anchor="middle" class="h" fill="#166534">✓ RoMa 锚点分类（64×64 类）+ ToWarp 局部解码</text>
  <rect x="510" y="138" width="396" height="128" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <!-- Bar chart showing bimodal peaks -->
  <rect x="546" y="168" width="38" height="68" rx="4" fill="#16A34A"/><text x="565" y="160" text-anchor="middle" class="s" fill="#15803D" font-weight="700">峰1: 0.52</text>
  <rect x="606" y="226" width="38" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="666" y="228" width="38" height="8" rx="3" fill="#CBD5E1"/>
  <text x="685" y="216" text-anchor="middle" class="s" fill="#64748B">中间空墙 ≈ 0</text>
  <rect x="726" y="226" width="38" height="10" rx="3" fill="#CBD5E1"/>
  <rect x="786" y="176" width="38" height="60" rx="4" fill="#3B82F6"/><text x="805" y="168" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">峰2: 0.44</text>
  <!-- Star on Peak 1 -->
  <text x="572" y="255" text-anchor="middle" class="s" fill="#15803D" font-weight="700">★ argmax 选主峰</text>

  <text x="708" y="296" text-anchor="middle" class="b" fill="#14532D">① 交叉熵允许两个拱门各自保留高概率峰值，绝不糊成均值</text>
  <text x="708" y="324" text-anchor="middle" class="b" fill="#14532D">② 推理时 ToWarp 先挑最高峰 k*，再在 4 邻域内局部软加权</text>

</svg>