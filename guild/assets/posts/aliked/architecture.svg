<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="980" height="400" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 1：ALIKED 整体工作流程（宏观全景）</text>
  <text x="490" y="62" text-anchor="middle" class="sub">输入单张图像 → 4 级编码聚合成全分辨率特征图 → 先找稀疏关键点 → 仅在关键点上跑可变形描述头</text>

  <!-- Stage 1: Input & Multi-scale Encoding -->
  <rect x="24" y="92" width="204" height="252" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="126" y="118" text-anchor="middle" class="h" fill="#1E293B">① 输入与多尺度编码</text>

  <!-- Mini RGB image -->
  <rect x="42" y="130" width="168" height="54" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Mini building icon inside image -->
  <polygon points="58,166 74,146 90,166" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/>
  <rect x="62" y="166" width="24" height="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.4"/>
  <text x="148" y="155" text-anchor="middle" class="b" fill="#1E293B" font-weight="700">输入图像 I</text>
  <text x="148" y="173" text-anchor="middle" class="s">H × W × 3</text>

  <line x1="126" y1="184" x2="126" y2="202" stroke="#64748B" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- 4 Pyramid Blocks -->
  <rect x="40" y="206" width="172" height="24" rx="5" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.4"/>
  <text x="126" y="223" text-anchor="middle" class="s" fill="#1E40AF" font-weight="700">1×  block1 · 普通卷积</text>

  <rect x="45" y="235" width="162" height="24" rx="5" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.4"/>
  <text x="126" y="252" text-anchor="middle" class="s" fill="#1E40AF" font-weight="700">1/2 block2 · 普通卷积</text>

  <rect x="50" y="264" width="152" height="24" rx="5" fill="#FFEDD5" stroke="#FB923C" stroke-width="1.5"/>
  <text x="126" y="281" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">1/8 block3 · DCN</text>

  <rect x="55" y="293" width="142" height="24" rx="5" fill="#FFEDD5" stroke="#FB923C" stroke-width="1.5"/>
  <text x="126" y="310" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">1/32 block4 · DCN</text>

  <text x="126" y="335" text-anchor="middle" class="s">浅层保细节 · 深层抗形变</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="228" y1="218" x2="256" y2="218" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Aggregation + Keypoint Detection -->
  <rect x="260" y="92" width="220" height="252" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="370" y="118" text-anchor="middle" class="h" fill="#1E3A8A">② 聚合特征与检点</text>

  <rect x="278" y="132" width="184" height="76" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="370" y="156" text-anchor="middle" class="h" fill="#1D4ED8">4 路对齐拼接 → F</text>
  <text x="370" y="177" text-anchor="middle" class="b">ublock1~4 上采样聚合</text>
  <text x="370" y="196" text-anchor="middle" class="s">H×W 全分辨率多尺度特征</text>

  <line x1="370" y1="208" x2="370" y2="232" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="278" y="236" width="184" height="88" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="370" y="260" text-anchor="middle" class="h" fill="#047857">SMH 分数图 → DKD</text>
  <text x="370" y="282" text-anchor="middle" class="b">NMS + softargmax 精修</text>
  <text x="370" y="304" text-anchor="middle" class="s" fill="#059669" font-weight="700">先检出 N 个亚像素点 P</text>

  <!-- Dual Fork Arrows 2 -> 3 -->
  <line x1="480" y1="170" x2="544" y2="170" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="512" y="160" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">特征图 F</text>

  <line x1="480" y1="280" x2="544" y2="280" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-purple)"/>
  <text x="512" y="270" text-anchor="middle" class="s" fill="#6D28D9" font-weight="700">稀疏点 P</text>

  <!-- Stage 3: SDDH -->
  <rect x="548" y="92" width="214" height="252" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="655" y="118" text-anchor="middle" class="h" fill="#5B21B6">③ 稀疏可变形头 SDDH</text>

  <!-- Visual deformable sampling box -->
  <rect x="566" y="132" width="178" height="148" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.8"/>
  <!-- Slanted object outline -->
  <polygon points="586,238 616,154 714,168 696,248" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Small 3x3 dashed patch around keypoint -->
  <rect x="640" y="186" width="24" height="24" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2" stroke-dasharray="3,2"/>
  <!-- Deformable tentacles from p(652,198) to M supporting points -->
  <line x1="652" y1="198" x2="618" y2="162" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="652" y1="198" x2="658" y2="160" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="652" y1="198" x2="704" y2="174" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="652" y1="198" x2="604" y2="210" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="652" y1="198" x2="694" y2="214" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="652" y1="198" x2="624" y2="236" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="652" y1="198" x2="678" y2="240" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Supporting points -->
  <circle cx="618" cy="162" r="4.5" fill="#F97316"/>
  <circle cx="658" cy="160" r="4.5" fill="#F97316"/>
  <circle cx="704" cy="174" r="4.5" fill="#F97316"/>
  <circle cx="604" cy="210" r="4.5" fill="#F97316"/>
  <circle cx="694" cy="214" r="4.5" fill="#F97316"/>
  <circle cx="624" cy="236" r="4.5" fill="#F97316"/>
  <circle cx="678" cy="240" r="4.5" fill="#F97316"/>
  <!-- Center keypoint p -->
  <circle cx="652" cy="198" r="6.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.8"/>
  <text x="655" y="270" text-anchor="middle" class="s" fill="#6D28D9" font-weight="700">每点自由采 M 个支撑点</text>

  <rect x="566" y="292" width="178" height="36" rx="18" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="655" y="315" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">只在 N 个点算描述子</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="762" y1="218" x2="790" y2="218" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Output -->
  <rect x="794" y="92" width="162" height="252" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="875" y="118" text-anchor="middle" class="h" fill="#065F46">④ 输出局部特征</text>

  <!-- Output mini image -->
  <rect x="812" y="132" width="126" height="114" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <polygon points="834,218 874,158 918,218" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
  <!-- Detected keypoints -->
  <circle cx="874" cy="158" r="6" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="834" cy="218" r="6" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="918" cy="218" r="6" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="874" cy="196" r="6" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="875" y="238" text-anchor="middle" class="s" fill="#047857">精准点 + 强特征</text>

  <rect x="812" y="258" width="126" height="30" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
  <text x="875" y="278" text-anchor="middle" class="b" fill="#065F46" font-weight="700">亚像素坐标 P</text>

  <rect x="812" y="296" width="126" height="30" rx="6" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.4"/>
  <text x="875" y="316" text-anchor="middle" class="b" fill="#065F46" font-weight="700">可变形描述子 D</text>

  <text x="490" y="376" text-anchor="middle" class="s">核心颠覆：彻底抛弃全图稠密描述图（砍掉 99% 无点像素的无效卷积），先检出稀疏点再按需提取描述子</text>
</svg>