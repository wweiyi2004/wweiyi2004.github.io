  <text x="612" y="286" text-anchor="middle" class="b">顺着物体轮廓抓特征</text>
  <text x="612" y="308" text-anchor="middle" class="s">旋转/斜视时触手跟着转</text>

  <line x1="724" y1="206" x2="746" y2="206" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-purple)"/>

  <!-- Step 4 Card -->
  <rect x="750" y="88" width="206" height="238" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="853" y="114" text-anchor="middle" class="h" fill="#166534">④ 加权聚合成描述子</text>
  <rect x="766" y="128" width="174" height="134" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
  <!-- M supporting feature bars on left -->
  <rect x="780" y="140" width="12" height="62" rx="3" fill="#60A5FA"/>
  <rect x="796" y="140" width="12" height="62" rx="3" fill="#A78BFA"/>
  <rect x="812" y="140" width="12" height="62" rx="3" fill="#FB923C"/>
  <text x="802" y="220" text-anchor="middle" class="s">M 个向量</text>
  <!-- Merge arrow & ConvM -->
  <line x1="828" y1="171" x2="884" y2="171" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <text x="854" y="160" text-anchor="middle" class="mono" font-size="11.5" fill="#15803D">ConvM</text>
  <text x="854" y="189" text-anchor="middle" class="s" fill="#15803D">加权融合</text>
