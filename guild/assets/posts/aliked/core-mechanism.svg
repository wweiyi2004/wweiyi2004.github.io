  <rect x="892" y="138" width="28" height="66" rx="5" fill="#16A34A"/>
  <text x="906" y="176" text-anchor="middle" class="mono" font-size="14" fill="#FFFFFF">d</text>
  <text x="906" y="220" text-anchor="middle" class="s" fill="#15803D" font-weight="700">128维</text>
  <text x="853" y="250" text-anchor="middle" class="s" fill="#15803D" font-weight="700">Conv1×1 → SELU → ConvM</text>
  <text x="853" y="286" text-anchor="middle" class="b">跨槽位融合 M 个特征</text>
  <text x="853" y="308" text-anchor="middle" class="s">一步输出抗形变描述子</text>

  <!-- Bottom Comparison Callout -->
  <rect x="24" y="344" width="932" height="56" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="490" y="368" text-anchor="middle" class="b" fill="#1E293B" font-weight="700">SDDH 对比普通 DCN 的三大区别：① 仅在稀疏点计算（非全图） · ② 采样数 M 任意可调（8 / 16 / 32，不受 K×K 束缚）</text>
  <text x="490" y="388" text-anchor="middle" class="b" fill="#475569">③ 专职单步提炼强表达描述子：ALIKED-N(16) 的 SDDH 仅占 0.57 GFLOPs（1.88 ms），精度大幅领先普通稀疏 3×3 卷积</text>
