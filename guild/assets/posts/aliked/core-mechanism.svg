  <text x="129" y="250" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">特征图 F 上抠 3×3 块</text>
  <text x="129" y="286" text-anchor="middle" class="b">只以关键点 p 为中心</text>
  <text x="129" y="308" text-anchor="middle" class="s">跳过全图 99% 无点区域</text>

  <line x1="234" y1="206" x2="256" y2="206" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>

