  <circle cx="367" cy="212" r="5.5" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="367" y="254" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">M 组自由偏移 (Δx, Δy)</text>
  <text x="367" y="286" text-anchor="middle" class="b">2M 自由度自由伸缩</text>
  <text x="367" y="308" text-anchor="middle" class="s">突破传统仿射 6 自由度</text>

  <line x1="474" y1="206" x2="496" y2="206" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arr-orange)"/>

  <!-- Step 3 Card -->
  <rect x="500" y="88" width="224" height="238" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="612" y="114" text-anchor="middle" class="h" fill="#5B21B6">③ 双线性采 M 个支撑点</text>
  <rect x="516" y="128" width="192" height="134" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <!-- Slanted perspective contour -->
  <polygon points="546,225 566,140 672,155 664,230" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="612" y1="187" x2="564" y2="154" stroke="#8B5CF6" stroke-width="1.6" stroke-dasharray="3,2"/>
