<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：为什么只在 block3/4 加 DCN，前两块坚决用普通卷积？</text>
  <text x="480" y="62" text-anchor="middle" class="sub">浅层高分辨率要死守像素级角点定位，深层低分辨率开 DCN 几乎零成本换来大幅涨点</text>

  <!-- Left Panel: Shallow Blocks (NO DCN) -->
  <rect x="28" y="88" width="438" height="274" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="247" y="116" text-anchor="middle" class="h" fill="#991B1B">✗ 浅层 block1/2（1×、1/2）：绝不加 DCN</text>

  <!-- Visual left: Sharp corner with regular 3x3 -->
  <rect x="48" y="132" width="186" height="142" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <text x="141" y="152" text-anchor="middle" class="s" fill="#1E40AF" font-weight="700">480×640 高分辨率角点</text>
  <!-- Crisp L-corner shape -->
  <path d="M 86 232 L 141 232 L 141 164 L 196 164 L 196 232 Z" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <polyline points="86,232 141,232 141,164" fill="none" stroke="#1E3A8A" stroke-width="2.5"/>
  <!-- 3x3 grid box -->
  <rect x="111" y="166" width="60" height="60" rx="4" fill="none" stroke="#3B82F6" stroke-width="1.3" stroke-dasharray="4,3"/>
  <circle cx="119" cy="174" r="4.5" fill="#2563EB"/>
  <circle cx="119" cy="196" r="4.5" fill="#2563EB"/>
  <circle cx="119" cy="218" r="4.5" fill="#2563EB"/>
  <circle cx="141" cy="174" r="4.5" fill="#2563EB"/>
  <circle cx="141" cy="196" r="4.5" fill="#2563EB"/>
  <circle cx="141" cy="218" r="4.5" fill="#2563EB"/>
  <circle cx="163" cy="174" r="4.5" fill="#2563EB"/>
  <circle cx="163" cy="196" r="4.5" fill="#2563EB"/>
  <circle cx="163" cy="218" r="4.5" fill="#2563EB"/>
  <text x="141" y="262" text-anchor="middle" class="s" fill="#475569">规则 3×3 稳稳锁住尖锐边缘</text>

  <!-- Info box right of visual -->
  <rect x="248" y="132" width="198" height="142" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <text x="347" y="160" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">硬加 DCN 的两大代价</text>
  <text x="264" y="190" class="b" fill="#7F1D1D">• 像素基数太大，算力暴涨</text>
  <text x="264" y="218" class="b" fill="#7F1D1D">• 偏移易搅乱底层精细角点</text>
  <rect x="264" y="234" width="166" height="26" rx="13" fill="#FEE2E2"/>
  <text x="347" y="252" text-anchor="middle" class="s" fill="#B91C1C" font-weight="700">吃力不讨好：变慢且掉点</text>

  <text x="247" y="304" text-anchor="middle" class="b" fill="#7F1D1D">• 前两块专职保留最细腻的边缘与亚像素定位线索</text>
  <text x="247" y="330" text-anchor="middle" class="b" fill="#7F1D1D">• 池化换 AvgPool + SELU：零额外耗时，精度先涨 +2.57%</text>

  <!-- Right Panel: Deep Blocks (YES DCN) -->
  <rect x="494" y="88" width="438" height="274" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="713" y="116" text-anchor="middle" class="h" fill="#166534">✓ 深层 block3/4（1/8、1/32）：果断换 DCN3×3</text>

  <!-- Visual right: Slanted perspective wall with DCN -->
  <rect x="514" y="132" width="186" height="142" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
  <text x="607" y="152" text-anchor="middle" class="s" fill="#15803D" font-weight="700">60×80 / 15×20 倾斜透视区</text>
  <!-- Tilted perspective facade -->
  <polygon points="560,236 576,164 654,174 642,226" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <circle cx="583" cy="174" r="3" fill="#CBD5E1"/>
  <line x1="583" y1="174" x2="572" y2="182" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="572" cy="182" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="607" cy="174" r="3" fill="#CBD5E1"/>
  <line x1="607" y1="174" x2="605" y2="168" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="605" cy="168" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="631" cy="174" r="3" fill="#CBD5E1"/>
  <line x1="631" y1="174" x2="644" y2="174" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="644" cy="174" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="583" cy="198" r="3" fill="#CBD5E1"/>
  <line x1="583" y1="198" x2="578" y2="204" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="578" cy="204" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="607" cy="198" r="3" fill="#CBD5E1"/>
  <circle cx="607" cy="198" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="631" cy="198" r="3" fill="#CBD5E1"/>
  <line x1="631" y1="198" x2="640" y2="194" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="640" cy="194" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="583" cy="222" r="3" fill="#CBD5E1"/>
  <line x1="583" y1="222" x2="588" y2="228" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="588" cy="228" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="607" cy="222" r="3" fill="#CBD5E1"/>
  <line x1="607" y1="222" x2="614" y2="224" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="614" cy="224" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <circle cx="631" cy="222" r="3" fill="#CBD5E1"/>
  <line x1="631" y1="222" x2="636" y2="216" stroke="#F97316" stroke-width="1.4"/>
  <circle cx="636" cy="216" r="4.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1"/>
  <text x="607" y="262" text-anchor="middle" class="s" fill="#15803D">采样点动态挪动贴合透视</text>

  <!-- Metric box right of visual -->
  <rect x="714" y="132" width="198" height="142" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
  <text x="813" y="160" text-anchor="middle" class="b" fill="#166534" font-weight="700">消融实测（极致性价比）</text>
  <text x="730" y="188" class="b" fill="#14532D">算力仅增：</text>
  <text x="898" y="188" text-anchor="end" class="mono" font-size="13" fill="#047857">+0.1 GFLOPs</text>
  <text x="730" y="214" class="b" fill="#14532D">耗时仅多：</text>
  <text x="898" y="214" text-anchor="end" class="mono" font-size="13" fill="#047857">+0.8 ms</text>
  <rect x="728" y="232" width="170" height="28" rx="14" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.4"/>
  <text x="813" y="251" text-anchor="middle" class="b" fill="#15803D" font-weight="700">IMW 精度暴涨 +5.36%</text>

  <text x="713" y="304" text-anchor="middle" class="b" fill="#14532D">• 空间尺寸已缩至 1/8 和 1/32，跑 DCN 开销微乎其微</text>
  <text x="713" y="330" text-anchor="middle" class="b" fill="#14532D">• 最后 4 路 ublock 拼接，兼得浅层准定位 + 深层抗形变</text>
</svg>