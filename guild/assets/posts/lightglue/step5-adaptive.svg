<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="440" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 5：自适应“早停”与“点剪枝”——看题难易动态省算力</text>
  <text x="480" y="62" text-anchor="middle" class="sub">简单图像对只跑 2~3 层直接下班；困难图像对每层把遮挡废点扔掉，越往后算得越轻</text>

  <!-- Row 1: Early Exit -->
  <rect x="28" y="88" width="904" height="148" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="48" y="116" class="h" fill="#166534">机制 A · 自适应深度（Early Exit）：简单图像对（如相邻视频帧）</text>

  <rect x="52" y="134" width="132" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="118" y="162" text-anchor="middle" class="h" fill="#1E40AF">Layer 1</text>
  <text x="118" y="186" text-anchor="middle" class="b">自信点：42%</text>

  <line x1="184" y1="172" x2="218" y2="172" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <rect x="224" y="134" width="132" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="290" y="162" text-anchor="middle" class="h" fill="#1E40AF">Layer 2</text>
  <text x="290" y="186" text-anchor="middle" class="b">自信点：79%</text>

  <line x1="356" y1="172" x2="390" y2="172" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <rect x="396" y="134" width="160" height="76" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2.2"/>
  <text x="476" y="162" text-anchor="middle" class="h" fill="#14532D">Layer 3 ★ 达标</text>
  <text x="476" y="186" text-anchor="middle" class="b" fill="#166534" font-weight="700">自信点 96% &gt; 95%</text>

  <line x1="556" y1="172" x2="594" y2="172" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <rect x="600" y="134" width="138" height="76" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="669" y="162" text-anchor="middle" class="h" fill="#5B21B6">提前输出！</text>
  <text x="669" y="186" text-anchor="middle" class="b" fill="#6D28D9">直接送匹配头</text>

  <rect x="756" y="134" width="154" height="76" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="833" y="162" text-anchor="middle" class="h" fill="#94A3B8">Layer 4 ~ 9</text>
  <text x="833" y="186" text-anchor="middle" class="s" fill="#94A3B8">全部跳过（零算力）</text>

  <!-- Row 2: Point Pruning -->
  <rect x="28" y="256" width="904" height="162" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="48" y="284" class="h" fill="#9A3412">机制 B · 自适应宽度（Point Pruning）：困难大视角图像对（很多点不在共视区）</text>

  <!-- Mini point frame 1 -->
  <rect x="52" y="302" width="188" height="96" rx="10" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.8"/>
  <text x="146" y="324" text-anchor="middle" class="h" fill="#1E40AF">Layer 1：2048 点</text>
  <!-- Visual dots: mix of blue (good) and grey (unmatchable) -->
  <circle cx="80" cy="348" r="5" fill="#2563EB"/><circle cx="102" cy="342" r="5" fill="#2563EB"/><circle cx="122" cy="356" r="5" fill="#2563EB"/>
  <circle cx="88" cy="370" r="5" fill="#2563EB"/><circle cx="114" cy="376" r="5" fill="#2563EB"/>
  <circle cx="156" cy="344" r="5" fill="#CBD5E1"/><circle cx="178" cy="348" r="5" fill="#CBD5E1"/><circle cx="204" cy="342" r="5" fill="#CBD5E1"/>
  <circle cx="164" cy="368" r="5" fill="#CBD5E1"/><circle cx="192" cy="374" r="5" fill="#CBD5E1"/><circle cx="212" cy="366" r="5" fill="#CBD5E1"/>
  <text x="146" y="392" text-anchor="middle" class="s">蓝=共视区 · 灰=遮挡废点</text>

  <line x1="240" y1="350" x2="296" y2="350" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arr-orange)"/>
  <text x="268" y="340" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">剪废点</text>

  <!-- Mini point frame 2 -->
  <rect x="302" y="302" width="188" height="96" rx="10" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.8"/>
  <text x="396" y="324" text-anchor="middle" class="h" fill="#C2410C">Layer 3：剩 ~1500 点</text>
  <circle cx="330" cy="348" r="5" fill="#2563EB"/><circle cx="352" cy="342" r="5" fill="#2563EB"/><circle cx="372" cy="356" r="5" fill="#2563EB"/>
  <circle cx="338" cy="370" r="5" fill="#2563EB"/><circle cx="364" cy="376" r="5" fill="#2563EB"/>
  <circle cx="406" cy="344" r="5" fill="#CBD5E1"/><circle cx="428" cy="368" r="5" fill="#CBD5E1"/>
  <text x="396" y="392" text-anchor="middle" class="s">确认 σ≈0 且自信的点直接剔除</text>

  <line x1="490" y1="350" x2="546" y2="350" stroke="#EA580C" stroke-width="2.2" marker-end="url(#arr-orange)"/>
  <text x="518" y="340" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">再剪枝</text>

  <!-- Mini point frame 3 -->
  <rect x="552" y="302" width="188" height="96" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="646" y="324" text-anchor="middle" class="h" fill="#15803D">Layer 7~9：聚焦核心区</text>
  <circle cx="585" cy="348" r="5.5" fill="#2563EB"/><circle cx="612" cy="342" r="5.5" fill="#2563EB"/><circle cx="638" cy="356" r="5.5" fill="#2563EB"/>
  <circle cx="598" cy="372" r="5.5" fill="#2563EB"/><circle cx="628" cy="374" r="5.5" fill="#2563EB"/><circle cx="662" cy="350" r="5.5" fill="#2563EB"/>
  <text x="646" y="392" text-anchor="middle" class="s">只剩高价值共视点互相精配</text>

  <line x1="740" y1="350" x2="778" y2="350" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-purple)"/>

  <rect x="784" y="308" width="126" height="84" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  <text x="847" y="344" text-anchor="middle" class="h" fill="#5B21B6">复杂度大降</text>
  <text x="847" y="368" text-anchor="middle" class="s" fill="#6D28D9">注意力按 N² 暴减</text>

</svg>