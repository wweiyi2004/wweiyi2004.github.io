<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="980" height="400" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 1：LightGlue 整体工作流程（宏观全景）</text>
  <text x="490" y="62" text-anchor="middle" class="sub">输入两张图的关键点与描述子 → 多层交替注意力（简单图提前退出）→ 一步输出一对一匹配</text>

  <!-- Stage 1: Input -->
  <rect x="28" y="95" width="185" height="245" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="120" y="122" text-anchor="middle" class="h" fill="#1E293B">① 输入局部特征</text>
  <!-- Mini Image A -->
  <rect x="48" y="138" width="145" height="82" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="120" y="158" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">图 A（M 个点）</text>
  <circle cx="76" cy="176" r="6" fill="#2563EB"/><circle cx="115" cy="172" r="6" fill="#16A34A"/>
  <circle cx="152" cy="190" r="6" fill="#7C3AED"/><circle cx="92" cy="192" r="6" fill="#94A3B8"/>
  <text x="120" y="213" text-anchor="middle" class="s">位置 p + 描述子 d</text>
  <!-- Mini Image B -->
  <rect x="48" y="236" width="145" height="82" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="120" y="256" text-anchor="middle" class="b" fill="#15803D" font-weight="700">图 B（N 个点）</text>
  <circle cx="82" cy="278" r="6" fill="#2563EB"/><circle cx="122" cy="274" r="6" fill="#16A34A"/>
  <circle cx="158" cy="292" r="6" fill="#7C3AED"/><circle cx="164" cy="264" r="6" fill="#94A3B8"/>
  <text x="120" y="311" text-anchor="middle" class="s">位置 p + 描述子 d</text>

  <!-- Arrow 1->2 -->
  <line x1="213" y1="218" x2="255" y2="218" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Stacked Layers -->
  <rect x="260" y="95" width="250" height="245" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="385" y="122" text-anchor="middle" class="h" fill="#1E3A8A">② L 层轻量注意力（L = 9）</text>
  <rect x="282" y="140" width="206" height="58" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="385" y="164" text-anchor="middle" class="h" fill="#1D4ED8">图内自注意力 + 2D RoPE</text>
  <text x="385" y="185" text-anchor="middle" class="s">看清点与点之间的相对几何位置</text>

  <line x1="385" y1="198" x2="385" y2="218" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="282" y="222" width="206" height="58" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="385" y="246" text-anchor="middle" class="h" fill="#047857">双向交叉注意力（算力减半）</text>
  <text x="385" y="267" text-anchor="middle" class="s">两张图共享一份相似度矩阵互查</text>

  <rect x="275" y="294" width="220" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="385" y="315" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">每层动态剪掉遮挡废点 + 判断早停</text>

  <!-- Early Exit curved arrow -->
  <path d="M 495 310 Q 538 310 538 260 L 538 235" fill="none" stroke="#EA580C" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-orange)"/>
  <text x="538" y="352" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">够自信就提前退出！</text>

  <!-- Arrow 2->3 -->
  <line x1="510" y1="218" x2="555" y2="218" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Matching Head -->
  <rect x="560" y="128" width="165" height="180" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="642" y="158" text-anchor="middle" class="h" fill="#065F46">③ 解耦匹配头</text>
  <rect x="578" y="176" width="129" height="44" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="642" y="196" text-anchor="middle" class="b" fill="#065F46" font-weight="700">双向 Softmax</text>
  <text x="642" y="213" text-anchor="middle" class="s">选“谁最像”</text>
  <text x="642" y="238" text-anchor="middle" class="h" fill="#059669">×</text>
  <rect x="578" y="246" width="129" height="44" rx="7" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="642" y="266" text-anchor="middle" class="b" fill="#065F46" font-weight="700">可匹配度 σ</text>
  <text x="642" y="283" text-anchor="middle" class="s">判“在不在对面”</text>

  <!-- Arrow 3->4 -->
  <line x1="725" y1="218" x2="765" y2="218" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Output -->
  <rect x="770" y="95" width="182" height="245" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="861" y="122" text-anchor="middle" class="h" fill="#5B21B6">④ 输出精准匹配</text>
  <!-- Top & bottom mini frames with match lines -->
  <rect x="790" y="142" width="142" height="62" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="790" y="236" width="142" height="62" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <!-- Match lines -->
  <line x1="815" y1="175" x2="822" y2="266" stroke="#2563EB" stroke-width="2.2"/>
  <line x1="855" y1="168" x2="862" y2="262" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="895" y1="184" x2="900" y2="275" stroke="#7C3AED" stroke-width="2.2"/>
  <!-- Points -->
  <circle cx="815" cy="175" r="5.5" fill="#2563EB"/><circle cx="822" cy="266" r="5.5" fill="#2563EB"/>
  <circle cx="855" cy="168" r="5.5" fill="#16A34A"/><circle cx="862" cy="262" r="5.5" fill="#16A34A"/>
  <circle cx="895" cy="184" r="5.5" fill="#7C3AED"/><circle cx="900" cy="275" r="5.5" fill="#7C3AED"/>
  <!-- Crossed out unmatched points -->
  <circle cx="918" cy="158" r="5" fill="#CBD5E1"/>
  <line x1="913" y1="153" x2="923" y2="163" stroke="#EF4444" stroke-width="2"/>
  <line x1="923" y1="153" x2="913" y2="163" stroke="#EF4444" stroke-width="2"/>
  <circle cx="806" cy="283" r="5" fill="#CBD5E1"/>
  <line x1="801" y1="278" x2="811" y2="288" stroke="#EF4444" stroke-width="2"/>
  <line x1="811" y1="278" x2="801" y2="288" stroke="#EF4444" stroke-width="2"/>
  <text x="861" y="322" text-anchor="middle" class="s" fill="#5B21B6">一对一连线 · 剔除遮挡点</text>

  <text x="490" y="376" text-anchor="middle" class="s">对比 SuperGlue：砍掉 100 步 Sinkhorn 迭代，改用 2D RoPE + 双向共享相似度 + 看难易自动早停</text>

</svg>