<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 730" width="1080" height="730" role="img" aria-label="LightGlue 端到端架构总览图">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .font-main { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 12.5px; fill: #4B5563; }
      .stage-title { font-size: 13px; font-weight: 700; fill: #374151; }
      .box-title { font-size: 13.5px; font-weight: 700; }
      .box-sub { font-size: 11.5px; }
      .tensor { font-size: 11px; font-family: Consolas, "Courier New", "Microsoft YaHei", monospace; font-weight: 600; }
      .note-text { font-size: 11.5px; fill: #4B5563; }
      .badge-text { font-size: 11px; font-weight: 700; }

      .node-data { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; }
      .text-data { fill: #111827; }

      .node-enc { fill: #E5F2FC; stroke: #2783DE; stroke-width: 1.5; }
      .text-enc { fill: #153B60; }

      .node-attn { fill: #E8F1EC; stroke: #46A171; stroke-width: 1.5; }
      .text-attn { fill: #1F5138; }

      .node-hi { fill: #FBEBDE; stroke: #D5803B; stroke-width: 1.6; }
      .text-hi { fill: #70401C; }

      .node-out { fill: #EDE9FE; stroke: #8B5CF6; stroke-width: 1.5; }
      .text-out { fill: #422578; }

      .container-loop { fill: #FAFDFB; stroke: #46A171; stroke-width: 1.6; stroke-dasharray: 7 4; }
      .container-head { fill: #FAF9FF; stroke: #8B5CF6; stroke-width: 1.4; stroke-dasharray: 6 4; }

      .arrow { stroke: #4B5563; stroke-width: 1.7; fill: none; }
      .arrow-blue { stroke: #2783DE; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
      .arrow-green { stroke: #46A171; stroke-width: 1.8; fill: none; }
      .arrow-orange { stroke: #D5803B; stroke-width: 1.8; fill: none; }
      .arrow-purple { stroke: #8B5CF6; stroke-width: 1.8; fill: none; }
    </style>

    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2783DE" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#46A171" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D5803B" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect class="bg" x="0" y="0" width="1080" height="730" />

  <!-- Title Header -->
  <text class="font-main title" x="540" y="36" text-anchor="middle">LightGlue 整体端到端架构总览</text>
  <text class="font-main subtitle" x="540" y="58" text-anchor="middle">默认配置：L = 9 层 Transformer · h = 4 头 · 特征维度 d = 256 · 自适应早停 (α = 95%) 与动态点剪枝 (β = 0.01)</text>
  <line x1="28" y1="72" x2="1052" y2="72" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- Column Stage Headers -->
  <text class="font-main stage-title" x="128" y="96" text-anchor="middle">① 局部特征输入与位置编码</text>
  <text class="font-main stage-title" x="455" y="96" text-anchor="middle">② 自适应深度 / 宽度 Transformer 交互主干（循环 L = 9 层）</text>
  <text class="font-main stage-title" x="780" y="96" text-anchor="middle">③ 轻量级解耦匹配头</text>
  <text class="font-main stage-title" x="980" y="96" text-anchor="middle">④ 筛选与输出</text>

  <!-- ================= COLUMN 1: INPUT & ENCODING ================= -->
  <!-- Image A features -->
  <rect class="node-data" x="28" y="114" width="200" height="86" rx="10" />
  <text class="font-main box-title text-data" x="128" y="138" text-anchor="middle">图像 A 局部特征</text>
  <text class="font-main box-sub text-data" x="128" y="159" text-anchor="middle">2D 关键点坐标 pᴬ</text>
  <text class="tensor text-data" x="128" y="176" text-anchor="middle">[M, 2]  归一化至 [-1, 1]</text>
  <text class="tensor text-data" x="128" y="192" text-anchor="middle">描述子 dᴬ: [M, D_in]</text>

  <!-- Image B features -->
  <rect class="node-data" x="28" y="216" width="200" height="86" rx="10" />
  <text class="font-main box-title text-data" x="128" y="240" text-anchor="middle">图像 B 局部特征</text>
  <text class="font-main box-sub text-data" x="128" y="261" text-anchor="middle">2D 关键点坐标 pᴮ</text>
  <text class="tensor text-data" x="128" y="278" text-anchor="middle">[N, 2]  归一化至 [-1, 1]</text>
  <text class="tensor text-data" x="128" y="294" text-anchor="middle">描述子 dᴮ: [N, D_in]</text>

  <!-- Descriptor Init -->
  <rect class="node-enc" x="28" y="330" width="200" height="104" rx="10" />
  <text class="font-main box-title text-enc" x="128" y="354" text-anchor="middle">特征投影与状态初始化</text>
  <text class="font-main box-sub text-enc" x="128" y="375" text-anchor="middle">SuperPoint (256) 直接作为初态</text>
  <text class="font-main box-sub text-enc" x="128" y="393" text-anchor="middle">SIFT / DISK (128) → Linear 升维</text>
  <text class="tensor text-enc" x="128" y="413" text-anchor="middle">Xᴬ: [M, 256]  |  Xᴮ: [N, 256]</text>
  <text class="font-main box-sub text-enc" x="128" y="428" text-anchor="middle">(不混入绝对位置编码)</text>

  <!-- 2D RoPE Cache -->
  <rect class="node-enc" x="28" y="460" width="200" height="114" rx="10" />
  <text class="font-main box-title text-enc" x="128" y="484" text-anchor="middle">2D 旋转位置编码缓存</text>
  <text class="font-main box-sub text-enc" x="128" y="505" text-anchor="middle">线性投影 W_p ∈ R^(2 × d/2h)</text>
  <text class="font-main box-sub text-enc" x="128" y="524" text-anchor="middle">将 2D 坐标映射为旋转角 θ</text>
  <text class="tensor text-enc" x="128" y="544" text-anchor="middle">cos / sin 缓存: [M/N, 32]</text>
  <text class="font-main box-sub text-enc" x="128" y="563" text-anchor="middle">仅计算一次，供 9 层自注意力复用</text>

  <!-- Arrows within Column 1 -->
  <path class="arrow" d="M 128 200 L 128 214" marker-end="url(#arr-gray)" />
  <path class="arrow" d="M 128 302 L 128 328" marker-end="url(#arr-gray)" />
  <!-- pA, pB to RoPE cache (routed cleanly along left gutter) -->
  <path class="arrow-blue" d="M 28 157 L 14 157 L 14 517 L 26 517" marker-end="url(#arr-blue)" />
  <path class="arrow-blue" d="M 28 259 L 14 259" />

  <!-- ================= COLUMN 2: TRANSFORMER BACKBONE LOOP ================= -->
  <rect class="container-loop" x="256" y="110" width="398" height="492" rx="14" />
  <rect x="274" y="122" width="362" height="26" rx="6" fill="#E8F1EC" />
  <text class="font-main badge-text text-attn" x="455" y="139" text-anchor="middle">第 ℓ 层交互块 (ℓ = 1 … 9) · 当前活跃点数：M_ℓ / N_ℓ</text>

  <!-- Unit 1: Self-Attention + 2D RoPE -->
  <rect class="node-attn" x="276" y="160" width="358" height="108" rx="10" />
  <text class="font-main box-title text-attn" x="455" y="182" text-anchor="middle">1. 图内自注意力（Self-Attention + 2D RoPE）</text>
  <text class="font-main box-sub text-attn" x="455" y="202" text-anchor="middle">图 A、B 各自在图内聚合上下文（4 头 × 64 维）</text>
  <text class="tensor text-attn" x="455" y="221" text-anchor="middle">a_ij = (R(p_i) q_i)ᵀ (R(p_j) k_j)  (不旋转 V)</text>
  <text class="font-main box-sub text-attn" x="455" y="240" text-anchor="middle">残差更新：x ← x + MLP([x | m])，隐层 2d=512 (LN+GeLU)</text>
  <text class="tensor text-attn" x="455" y="258" text-anchor="middle">输出状态: Xᴬ [M_ℓ, 256]  |  Xᴮ [N_ℓ, 256]</text>

  <!-- Unit 2: Bidirectional Cross-Attention -->
  <rect class="node-attn" x="276" y="288" width="358" height="106" rx="10" />
  <text class="font-main box-title text-attn" x="455" y="310" text-anchor="middle">2. 图间双向交叉注意力（Bidirectional Cross-Attn）</text>
  <text class="font-main box-sub text-attn" x="455" y="330" text-anchor="middle">共享 Q/K 投影矩阵，不加位置编码，相似度矩阵只算一次</text>
  <text class="tensor text-attn" x="455" y="349" text-anchor="middle">a_ij^(AB) = (k_iᴬ)ᵀ k_jᴮ = a_ji^(BA)  →  [M_ℓ, N_ℓ]</text>
  <text class="font-main box-sub text-attn" x="455" y="368" text-anchor="middle">按行 / 按列 Softmax 双向复用，跨图计算量直接减半</text>
  <text class="tensor text-attn" x="455" y="385" text-anchor="middle">残差更新后: Xᴬ [M_ℓ, 256]  |  Xᴮ [N_ℓ, 256]</text>

  <!-- Unit 3: Adaptive Depth & Width -->
  <rect class="node-hi" x="276" y="416" width="358" height="132" rx="10" />
  <text class="font-main box-title text-hi" x="455" y="438" text-anchor="middle">3. 置信度自省 · 自适应早停 &amp; 动态点剪枝</text>
  <text class="tensor text-hi" x="455" y="458" text-anchor="middle">置信度 c_i^ℓ = Sigmoid(Linear(x_i^ℓ)) ∈ [0, 1]</text>
  <text class="font-main box-sub text-hi" x="455" y="478" text-anchor="middle">动态阈值 λ_ℓ = 0.8 + 0.1·exp(-4ℓ/L)，判别 c_i^ℓ &gt; λ_ℓ</text>
  <line x1="292" y1="488" x2="618" y2="488" stroke="#E5B993" stroke-width="1" />
  <text class="font-main box-sub text-hi" x="455" y="506" text-anchor="middle">▶ 自适应深度（早停）：若高置信点占比 &gt; α (95%) 或 ℓ=9 → 立即退出</text>
  <text class="font-main box-sub text-hi" x="455" y="525" text-anchor="middle">▶ 自适应宽度（剪枝）：若继续，剔除 (c_i^ℓ &gt; λ_ℓ) ∧ (σ_i^ℓ &lt; 0.01) 的点</text>
  <text class="tensor text-hi" x="455" y="542" text-anchor="middle">剪枝后活跃点: M_{ℓ+1} ≤ M_ℓ ,  N_{ℓ+1} ≤ N_ℓ</text>

  <!-- Loopback Arrow inside Column 2 -->
  <path class="arrow-orange" d="M 455 548 L 455 584 L 266 584 L 266 214 L 274 214" marker-end="url(#arr-orange)" />
  <rect x="330" y="572" width="248" height="22" rx="5" fill="#FBEBDE" stroke="#D5803B" stroke-width="1" />
  <text class="font-main badge-text text-hi" x="454" y="587" text-anchor="middle">未早停：剪枝后送入第 ℓ + 1 层继续交互</text>

  <!-- Internal arrows in Column 2 -->
  <path class="arrow-green" d="M 455 268 L 455 286" marker-end="url(#arr-green)" />
  <path class="arrow-green" d="M 455 394 L 455 414" marker-end="url(#arr-green)" />

  <!-- Connections from Column 1 to Column 2 -->
  <path class="arrow" d="M 228 382 L 244 382 L 244 196 L 274 196" marker-end="url(#arr-gray)" />
  <!-- RoPE injection arrow to Self-Attention -->
  <path class="arrow-blue" d="M 228 517 L 250 517 L 250 232 L 274 232" marker-end="url(#arr-blue)" />

  <!-- ================= COLUMN 3: LIGHTWEIGHT MATCHING HEAD ================= -->
  <rect class="container-head" x="684" y="138" width="194" height="394" rx="14" />
  <text class="font-main badge-text text-out" x="781" y="160" text-anchor="middle">在退出层 ℓ* 执行一次</text>
  <text class="font-main box-sub text-out" x="781" y="176" text-anchor="middle">(训练时每层均计算以深度监督)</text>

  <!-- Branch A: Pairwise Similarity -->
  <rect class="node-attn" x="698" y="194" width="166" height="102" rx="10" />
  <text class="font-main box-title text-attn" x="781" y="216" text-anchor="middle">成对相似度矩阵 S</text>
  <text class="tensor text-attn" x="781" y="236" text-anchor="middle">Linear(xᴬ)ᵀ Linear(xᴮ)</text>
  <text class="tensor text-attn" x="781" y="254" text-anchor="middle">形状: [M_ℓ*, N_ℓ*]</text>
  <text class="font-main box-sub text-attn" x="781" y="274" text-anchor="middle">行 / 列双向 Softmax</text>
  <text class="font-main box-sub text-attn" x="781" y="289" text-anchor="middle">(Dual-Softmax 竞争)</text>

  <!-- Branch B: Unary Matchability -->
  <rect class="node-hi" x="698" y="314" width="166" height="90" rx="10" />
  <text class="font-main box-title text-hi" x="781" y="336" text-anchor="middle">一元可匹配度 σ</text>
  <text class="tensor text-hi" x="781" y="356" text-anchor="middle">σ_i = Sigmoid(Lin(x_i))</text>
  <text class="tensor text-hi" x="781" y="374" text-anchor="middle">σᴬ:[M_ℓ*]  σᴮ:[N_ℓ*]</text>
  <text class="font-main box-sub text-hi" x="781" y="394" text-anchor="middle">判别遮挡 / 非共视点</text>

  <!-- Soft Partial Assignment P -->
  <rect class="node-attn" x="698" y="424" width="166" height="94" rx="10" />
  <text class="font-main box-title text-attn" x="781" y="446" text-anchor="middle">软部分分配矩阵 P</text>
  <text class="tensor text-attn" x="781" y="466" text-anchor="middle">P_ij = σ_iᴬ σ_jᴮ ·</text>
  <text class="tensor text-attn" x="781" y="482" text-anchor="middle">Softmax_r · Softmax_c</text>
  <text class="tensor text-attn" x="781" y="500" text-anchor="middle">形状: [M_ℓ*, N_ℓ*]</text>
  <text class="font-main box-sub text-attn" x="781" y="513" text-anchor="middle">免 Sinkhorn 迭代</text>

  <!-- Arrows from Column 2 exit to Column 3 -->
  <path class="arrow-purple" d="M 634 482 L 668 482 L 668 245 L 696 245" marker-end="url(#arr-purple)" />
  <path class="arrow-purple" d="M 668 359 L 696 359" marker-end="url(#arr-purple)" />
  <rect x="639" y="454" width="46" height="20" rx="4" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1" />
  <text class="font-main badge-text text-out" x="662" y="468" text-anchor="middle">早停!</text>

  <!-- Arrows inside Column 3 -->
  <path class="arrow-green" d="M 781 296 L 781 312" marker-end="url(#arr-green)" />
  <path class="arrow-orange" d="M 781 404 L 781 422" marker-end="url(#arr-orange)" />

  <!-- ================= COLUMN 4: FILTER & OUTPUT ================= -->
  <rect class="node-out" x="904" y="250" width="152" height="114" rx="10" />
  <text class="font-main box-title text-out" x="980" y="274" text-anchor="middle">互近邻与阈值筛选</text>
  <text class="font-main box-sub text-out" x="980" y="296" text-anchor="middle">1. 行、列同时最大</text>
  <text class="font-main box-sub text-out" x="980" y="314" text-anchor="middle">(Mutual Check)</text>
  <text class="font-main box-sub text-out" x="980" y="335" text-anchor="middle">2. 置信度过滤</text>
  <text class="tensor text-out" x="980" y="352" text-anchor="middle">P_ij &gt; τ (τ = 0.1)</text>

  <rect class="node-out" x="904" y="402" width="152" height="116" rx="10" />
  <text class="font-main box-title text-out" x="980" y="426" text-anchor="middle">稀疏对应点对 M</text>
  <text class="tensor text-out" x="980" y="447" text-anchor="middle">M = {(i, j)} ⊂ A × B</text>
  <text class="font-main box-sub text-out" x="980" y="470" text-anchor="middle">直接送入下游几何求解</text>
  <text class="font-main box-sub text-out" x="980" y="489" text-anchor="middle">RANSAC / LO-RANSAC</text>
  <text class="font-main box-sub text-out" x="980" y="506" text-anchor="middle">加权 DLT / SfM / SLAM</text>

  <!-- Arrow from Column 3 P to Column 4 -->
  <path class="arrow-purple" d="M 864 471 L 888 471 L 888 307 L 902 307" marker-end="url(#arr-purple)" />
  <path class="arrow-purple" d="M 980 364 L 980 400" marker-end="url(#arr-purple)" />

  <!-- ================= BOTTOM LEGEND & TRAINING NOTE ================= -->
  <rect x="28" y="622" width="1028" height="86" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- Color Legend Row -->
  <rect class="node-data" x="48" y="638" width="18" height="14" rx="3" />
  <text class="font-main note-text" x="72" y="649">输入 / 局部特征数据</text>

  <rect class="node-enc" x="214" y="638" width="18" height="14" rx="3" />
  <text class="font-main note-text" x="238" y="649">投影与 2D RoPE 编码</text>

  <rect class="node-attn" x="390" y="638" width="18" height="14" rx="3" />
  <text class="font-main note-text" x="414" y="649">注意力与匹配核心模块</text>

  <rect class="node-hi" x="572" y="638" width="18" height="14" rx="3" />
  <text class="font-main note-text" x="596" y="649">自适应机制与关键高亮</text>

  <rect class="node-out" x="756" y="638" width="18" height="14" rx="3" />
  <text class="font-main note-text" x="780" y="649">匹配后处理与最终输出</text>

  <line x1="48" y1="664" x2="1036" y2="664" stroke="#E5E7EB" stroke-width="1" />
  <text class="font-main note-text" x="48" y="683">
    <tspan font-weight="700" fill="#1F5138">训练 vs 推理关键差异：</tspan>训练采用两阶段——阶段一在全部 9 层均计算匹配头并施加深度监督（Deep Supervision），不做早停与剪枝；阶段二冻结主干特征梯度，
  </text>
  <text class="font-main note-text" x="48" y="700">
    仅用二元交叉熵训练第 1～8 层置信度分类器。推理时开启自适应早停与动态点剪枝，仅在触发退出的单层 ℓ* 计算一次匹配头即可。
  </text>
</svg>
