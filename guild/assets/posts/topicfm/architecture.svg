<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 766" width="1060" height="766">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#4B5563"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2783DE"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#46A171"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#D5803B"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 12px; fill: #6B7280; }
      .stage-title { font-size: 14px; font-weight: 700; }
      .node-title { font-size: 13px; font-weight: 700; }
      .node-text { font-size: 11.5px; }
      .mono { font-size: 11px; font-weight: 600; }
      .badge { font-size: 10.5px; font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1060" height="766" fill="#FFFFFF"/>

  <!-- Main Header -->
  <text x="530" y="30" text-anchor="middle" class="title">TopicFM 端到端粗到细（Coarse-to-Fine）整体架构与张量尺寸流</text>
  <text x="530" y="49" text-anchor="middle" class="subtitle">基于标准 UNet 轻量化骨干 + Transformer 主题推断 + 共视主题感知注意力 + 局部交叉注意力精修</text>

  <!-- ==================== STAGE 1: FEATURE EXTRACTION ==================== -->
  <rect x="18" y="64" width="1012" height="176" rx="10" fill="#F8FBFE" stroke="#2783DE" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="32" y="84" class="stage-title" fill="#153B60">阶段一：多尺度特征提取（标准 UNet / FPN 孪生骨干，640×480 下仅 95 GFLOPs，较 LoFTR 降低 36%）</text>

  <!-- Input Images -->
  <rect x="32" y="102" width="146" height="122" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="105" y="126" text-anchor="middle" class="node-title" fill="#111827">输入图像对</text>
  <text x="105" y="148" text-anchor="middle" class="mono" fill="#111827">I^A, I^B</text>
  <text x="105" y="168" text-anchor="middle" class="mono" fill="#374151">[B, C_in, H, W]</text>
  <text x="105" y="189" text-anchor="middle" class="node-text" fill="#4B5563">训练最长边 800</text>
  <text x="105" y="207" text-anchor="middle" class="node-text" fill="#4B5563">双图共享骨干权重</text>

  <!-- Arrow Input -> Encoder -->
  <line x1="178" y1="163" x2="206" y2="163" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Standard UNet Encoder -->
  <rect x="210" y="96" width="336" height="134" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="378" y="116" text-anchor="middle" class="node-title" fill="#153B60">标准 Conv+BN+GELU 4 级编码器（替代 ResBlock）</text>

  <!-- 4 level mini pills -->
  <rect x="222" y="125" width="312" height="22" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="230" y="140" class="mono" fill="#153B60">F1: Conv(7×7,S2)+2×Conv(3×3)</text>
  <text x="526" y="140" text-anchor="end" class="mono" fill="#2783DE">[B, 128, H/2, W/2]</text>

  <rect x="222" y="151" width="312" height="22" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="230" y="166" class="mono" fill="#153B60">F2: Conv(3×3,S2)+Conv(3×3)</text>
  <text x="526" y="166" text-anchor="end" class="mono" fill="#2783DE">[B, 192, H/4, W/4]</text>

  <rect x="222" y="177" width="312" height="22" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="230" y="192" class="mono" fill="#153B60">F3: Conv(3×3,S2)+Conv(3×3)</text>
  <text x="526" y="192" text-anchor="end" class="mono" fill="#2783DE">[B, 256, H/8, W/8]</text>

  <rect x="222" y="203" width="312" height="22" rx="4" fill="#DBEAFE" stroke="#2783DE" stroke-width="1"/>
  <text x="230" y="218" class="mono" fill="#153B60">F4: 新增 1/16 层扩大感受野</text>
  <text x="526" y="218" text-anchor="end" class="mono" fill="#153B60">[B, 384, H/16, W/16]</text>

  <!-- Arrow Encoder -> FPN -->
  <line x1="546" y1="163" x2="574" y2="163" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- FPN Decoder -->
  <rect x="578" y="96" width="212" height="134" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="684" y="117" text-anchor="middle" class="node-title" fill="#153B60">FPN 自顶向下上采样融合</text>
  <text x="684" y="140" text-anchor="middle" class="mono" fill="#153B60">Conv(F3) ⊕ Up(F4) → F_c</text>
  <text x="684" y="162" text-anchor="middle" class="mono" fill="#153B60">Conv(F2) ⊕ Up(F_c) → F2^out</text>
  <text x="684" y="184" text-anchor="middle" class="mono" fill="#153B60">Conv(F1) ⊕ Up(F2^out) → F_f</text>
  <text x="684" y="211" text-anchor="middle" class="node-text" fill="#1E40AF">融合高层语义与低层精确定位</text>

  <!-- Arrows FPN -> Outputs -->
  <path d="M 790 133 L 818 133" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 790 193 L 818 193" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Output F_f -->
  <rect x="822" y="102" width="194" height="58" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="919" y="124" text-anchor="middle" class="node-title" fill="#111827">细层级特征图 F_f^A, F_f^B</text>
  <text x="919" y="146" text-anchor="middle" class="mono" fill="#374151">[B, 128, H/2, W/2]</text>

  <!-- Output F_c -->
  <rect x="822" y="169" width="194" height="58" rx="8" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5"/>
  <text x="919" y="191" text-anchor="middle" class="node-title" fill="#111827">粗层级特征图 F_c^A, F_c^B</text>
  <text x="919" y="212" text-anchor="middle" class="mono" fill="#374151">[B, 256, H/8, W/8] → [N, 256]</text>

  <!-- Routing F_c from Stage 1 to Stage 2 -->
  <path d="M 919 227 L 919 252 L 138 252 L 138 296" fill="none" stroke="#46A171" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="425" y="242" width="210" height="20" rx="4" fill="#FFFFFF"/>
  <text x="530" y="256" text-anchor="middle" class="mono" fill="#1F5138">展平为视觉词序列 N = (H/8)·(W/8)</text>

  <!-- Routing F_f along right channel down to Stage 3 -->
  <path d="M 1016 131 L 1044 131 L 1044 532 L 116 532 L 116 570" fill="none" stroke="#2783DE" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <rect x="984" y="368" width="66" height="40" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <text x="1017" y="384" text-anchor="middle" class="mono" fill="#153B60">高分特征</text>
  <text x="1017" y="400" text-anchor="middle" class="mono" fill="#153B60">F_f 直连</text>

  <!-- ==================== STAGE 2: COARSE-LEVEL TOPICFM ==================== -->
  <rect x="18" y="268" width="1012" height="246" rx="10" fill="#F5FBF8" stroke="#46A171" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="32" y="288" class="stage-title" fill="#1F5138">阶段二：粗层级主题辅助特征匹配（TopicFM 模块，640×480 下仅约 15 GFLOPs，较 LoFTR 降低 71%）</text>

  <!-- Step 2.1: Topic Inference -->
  <rect x="32" y="302" width="212" height="198" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="138" y="324" text-anchor="middle" class="node-title" fill="#1F5138">① Transformer 主题推断</text>
  <rect x="44" y="335" width="188" height="36" rx="5" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <text x="138" y="351" text-anchor="middle" class="mono" fill="#1F5138">可学习主题嵌入 T: [K, 256]</text>
  <text x="138" y="365" text-anchor="middle" class="node-text" fill="#374151">(默认 K = 100，全数据集共享)</text>
  <text x="138" y="391" text-anchor="middle" class="mono" fill="#1F5138">[CA(C:256, 8头)(T, F_c)] × 5</text>
  <text x="138" y="410" text-anchor="middle" class="node-text" fill="#1F5138">Q = T，K = V = F_c</text>
  <text x="138" y="429" text-anchor="middle" class="node-text" fill="#1F5138">推导图像局部主题 T̂_k</text>
  <rect x="44" y="442" width="188" height="46" rx="5" fill="#FFFFFF" stroke="#46A171" stroke-width="1"/>
  <text x="138" y="460" text-anchor="middle" class="mono" fill="#1F5138">输出逐特征主题分布 θ^A, θ^B</text>
  <text x="138" y="479" text-anchor="middle" class="mono" fill="#46A171">形状: [B, N, K] (式 2~3)</text>

  <!-- Arrow 2.1 -> 2.2 -->
  <line x1="244" y1="401" x2="270" y2="401" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Step 2.2: Co-visible Selection & Sampling -->
  <rect x="274" y="302" width="222" height="198" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.5"/>
  <text x="385" y="324" text-anchor="middle" class="node-title" fill="#70401C">② 共视主题筛选 + 标签采样</text>
  <text x="385" y="347" text-anchor="middle" class="node-text" fill="#70401C">全图聚合图像级分布 θ_k^A, θ_k^B</text>
  <text x="385" y="367" text-anchor="middle" class="mono" fill="#70401C">共视概率 θ_k^Vis = θ_k^A · θ_k^B</text>
  <rect x="286" y="378" width="198" height="44" rx="5" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1"/>
  <text x="385" y="396" text-anchor="middle" class="mono" fill="#70401C">仅保留 Top-K_co 共视主题</text>
  <text x="385" y="413" text-anchor="middle" class="node-text" fill="#92400E">训练 K_co=6，测试可调 (6~10)</text>
  <text x="385" y="442" text-anchor="middle" class="node-text" fill="#70401C">蒙特卡洛采样 z_i ~ θ_i^A, z_j ~ θ_j^B</text>
  <text x="385" y="462" text-anchor="middle" class="mono" fill="#70401C">按共视主题 k̃ 聚簇特征子集</text>
  <text x="385" y="482" text-anchor="middle" class="node-text" fill="#92400E">剔除非重叠区噪声 (z_ij = NaN)</text>

  <!-- Arrow 2.2 -> 2.3 -->
  <line x1="496" y1="401" x2="522" y2="401" stroke="#D5803B" stroke-width="1.8" marker-end="url(#arrow-orange)"/>

  <!-- Step 2.3: Topic-Aware Augmentation -->
  <rect x="526" y="302" width="224" height="198" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="638" y="324" text-anchor="middle" class="node-title" fill="#1F5138">③ 主题感知特征增强</text>
  <text x="638" y="347" text-anchor="middle" class="node-text" fill="#1F5138">对每个共视主题 k̃ ∈ K_co 分别处理</text>
  <rect x="538" y="359" width="200" height="62" rx="5" fill="#FFFFFF" stroke="#46A171" stroke-width="1"/>
  <text x="638" y="378" text-anchor="middle" class="mono" fill="#1F5138">单层共享 SA + CA (256维, 8头)</text>
  <text x="638" y="396" text-anchor="middle" class="mono" fill="#374151">SA(F_c^{A,k̃}) 与 SA(F_c^{B,k̃})</text>
  <text x="638" y="413" text-anchor="middle" class="mono" fill="#374151">CA(F_c^{A,k̃}, F_c^{B,k̃}) 双向</text>
  <text x="638" y="443" text-anchor="middle" class="node-text" fill="#1F5138">线性注意力复杂度降至 O(K_co·N/K)</text>
  <rect x="538" y="454" width="200" height="36" rx="5" fill="#D1FAE5" stroke="#46A171" stroke-width="1"/>
  <text x="638" y="476" text-anchor="middle" class="mono" fill="#1F5138">输出增强特征 F̂_c^{A,k̃}, F̂_c^{B,k̃}</text>

  <!-- Arrow 2.3 -> 2.4 -->
  <line x1="750" y1="401" x2="776" y2="401" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Step 2.4: Probabilistic Matching -->
  <rect x="780" y="302" width="234" height="198" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="897" y="324" text-anchor="middle" class="node-title" fill="#1F5138">④ 概率特征匹配与粗筛选</text>
  <text x="897" y="347" text-anchor="middle" class="node-text" fill="#1F5138">在各共视主题内算点积相似度</text>
  <rect x="792" y="359" width="210" height="46" rx="5" fill="#FFFFFF" stroke="#46A171" stroke-width="1"/>
  <text x="897" y="378" text-anchor="middle" class="mono" fill="#1F5138">Dual-Softmax 条件匹配概率</text>
  <text x="897" y="396" text-anchor="middle" class="mono" fill="#46A171">P(m_ij | z_ij=k̃, F_c^A, F_c^B)</text>
  <text x="897" y="426" text-anchor="middle" class="node-text" fill="#1F5138">置信度过滤: 保留 P &gt; τ (默认 0.2)</text>
  <text x="897" y="446" text-anchor="middle" class="mono" fill="#1F5138">输出 M_c 组粗匹配坐标 (i, j)</text>
  <rect x="792" y="458" width="210" height="32" rx="5" fill="#FBEBDE" stroke="#D5803B" stroke-width="1"/>
  <text x="897" y="478" text-anchor="middle" class="mono" fill="#70401C">训练监督: L_c = L_c^pos + L_c^neg</text>

  <!-- Routing coarse matches from Stage 2 to Stage 3 -->
  <path d="M 897 500 L 897 540 L 182 540 L 182 570" fill="none" stroke="#D5803B" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <rect x="445" y="529" width="190" height="20" rx="4" fill="#FFFFFF"/>
  <text x="540" y="543" text-anchor="middle" class="mono" fill="#70401C">M_c 组 1/8 尺度粗匹配坐标</text>

  <!-- ==================== STAGE 3: FINE-LEVEL REFINEMENT ==================== -->
  <rect x="18" y="556" width="1012" height="162" rx="10" fill="#FFFBF7" stroke="#D5803B" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="32" y="576" class="stage-title" fill="#70401C">阶段三：细层级局部窗口精修（1/2 尺度亚像素坐标回归，省去 LoFTR 的细层级自注意力）</text>

  <!-- Step 3.1: Patch Crop -->
  <rect x="32" y="590" width="224" height="114" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.5"/>
  <text x="144" y="613" text-anchor="middle" class="node-title" fill="#70401C">① 高分辨率局部窗口裁剪</text>
  <text x="144" y="635" text-anchor="middle" class="node-text" fill="#70401C">粗坐标放大至 1/2 分辨率尺度</text>
  <text x="144" y="655" text-anchor="middle" class="node-text" fill="#70401C">在 F_f^A, F_f^B 上裁剪 N_p×N_p 块</text>
  <text x="144" y="679" text-anchor="middle" class="mono" fill="#92400E">张量形状: [M_c, N_p², 128]</text>

  <!-- Arrow 3.1 -> 3.2 -->
  <line x1="256" y1="647" x2="284" y2="647" stroke="#D5803B" stroke-width="1.8" marker-end="url(#arrow-orange)"/>

  <!-- Step 3.2: Fine Cross-Attention -->
  <rect x="288" y="590" width="222" height="114" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.5"/>
  <text x="399" y="613" text-anchor="middle" class="node-title" fill="#70401C">② 轻量细层级交叉注意力</text>
  <rect x="302" y="625" width="194" height="32" rx="5" fill="#FFFFFF" stroke="#D5803B" stroke-width="1"/>
  <text x="399" y="645" text-anchor="middle" class="mono" fill="#70401C">仅 1 层 CA [C:128, head:4]</text>
  <text x="399" y="675" text-anchor="middle" class="node-text" fill="#70401C">相比 LoFTR (SA+CA, 8头) 更轻量</text>
  <text x="399" y="693" text-anchor="middle" class="node-text" fill="#92400E">仅在窗口对之间交互丰富局部特征</text>

  <!-- Arrow 3.2 -> 3.3 -->
  <line x1="510" y1="647" x2="538" y2="647" stroke="#D5803B" stroke-width="1.8" marker-end="url(#arrow-orange)"/>

  <!-- Step 3.3: Coordinate Regression -->
  <rect x="542" y="590" width="226" height="114" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.5"/>
  <text x="655" y="613" text-anchor="middle" class="node-title" fill="#70401C">③ 窗口内相似度定位与监督</text>
  <text x="655" y="635" text-anchor="middle" class="node-text" fill="#70401C">固定窗口 A 中心特征 F_{f,i}^A</text>
  <text x="655" y="655" text-anchor="middle" class="node-text" fill="#70401C">与窗口 B 全特征计算相似度分布</text>
  <text x="655" y="675" text-anchor="middle" class="node-text" fill="#70401C">估计窗口 B 中的精细偏移坐标</text>
  <text x="655" y="694" text-anchor="middle" class="mono" fill="#92400E">训练监督: LoFTR 方差加权 l2 损失 L_f</text>

  <!-- Arrow 3.3 -> Output -->
  <line x1="768" y1="647" x2="796" y2="647" stroke="#4B5563" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Final Output -->
  <rect x="800" y="590" width="214" height="114" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="907" y="614" text-anchor="middle" class="node-title" fill="#422578">最终输出</text>
  <text x="907" y="638" text-anchor="middle" class="mono" fill="#422578">半稠密高精度匹配点对</text>
  <text x="907" y="658" text-anchor="middle" class="mono" fill="#5B21B6">{(x_m^A, y_m^A) ↔ (x_m^B, y_m^B)}</text>
  <text x="907" y="680" text-anchor="middle" class="node-text" fill="#422578">附带可解释的主题分割热图</text>
  <text x="907" y="696" text-anchor="middle" class="node-text" fill="#6D28D9">可用于单应 / 位姿 / 视觉定位</text>

  <!-- Legend Bar -->
  <g transform="translate(115, 734)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
    <text x="20" y="11" class="node-text" fill="#374151">输入 / 中间特征张量</text>

    <rect x="165" y="0" width="14" height="14" rx="3" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.2"/>
    <text x="185" y="11" class="node-text" fill="#153B60">UNet 特征编码与融合</text>

    <rect x="335" y="0" width="14" height="14" rx="3" fill="#E8F1EC" stroke="#46A171" stroke-width="1.2"/>
    <text x="355" y="11" class="node-text" fill="#1F5138">主题推断与注意力匹配</text>

    <rect x="515" y="0" width="14" height="14" rx="3" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2"/>
    <text x="535" y="11" class="node-text" fill="#70401C">共视筛选 / 精修 / 损失</text>

    <rect x="695" y="0" width="14" height="14" rx="3" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
    <text x="715" y="11" class="node-text" fill="#422578">最终匹配结果</text>
  </g>
</svg>
