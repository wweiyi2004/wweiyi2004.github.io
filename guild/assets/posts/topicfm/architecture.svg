<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="380" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 1：TopicFM 整体工作流程（宏观全景）</text>
  <text x="480" y="62" text-anchor="middle" class="sub">先给两张图的网格自动划分“潜在语义主题”，再只在同主题内部做精准上下文交互与匹配</text>

  <rect x="24" y="92" width="186" height="240" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="117" y="120" text-anchor="middle" class="h" fill="#1E293B">① 轻量 UNet 提特征</text>
  <rect x="42" y="138" width="150" height="74" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="117" y="164" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">粗特征 F_c（1/8）</text>
  <text x="117" y="186" text-anchor="middle" class="s">用来分主题 + 粗匹配</text>
  <rect x="42" y="226" width="150" height="74" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="117" y="252" text-anchor="middle" class="b" fill="#15803D" font-weight="700">细特征 F_f（1/2）</text>
  <text x="117" y="274" text-anchor="middle" class="s">留给最后精修亚像素</text>

  <line x1="210" y1="212" x2="244" y2="212" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <rect x="250" y="92" width="210" height="240" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="355" y="120" text-anchor="middle" class="h" fill="#1E3A8A">② 主题推断（Topic）</text>
  <rect x="270" y="140" width="170" height="84" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="355" y="164" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">M 个潜在主题原型</text>
  <circle cx="304" cy="196" r="10" fill="#3B82F6"/><text x="304" y="200" text-anchor="middle" fill="#FFF" font-size="11" font-weight="700">T1</text>
  <circle cx="338" cy="196" r="10" fill="#22C55E"/><text x="338" y="200" text-anchor="middle" fill="#FFF" font-size="11" font-weight="700">T2</text>
  <circle cx="372" cy="196" r="10" fill="#F97316"/><text x="372" y="200" text-anchor="middle" fill="#FFF" font-size="11" font-weight="700">T3</text>
  <circle cx="406" cy="196" r="10" fill="#8B5CF6"/><text x="406" y="200" text-anchor="middle" fill="#FFF" font-size="11" font-weight="700">TM</text>
  <rect x="270" y="238" width="170" height="72" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="355" y="264" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">预测每个网格的归属</text>
  <text x="355" y="286" text-anchor="middle" class="s">挑出两图共视 Top-K 主题</text>

  <line x1="460" y1="212" x2="494" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <rect x="500" y="92" width="218" height="240" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="609" y="120" text-anchor="middle" class="h" fill="#166534">③ 主题内精准注意力</text>
  <rect x="520" y="142" width="178" height="72" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.6"/>
  <text x="609" y="168" text-anchor="middle" class="b" fill="#15803D" font-weight="700">同主题网格内部互查</text>
  <text x="609" y="190" text-anchor="middle" class="s">屋顶只和屋顶聊，屏蔽干扰</text>
  <line x1="609" y1="214" x2="609" y2="236" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="520" y="240" width="178" height="70" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="609" y="266" text-anchor="middle" class="b" fill="#14532D" font-weight="700">主题感知粗匹配</text>
  <text x="609" y="288" text-anchor="middle" class="s">融合特征相似度 + 主题分布</text>

  <line x1="718" y1="212" x2="752" y2="212" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="758" y="92" width="178" height="240" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="847" y="120" text-anchor="middle" class="h" fill="#5B21B6">④ 细窗口精修输出</text>
  <rect x="778" y="148" width="138" height="72" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="847" y="174" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">1/2 细图 5×5 窗</text>
  <text x="847" y="196" text-anchor="middle" class="s">局部期望回归亚像素</text>
  <rect x="778" y="238" width="138" height="62" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="847" y="264" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">精准半稠密匹配</text>
  <text x="847" y="284" text-anchor="middle" class="s">+ 可解释主题分割图</text>

  <text x="480" y="362" text-anchor="middle" class="s">核心亮点：不需要人工语义标注，靠真值匹配对自发学出“同区域同主题”，同时兼顾速度、鲁棒性与可解释性</text>

</svg>