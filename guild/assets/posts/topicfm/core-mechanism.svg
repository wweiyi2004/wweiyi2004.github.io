<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：主题辅助注意力——为什么按“语义主题”分组比全图乱聊更稳？</text>
  <text x="480" y="62" text-anchor="middle" class="sub">把大尺度/大视角下的无关背景挡在门外，让特征只和同类语义区域深度交流</text>

  <!-- Left: Global Attention -->
  <rect x="28" y="88" width="424" height="270" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="240" y="118" text-anchor="middle" class="h" fill="#991B1B">✗ 传统全图注意力（LoFTR）：所有人混在一间屋</text>

  <rect x="58" y="140" width="152" height="130" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="134" y="160" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">图 A（各区域混在一起）</text>
  <rect x="72" y="170" width="56" height="40" rx="5" fill="#DBEAFE" stroke="#3B82F6"/><text x="100" y="195" text-anchor="middle" class="s" fill="#1D4ED8">屋顶</text>
  <rect x="138" y="170" width="56" height="40" rx="5" fill="#DCFCE7" stroke="#22C55E"/><text x="166" y="195" text-anchor="middle" class="s" fill="#15803D">窗墙</text>
  <rect x="72" y="218" width="56" height="40" rx="5" fill="#FFEDD5" stroke="#F97316"/><text x="100" y="243" text-anchor="middle" class="s" fill="#C2410C">路面</text>
  <rect x="138" y="218" width="56" height="40" rx="5" fill="#E2E8F0" stroke="#94A3B8"/><text x="166" y="243" text-anchor="middle" class="s" fill="#475569">天空</text>

  <rect x="270" y="140" width="152" height="130" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="346" y="160" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">图 B（两两全连）</text>
  <rect x="284" y="170" width="56" height="40" rx="5" fill="#DBEAFE" stroke="#3B82F6"/><text x="312" y="195" text-anchor="middle" class="s" fill="#1D4ED8">屋顶</text>
  <rect x="350" y="170" width="56" height="40" rx="5" fill="#DCFCE7" stroke="#22C55E"/><text x="378" y="195" text-anchor="middle" class="s" fill="#15803D">窗墙</text>
  <rect x="284" y="218" width="56" height="40" rx="5" fill="#FFEDD5" stroke="#F97316"/><text x="312" y="243" text-anchor="middle" class="s" fill="#C2410C">路面</text>
  <rect x="350" y="218" width="56" height="40" rx="5" fill="#E2E8F0" stroke="#94A3B8"/><text x="378" y="243" text-anchor="middle" class="s" fill="#475569">路人</text>

  <!-- Messy crossing lines -->
  <line x1="210" y1="185" x2="270" y2="238" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="238" x2="270" y2="185" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="205" x2="270" y2="205" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="240" y="302" text-anchor="middle" class="b" fill="#7F1D1D">• 窗户要和天空/路面/路人一起算注意力，噪声极多</text>
  <text x="240" y="328" text-anchor="middle" class="b" fill="#7F1D1D">• 尺度差异大时，全局线性注意力焦点极易被冲淡</text>

  <!-- Right: TopicFM -->
  <rect x="488" y="88" width="444" height="270" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="710" y="118" text-anchor="middle" class="h" fill="#166534">✓ TopicFM：按主题分房间，只和同类深度互查</text>

  <!-- 3 clean topic rooms -->
  <rect x="502" y="138" width="416" height="42" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="562" y="164" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">主题 1 · 屋顶</text>
  <text x="760" y="164" text-anchor="middle" font-size="12" fill="#1E40AF">图 A 屋顶网格 ◄──精准注意力──► 图 B 屋顶网格</text>

  <rect x="502" y="190" width="416" height="42" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="562" y="216" text-anchor="middle" class="b" fill="#15803D" font-weight="700">主题 2 · 窗墙</text>
  <text x="760" y="216" text-anchor="middle" font-size="12" fill="#14532D">图 A 窗墙网格 ◄──精准注意力──► 图 B 窗墙网格</text>

  <rect x="502" y="242" width="416" height="42" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.6"/>
  <text x="562" y="268" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">主题 3 · 路面</text>
  <text x="760" y="268" text-anchor="middle" font-size="12" fill="#9A3412">图 A 路面网格 ◄──精准注意力──► 图 B 路面网格</text>

  <text x="710" y="310" text-anchor="middle" class="b" fill="#14532D">• 无关背景（天空/路人）自动隔离，不污染有效特征</text>
  <text x="710" y="334" text-anchor="middle" class="b" fill="#14532D">• 每个房间点数很少，注意力聚焦度高且推理更快</text>

</svg>