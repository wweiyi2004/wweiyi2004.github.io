    </style>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1060" height="820" fill="#FFFFFF"/>

  <!-- Main Header -->
  <text x="530" y="30" text-anchor="middle" class="title">TopicFM 核心机制图解：共视主题分桶匹配与无语义标注自监督</text>
  <text x="530" y="49" text-anchor="middle" class="subtitle">像人类一样“先按语义结构找到两图共同可见区域，再在各自主题内部精细找对应点”</text>

  <!-- ==================== PART 1: 4-STEP COMIC STRIP ==================== -->
  <rect x="18" y="64" width="1024" height="378" rx="10" fill="#F5FBF8" stroke="#46A171" stroke-width="1.5"/>
  <text x="34" y="86" class="sec-title" fill="#1F5138">核心机制一：从“全图盲搜”到“共视主题分桶匹配”的四步连环图解</text>

  <!-- STEP 1 -->
  <rect x="32" y="100" width="224" height="328" rx="8" fill="#FFFFFF" stroke="#2783DE" stroke-width="1.5"/>
  <rect x="32" y="100" width="224" height="30" rx="8" fill="#E5F2FC"/>
  <text x="144" y="120" text-anchor="middle" class="card-title" fill="#153B60">步骤 1：Transformer 主题推断</text>

  <!-- Mini visual grids for Image A and Image B -->
  <text x="86" y="147" text-anchor="middle" class="mono" fill="#153B60">图 A 特征网格</text>
  <g transform="translate(46, 154)">
    <!-- 4x3 grid: blue=building(T1), green=tree(T2), gray=sky/car(T3 non-covis) -->
    <rect x="0" y="0" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>
    <rect x="21" y="0" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>
    <rect x="42" y="0" width="19" height="19" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
    <rect x="63" y="0" width="19" height="19" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>

    <rect x="0" y="21" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>
    <rect x="21" y="21" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>
    <rect x="42" y="21" width="19" height="19" fill="#86EFAC" stroke="#46A171" stroke-width="1"/>
    <rect x="63" y="21" width="19" height="19" fill="#86EFAC" stroke="#46A171" stroke-width="1"/>

    <rect x="0" y="42" width="19" height="19" fill="#FDE68A" stroke="#D5803B" stroke-width="1"/>
    <rect x="21" y="42" width="19" height="19" fill="#FDE68A" stroke="#D5803B" stroke-width="1"/>
    <rect x="42" y="42" width="19" height="19" fill="#86EFAC" stroke="#46A171" stroke-width="1"/>
    <rect x="63" y="42" width="19" height="19" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1"/>
  </g>

  <text x="196" y="147" text-anchor="middle" class="mono" fill="#153B60">图 B 特征网格</text>
  <g transform="translate(156, 154)">
    <!-- Shifted viewpoint: building shifted right, tree present, no yellow ground, new purple bus(T4) -->
    <rect x="0" y="0" width="19" height="19" fill="#C4B5FD" stroke="#8B5CF6" stroke-width="1"/>
    <rect x="21" y="0" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>
    <rect x="42" y="0" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>
    <rect x="63" y="0" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>

    <rect x="0" y="21" width="19" height="19" fill="#C4B5FD" stroke="#8B5CF6" stroke-width="1"/>
    <rect x="21" y="21" width="19" height="19" fill="#93C5FD" stroke="#2783DE" stroke-width="1"/>
    <rect x="42" y="21" width="19" height="19" fill="#86EFAC" stroke="#46A171" stroke-width="1"/>
    <rect x="63" y="21" width="19" height="19" fill="#86EFAC" stroke="#46A171" stroke-width="1"/>

    <rect x="0" y="42" width="19" height="19" fill="#C4B5FD" stroke="#8B5CF6" stroke-width="1"/>
    <rect x="21" y="42" width="19" height="19" fill="#86EFAC" stroke="#46A171" stroke-width="1"/>
