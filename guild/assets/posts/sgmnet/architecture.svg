<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="980" height="400" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">图 1：SGMNet 整体工作流程（宏观全景）</text>
  <text x="490" y="60" text-anchor="middle" class="sub">局部特征 + 初始选种 → 6 层种子图网络 → 级联重选种 + 3 层精修 → Sinkhorn 输出一对一匹配</text>

  <!-- Stage 1: Input & Initial Seeding -->
  <rect x="22" y="86" width="194" height="258" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="119" y="112" text-anchor="middle" class="h" fill="#1E293B">① 输入与初始选种</text>

  <rect x="38" y="126" width="162" height="72" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="119" y="145" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">图 A（n 个点）</text>
  <circle cx="68" cy="164" r="5.5" fill="#2563EB"/>
  <circle cx="104" cy="160" r="5.5" fill="#16A34A"/>
  <circle cx="144" cy="171" r="5.5" fill="#7C3AED"/>
  <circle cx="172" cy="161" r="5" fill="#94A3B8"/>
  <text x="119" y="191" text-anchor="middle" class="s" fill="#6B7280">坐标 p + 描述子 d</text>

  <rect x="38" y="208" width="162" height="72" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="119" y="227" text-anchor="middle" class="b" fill="#15803D" font-weight="700">图 B（m 个点）</text>
  <circle cx="72" cy="246" r="5.5" fill="#2563EB"/>
  <circle cx="110" cy="243" r="5.5" fill="#16A34A"/>
  <circle cx="148" cy="253" r="5.5" fill="#7C3AED"/>
  <circle cx="174" cy="242" r="5" fill="#94A3B8"/>
  <text x="119" y="273" text-anchor="middle" class="s" fill="#6B7280">坐标 p + 描述子 d</text>

  <rect x="33" y="294" width="172" height="34" rx="17" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="119" y="315" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">NN+比率+NMS 选 k 种子</text>

  <!-- Arrow 1->2 -->
  <line x1="216" y1="215" x2="244" y2="215" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Initial 6-Layer Seeded GNN -->
  <rect x="248" y="86" width="230" height="258" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="363" y="112" text-anchor="middle" class="h" fill="#1E3A8A">② 初始 6 层 Seeded GNN</text>

  <rect x="266" y="126" width="194" height="54" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="363" y="148" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">注意力池化（N → k）</text>
  <text x="363" y="168" text-anchor="middle" class="s" fill="#6B7280">全图上下文汇总到 k 个种子</text>

  <line x1="363" y1="180" x2="363" y2="195" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="266" y="198" width="194" height="54" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.6"/>
  <text x="363" y="220" text-anchor="middle" class="b" fill="#047857" font-weight="700">种子过滤 + 内点打分 γ</text>
  <text x="363" y="240" text-anchor="middle" class="s" fill="#6B7280">仅在 k×k 种子间跨图通信</text>

  <line x1="363" y1="252" x2="363" y2="267" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-orange)"/>

  <rect x="266" y="270" width="194" height="56" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="363" y="292" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">加权反池化（k → N）</text>
  <text x="363" y="313" text-anchor="middle" class="s" fill="#9A3412">按 γ 静音假种子 · 广播全图</text>

  <!-- Arrow 2->3 -->
  <line x1="478" y1="215" x2="506" y2="215" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Reseeding + 3-Layer Refine -->
  <rect x="510" y="86" width="220" height="258" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="620" y="112" text-anchor="middle" class="h" fill="#065F46">③ 重选种 + 3 层精修</text>

  <rect x="528" y="126" width="184" height="54" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <text x="620" y="148" text-anchor="middle" class="b" fill="#065F46" font-weight="700">初始分配矩阵 M_r</text>
  <text x="620" y="168" text-anchor="middle" class="s" fill="#6B7280">Sinkhorn 输出初步概率</text>

  <line x1="620" y1="180" x2="620" y2="195" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="528" y="198" width="184" height="54" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="620" y="220" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">级联重选种 Reseeding</text>
  <text x="620" y="240" text-anchor="middle" class="s" fill="#9A3412">互为最大挑 Top-k 新种子 S'</text>

  <line x1="620" y1="252" x2="620" y2="267" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="528" y="270" width="184" height="56" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="620" y="292" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">精修 3 层 Seeded GNN</text>
  <text x="620" y="313" text-anchor="middle" class="s" fill="#6B7280">用新种子 S' 精细打磨特征</text>

  <!-- Arrow 3->4 -->
  <line x1="730" y1="215" x2="758" y2="215" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Output -->
  <rect x="762" y="86" width="196" height="258" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="860" y="112" text-anchor="middle" class="h" fill="#5B21B6">④ 输出精准匹配</text>

  <rect x="782" y="130" width="156" height="62" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="782" y="224" width="156" height="62" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>

  <line x1="808" y1="162" x2="816" y2="254" stroke="#2563EB" stroke-width="2.2"/>
  <line x1="852" y1="154" x2="860" y2="249" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="896" y1="170" x2="902" y2="264" stroke="#7C3AED" stroke-width="2.2"/>

  <circle cx="808" cy="162" r="5.5" fill="#2563EB"/><circle cx="816" cy="254" r="5.5" fill="#2563EB"/>
  <circle cx="852" cy="154" r="5.5" fill="#16A34A"/><circle cx="860" cy="249" r="5.5" fill="#16A34A"/>
  <circle cx="896" cy="170" r="5.5" fill="#7C3AED"/><circle cx="902" cy="264" r="5.5" fill="#7C3AED"/>

  <!-- Dustbin / rejected unmatched points -->
  <circle cx="920" cy="146" r="5" fill="#CBD5E1"/>
  <line x1="915" y1="141" x2="925" y2="151" stroke="#EF4444" stroke-width="2"/>
  <line x1="925" y1="141" x2="915" y2="151" stroke="#EF4444" stroke-width="2"/>
  <circle cx="798" cy="272" r="5" fill="#CBD5E1"/>
  <line x1="793" y1="267" x2="803" y2="277" stroke="#EF4444" stroke-width="2"/>
  <line x1="803" y1="267" x2="793" y2="277" stroke="#EF4444" stroke-width="2"/>

  <text x="860" y="311" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">Sinkhorn → M_f（&gt; 0.2）</text>
  <text x="860" y="331" text-anchor="middle" class="s" fill="#6D28D9">一对一连线 · 剔除垃圾桶点</text>

  <text x="490" y="376" text-anchor="middle" class="s" fill="#6B7280">对比 SuperGlue：用 k 个高置信种子充当跨图通信中转站，单层 GNN 复杂度从 O(N²C) 暴降至 O(NKC)</text>
</svg>