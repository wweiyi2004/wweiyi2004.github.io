  <rect x="140" y="194" width="132" height="26" rx="13" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="206" y="212" text-anchor="middle" class="s" fill="#B91C1C" font-weight="700">绝大多数边权重 ≈ 0</text>

  <text x="206" y="299" text-anchor="middle" class="b" fill="#7F1D1D">• 8k 点需算 6400 万条边，大量算力空转</text>
  <text x="206" y="323" text-anchor="middle" class="b" fill="#7F1D1D">• 显存 O(N²)，外点噪音在全图互相污染</text>

  <!-- Right Panel: SGMNet Seeded Bottleneck (2 layers max!) -->
  <rect x="408" y="84" width="528" height="256" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="672" y="112" text-anchor="middle" class="h" fill="#166534">✓ SGMNet：种子瓶颈三步曲 O(NKC)</text>

  <!-- Sub-card 1: Full Points Input -->
  <rect x="424" y="128" width="94" height="144" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
  <text x="471" y="148" text-anchor="middle" class="b" fill="#1E293B" font-weight="700">全图 N 点</text>
  <circle cx="452" cy="172" r="5.5" fill="#2563EB"/><circle cx="490" cy="172" r="5.5" fill="#2563EB"/>
  <circle cx="471" cy="192" r="5.5" fill="#2563EB"/>
  <line x1="440" y1="208" x2="502" y2="208" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="452" cy="226" r="5.5" fill="#16A34A"/><circle cx="490" cy="226" r="5.5" fill="#16A34A"/>
  <circle cx="471" cy="246" r="5.5" fill="#16A34A"/>
  <text x="471" y="265" text-anchor="middle" class="s" fill="#6B7280">蓝 A · 绿 B</text>

  <!-- Pooling Arrow -->
  <line x1="520" y1="200" x2="582" y2="200" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <text x="553" y="185" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">① 池化</text>
  <text x="553" y="220" text-anchor="middle" class="s" fill="#64748B">k × N</text>

  <!-- Sub-card 2: Seed Hub -->
  <rect x="588" y="128" width="168" height="144" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="672" y="148" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">② k 颗种子中转站</text>
  <text x="672" y="167" text-anchor="middle" class="s" fill="#475569">仅 k×k 互聊 + CN 验真</text>

  <!-- Good seed pair -->
  <circle cx="614" cy="194" r="6" fill="#2563EB"/>
  <line x1="620" y1="194" x2="668" y2="194" stroke="#16A34A" stroke-width="2.2"/>
  <circle cx="674" cy="194" r="6" fill="#16A34A"/>
  <text x="720" y="198" text-anchor="middle" class="s" fill="#15803D" font-weight="700">✓ 0.94</text>

  <!-- Bad seed pair -->
  <circle cx="614" cy="226" r="6" fill="#94A3B8"/>
  <line x1="620" y1="226" x2="668" y2="226" stroke="#EA580C" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="674" cy="226" r="6" fill="#94A3B8"/>
  <text x="720" y="230" text-anchor="middle" class="s" fill="#DC2626" font-weight="700">✗ 0.04</text>

  <text x="672" y="261" text-anchor="middle" class="s" fill="#1D4ED8">k ≪ N（如 512 vs 8000）</text>

  <!-- Weighted Unpooling Arrow -->
  <line x1="758" y1="200" x2="820" y2="200" stroke="#EA580C" stroke-width="2.4" marker-end="url(#arr-orange)"/>
  <text x="791" y="185" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">③ 反池化</text>
  <text x="791" y="220" text-anchor="middle" class="s" fill="#C2410C">乘 γ 广播</text>

  <!-- Sub-card 3: Updated Full Points -->
  <rect x="826" y="128" width="94" height="144" rx="8" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.8"/>
  <text x="873" y="148" text-anchor="middle" class="b" fill="#15803D" font-weight="700">更新 N 点</text>
  <circle cx="854" cy="172" r="6" fill="#2563EB" stroke="#93C5FD" stroke-width="2.5"/>
  <circle cx="892" cy="172" r="6" fill="#2563EB" stroke="#93C5FD" stroke-width="2.5"/>
  <circle cx="873" cy="192" r="6" fill="#2563EB" stroke="#93C5FD" stroke-width="2.5"/>
  <line x1="842" y1="208" x2="904" y2="208" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="3,3"/>
  <circle cx="854" cy="226" r="6" fill="#16A34A" stroke="#86EFAC" stroke-width="2.5"/>
  <circle cx="892" cy="226" r="6" fill="#16A34A" stroke="#86EFAC" stroke-width="2.5"/>
  <circle cx="873" cy="246" r="6" fill="#16A34A" stroke="#86EFAC" stroke-width="2.5"/>
  <text x="873" y="265" text-anchor="middle" class="s" fill="#15803D">干净上下文</text>

  <text x="672" y="299" text-anchor="middle" class="b" fill="#14532D">• 8k 点配 512 种子：种子互聊边数缩小 244 倍！</text>
  <text x="672" y="323" text-anchor="middle" class="b" fill="#14532D">• 复杂度降至 O(NKC)，10k 点 GNN 提速 6.8 倍、显存砍半</text>

  <!-- Bottom Analogy Callout -->
  <rect x="24" y="354" width="912" height="40" rx="10" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="480" y="379" text-anchor="middle" class="b" fill="#1E3A8A" font-weight="700">直觉类比：不让 8000 名同学两两私聊，而是先向 512 位班长汇报 → 班长开会验真伪 → 静音谣言再全班广播</text>
