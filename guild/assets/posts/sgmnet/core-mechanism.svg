      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="960" height="410" fill="#FFFFFF" rx="12"/>

  <text x="480" y="36" text-anchor="middle" class="title">图 2：核心机制——种子瓶颈稀疏图 vs 全连接图（复杂度暴降）</text>
  <text x="480" y="60" text-anchor="middle" class="sub">SuperGlue 让全图两两传话（绝大部分边权重 ≈ 0）；SGMNet 用 k 颗种子做中转站，三步走完高效通信</text>

  <!-- Left Panel: SuperGlue Dense Graph -->
  <rect x="24" y="84" width="364" height="256" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="206" y="112" text-anchor="middle" class="h" fill="#991B1B">✗ SuperGlue：全连接图 O(N²C)</text>

  <rect x="44" y="126" width="324" height="146" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <text x="100" y="146" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">图 A（N 点）</text>
  <text x="312" y="146" text-anchor="middle" class="s" fill="#15803D" font-weight="700">图 B（M 点）</text>
  <line x1="100" y1="164" x2="312" y2="164" stroke="#CBD5E1" stroke-width="1.2" opacity="0.85"/>
