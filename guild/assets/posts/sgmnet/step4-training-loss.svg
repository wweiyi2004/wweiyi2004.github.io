<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 384" width="960" height="384">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="960" height="384" fill="#FFFFFF" rx="12"/>

  <text x="480" y="36" text-anchor="middle" class="title">图 5：双阶段深监督与“前 140k 步梯度截断”训练策略</text>
  <text x="480" y="60" text-anchor="middle" class="sub">同时监督两阶段分配矩阵（M_r, M_f）与 9 层种子内点分 γ；训练早期隔断两阶段梯度防噪音倒灌</text>

  <!-- Left Panel: Dual Supervision Wiring -->
  <rect x="24" y="84" width="548" height="250" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="298" y="112" text-anchor="middle" class="h" fill="#1E3A8A">总损失 L = L_assign + 250 · Σ L_weight（9 层）</text>

  <!-- Stage 1 -->
  <rect x="44" y="136" width="130" height="58" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="109" y="160" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">阶段一：6 层 GNN</text>
  <text x="109" y="181" text-anchor="middle" class="s" fill="#6B7280">输出 M_r 与 γ¹~γ⁶</text>

  <!-- Arrow with stop-grad barrier -->
  <line x1="174" y1="165" x2="262" y2="165" stroke="#EA580C" stroke-width="2.4" stroke-dasharray="5,3" marker-end="url(#arr-orange)"/>
  <line x1="218" y1="148" x2="218" y2="182" stroke="#DC2626" stroke-width="2.6"/>
  <text x="218" y="139" text-anchor="middle" class="s" fill="#DC2626" font-weight="700">前 140k 截断</text>

  <!-- Reseeding -->
  <rect x="268" y="136" width="106" height="58" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8"/>
  <text x="321" y="160" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">Reseeding</text>
  <text x="321" y="181" text-anchor="middle" class="s" fill="#9A3412">离散索引 S'</text>

  <!-- Arrow to Stage 2 -->
  <line x1="374" y1="165" x2="408" y2="165" stroke="#16A34A" stroke-width="2.4" marker-end="url(#arr-green)"/>

  <!-- Stage 2 -->
  <rect x="414" y="136" width="138" height="58" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="483" y="160" text-anchor="middle" class="b" fill="#047857" font-weight="700">阶段二：3 层精修</text>
  <text x="483" y="181" text-anchor="middle" class="s" fill="#6B7280">输出 M_f 与 γ⁷~γ⁹</text>

  <!-- Supervision down arrows -->
  <line x1="109" y1="194" x2="109" y2="232" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="483" y1="194" x2="483" y2="232" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-orange)"/>
  <!-- Cross link from Stage 2 to L_assign & Stage 1 to L_weight -->
  <path d="M 446 194 L 446 212 L 244 212 L 244 232" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <path d="M 146 194 L 146 221 L 348 221 L 348 232" fill="none" stroke="#EA580C" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>

  <!-- Loss Card 1 -->
  <rect x="44" y="238" width="242" height="78" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="165" y="261" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">双阶段分配损失 L_assign</text>
  <text x="165" y="283" text-anchor="middle" class="s" fill="#374151">对 M_r 与 M_f 同时算负对数似然</text>
  <text x="165" y="303" text-anchor="middle" class="s" fill="#6B7280">真匹配概率趋 1 · 遮挡点入垃圾桶</text>

  <!-- Loss Card 2 -->
  <rect x="306" y="238" width="246" height="78" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8"/>
  <text x="429" y="261" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">9 层种子 BCE 损失（δ = 250）</text>
  <text x="429" y="283" text-anchor="middle" class="s" fill="#9A3412">按对极距离标真伪，监督每层 γ</text>
  <text x="429" y="303" text-anchor="middle" class="s" fill="#9A3412">乘 δ=250 拉齐与求和 NLL 的量级</text>

  <!-- Right Panel: Why Stop-Grad for 140k -->
  <rect x="592" y="84" width="344" height="250" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="764" y="112" text-anchor="middle" class="h" fill="#166534">为什么前 140k 步要截断梯度？</text>

  <rect x="614" y="132" width="300" height="78" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.6"/>
  <text x="764" y="156" text-anchor="middle" class="b" fill="#B91C1C" font-weight="700">Step 0 ~ 140k：阻断阶段 1 → 2 梯度</text>
  <text x="764" y="178" text-anchor="middle" class="s" fill="#7F1D1D">初期 M_r 接近随机，重选出的 S' 满是噪音</text>
  <text x="764" y="198" text-anchor="middle" class="s" fill="#7F1D1D">先隔离梯度，让阶段一稳稳学会产出好种子</text>

  <line x1="764" y1="210" x2="764" y2="232" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <rect x="614" y="238" width="300" height="78" rx="8" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.8"/>
  <text x="764" y="262" text-anchor="middle" class="b" fill="#15803D" font-weight="700">Step &gt; 140k：放开端到端联合微调</text>
  <text x="764" y="284" text-anchor="middle" class="s" fill="#14532D">阶段一成熟后连通两阶段特征梯度流</text>
  <text x="764" y="304" text-anchor="middle" class="s" fill="#14532D">两阶段协同优化，训练更稳、精度更高</text>

  <!-- Bottom note -->
  <text x="480" y="362" text-anchor="middle" class="s" fill="#6B7280">单一 GL3D 数据集（室内外通吃 · 每图 1k 点 · 128 种子 · Batch=16 · 训练显存 &lt; 9 GB，比 SuperGlue 省 60%+）</text>
</svg>