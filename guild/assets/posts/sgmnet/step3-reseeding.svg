<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#FFFFFF" rx="12"/>

  <text x="480" y="36" text-anchor="middle" class="title">图 4：初始选种 vs 级联重选种（Reseeding）——给种子彻底“换血”</text>
  <text x="480" y="60" text-anchor="middle" class="sub">先靠原始描述子粗筛建桥，跑完 6 层拿到高质量 M_r 后，按“行列互为最大”换一批纯净种子再精修 3 层</text>

  <!-- Card 1: Initial Seeding -->
  <rect x="22" y="86" width="266" height="258" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="155" y="112" text-anchor="middle" class="h" fill="#9A3412">① 初始选种（原始描述子）</text>

  <rect x="44" y="126" width="222" height="50" rx="7" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <rect x="44" y="190" width="222" height="50" rx="7" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>

  <!-- 2 good seeds -->
  <line x1="74" y1="150" x2="82" y2="216" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="126" y1="145" x2="132" y2="210" stroke="#16A34A" stroke-width="2.2"/>
  <!-- 1 false crossing seed -->
  <line x1="170" y1="154" x2="218" y2="218" stroke="#EF4444" stroke-width="2.2" stroke-dasharray="5,3"/>
  <circle cx="74" cy="150" r="5" fill="#16A34A"/><circle cx="82" cy="216" r="5" fill="#16A34A"/>
  <circle cx="126" cy="145" r="5" fill="#16A34A"/><circle cx="132" cy="210" r="5" fill="#16A34A"/>
  <circle cx="170" cy="154" r="5" fill="#EF4444"/><circle cx="218" cy="218" r="5" fill="#EF4444"/>
  <!-- Missing region indicator -->
  <circle cx="236" cy="151" r="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="236" y="155" text-anchor="middle" class="s" fill="#64748B">漏</text>

  <text x="155" y="264" text-anchor="middle" class="s" fill="#DC2626" font-weight="700">✗ 红虚线误配 + 右侧局部漏选</text>
  <text x="155" y="294" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">NN 最近邻 + 距离比倒数 + NMS</text>
  <text x="155" y="318" text-anchor="middle" class="s" fill="#C2410C">零学习成本，但重复纹理易出错</text>

  <!-- Arrow 1->2 -->
  <line x1="288" y1="215" x2="334" y2="215" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <text x="311" y="201" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">6 层</text>
  <text x="311" y="236" text-anchor="middle" class="s" fill="#1D4ED8">出 M_r</text>

  <!-- Card 2: Mutual Max from M_r -->
  <rect x="340" y="86" width="280" height="258" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" class="h" fill="#1E3A8A">② 从 M_r 筛互为最大 Top-k</text>
  <text x="415.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">B1</text>
  <text x="467.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">B2</text>
  <text x="519.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">B3</text>
  <text x="571.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">B4</text>
  <text x="382" y="169" text-anchor="end" class="s" fill="#334155" font-weight="700">A1</text>
  <rect x="392" y="148" width="46" height="32" rx="5" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.3"/>
  <text x="415.0" y="169" text-anchor="middle" class="mono" font-size="12.5" fill="#FFFFFF">0.92</text>
  <rect x="444" y="148" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="467.0" y="169" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.03</text>
  <rect x="496" y="148" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="519.0" y="169" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.02</text>
  <rect x="548" y="148" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="571.0" y="169" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.01</text>
  <text x="382" y="207" text-anchor="end" class="s" fill="#334155" font-weight="700">A2</text>
  <rect x="392" y="186" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="415.0" y="207" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.02</text>
  <rect x="444" y="186" width="46" height="32" rx="5" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.3"/>
  <text x="467.0" y="207" text-anchor="middle" class="mono" font-size="12.5" fill="#FFFFFF">0.87</text>
  <rect x="496" y="186" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="519.0" y="207" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.05</text>
  <rect x="548" y="186" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="571.0" y="207" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.02</text>
  <text x="382" y="245" text-anchor="end" class="s" fill="#334155" font-weight="700">A3</text>
  <rect x="392" y="224" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="415.0" y="245" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.01</text>
  <rect x="444" y="224" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="467.0" y="245" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.04</text>
  <rect x="496" y="224" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="519.0" y="245" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.03</text>
  <rect x="548" y="224" width="46" height="32" rx="5" fill="#7C3AED" stroke="#5B21B6" stroke-width="1.3"/>
  <text x="571.0" y="245" text-anchor="middle" class="mono" font-size="12.5" fill="#FFFFFF">0.85</text>
  <text x="382" y="283" text-anchor="end" class="s" fill="#334155" font-weight="700">A4</text>
  <rect x="392" y="262" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="415.0" y="283" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.02</text>
  <rect x="444" y="262" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="467.0" y="283" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.03</text>
  <rect x="496" y="262" width="46" height="32" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3"/>
  <text x="519.0" y="283" text-anchor="middle" class="mono" font-size="12.5" fill="#94A3B8">0.38</text>
  <rect x="548" y="262" width="46" height="32" rx="5" fill="#FED7AA" stroke="#EA580C" stroke-width="1.3"/>
  <text x="571.0" y="283" text-anchor="middle" class="mono" font-size="12.5" fill="#9A3412">0.42</text>
  <text x="480" y="312" text-anchor="middle" class="s" fill="#5B21B6" font-weight="700">紫格：行列双最高 → 入选新种子 S'</text>
  <text x="480" y="332" text-anchor="middle" class="s" fill="#C2410C">橙格 0.42 非列最高（&lt; 0.85）→ 淘汰</text>

  <!-- Arrow 2->3 -->
  <line x1="620" y1="215" x2="666" y2="215" stroke="#16A34A" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <text x="643" y="201" text-anchor="middle" class="s" fill="#15803D" font-weight="700">换血</text>
  <text x="643" y="236" text-anchor="middle" class="s" fill="#15803D">新 S'</text>

  <!-- Card 3: Refined Seeding + 3-Layer GNN -->
  <rect x="672" y="86" width="266" height="258" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="805" y="112" text-anchor="middle" class="h" fill="#166534">③ 重选种 S' + 3 层精修</text>

  <rect x="694" y="126" width="222" height="50" rx="7" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <rect x="694" y="190" width="222" height="50" rx="7" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>

  <!-- 4 clean, evenly spaced true seeds -->
  <line x1="720" y1="150" x2="726" y2="216" stroke="#2563EB" stroke-width="2.2"/>
  <line x1="772" y1="145" x2="778" y2="210" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="830" y1="155" x2="836" y2="220" stroke="#7C3AED" stroke-width="2.2"/>
  <line x1="884" y1="147" x2="890" y2="212" stroke="#16A34A" stroke-width="2.2"/>
  <circle cx="720" cy="150" r="5" fill="#2563EB"/><circle cx="726" cy="216" r="5" fill="#2563EB"/>
  <circle cx="772" cy="145" r="5" fill="#16A34A"/><circle cx="778" cy="210" r="5" fill="#16A34A"/>
  <circle cx="830" cy="155" r="5" fill="#7C3AED"/><circle cx="836" cy="220" r="5" fill="#7C3AED"/>
  <circle cx="884" cy="147" r="5" fill="#16A34A"/><circle cx="890" cy="212" r="5" fill="#16A34A"/>

  <text x="805" y="264" text-anchor="middle" class="s" fill="#15803D" font-weight="700">✓ 假种子清除 · 全局覆盖均匀</text>
  <text x="805" y="294" text-anchor="middle" class="b" fill="#14532D" font-weight="700">用 S' 驱动 3 层精修 Seeded GNN</text>
  <text x="805" y="318" text-anchor="middle" class="s" fill="#15803D">输出高精度 M_f（消融 AUC +1.07）</text>

  <text x="480" y="376" text-anchor="middle" class="s" fill="#6B7280">两轮选种都只输出离散整数索引（不反传梯度），既保持端到端可微，又实现“由粗到精”的种子升级</text>
</svg>