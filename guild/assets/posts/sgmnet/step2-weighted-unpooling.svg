  <text x="664" y="146" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.282</text>
  <rect x="716" y="131" width="136" height="18" rx="5" fill="#7C3AED"/>
  <text x="862" y="146" class="b" fill="#5B21B6" font-weight="700">主导上下文</text>
  <text x="218" y="192" text-anchor="end" class="b" fill="#334155" font-weight="700">种子 2（门角 ↔ 门角）</text>
  <rect x="234" y="168" width="72" height="36" rx="6" fill="#3B82F6"/>
  <text x="270" y="192" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.20</text>
  <rect x="392" y="168" width="72" height="36" rx="6" fill="#16A34A"/>
  <text x="428" y="192" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.91</text>
  <text x="478" y="192" class="b" fill="#15803D" font-weight="700">✓ 真种子</text>
  <rect x="626" y="168" width="76" height="36" rx="6" fill="#8B5CF6" stroke="#CBD5E1" stroke-width="1"/>
  <text x="664" y="192" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.182</text>
  <rect x="716" y="177" width="88" height="18" rx="5" fill="#8B5CF6"/>
  <text x="814" y="192" class="b" fill="#6D28D9" font-weight="700">有效补充</text>
  <rect x="26" y="210" width="928" height="44" rx="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="218" y="238" text-anchor="end" class="b" fill="#DC2626" font-weight="700">种子 3*（左窗 ↔ 右窗）</text>
  <rect x="234" y="214" width="72" height="36" rx="6" fill="#EA580C"/>
  <text x="270" y="238" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.40</text>
  <rect x="392" y="214" width="72" height="36" rx="6" fill="#DC2626"/>
  <text x="428" y="238" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.04</text>
  <text x="478" y="238" class="b" fill="#DC2626" font-weight="700">✗ 假种子</text>
  <rect x="626" y="214" width="76" height="36" rx="6" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <text x="664" y="238" text-anchor="middle" class="mono" font-size="13.5" fill="#475569">0.016</text>
