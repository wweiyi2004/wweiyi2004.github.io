  <rect width="980" height="400" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">图 3：加权注意力反池化——用内点分 γ 给假种子“一键静音”</text>
  <text x="490" y="60" text-anchor="middle" class="sub">数值实例：墙角点 i 对假种子 3* 给出了 0.40 最高注意力，左乘 Diag(γ) 后贡献瞬间压缩 25 倍</text>

  <!-- Column headers -->
  <text x="180" y="98" text-anchor="middle" class="h" fill="#1D4ED8">① 原始注意力权重 θ(qᵢKᵀ)</text>
  <text x="468" y="98" text-anchor="middle" class="h" fill="#15803D">② CN 内点分 γ</text>
  <text x="774" y="98" text-anchor="middle" class="h" fill="#6D28D9">③ 实际消息贡献（× V）</text>

  <text x="218" y="146" text-anchor="end" class="b" fill="#334155" font-weight="700">种子 1（塔尖 ↔ 塔尖）</text>
  <rect x="234" y="122" width="72" height="36" rx="6" fill="#2563EB"/>
  <text x="270" y="146" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.30</text>
