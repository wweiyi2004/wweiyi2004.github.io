  <text x="770" y="284" class="b" fill="#6D28D9" font-weight="700">有效补充</text>

  <!-- Operators with clean white mask so dashed row border never collides -->
  <circle cx="349" cy="209" r="16" fill="#FFFFFF"/>
  <text x="349" y="218" text-anchor="middle" font-size="26" font-weight="700" fill="#475569">×</text>
  <circle cx="586" cy="209" r="16" fill="#FFFFFF"/>
  <text x="586" y="218" text-anchor="middle" font-size="26" font-weight="700" fill="#475569">=</text>

  <!-- Bottom Callout -->
  <rect x="34" y="318" width="912" height="58" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="490" y="342" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">看第 3 行假种子 3*（重复纹理误配）：原始注意力高达 0.40（全场最高），普通反池化会被严重带偏；</text>
  <text x="490" y="364" text-anchor="middle" class="b" fill="#9A3412">左乘 Diag(γ) 后贡献骤降为 0.016（静音 25 倍）——消融证实去掉它精确率直掉 4.82%，AUC@20° 暴跌 2.84！</text>
</svg>