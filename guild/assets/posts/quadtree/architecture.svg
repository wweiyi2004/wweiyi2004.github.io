  <rect x="266" y="232" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.6"/>
  <text x="381" y="254" text-anchor="middle" class="b" fill="#047857" font-weight="700">QuadTree-B 多尺度加权融合</text>
