  <rect width="980" height="412" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">图 1：QuadTree Attention 整体流程（以 LoFTR 半稠密匹配为例）</text>
  <text x="490" y="60" text-anchor="middle" class="sub">双图提粗/细特征 → 粗级 Transformer 替换为四叉树多尺度注意力 → 粗匹配 + 细级窗口精修</text>

  <!-- Stage 1: Input & FPN -->
  <rect x="24" y="88" width="184" height="248" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="116" y="114" text-anchor="middle" class="h" fill="#1E293B">① 双图提取特征</text>

