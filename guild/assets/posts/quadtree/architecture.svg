  <text x="116" y="226" text-anchor="middle" class="b" fill="#15803D" font-weight="700">图 B（640×480）</text>
  <rect x="64" y="234" width="104" height="30" rx="4" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1"/>
  <line x1="90" y1="234" x2="90" y2="264" stroke="#DCFCE7" stroke-width="1"/>
