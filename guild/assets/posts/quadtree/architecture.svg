  <text x="116" y="148" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">图 A（640×480）</text>
  <rect x="64" y="156" width="104" height="30" rx="4" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1"/>
  <line x1="90" y1="156" x2="90" y2="186" stroke="#DBEAFE" stroke-width="1"/>
