  <text x="490" y="330" text-anchor="middle" class="h" fill="#9A3412">工程实测真相（COCO 800×1333 · RetinaNet · PVTv2-b0 vs QuadTree-B-b0）</text>

  <!-- Metric 1: FLOPs -->
  <rect x="44" y="342" width="286" height="70" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="58" y="362" class="b" fill="#166534" font-weight="700">理论计算量 FLOPs</text>
  <text x="316" y="362" text-anchor="end" class="mono" font-size="13" fill="#16A34A">-42% ↓</text>
  <text x="58" y="382" class="s" fill="#64748B">PVTv2</text>
  <rect x="128" y="372" width="124" height="12" rx="4" fill="#CBD5E1"/>
  <text x="260" y="382" class="mono" font-size="12" fill="#475569">28.3G</text>
