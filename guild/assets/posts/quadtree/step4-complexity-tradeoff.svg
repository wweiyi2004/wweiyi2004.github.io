  <rect width="980" height="438" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">图 5：四大视觉注意力视野对比与工程实测真相</text>
  <text x="490" y="60" text-anchor="middle" class="sub">QuadTree 兼具全局视野、细粒度聚焦与线性显存 O(KN)，但落地需警惕朴素稀疏 CUDA 的耗时倒挂</text>

  <!-- Card 1: Standard -->
  <rect x="26" y="82" width="220" height="208" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <text x="136" y="108" text-anchor="middle" class="h" fill="#991B1B">标准注意力</text>
  <rect x="96" y="116" width="80" height="22" rx="11" fill="#FEE2E2"/>
  <text x="136" y="132" text-anchor="middle" class="mono" font-size="12.5" fill="#DC2626">O(N²)</text>
  <text x="136" y="258" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">全局 + 精细，但爆显存</text>
  <text x="136" y="276" text-anchor="middle" class="s" fill="#64748B">4800 点需算 2304 万对</text>

  <!-- Card 2: Linear -->
  <rect x="262" y="82" width="220" height="208" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="372" y="108" text-anchor="middle" class="h" fill="#9A3412">线性注意力 (LoFTR)</text>
  <rect x="332" y="116" width="80" height="22" rx="11" fill="#FFEDD5"/>
  <text x="372" y="132" text-anchor="middle" class="mono" font-size="12.5" fill="#EA580C">O(N)</text>
  <text x="372" y="258" text-anchor="middle" class="s" fill="#9A3412" font-weight="700">线性算力，但低秩发散</text>
  <text x="372" y="276" text-anchor="middle" class="s" fill="#64748B">注意力糊在一大片背景上</text>

  <!-- Card 3: Local Window -->
  <rect x="498" y="82" width="220" height="208" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.8"/>
  <text x="608" y="108" text-anchor="middle" class="h" fill="#334155">局部窗口 (Swin)</text>
  <rect x="564" y="116" width="88" height="22" rx="11" fill="#E2E8F0"/>
  <text x="608" y="132" text-anchor="middle" class="mono" font-size="12.5" fill="#475569">O(M²N)</text>
  <text x="608" y="258" text-anchor="middle" class="s" fill="#334155" font-weight="700">局部精细，但丢全局视野</text>
  <text x="608" y="276" text-anchor="middle" class="s" fill="#64748B">难以直接做跨图匹配</text>

  <!-- Card 4: QuadTree-B -->
  <rect x="734" y="82" width="220" height="208" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.4"/>
  <text x="844" y="108" text-anchor="middle" class="h" fill="#166534">QuadTree-B（本文 ★）</text>
  <rect x="802" y="116" width="84" height="22" rx="11" fill="#DCFCE7"/>
  <text x="844" y="132" text-anchor="middle" class="mono" font-size="12.5" fill="#15803D">O(KN)</text>
  <text x="844" y="258" text-anchor="middle" class="s" fill="#166534" font-weight="700">全局覆盖 + 细层无损聚焦</text>
  <text x="844" y="276" text-anchor="middle" class="s" fill="#15803D" font-weight="700">自/交叉注意力统一支持</text>

