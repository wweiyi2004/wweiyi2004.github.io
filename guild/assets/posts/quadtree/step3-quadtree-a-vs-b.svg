  <text x="480" y="36" text-anchor="middle" class="title">图 4：QuadTree-A vs QuadTree-B——为什么放弃“拼图”改用独立融合？</text>
  <text x="480" y="60" text-anchor="middle" class="sub">核心分水岭在于各层权重是否“跨层连乘”：A 方案把细层越乘越小，B 方案让细层满血聚焦</text>

