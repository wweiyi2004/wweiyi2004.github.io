  <!-- Calculation decay box -->
  <rect x="206" y="136" width="246" height="146" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <text x="329" y="160" text-anchor="middle" class="b" fill="#B91C1C" font-weight="700">递归连乘：sˡ = sˡ⁻¹ × tˡ</text>
  <text x="329" y="188" text-anchor="middle" class="mono" font-size="13" fill="#374151">粗层：0.30</text>
  <text x="329" y="213" text-anchor="middle" class="mono" font-size="13" fill="#B45309">中层：0.30 × 0.40 = 0.12</text>
  <text x="329" y="238" text-anchor="middle" class="mono" font-size="13" fill="#DC2626">细层：0.12 × 0.50 = 0.06 ↓</text>
  <rect x="226" y="250" width="206" height="24" rx="6" fill="#FEE2E2"/>
  <text x="329" y="267" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">层级越深，权重衰减越严重！</text>

  <text x="46" y="336" class="b" fill="#7F1D1D">• 最有价值的细粒度特征反被连乘压成最小权重</text>
  <text x="46" y="362" class="b" fill="#7F1D1D">• 粗层打分一旦偏低，细层被一路压死无法翻身</text>

