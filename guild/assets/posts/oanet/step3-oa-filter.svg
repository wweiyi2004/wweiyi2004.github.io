<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="404" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 4：Order-Aware Filtering 块——通道与空间正交交替混合</text>
  <text x="480" y="62" text-anchor="middle" class="sub">用“4 个有序聚类 × 3 个特征通道”色块矩阵看懂：转置一次，跨通道共享 MLP 即可打通全局空间关联</text>

  <!-- Stage 1: Channel Mixing -->
  <rect x="26" y="88" width="234" height="236" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="143" y="116" text-anchor="middle" class="h" fill="#1E3A8A">① 通道混合（PointCN）</text>
  <text x="97.0" y="144" text-anchor="middle" class="s" font-weight="700" fill="#475569">d1</text>
  <text x="144.0" y="144" text-anchor="middle" class="s" font-weight="700" fill="#475569">d2</text>
  <text x="191.0" y="144" text-anchor="middle" class="s" font-weight="700" fill="#475569">d3</text>
  <text x="68" y="169.5" text-anchor="end" class="s" font-weight="700" fill="#334155">C1</text>
  <rect x="76" y="152" width="42" height="26" rx="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="123" y="152" width="42" height="26" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="170" y="152" width="42" height="26" rx="5" fill="#93C5FD" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="73" y="149" width="142" height="32" rx="7" fill="none" stroke="#1D4ED8" stroke-width="2.2"/>
  <text x="68" y="200.5" text-anchor="end" class="s" font-weight="700" fill="#334155">C2</text>
  <rect x="76" y="183" width="42" height="26" rx="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="123" y="183" width="42" height="26" rx="5" fill="#34D399" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="170" y="183" width="42" height="26" rx="5" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="68" y="231.5" text-anchor="end" class="s" font-weight="700" fill="#334155">C3</text>
  <rect x="76" y="214" width="42" height="26" rx="5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="123" y="214" width="42" height="26" rx="5" fill="#FB923C" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="170" y="214" width="42" height="26" rx="5" fill="#FDBA74" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="68" y="262.5" text-anchor="end" class="s" font-weight="700" fill="#334155">C4</text>
  <rect x="76" y="245" width="42" height="26" rx="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="123" y="245" width="42" height="26" rx="5" fill="#A78BFA" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="170" y="245" width="42" height="26" rx="5" fill="#C4B5FD" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="143" y="294" text-anchor="middle" class="b" font-weight="700" fill="#1D4ED8">蓝框沿行混合 D 维通道</text>
  <text x="143" y="313" text-anchor="middle" class="s" fill="#475569">每个聚类内部消化 · 互不交流</text>

  <!-- Arrow 1->2 Transpose -->
  <line x1="260" y1="206" x2="322" y2="206" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="291" y="192" text-anchor="middle" class="b" font-weight="700" fill="#C2410C">转置</text>
  <text x="291" y="226" text-anchor="middle" class="mono" font-size="12" fill="#9A3412">M×D→D×M</text>

  <!-- Stage 2: Spatial Correlation -->
  <rect x="328" y="88" width="276" height="236" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2.2"/>
  <text x="466" y="116" text-anchor="middle" class="h" fill="#9A3412">② 空间关联（Spatial Correlation）</text>
  <text x="402.0" y="158" text-anchor="middle" class="s" font-weight="700" fill="#9A3412">C1</text>
  <text x="447.0" y="158" text-anchor="middle" class="s" font-weight="700" fill="#9A3412">C2</text>
  <text x="492.0" y="158" text-anchor="middle" class="s" font-weight="700" fill="#9A3412">C3</text>
  <text x="537.0" y="158" text-anchor="middle" class="s" font-weight="700" fill="#9A3412">C4</text>
  <text x="374" y="184.5" text-anchor="end" class="s" font-weight="700" fill="#475569">d1</text>
  <rect x="382" y="166" width="40" height="28" rx="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="427" y="166" width="40" height="28" rx="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="472" y="166" width="40" height="28" rx="5" fill="#F97316" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="517" y="166" width="40" height="28" rx="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="374" y="217.5" text-anchor="end" class="s" font-weight="700" fill="#475569">d2</text>
  <rect x="382" y="199" width="40" height="28" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="427" y="199" width="40" height="28" rx="5" fill="#34D399" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="472" y="199" width="40" height="28" rx="5" fill="#FB923C" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="517" y="199" width="40" height="28" rx="5" fill="#A78BFA" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="374" y="250.5" text-anchor="end" class="s" font-weight="700" fill="#475569">d3</text>
  <rect x="382" y="232" width="40" height="28" rx="5" fill="#93C5FD" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="427" y="232" width="40" height="28" rx="5" fill="#6EE7B7" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="472" y="232" width="40" height="28" rx="5" fill="#FDBA74" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="517" y="232" width="40" height="28" rx="5" fill="#C4B5FD" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="379" y="163" width="181" height="34" rx="7" fill="none" stroke="#EA580C" stroke-width="2.4"/>
  <text x="466" y="294" text-anchor="middle" class="b" font-weight="700" fill="#C2410C">橙框横跨 C1~C4 直接对话！</text>
  <text x="466" y="313" text-anchor="middle" class="s" fill="#9A3412">D 个通道共享 1 套 M×M 权重（防过拟合）</text>

  <!-- Arrow 2->3 Transpose Back -->
  <line x1="604" y1="206" x2="666" y2="206" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <text x="635" y="192" text-anchor="middle" class="b" font-weight="700" fill="#6D28D9">转置回</text>
  <text x="635" y="226" text-anchor="middle" class="mono" font-size="12" fill="#5B21B6">D×M→M×D</text>

  <!-- Stage 3: Second Channel Mixing + Residual -->
  <rect x="672" y="88" width="262" height="236" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="803" y="116" text-anchor="middle" class="h" fill="#5B21B6">③ 再通道混合 + 残差输出</text>
  <text x="757.0" y="144" text-anchor="middle" class="s" font-weight="700" fill="#475569">d1</text>
  <text x="804.0" y="144" text-anchor="middle" class="s" font-weight="700" fill="#475569">d2</text>
  <text x="851.0" y="144" text-anchor="middle" class="s" font-weight="700" fill="#475569">d3</text>
  <text x="728" y="169.5" text-anchor="end" class="s" font-weight="700" fill="#5B21B6">C1'</text>
  <rect x="736" y="152" width="42" height="26" rx="5" fill="#6D28D9" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="783" y="152" width="42" height="26" rx="5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="830" y="152" width="42" height="26" rx="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="728" y="200.5" text-anchor="end" class="s" font-weight="700" fill="#5B21B6">C2'</text>
  <rect x="736" y="183" width="42" height="26" rx="5" fill="#4F46E5" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="783" y="183" width="42" height="26" rx="5" fill="#6366F1" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="830" y="183" width="42" height="26" rx="5" fill="#818CF8" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="728" y="231.5" text-anchor="end" class="s" font-weight="700" fill="#5B21B6">C3'</text>
  <rect x="736" y="214" width="42" height="26" rx="5" fill="#0D9488" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="783" y="214" width="42" height="26" rx="5" fill="#14B8A6" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="830" y="214" width="42" height="26" rx="5" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="728" y="262.5" text-anchor="end" class="s" font-weight="700" fill="#5B21B6">C4'</text>
  <rect x="736" y="245" width="42" height="26" rx="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="783" y="245" width="42" height="26" rx="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2"/>
  <rect x="830" y="245" width="42" height="26" rx="5" fill="#60A5FA" stroke="#FFFFFF" stroke-width="1.2"/>
  <text x="803" y="294" text-anchor="middle" class="b" font-weight="700" fill="#6D28D9">兼具局部与全局几何上下文</text>
  <text x="803" y="313" text-anchor="middle" class="s" fill="#475569">早期“类 MLP-Mixer”正交交互设计</text>

  <!-- Bottom crisp callout -->
  <rect x="26" y="340" width="908" height="48" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="480" y="361" text-anchor="middle" class="b" font-weight="700" fill="#1E293B">核心禁区：Spatial Correlation 只能放在 DiffPool 之后的 Level-2（固定 500 个规范槽位）！</text>
  <text x="480" y="379" text-anchor="middle" class="s" fill="#475569">若直接放在 Level-1，N 个原始点次序随机且数量可变，跨行加权没有任何稳定的空间对应意义。</text>
</svg>