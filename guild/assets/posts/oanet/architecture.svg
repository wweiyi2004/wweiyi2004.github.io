<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="410" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 1：OANet 整体工作流程（两层 U 型宏观全景）</text>
  <text x="490" y="62" text-anchor="middle" class="sub">输入 N 对无序粗匹配（含大量误匹配）→ 软聚类自动排座 → 跨聚类全局交互 → 还原顺序并解出本质矩阵 Ê</text>

  <!-- Stage 1: Unordered Input -->
  <rect x="24" y="94" width="184" height="248" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="116" y="122" text-anchor="middle" class="h" fill="#1E293B">① 输入无序粗匹配</text>
  <rect x="44" y="140" width="144" height="58" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="44" y="232" width="144" height="58" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="68" y1="168" x2="74" y2="260" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="115" y1="160" x2="122" y2="256" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="162" y1="175" x2="168" y2="268" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="88" y1="182" x2="152" y2="248" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5,3"/>
  <line x1="145" y1="154" x2="62" y2="274" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5,3"/>
  <circle cx="68" cy="168" r="4.5" fill="#16A34A"/><circle cx="74" cy="260" r="4.5" fill="#16A34A"/>
  <circle cx="115" cy="160" r="4.5" fill="#16A34A"/><circle cx="122" cy="256" r="4.5" fill="#16A34A"/>
  <circle cx="162" cy="175" r="4.5" fill="#16A34A"/><circle cx="168" cy="268" r="4.5" fill="#16A34A"/>
  <circle cx="88" cy="182" r="4.5" fill="#EF4444"/><circle cx="152" cy="248" r="4.5" fill="#EF4444"/>
  <circle cx="145" cy="154" r="4.5" fill="#EF4444"/><circle cx="62" cy="274" r="4.5" fill="#EF4444"/>
  <text x="116" y="313" text-anchor="middle" class="b" font-weight="700" fill="#334155">N 对坐标 C (N×4)</text>
  <text x="116" y="331" text-anchor="middle" class="s" fill="#6B7280">行序随机 · 外点繁多</text>

  <!-- Arrow 1->2 -->
  <line x1="208" y1="218" x2="242" y2="218" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Level-1 Encode + DiffPool -->
  <rect x="248" y="94" width="204" height="248" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="350" y="122" text-anchor="middle" class="h" fill="#1E3A8A">② 浅层编码 + 软聚类</text>
  <rect x="266" y="140" width="168" height="62" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="350" y="165" text-anchor="middle" class="h" fill="#1D4ED8">浅层编码 → X₁</text>
  <text x="350" y="187" text-anchor="middle" class="s" fill="#475569">保留原始 N 点顺序</text>

  <line x1="350" y1="202" x2="350" y2="226" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <rect x="266" y="232" width="168" height="92" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.8"/>
  <text x="350" y="256" text-anchor="middle" class="h" fill="#1D4ED8">DiffPool 软池化</text>
  <rect x="280" y="268" width="28" height="22" rx="5" fill="#3B82F6"/>
  <text x="294" y="283" text-anchor="middle" class="mono" font-size="12" fill="#FFFFFF">C1</text>
  <rect x="314" y="268" width="28" height="22" rx="5" fill="#10B981"/>
  <text x="328" y="283" text-anchor="middle" class="mono" font-size="12" fill="#FFFFFF">C2</text>
  <rect x="348" y="268" width="28" height="22" rx="5" fill="#F97316"/>
  <text x="362" y="283" text-anchor="middle" class="mono" font-size="12" fill="#FFFFFF">C3</text>
  <text x="388" y="283" text-anchor="middle" class="b" fill="#64748B">…</text>
  <rect x="398" y="268" width="28" height="22" rx="5" fill="#8B5CF6"/>
  <text x="412" y="283" text-anchor="middle" class="mono" font-size="12" fill="#FFFFFF">CM</text>
  <text x="350" y="311" text-anchor="middle" class="s" fill="#475569">N 点 → M=500 规范顺序簇</text>

  <!-- Arrow 2->3 (Level-2 flow) -->
  <line x1="452" y1="278" x2="500" y2="278" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Level-2 OA Filtering + Order-Aware DiffUnpool -->
  <rect x="506" y="94" width="218" height="248" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="615" y="122" text-anchor="middle" class="h" fill="#166534">③ 全局交互 + 顺序还原</text>

  <rect x="524" y="140" width="182" height="72" rx="8" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.8"/>
  <text x="615" y="165" text-anchor="middle" class="h" fill="#C2410C">Order-Aware 反池化</text>
  <text x="615" y="186" text-anchor="middle" class="s" fill="#475569">借浅层 X₁ 找回原始顺序</text>
  <text x="615" y="203" text-anchor="middle" class="s" fill="#475569">M=500 簇精准还原回 N 点</text>

  <!-- Skip connection drawn on top so arrowhead cleanly lands on Order-Aware DiffUnpool -->
  <line x1="434" y1="174" x2="518" y2="174" stroke="#EA580C" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-orange)"/>
  <rect x="458" y="144" width="42" height="22" rx="6" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.2"/>
  <text x="479" y="159" text-anchor="middle" class="s" font-weight="700" fill="#C2410C">借 X₁</text>

  <line x1="615" y1="242" x2="615" y2="218" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <rect x="524" y="244" width="182" height="80" rx="8" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.8"/>
  <text x="615" y="269" text-anchor="middle" class="h" fill="#15803D">Order-Aware 空间滤波</text>
  <text x="615" y="291" text-anchor="middle" class="b" fill="#374151">500 个有序聚类直接对话</text>
  <text x="615" y="311" text-anchor="middle" class="s" fill="#6B7280">通道混合 ↔ 空间混合交替</text>

  <!-- Arrow 3->4 -->
  <line x1="724" y1="176" x2="762" y2="176" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Clean Matches + Essential Matrix -->
  <rect x="768" y="94" width="188" height="248" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="862" y="122" text-anchor="middle" class="h" fill="#5B21B6">④ 内点筛选与几何估计</text>
  <rect x="788" y="138" width="148" height="52" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="788" y="218" width="148" height="52" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <line x1="814" y1="164" x2="820" y2="244" stroke="#16A34A" stroke-width="2.4"/>
  <line x1="860" y1="158" x2="866" y2="240" stroke="#16A34A" stroke-width="2.4"/>
  <line x1="906" y1="170" x2="912" y2="250" stroke="#16A34A" stroke-width="2.4"/>
  <circle cx="814" cy="164" r="4.8" fill="#16A34A"/><circle cx="820" cy="244" r="4.8" fill="#16A34A"/>
  <circle cx="860" cy="158" r="4.8" fill="#16A34A"/><circle cx="866" cy="240" r="4.8" fill="#16A34A"/>
  <circle cx="906" cy="170" r="4.8" fill="#16A34A"/><circle cx="912" cy="250" r="4.8" fill="#16A34A"/>
  <line x1="832" y1="173" x2="842" y2="183" stroke="#EF4444" stroke-width="2"/>
  <line x1="842" y1="173" x2="832" y2="183" stroke="#EF4444" stroke-width="2"/>
  <line x1="882" y1="227" x2="892" y2="237" stroke="#EF4444" stroke-width="2"/>
  <line x1="892" y1="227" x2="882" y2="237" stroke="#EF4444" stroke-width="2"/>

  <rect x="784" y="286" width="156" height="44" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="862" y="305" text-anchor="middle" class="b" font-weight="700" fill="#5B21B6">可微加权八点法</text>
  <text x="862" y="322" text-anchor="middle" class="s" fill="#6D28D9">输出权重 w 与本质矩阵 Ê</text>

  <!-- Footer -->
  <rect x="36" y="358" width="908" height="36" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <text x="490" y="381" text-anchor="middle" class="b" fill="#475569">设计精髓：把乱序 N 点先压入固定 M=500 规范有序瓶颈做全局交互，再借浅层 X₁ 无损还原，支持任意变长 N！</text>
</svg>