<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="420" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：DiffPool 核心魔术——输入怎么打乱，聚类顺序稳如泰山</text>
  <text x="480" y="62" text-anchor="middle" class="sub">用 4 个匹配点软聚成 3 个固定槽位来直观演示：打乱行序后，分配矩阵会同步跟着排，相乘时恰好完全抵消</text>

  <!-- Left Top Card: Original Order -->
  <rect x="28" y="88" width="276" height="114" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="166" y="113" text-anchor="middle" class="h" fill="#1E3A8A">情况 A：原始输入顺序 X</text>
  <rect x="44" y="128" width="56" height="36" rx="7" fill="#2563EB"/>
  <text x="72" y="151" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c1</text>
  <rect x="108" y="128" width="56" height="36" rx="7" fill="#16A34A"/>
  <text x="136" y="151" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c2</text>
  <rect x="172" y="128" width="56" height="36" rx="7" fill="#EF4444"/>
  <text x="200" y="151" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c3</text>
  <rect x="236" y="128" width="56" height="36" rx="7" fill="#3B82F6"/>
  <text x="264" y="151" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c4</text>
  <text x="166" y="186" text-anchor="middle" class="s" fill="#475569">蓝=左移运动 · 绿=上移运动 · 红=误匹配</text>

  <!-- Left Bottom Card: Shuffled Order -->
  <rect x="28" y="220" width="276" height="114" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="166" y="245" text-anchor="middle" class="h" fill="#9A3412">情况 B：随机打乱输入 P·X</text>
  <rect x="44" y="260" width="56" height="36" rx="7" fill="#EF4444"/>
  <text x="72" y="283" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c3</text>
  <rect x="108" y="260" width="56" height="36" rx="7" fill="#2563EB"/>
  <text x="136" y="283" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c1</text>
  <rect x="172" y="260" width="56" height="36" rx="7" fill="#3B82F6"/>
  <text x="200" y="283" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c4</text>
  <rect x="236" y="260" width="56" height="36" rx="7" fill="#16A34A"/>
  <text x="264" y="283" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">c2</text>
  <text x="166" y="318" text-anchor="middle" class="s" fill="#9A3412">同一批点换了行号，物理意义完全不变</text>

  <!-- Middle Algebra Bridge -->
  <path d="M 304 145 L 366 145" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <path d="M 304 277 L 366 277" fill="none" stroke="#EA580C" stroke-width="2.4" marker-end="url(#arr-orange)"/>

  <rect x="372" y="106" width="212" height="210" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="478" y="132" text-anchor="middle" class="h" fill="#1E293B">DiffPool 矩阵相乘</text>

  <rect x="390" y="146" width="176" height="40" rx="8" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="478" y="171" text-anchor="middle" class="mono" font-size="13.5" fill="#1D4ED8">Sᵀ · X = X₂</text>

  <rect x="390" y="198" width="176" height="38" rx="19" fill="#FEF2F2" stroke="#F87171" stroke-width="1.6"/>
  <text x="478" y="222" text-anchor="middle" class="b" font-weight="700" fill="#B91C1C">Pᵀ · P = I 抵消打乱！</text>

  <rect x="390" y="248" width="176" height="50" rx="8" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.4"/>
  <text x="478" y="270" text-anchor="middle" class="mono" font-size="12.5" fill="#9A3412">(P·S)ᵀ · (P·X)</text>
  <text x="478" y="289" text-anchor="middle" class="mono" font-size="13" fill="#C2410C">= Sᵀ(PᵀP)X = X₂</text>

  <!-- Arrow from Middle to Right -->
  <line x1="584" y1="211" x2="634" y2="211" stroke="#16A34A" stroke-width="2.8" marker-end="url(#arr-green)"/>

  <!-- Right Card: Canonical Order Output -->
  <rect x="640" y="88" width="292" height="246" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2.2"/>
  <text x="786" y="114" text-anchor="middle" class="h" fill="#166534">输出完全一致的规范顺序 X₂</text>

  <!-- Slot 1 -->
  <rect x="660" y="132" width="252" height="54" rx="9" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <rect x="670" y="143" width="66" height="32" rx="6" fill="#2563EB"/>
  <text x="703" y="164" text-anchor="middle" class="b" font-weight="700" fill="#FFFFFF">槽位 1</text>
  <text x="748" y="156" class="b" font-weight="700" fill="#1E3A8A">聚合 c1 + c4</text>
  <text x="748" y="175" class="s" fill="#475569">固定负责“左移局部运动”</text>

  <!-- Slot 2 -->
  <rect x="660" y="198" width="252" height="54" rx="9" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.6"/>
  <rect x="670" y="209" width="66" height="32" rx="6" fill="#16A34A"/>
  <text x="703" y="230" text-anchor="middle" class="b" font-weight="700" fill="#FFFFFF">槽位 2</text>
  <text x="748" y="222" class="b" font-weight="700" fill="#166534">聚合 c2</text>
  <text x="748" y="241" class="s" fill="#475569">固定负责“上移局部运动”</text>

  <!-- Slot 3 -->
  <rect x="660" y="264" width="252" height="54" rx="9" fill="#FFFFFF" stroke="#F87171" stroke-width="1.6"/>
  <rect x="670" y="275" width="66" height="32" rx="6" fill="#EF4444"/>
  <text x="703" y="296" text-anchor="middle" class="b" font-weight="700" fill="#FFFFFF">槽位 3</text>
  <text x="748" y="288" class="b" font-weight="700" fill="#991B1B">聚合 c3</text>
  <text x="748" y="307" class="s" fill="#475569">固定负责“误匹配外点簇”</text>

  <!-- Bottom Callout -->
  <rect x="28" y="352" width="904" height="50" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="480" y="374" text-anchor="middle" class="b" font-weight="700" fill="#9A3412">一石二鸟：① 相似运动的点软聚在一起，自动捕获局部上下文；</text>
  <text x="480" y="394" text-anchor="middle" class="b" fill="#9A3412">② 无论输入怎么乱序，输出永远按“规范顺序”对号入座，让后续跨聚类空间滤波成为可能！</text>
</svg>