<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 415" width="980" height="415">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="415" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title" fill="#111827">图 3：DKD 局部可微检测——NMS 画框 + Softargmax 算质心</text>
  <text x="490" y="62" text-anchor="middle" class="sub" fill="#4B5563">用具体 3×3 局部窗口数值看懂：右邻高分 0.78 把点位自然往右拉了 +0.30 像素，且梯度畅通无阻</text>

  <!-- Step 1 Card -->
  <rect x="20" y="88" width="252" height="248" rx="12" fill="#FFF7ED" stroke="#FB923C" stroke-width="2"/>
  <text x="146" y="114" text-anchor="middle" class="h" fill="#9A3412">① NMS 锁定局部窗口 S</text>
  <text x="99.0" y="140" text-anchor="middle" class="s" fill="#7C2D12" font-weight="700">i=-1</text>
  <text x="159.0" y="140" text-anchor="middle" class="s" fill="#7C2D12" font-weight="700">i=0</text>
  <text x="219.0" y="140" text-anchor="middle" class="s" fill="#7C2D12" font-weight="700">i=+1</text>
  <text x="64" y="174" text-anchor="end" class="s" fill="#7C2D12" font-weight="700">j=-1</text>
  <rect x="72" y="148" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="99.0" y="174" text-anchor="middle" class="mono" font-size="13.5" fill="#64748B">0.30</text>
  <rect x="132" y="148" width="54" height="42" rx="6" fill="#FFEDD5" stroke="#FB923C" stroke-width="1.4"/>
  <text x="159.0" y="174" text-anchor="middle" class="mono" font-size="13.5" fill="#9A3412">0.58</text>
  <rect x="192" y="148" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="219.0" y="174" text-anchor="middle" class="mono" font-size="13.5" fill="#64748B">0.42</text>
  <text x="64" y="222" text-anchor="end" class="s" fill="#7C2D12" font-weight="700">j=0</text>
  <rect x="72" y="196" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="99.0" y="222" text-anchor="middle" class="mono" font-size="13.5" fill="#64748B">0.45</text>
  <rect x="132" y="196" width="54" height="42" rx="6" fill="#EA580C" stroke="#C2410C" stroke-width="1.4"/>
  <text x="159.0" y="222" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.85</text>
  <rect x="192" y="196" width="54" height="42" rx="6" fill="#FDBA74" stroke="#EA580C" stroke-width="1.4"/>
  <text x="219.0" y="222" text-anchor="middle" class="mono" font-size="13.5" fill="#7C2D12">0.78</text>
  <text x="64" y="270" text-anchor="end" class="s" fill="#7C2D12" font-weight="700">j=+1</text>
  <rect x="72" y="244" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="99.0" y="270" text-anchor="middle" class="mono" font-size="13.5" fill="#64748B">0.28</text>
  <rect x="132" y="244" width="54" height="42" rx="6" fill="#FFEDD5" stroke="#FB923C" stroke-width="1.4"/>
  <text x="159.0" y="270" text-anchor="middle" class="mono" font-size="13.5" fill="#9A3412">0.63</text>
  <rect x="192" y="244" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="219.0" y="270" text-anchor="middle" class="mono" font-size="13.5" fill="#64748B">0.52</text>
  <text x="146" y="310" text-anchor="middle" class="s" fill="#B91C1C" font-weight="700">传统 NMS 死卡中心 (0, 0)</text>
  <text x="146" y="327" text-anchor="middle" class="s" fill="#9A3412">忽略右邻 0.78 · 不可导 ✗</text>

  <!-- Arrow 1->2 -->
  <line x1="278" y1="212" x2="342" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="310" y="196" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">Softmax</text>
  <text x="310" y="234" text-anchor="middle" class="s" fill="#1D4ED8">t = 0.1</text>

  <!-- Step 2 Card -->
  <rect x="352" y="88" width="236" height="248" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="470" y="114" text-anchor="middle" class="h" fill="#1E3A8A">② 局部概率权重 s'（可微）</text>
  <text x="410.0" y="140" text-anchor="middle" class="s" fill="#1E3A8A" font-weight="700">i=-1</text>
  <text x="470.0" y="140" text-anchor="middle" class="s" fill="#1E3A8A" font-weight="700">i=0</text>
  <text x="530.0" y="140" text-anchor="middle" class="s" fill="#1E3A8A" font-weight="700">i=+1</text>
  <rect x="383" y="148" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="410.0" y="174" text-anchor="middle" class="mono" font-size="13.5" fill="#94A3B8">0.00</text>
  <rect x="443" y="148" width="54" height="42" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="470.0" y="174" text-anchor="middle" class="mono" font-size="13.5" fill="#1E3A8A">0.04</text>
  <rect x="503" y="148" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="530.0" y="174" text-anchor="middle" class="mono" font-size="13.5" fill="#94A3B8">0.01</text>
  <rect x="383" y="196" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="410.0" y="222" text-anchor="middle" class="mono" font-size="13.5" fill="#94A3B8">0.01</text>
  <rect x="443" y="196" width="54" height="42" rx="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="470.0" y="222" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.57</text>
  <rect x="503" y="196" width="54" height="42" rx="6" fill="#60A5FA" stroke="#2563EB" stroke-width="1.4"/>
  <text x="530.0" y="222" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.28</text>
  <rect x="383" y="244" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="410.0" y="270" text-anchor="middle" class="mono" font-size="13.5" fill="#94A3B8">0.00</text>
  <rect x="443" y="244" width="54" height="42" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.4"/>
  <text x="470.0" y="270" text-anchor="middle" class="mono" font-size="13.5" fill="#1E3A8A">0.06</text>
  <rect x="503" y="244" width="54" height="42" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4"/>
  <text x="530.0" y="270" text-anchor="middle" class="mono" font-size="13.5" fill="#94A3B8">0.02</text>
  <text x="470" y="310" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">总和为 1 · 高分拿大权重</text>
  <text x="470" y="327" text-anchor="middle" class="s" fill="#1E3A8A">中心 57% + 右邻 28% + 下邻 6%</text>

  <!-- Arrow 2->3 -->
  <line x1="594" y1="212" x2="660" y2="212" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="627" y="196" text-anchor="middle" class="s" fill="#15803D" font-weight="700">加权求质心</text>
  <text x="627" y="234" text-anchor="middle" class="s" fill="#15803D">Softargmax</text>

  <!-- Step 3 Card: Subpixel centroid visual -->
  <rect x="670" y="88" width="290" height="248" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="815" y="114" text-anchor="middle" class="h" fill="#166534">③ 亚像素坐标 + 梯度直通</text>

  <!-- Magnified 3x3 pixel grid: x=694..936 (w=242), y=130..268 (h=138, 3 rows of 46) -->
  <rect x="694" y="130" width="242" height="138" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
  <line x1="775" y1="130" x2="775" y2="268" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="855" y1="130" x2="855" y2="268" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="694" y1="176" x2="936" y2="176" stroke="#E2E8F0" stroke-width="1.2"/>
  <line x1="694" y1="222" x2="936" y2="222" stroke="#E2E8F0" stroke-width="1.2"/>

  <!-- Clean top labels inside top row cells (y=130..176, zero line collisions!) -->
  <text x="734" y="150" text-anchor="middle" class="s" fill="#64748B">整数中心</text>
  <text x="734" y="167" text-anchor="middle" class="mono" font-size="12" fill="#64748B">(120, 80)</text>

  <text x="862" y="150" text-anchor="middle" class="s" fill="#EA580C" font-weight="700">亚像素偏移</text>
  <text x="862" y="167" text-anchor="middle" class="mono" font-size="12" fill="#C2410C">(+0.30, +0.04)</text>

  <!-- Integer NMS center cross at (815, 199) in middle cell -->
  <line x1="807" y1="199" x2="823" y2="199" stroke="#94A3B8" stroke-width="2.2"/>
  <line x1="815" y1="191" x2="815" y2="207" stroke="#94A3B8" stroke-width="2.2"/>

  <!-- Shift arrow to subpixel point -> (854, 206) -->
  <line x1="821" y1="200" x2="844" y2="204" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <circle cx="854" cy="206" r="7.5" fill="#EA580C" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Final subpixel coordinate neatly centered in bottom row (y=222..268) -->
  <text x="815" y="250" text-anchor="middle" class="mono" font-size="13" fill="#C2410C">最终落点：(120.30, 80.04)</text>

  <!-- Result notes -->
  <text x="815" y="291" text-anchor="middle" class="b" fill="#166534" font-weight="700">反向传播梯度 ∂L / ∂p 直通！</text>
  <text x="815" y="311" text-anchor="middle" class="s" fill="#14532D">自动抬高正确方向像素分、压低偏离像素分</text>
  <text x="815" y="328" text-anchor="middle" class="s" fill="#15803D">动态以极大值为中心，无固定网格边界伪影</text>

  <!-- Bottom crisp callout -->
  <rect x="20" y="352" width="940" height="44" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="490" y="379" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">为什么叫“局部可微”？  p = p_NMS（只负责画框，无梯度） + Δp_soft（窗口内平滑可导）→ 几何重投影误差可直接雕刻分数图！</text>
</svg>
