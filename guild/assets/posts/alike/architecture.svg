<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 405" width="980" height="405">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="405" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title" fill="#111827">图 1：ALIKE 整体工作流程（宏观全景）</text>
  <text x="490" y="62" text-anchor="middle" class="sub" fill="#4B5563">轻量多尺度编码 → 原图分辨率融合输出分数图与描述子图 → DKD 亚像素可微提取（95 FPS）</text>

  <!-- Stage 1: Lightweight Multi-scale Encoder -->
  <rect x="24" y="92" width="210" height="252" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="129" y="120" text-anchor="middle" class="h" fill="#1E293B">① 轻量多尺度编码器</text>

  <!-- Mini RGB Image -->
  <rect x="44" y="136" width="170" height="68" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="129" y="156" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">输入 RGB 图像</text>
  <rect x="66" y="172" width="26" height="24" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.2"/>
  <polygon points="104,196 126,166 148,196" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.2"/>
  <rect x="158" y="176" width="32" height="20" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.2"/>

  <!-- 4 shrinking pyramid bars -->
  <line x1="129" y1="204" x2="129" y2="220" stroke="#64748B" stroke-width="2" marker-end="url(#arr-gray)"/>
  <rect x="44" y="226" width="170" height="20" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="129" y="240" text-anchor="middle" class="s" fill="#1E3A8A" font-weight="700">Block 1（原图 1×）</text>

  <rect x="62" y="252" width="134" height="18" rx="4" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.2"/>
  <text x="129" y="265" text-anchor="middle" class="s" fill="#1E3A8A">Block 2（1/2）</text>

  <rect x="82" y="276" width="94" height="18" rx="4" fill="#93C5FD" stroke="#2563EB" stroke-width="1.2"/>
  <text x="129" y="289" text-anchor="middle" class="s" fill="#1E3A8A">Block 3（1/8）</text>

  <rect x="98" y="300" width="62" height="18" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="129" y="313" text-anchor="middle" class="s" fill="#FFFFFF" font-weight="700">1/32</text>
  <text x="129" y="335" text-anchor="middle" class="s" fill="#64748B">快速扩出大感受野</text>

  <!-- Arrow 1->2 -->
  <line x1="234" y1="218" x2="266" y2="218" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Full-Res Aggregation & Head -->
  <rect x="272" y="92" width="224" height="252" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="384" y="120" text-anchor="middle" class="h" fill="#1E3A8A">② 全分辨率聚合与输出头</text>

  <rect x="292" y="138" width="184" height="52" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="384" y="160" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">4 尺度 1×1 卷积 + 上采样</text>
  <text x="384" y="180" text-anchor="middle" class="s" fill="#64748B">全部对齐回原图尺寸并拼接</text>

  <line x1="384" y1="190" x2="384" y2="212" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Split into Score Map S & Descriptor Map D -->
  <rect x="292" y="218" width="184" height="48" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="384" y="239" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">稠密分数图 S（Sigmoid）</text>
  <text x="384" y="257" text-anchor="middle" class="s" fill="#9A3412">每像素打分 0 ~ 1</text>

  <rect x="292" y="276" width="184" height="48" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.6"/>
  <text x="384" y="297" text-anchor="middle" class="b" fill="#15803D" font-weight="700">稠密描述子图 D（L2 归一）</text>
  <text x="384" y="315" text-anchor="middle" class="s" fill="#166534">每像素单位特征向量</text>

  <!-- Arrow 2->3 -->
  <line x1="496" y1="242" x2="530" y2="242" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <path d="M 496 300 L 732 300 L 732 252 L 760 252" fill="none" stroke="#16A34A" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>

  <!-- Stage 3: DKD -->
  <rect x="536" y="92" width="188" height="190" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="630" y="120" text-anchor="middle" class="h" fill="#9A3412">③ DKD 可微检测</text>

  <rect x="554" y="138" width="152" height="48" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="630" y="159" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">局部 NMS 画框</text>
  <text x="630" y="177" text-anchor="middle" class="s" fill="#64748B">锁定整像素候选中心</text>

  <line x1="630" y1="186" x2="630" y2="206" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-orange)"/>

  <rect x="554" y="212" width="152" height="52" rx="8" fill="#FFFFFF" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="630" y="233" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">窗口 Softargmax</text>
  <text x="630" y="253" text-anchor="middle" class="s" fill="#64748B">求亚像素质心 · 梯度直通</text>

  <!-- Gradient feedback hint under stage 3 -->
  <text x="630" y="328" text-anchor="middle" class="s" fill="#15803D" font-weight="700">按亚像素坐标直接双线性采样 D</text>

  <!-- Arrow 3->4 -->
  <line x1="724" y1="186" x2="760" y2="186" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- Stage 4: Output -->
  <rect x="766" y="92" width="190" height="252" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="861" y="120" text-anchor="middle" class="h" fill="#5B21B6">④ 输出精准局部特征</text>

  <!-- Output mini image with crisp keypoints -->
  <rect x="786" y="138" width="150" height="106" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <rect x="804" y="184" width="28" height="44" fill="#F3E8FF" stroke="#A78BFA" stroke-width="1.2"/>
  <polygon points="844,228 872,172 900,228" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2"/>
  <rect x="902" y="196" width="20" height="32" fill="#F3E8FF" stroke="#A78BFA" stroke-width="1.2"/>
  <circle cx="804" cy="184" r="5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="832" cy="184" r="5" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="872" cy="172" r="5.5" fill="#16A34A" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="900" cy="228" r="5" fill="#7C3AED" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="922" cy="196" r="5" fill="#EA580C" stroke="#FFFFFF" stroke-width="1.5"/>
  <text x="861" y="158" text-anchor="middle" class="s" fill="#5B21B6" font-weight="700">角点严丝合缝（亚像素）</text>

  <rect x="786" y="256" width="150" height="72" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.4"/>
  <text x="861" y="278" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">亚像素坐标 p_k</text>
  <text x="861" y="298" text-anchor="middle" class="b" fill="#15803D" font-weight="700">+ 采样描述子 d_k</text>
  <text x="861" y="318" text-anchor="middle" class="s" fill="#64748B">ALIKE-N 达 95.19 FPS</text>

  <!-- Bottom crisp takeaway -->
  <text x="490" y="380" text-anchor="middle" class="s" fill="#64748B">端到端免伪标签训练：重投影损失 L_rp + 离散峰值 L_pk + 稠密 NRE 损失 L_de + 可靠度 L_rl 联合优化</text>
</svg>
