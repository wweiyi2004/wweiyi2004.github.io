<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="392" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title" fill="#111827">图 2：为什么 ALIKE 既保住原图精度，又能跑出 95 FPS？</text>
  <text x="480" y="62" text-anchor="middle" class="sub" fill="#4B5563">对比前代两种路线：低分辨率伤精度、全程原图烧算力；ALIKE 用“快速降采样 + 轻量上采样”两头兼得</text>

  <!-- Left Panel: Two Pitfalls -->
  <rect x="24" y="88" width="424" height="276" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="236" y="116" text-anchor="middle" class="h" fill="#991B1B">✗ 前代方法的两难妥协</text>

  <!-- Pitfall 1: Low-res -->
  <rect x="42" y="134" width="388" height="102" rx="9" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <text x="58" y="158" class="h" fill="#B91C1C">路线 A：低分辨率输出（SuperPoint / D2-Net）</text>
  <rect x="58" y="172" width="66" height="44" rx="5" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.4"/>
  <text x="91" y="198" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">原图 1×</text>
  <line x1="128" y1="194" x2="162" y2="194" stroke="#EF4444" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="168" y="182" width="36" height="24" rx="4" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="186" y="198" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">1/8</text>
  <text x="220" y="189" class="b" fill="#7F1D1D" font-weight="700">省算力，但空间糊了</text>
  <text x="220" y="211" class="s" fill="#991B1B">1/8 图上提特征，定位先天折损</text>

  <!-- Pitfall 2: Full-res heavy -->
  <rect x="42" y="248" width="388" height="102" rx="9" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <text x="58" y="272" class="h" fill="#B91C1C">路线 B：全程原图硬扛（R2D2 空洞卷积）</text>
  <!-- Clean 3 equal full-res blocks with labels inside -->
  <rect x="58" y="286" width="42" height="36" rx="5" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="79" y="309" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">1×</text>
  <rect x="108" y="286" width="42" height="36" rx="5" fill="#FECACA" stroke="#EF4444" stroke-width="1.4"/>
  <text x="129" y="309" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">1×</text>
  <rect x="158" y="286" width="42" height="36" rx="5" fill="#FCA5A5" stroke="#DC2626" stroke-width="1.4"/>
  <text x="179" y="309" text-anchor="middle" class="s" fill="#7F1D1D" font-weight="700">1×</text>
  <text x="129" y="339" text-anchor="middle" class="s" fill="#B91C1C">全程大图跑 3×3 卷积</text>

  <text x="220" y="303" class="b" fill="#7F1D1D" font-weight="700">参数少却极慢（8.7 FPS）</text>
  <text x="220" y="325" class="s" fill="#991B1B">计算量飙至 464.5 GFLOPs</text>

  <!-- Right Panel: ALIKE Solution -->
  <rect x="472" y="88" width="464" height="276" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="704" y="116" text-anchor="middle" class="h" fill="#166534">✓ ALIKE：快速降采样扩视野 + 1×1 轻量回原图</text>

  <!-- Visual funnel + merge -->
  <rect x="490" y="134" width="428" height="148" rx="9" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>

  <!-- Left 4 bars (encoder scales) -->
  <rect x="508" y="150" width="96" height="22" rx="4" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="556" y="165" text-anchor="middle" class="s" fill="#1E3A8A" font-weight="700">1× 精细角点</text>

  <rect x="522" y="180" width="68" height="20" rx="4" fill="#BFDBFE" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="556" y="194" text-anchor="middle" class="s" fill="#1E3A8A">1/2 降采样</text>

  <rect x="530" y="208" width="52" height="20" rx="4" fill="#93C5FD" stroke="#2563EB" stroke-width="1.3"/>
  <text x="556" y="222" text-anchor="middle" class="s" fill="#1E3A8A" font-weight="700">1/8</text>

  <rect x="536" y="236" width="40" height="20" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.3"/>
  <text x="556" y="250" text-anchor="middle" class="s" fill="#FFFFFF" font-weight="700">1/32</text>

  <!-- Converging arrows to 1x1 + Upsample -->
  <line x1="608" y1="161" x2="660" y2="195" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="594" y1="190" x2="660" y2="202" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="586" y1="218" x2="660" y2="210" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="580" y1="246" x2="660" y2="218" stroke="#3B82F6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Merge box -->
  <rect x="666" y="176" width="116" height="62" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.6"/>
  <text x="724" y="200" text-anchor="middle" class="b" fill="#166534" font-weight="700">1×1 改通道</text>
  <text x="724" y="221" text-anchor="middle" class="s" fill="#15803D">双线性上采样拼接</text>

  <line x1="782" y1="207" x2="808" y2="207" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <!-- Full-res output -->
  <rect x="814" y="156" width="88" height="102" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="858" y="180" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">原图 1×</text>
  <text x="858" y="203" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">分数图 S</text>
  <text x="858" y="222" text-anchor="middle" class="s" fill="#15803D" font-weight="700">描述子图 D</text>
  <text x="858" y="245" text-anchor="middle" class="s" fill="#64748B">仅用 1×1 卷积</text>

  <!-- Highlight badges at bottom right -->
  <rect x="490" y="294" width="206" height="56" rx="8" fill="#DCFCE7" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="593" y="317" text-anchor="middle" class="h" fill="#166534">感受野达 204 × 204</text>
  <text x="593" y="338" text-anchor="middle" class="s" fill="#14532D">重卷积全放在 1/8、1/32 小图上</text>

  <rect x="712" y="294" width="206" height="56" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="815" y="317" text-anchor="middle" class="h" fill="#92400E">7.9 GFLOPs · 95.2 FPS</text>
  <text x="815" y="338" text-anchor="middle" class="s" fill="#B45309">比 R2D2 省 58 倍算力！</text>
</svg>
