<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" width="960" height="410">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="410" fill="#FFFFFF" rx="12"/>

  <text x="480" y="36" text-anchor="middle" class="title">图 2：Linear Attention 如何把 O(N²) 降成 O(N)？</text>
  <text x="480" y="60" text-anchor="middle" class="sub">用可拆分核 φ(x) = elu(x) + 1 替换 Softmax，把矩阵乘法括号向右挪一步，彻底绕开巨型 N×N 矩阵</text>

  <!-- Left Panel: Standard Dot-Product Attention (NO) -->
  <rect x="26" y="84" width="442" height="298" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="247" y="114" text-anchor="middle" class="h" fill="#991B1B">✗ 标准点积注意力：先算 QKᵀ，显存爆炸 O(N²D)</text>

  <!-- Step 1a: Q (N x D) * K^T (D x N) -->
  <rect x="46" y="142" width="32" height="86" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="62" y="190" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">Q</text>
  <text x="62" y="246" text-anchor="middle" class="s" fill="#1E40AF">N×D</text>

  <text x="92" y="191" text-anchor="middle" class="h" fill="#475569">×</text>

  <rect x="106" y="170" width="74" height="30" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="143" y="190" text-anchor="middle" class="b" fill="#15803D" font-weight="700">Kᵀ</text>
  <text x="143" y="218" text-anchor="middle" class="s" fill="#166534">D×N</text>

  <line x1="186" y1="185" x2="210" y2="185" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr-red)"/>

  <!-- Giant N x N red matrix -->
  <rect x="216" y="132" width="114" height="114" rx="8" fill="#FEE2E2" stroke="#DC2626" stroke-width="2.2"/>
  <text x="273" y="164" text-anchor="middle" class="h" fill="#991B1B">N × N</text>
  <text x="273" y="188" text-anchor="middle" class="mono" font-size="12.5" fill="#DC2626">4800×4800</text>
  <text x="273" y="210" text-anchor="middle" class="s" fill="#B91C1C" font-weight="700">2304 万格！</text>
  <text x="273" y="232" text-anchor="middle" class="s" fill="#991B1B">被 Softmax 锁死</text>

  <text x="345" y="191" text-anchor="middle" class="h" fill="#475569">×</text>

  <rect x="360" y="142" width="32" height="86" rx="5" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.8"/>
  <text x="376" y="190" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">V</text>
  <text x="376" y="246" text-anchor="middle" class="s" fill="#9A3412">N×D</text>

  <text x="406" y="191" text-anchor="middle" class="h" fill="#475569">=</text>

  <rect x="420" y="142" width="32" height="86" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="436" y="190" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">O</text>
  <text x="436" y="246" text-anchor="middle" class="s" fill="#5B21B6">N×D</text>

  <!-- Formula & takeaways left -->
  <rect x="46" y="268" width="402" height="96" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="247" y="294" text-anchor="middle" class="mono" font-size="13.5" fill="#B91C1C">softmax( Q · Kᵀ ) · V  ← 括号被锁死在左边</text>
  <text x="64" y="322" class="b" fill="#7F1D1D">• 必须先把 4800×4800 矩阵全算完，才能逐行做 Softmax</text>
  <text x="64" y="346" class="b" fill="#7F1D1D">• 图像变大时显存按四次方暴涨，半稠密匹配直接 OOM</text>

  <!-- Right Panel: Linear Attention (YES) -->
  <rect x="492" y="84" width="442" height="298" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="713" y="114" text-anchor="middle" class="h" fill="#166534">✓ 线性注意力：换括号先算 φ(K)ᵀV，仅需 O(ND²)</text>

  <!-- phi(Q) (N x D) -->
  <rect x="514" y="142" width="46" height="86" rx="5" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <text x="537" y="190" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">φ(Q)</text>
  <text x="537" y="246" text-anchor="middle" class="s" fill="#1E40AF">N×D</text>

  <text x="574" y="191" text-anchor="middle" class="h" fill="#475569">×</text>

  <!-- Dashed green group for (phi(K)^T * V) -->
  <rect x="588" y="130" width="246" height="122" rx="10" fill="#FFFFFF" stroke="#16A34A" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="711" y="150" text-anchor="middle" class="s" fill="#15803D" font-weight="700">先算右括号：浓缩成极小方阵</text>

  <rect x="602" y="176" width="66" height="28" rx="5" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.6"/>
  <text x="635" y="195" text-anchor="middle" class="s" fill="#15803D" font-weight="700">φ(K)ᵀ</text>

  <text x="680" y="195" text-anchor="middle" class="h" fill="#16A34A">×</text>

  <rect x="692" y="158" width="28" height="66" rx="5" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.6"/>
  <text x="706" y="196" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">V</text>

  <line x1="726" y1="190" x2="750" y2="190" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <!-- Tiny D x D green square with bright white text -->
  <rect x="758" y="166" width="58" height="48" rx="6" fill="#16A34A" stroke="#15803D" stroke-width="1.8"/>
  <text x="787" y="187" text-anchor="middle" class="b" fill="#FFFFFF" font-weight="700">D×D</text>
  <text x="787" y="205" text-anchor="middle" class="mono" font-size="12" fill="#DCFCE7">32×32</text>
  <text x="787" y="236" text-anchor="middle" class="s" fill="#166534" font-weight="700">仅 1024 格！</text>

  <text x="852" y="191" text-anchor="middle" class="h" fill="#475569">=</text>

  <rect x="870" y="142" width="38" height="86" rx="5" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="889" y="190" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">O</text>
  <text x="889" y="246" text-anchor="middle" class="s" fill="#5B21B6">N×D</text>

  <!-- Formula & takeaways right -->
  <rect x="512" y="268" width="402" height="96" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="713" y="294" text-anchor="middle" class="mono" font-size="13.5" fill="#15803D">φ(Q) · ( φ(K)ᵀ · V )  ← 结合律解锁！</text>
  <text x="530" y="322" class="b" fill="#14532D">• 先把整张图的 Key/Value 提炼成 D×D“全局内容提要表”</text>
  <text x="530" y="346" class="b" fill="#14532D">• 每个查询点按需查表，显存缩小上万倍（因为 D ≪ N）</text>
</svg>