  <rect x="635" y="220" width="22" height="22" rx="4" fill="#16A34A" stroke="#86EFAC" stroke-width="1"/>
  <rect x="661" y="220" width="22" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="583" y="246" width="22" height="22" rx="4" fill="#FED7AA" stroke="#86EFAC" stroke-width="1"/>
  <rect x="609" y="246" width="22" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="635" y="246" width="22" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="661" y="246" width="22" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="633" y="292" text-anchor="middle" class="b" fill="#166534" font-weight="700">Dual-Softmax / OT</text>
  <text x="633" y="314" text-anchor="middle" class="s" fill="#4B5563">算全局置信度矩阵 P_c</text>
  <rect x="565" y="328" width="136" height="28" rx="14" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.4"/>
  <text x="633" y="346" text-anchor="middle" class="s" fill="#15803D" font-weight="700">≥ 0.2 + 互近邻筛选</text>

  <!-- Arrow 3->4 -->
  <line x1="716" y1="244" x2="754" y2="244" stroke="#16A34A" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <text x="735" y="232" text-anchor="middle" class="s" fill="#15803D" font-weight="700">M_c</text>

  <!-- Stage 4: Coarse-to-Fine Sub-pixel Refinement -->
  <rect x="760" y="118" width="194" height="252" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="857" y="146" text-anchor="middle" class="h" fill="#5B21B6">④ 5×5 亚像素精修</text>
  <rect x="801" y="162" width="20" height="20" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
  <rect x="824" y="162" width="20" height="20" rx="3" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1"/>
