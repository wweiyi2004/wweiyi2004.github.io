<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="420" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">图 1：LoFTR 整体工作流程（宏观全景）</text>
  <text x="490" y="60" text-anchor="middle" class="sub">彻底抛弃关键点检测器：双尺度 CNN 提特征 → 粗级全局注意力 → 可微粗匹配 → 5×5 窗口亚像素精修</text>

  <!-- Top Skip Connection: 1/2 Fine Features directly from Stage 1 (center 118) to Stage 4 (center 857) -->
  <path d="M 118 118 L 118 90 L 857 90 L 857 114" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <rect x="348" y="76" width="284" height="26" rx="13" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="490" y="94" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">1/2 精级特征直通支路（留给阶段 ④ 精修用）</text>

  <!-- Stage 1: Dual-scale CNN -->
  <rect x="26" y="118" width="184" height="252" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="118" y="144" text-anchor="middle" class="h" fill="#1E293B">① 双尺度 CNN</text>
  <text x="118" y="164" text-anchor="middle" class="s" fill="#6B7280">ResNet-18 + FPN</text>

  <!-- Mini Image A -->
  <rect x="48" y="178" width="140" height="42" rx="6" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <!-- Mini Image B -->
  <rect x="48" y="266" width="140" height="42" rx="6" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <line x1="76" y1="178" x2="76" y2="220" stroke="#93C5FD" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="104" y1="178" x2="104" y2="220" stroke="#93C5FD" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="132" y1="178" x2="132" y2="220" stroke="#93C5FD" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="160" y1="178" x2="160" y2="220" stroke="#93C5FD" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="48" y1="192" x2="188" y2="192" stroke="#93C5FD" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="48" y1="206" x2="188" y2="206" stroke="#93C5FD" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="76" y1="266" x2="76" y2="308" stroke="#86EFAC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="104" y1="266" x2="104" y2="308" stroke="#86EFAC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="132" y1="266" x2="132" y2="308" stroke="#86EFAC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="160" y1="266" x2="160" y2="308" stroke="#86EFAC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="48" y1="280" x2="188" y2="280" stroke="#86EFAC" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="48" y1="294" x2="188" y2="294" stroke="#86EFAC" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="118" y="204" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">图 A（稠密网格）</text>
  <text x="118" y="247" text-anchor="middle" class="s" fill="#475569">无检测器 · 共享权重</text>
  <text x="118" y="292" text-anchor="middle" class="b" fill="#15803D" font-weight="700">图 B（稠密网格）</text>
  <text x="118" y="336" text-anchor="middle" class="b" fill="#1E293B" font-weight="700">输出双尺度特征</text>
  <text x="118" y="356" text-anchor="middle" class="s" fill="#64748B">1/8 粗特征 + 1/2 精特征</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="244" x2="248" y2="244" stroke="#64748B" stroke-width="2.4" marker-end="url(#arr-gray)"/>
  <text x="230" y="232" text-anchor="middle" class="s" fill="#475569" font-weight="700">1/8</text>

  <!-- Stage 2: Coarse LoFTR Module -->
  <rect x="254" y="118" width="252" height="252" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="380" y="144" text-anchor="middle" class="h" fill="#1E3A8A">② 粗级 LoFTR（N_c = 4）</text>
  <text x="380" y="164" text-anchor="middle" class="s" fill="#1D4ED8">展平 + 2D 位置编码（仅加 1 次）</text>

  <rect x="272" y="178" width="216" height="54" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="380" y="200" text-anchor="middle" class="h" fill="#1D4ED8">图内 Self-Attention</text>
  <text x="380" y="220" text-anchor="middle" class="s" fill="#4B5563">让白墙像素看清全局周边地标</text>

  <line x1="380" y1="232" x2="380" y2="250" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="272" y="255" width="216" height="54" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="380" y="277" text-anchor="middle" class="h" fill="#047857">跨图 Cross-Attention</text>
  <text x="380" y="297" text-anchor="middle" class="s" fill="#4B5563">双视角互相通信、对齐全局结构</text>

  <rect x="267" y="324" width="226" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="380" y="345" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">Linear Attention：O(N²) → O(N)</text>

  <!-- Arrow 2->3 -->
  <line x1="506" y1="244" x2="544" y2="244" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Differentiable Coarse Matching -->
  <rect x="550" y="118" width="166" height="252" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="633" y="146" text-anchor="middle" class="h" fill="#166534">③ 可微粗匹配</text>
  <rect x="583" y="168" width="22" height="22" rx="4" fill="#16A34A" stroke="#86EFAC" stroke-width="1"/>
  <rect x="609" y="168" width="22" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="635" y="168" width="22" height="22" rx="4" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
