  <!-- Sub-pixel red crosshair near cell (3,3) -->
  <circle cx="878" cy="238" r="5" fill="#EF4444" stroke="#FFFFFF" stroke-width="1.8"/>
  <line x1="868" y1="238" x2="888" y2="238" stroke="#EF4444" stroke-width="1.6"/>
  <line x1="878" y1="228" x2="878" y2="248" stroke="#EF4444" stroke-width="1.6"/>

  <text x="857" y="294" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">窗口精修 + 2D 期望</text>
  <text x="857" y="315" text-anchor="middle" class="s" fill="#4B5563">固定左图中心 · 精修右图点</text>
  <rect x="778" y="328" width="158" height="28" rx="14" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.4"/>
  <text x="857" y="346" text-anchor="middle" class="s" fill="#6D28D9" font-weight="700">输出亚像素匹配 M_f</text>

  <text x="490" y="400" text-anchor="middle" class="s" fill="#6B7280">核心分工：低分辨率 1/8 靠全局注意力建立弱纹理共识，高分辨率 1/2 靠 5×5 局部窗口把误差压到亚像素</text>
