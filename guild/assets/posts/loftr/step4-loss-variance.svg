  <text x="480" y="36" text-anchor="middle" class="title">图 5：精级损失为何按 1/σ² 加权，且必须截断 σ² 梯度？</text>
  <text x="480" y="60" text-anchor="middle" class="sub">热力图总方差 σ² 刻画模型把握程度；截断反向传播梯度防止网络“把热力图摊成大饼”来作弊</text>

  <!-- Left Panel: Uncertainty Weighting -->
  <rect x="26" y="84" width="440" height="276" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="246" y="114" text-anchor="middle" class="h" fill="#1E3A8A">① 1/σ² 加权：清晰角点重权，模糊白墙轻权</text>

