  <text x="356" y="273" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">σ² 很大 → 低权重</text>

  <text x="246" y="316" text-anchor="middle" class="b" fill="#1E3A8A">• 避免模糊区域带偏精修头，让清晰特征主导精准收敛</text>
  <text x="246" y="339" text-anchor="middle" class="s" fill="#475569">• 另：真值投影落出 5×5 窗口外的粗匹配直接忽略，不回传脏梯度</text>

  <!-- Right Panel: Why stop_gradient / detach -->
  <rect x="494" y="84" width="440" height="276" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="714" y="114" text-anchor="middle" class="h" fill="#1E293B">② 关键避坑：为什么 σ² 必须 detach() 截断梯度？</text>

  <!-- Formula pill -->
  <rect x="534" y="130" width="360" height="38" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6"/>
  <text x="714" y="154" text-anchor="middle" class="mono" font-size="14" fill="#0F172A">L_f = ( 1 / σ² ) × || ĵ' − ĵ'_gt ||₂</text>

  <!-- BAD case -->
  <rect x="516" y="182" width="396" height="76" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.8"/>
  <text x="534" y="206" class="h" fill="#991B1B">✗ 若不截断梯度：模型发现“摆烂捷径”</text>
  <text x="534" y="229" class="b" fill="#7F1D1D">故意把热力图摊成均匀大饼 → σ² 无限变大 → 1/σ² → 0</text>
  <text x="534" y="249" class="s" fill="#B91C1C">坐标完全没学准，损失 L_f 却作弊坍缩为 0！</text>

  <!-- GOOD case -->
  <rect x="516" y="270" width="396" height="76" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8"/>
  <text x="534" y="294" class="h" fill="#166534">✓ 截断 σ² 梯度（stop_gradient）</text>
  <text x="534" y="317" class="b" fill="#14532D">1/σ² 仅当常数权重，不向热力图回传“拉大方差”梯度</text>
  <text x="534" y="337" class="s" fill="#15803D">逼着网络只能老老实实把坐标误差 || ĵ' − ĵ'_gt ||₂ 压到最低</text>
</svg>