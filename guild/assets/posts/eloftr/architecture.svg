<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 385" width="960" height="385">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="385" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 1：Efficient LoFTR（ELoFTR）整体工作流程</text>
  <text x="480" y="62" text-anchor="middle" class="sub">三大改造齐发力：RepVGG 轻主干 + 聚合真 Softmax 注意力 + 砍掉细 Transformer 改两阶段相关性</text>

  <rect x="24" y="94" width="192" height="236" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="120" y="122" text-anchor="middle" class="h" fill="#1E3A8A">① RepVGG 轻主干</text>
  <rect x="42" y="142" width="156" height="68" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="120" y="168" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">推理合为单路 3×3</text>
  <text x="120" y="190" text-anchor="middle" class="s">无残差分支访存开销</text>
  <rect x="42" y="226" width="156" height="76" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="120" y="252" text-anchor="middle" class="b" fill="#1E40AF" font-weight="700">输出多尺度特征</text>
  <text x="120" y="274" text-anchor="middle" class="s">1/8 粗图 + 1/2、1/1 细图</text>

  <line x1="216" y1="212" x2="250" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <rect x="256" y="94" width="222" height="236" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="367" y="122" text-anchor="middle" class="h" fill="#166534">② 聚合注意力模块</text>
  <rect x="274" y="142" width="186" height="68" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="367" y="168" text-anchor="middle" class="b" fill="#15803D" font-weight="700">4×4 空间浓缩 16 倍</text>
  <text x="367" y="190" text-anchor="middle" class="s">4800 词元 → 仅 300 词元</text>
  <rect x="274" y="226" width="186" height="76" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="367" y="252" text-anchor="middle" class="b" fill="#14532D" font-weight="700">真 Softmax + 2D RoPE</text>
  <text x="367" y="274" text-anchor="middle" class="s">上采样后在原尺度过 FFN</text>

  <line x1="478" y1="212" x2="512" y2="212" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="518" y="94" width="190" height="236" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="613" y="122" text-anchor="middle" class="h" fill="#9A3412">③ 极速粗匹配</text>
  <rect x="536" y="142" width="154" height="72" rx="8" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.5"/>
  <text x="613" y="168" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">算 1/8 相似度表 S</text>
  <text x="613" y="190" text-anchor="middle" class="s">推理期可跳过双 Softmax</text>
  <rect x="536" y="228" width="154" height="74" rx="8" fill="#FFEDD5" stroke="#F97316" stroke-width="1.5"/>
  <text x="613" y="254" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">直接互近邻筛粗对</text>
  <text x="613" y="276" text-anchor="middle" class="s">大幅削减大矩阵指数耗时</text>

  <line x1="708" y1="212" x2="742" y2="212" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <rect x="748" y="94" width="188" height="236" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="842" y="122" text-anchor="middle" class="h" fill="#5B21B6">④ 两阶段相关精修</text>
  <rect x="766" y="142" width="152" height="70" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="842" y="168" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">Stage 1: 锁整像素</text>
  <text x="842" y="188" text-anchor="middle" class="s">MNN 彻底切掉远处杂点</text>
  <rect x="766" y="226" width="152" height="76" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="842" y="252" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">Stage 2: 3×3 亚像素</text>
  <text x="842" y="274" text-anchor="middle" class="s">无偏精准输出 · 提速 2.5×</text>

  <text x="480" y="364" text-anchor="middle" class="s">结论：半稠密匹配首次跑出逼近稀疏匹配（SuperPoint + LightGlue）的速度，同时精度全面反超原版 LoFTR</text>

</svg>