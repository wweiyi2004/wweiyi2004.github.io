<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：聚合注意力（Aggregated Attention）——浓缩 16 倍，反用真 Softmax！</text>
  <text x="480" y="62" text-anchor="middle" class="sub">相邻 4×4 网格的粗语义高度冗余：浓缩后注意力矩阵缩小 256 倍，既飞快又聚焦</text>

  <!-- Top: Old LoFTR -->
  <rect x="28" y="88" width="904" height="106" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="48" y="114" class="h" fill="#475569">原版 LoFTR：4800 个冗余词元硬塞进近似 Linear Attention</text>
  <rect x="52" y="128" width="210" height="48" rx="8" fill="#EFF6FF" stroke="#60A5FA"/><text x="157" y="157" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">粗图 [60×80] = 4800 词元</text>
  <line x1="262" y1="152" x2="310" y2="152" stroke="#64748B" stroke-width="2.2" marker-end="url(#arr-gray)"/>
  <rect x="316" y="128" width="320" height="48" rx="8" fill="#FEE2E2" stroke="#F87171"/><text x="476" y="157" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">Linear Attention 核近似（权重平而糊）</text>
  <line x1="636" y1="152" x2="684" y2="152" stroke="#64748B" stroke-width="2.2" marker-end="url(#arr-gray)"/>
  <rect x="690" y="128" width="218" height="48" rx="8" fill="#F1F5F9" stroke="#94A3B8"/><text x="799" y="157" text-anchor="middle" class="b" fill="#475569">又慢，焦点又不够锐利</text>

  <!-- Bottom: ELoFTR -->
  <rect x="28" y="212" width="904" height="162" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="48" y="240" class="h" fill="#166534">ELoFTR 聚合注意力：先 4×4 非对称浓缩 → 跑真 Softmax + RoPE → 先上采样再过 FFN！</text>

  <rect x="50" y="262" width="152" height="84" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="126" y="294" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">原始粗特征</text>
  <text x="126" y="318" text-anchor="middle" class="s">60×80（4800 格）</text>

  <line x1="202" y1="304" x2="234" y2="304" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <rect x="240" y="256" width="182" height="96" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <text x="331" y="280" text-anchor="middle" class="b" fill="#14532D" font-weight="700">① 4×4 空间浓缩</text>
  <text x="331" y="302" text-anchor="middle" class="s" fill="#166534">Q：Depthwise Conv</text>
  <text x="331" y="320" text-anchor="middle" class="s" fill="#166534">K, V：MaxPool(4×4)</text>
  <text x="331" y="340" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">缩成 15×20 = 300 格!</text>

  <line x1="422" y1="304" x2="454" y2="304" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <rect x="460" y="256" width="214" height="96" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="567" y="282" text-anchor="middle" class="b" fill="#1E3A8A" font-weight="700">② 真 Softmax + 2D RoPE</text>
  <text x="567" y="306" text-anchor="middle" class="s" fill="#1D4ED8">300×300 矩阵缩小 256 倍</text>
  <text x="567" y="328" text-anchor="middle" class="s" fill="#15803D" font-weight="700">直吃 FlashAttention 加速！</text>

  <line x1="674" y1="304" x2="706" y2="304" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#arr-purple)"/>

  <rect x="712" y="256" width="198" height="96" rx="8" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <text x="811" y="282" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">③ 先上采样，再过 FFN!</text>
  <text x="811" y="306" text-anchor="middle" class="s" fill="#C2410C">恢复 60×80 + 残差相加</text>
  <text x="811" y="328" text-anchor="middle" class="s">在原分辨率保留精细局部信息</text>

</svg>