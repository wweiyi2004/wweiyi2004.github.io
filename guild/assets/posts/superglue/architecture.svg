<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
      .bar { text-decoration: overline; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="980" height="400" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 1：SuperGlue 整体工作流程（宏观全景）</text>
  <text x="490" y="62" text-anchor="middle" class="sub">输入局部特征 → 位置编码融入坐标 → 18 层交替图注意力 → 带垃圾桶的可微 Sinkhorn 匹配</text>

  <!-- Stage 1: Input + Keypoint Encoder -->
  <rect x="26" y="92" width="190" height="252" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="121" y="118" text-anchor="middle" class="h" fill="#1E293B">① 输入与位置编码</text>

  <!-- Mini Image A -->
  <rect x="44" y="132" width="154" height="68" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="121" y="151" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">图 A（M 个点）</text>
  <circle cx="72" cy="171" r="5.5" fill="#2563EB"/>
  <circle cx="108" cy="166" r="5.5" fill="#16A34A"/>
  <circle cx="146" cy="175" r="5.5" fill="#7C3AED"/>
  <circle cx="174" cy="164" r="5.5" fill="#94A3B8"/>
  <text x="121" y="194" text-anchor="middle" class="s">外观 d + 坐标 (x,y,c)</text>

  <!-- Mini Image B -->
  <rect x="44" y="210" width="154" height="68" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="121" y="229" text-anchor="middle" class="b" fill="#15803D" font-weight="700">图 B（N 个点）</text>
  <circle cx="84" cy="249" r="5.5" fill="#2563EB"/>
  <circle cx="118" cy="244" r="5.5" fill="#16A34A"/>
  <circle cx="152" cy="252" r="5.5" fill="#7C3AED"/>
  <circle cx="175" cy="242" r="5.5" fill="#94A3B8"/>
  <text x="121" y="272" text-anchor="middle" class="s">外观 d + 坐标 (x,y,c)</text>

  <!-- Encoder Pill -->
  <rect x="42" y="292" width="158" height="34" rx="17" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="121" y="314" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">5 层 MLP 位置编码</text>

  <!-- Arrow 1->2 -->
  <line x1="216" y1="218" x2="250" y2="218" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Attentional GNN -->
  <rect x="256" y="92" width="248" height="252" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="380" y="118" text-anchor="middle" class="h" fill="#1E3A8A">② 交替注意力 GNN（9 组）</text>

  <rect x="276" y="136" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="380" y="161" text-anchor="middle" class="h" fill="#1D4ED8">图内自注意力（Self）</text>
  <text x="380" y="184" text-anchor="middle" class="s">同图内四处张望，认清周围地标</text>

  <line x1="380" y1="198" x2="380" y2="218" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="276" y="222" width="208" height="62" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="380" y="247" text-anchor="middle" class="h" fill="#047857">跨图交叉注意力（Cross）</text>
  <text x="380" y="270" text-anchor="middle" class="s">两图对称来回核对，锁定候选点</text>

  <rect x="272" y="296" width="216" height="32" rx="16" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.5"/>
  <text x="380" y="317" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">共 18 层 · 由全局粗配到局部细配</text>

  <!-- Arrow 2->3 -->
  <line x1="504" y1="218" x2="538" y2="218" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Optimal Matching Layer -->
  <rect x="544" y="112" width="182" height="212" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="635" y="140" text-anchor="middle" class="h" fill="#065F46">③ 最优匹配层</text>

  <rect x="562" y="156" width="146" height="60" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <text x="635" y="181" text-anchor="middle" class="b" fill="#065F46" font-weight="700">内积 + Dustbin</text>
  <text x="635" y="203" text-anchor="middle" class="s">拼入可学习垃圾桶 z</text>

  <line x1="635" y1="216" x2="635" y2="238" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="562" y="242" width="146" height="60" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <text x="635" y="267" text-anchor="middle" class="b" fill="#065F46" font-weight="700">100 步 Sinkhorn</text>
  <text x="635" y="289" text-anchor="middle" class="s">交替行列归一化求解</text>

  <!-- Arrow 3->4 -->
  <line x1="726" y1="218" x2="760" y2="218" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Output -->
  <rect x="766" y="92" width="188" height="252" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="860" y="118" text-anchor="middle" class="h" fill="#5B21B6">④ 输出部分软分配</text>

  <rect x="786" y="138" width="148" height="64" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="786" y="232" width="148" height="64" rx="7" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>

  <!-- Match lines -->
  <line x1="812" y1="172" x2="820" y2="262" stroke="#2563EB" stroke-width="2.2"/>
  <line x1="854" y1="164" x2="862" y2="258" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="894" y1="180" x2="900" y2="270" stroke="#7C3AED" stroke-width="2.2"/>

  <!-- Matched Points -->
  <circle cx="812" cy="172" r="5.5" fill="#2563EB"/><circle cx="820" cy="262" r="5.5" fill="#2563EB"/>
  <circle cx="854" cy="164" r="5.5" fill="#16A34A"/><circle cx="862" cy="258" r="5.5" fill="#16A34A"/>
  <circle cx="894" cy="180" r="5.5" fill="#7C3AED"/><circle cx="900" cy="270" r="5.5" fill="#7C3AED"/>

  <!-- Unmatched crossed points -->
  <circle cx="918" cy="156" r="5" fill="#CBD5E1"/>
  <line x1="913" y1="151" x2="923" y2="161" stroke="#EF4444" stroke-width="2"/>
  <line x1="923" y1="151" x2="913" y2="161" stroke="#EF4444" stroke-width="2"/>
  <circle cx="802" cy="278" r="5" fill="#CBD5E1"/>
  <line x1="797" y1="273" x2="807" y2="283" stroke="#EF4444" stroke-width="2"/>
  <line x1="807" y1="273" x2="797" y2="283" stroke="#EF4444" stroke-width="2"/>

  <text x="860" y="324" text-anchor="middle" class="s" fill="#5B21B6">一对一连线 · 遮挡点进垃圾桶</text>

  <!-- Footer -->
  <text x="490" y="376" text-anchor="middle" class="s">端到端可微中端匹配器：将上下文聚合、全局竞争分配与遮挡拒判三合一，彻底打破传统 NN 召回率天花板</text>
</svg>
