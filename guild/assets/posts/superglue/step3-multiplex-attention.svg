<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 392" width="960" height="392">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
      .bar { text-decoration: overline; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="392" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 3：多重图交替注意力——像人眼一样“由粗到细”来回看图</text>
  <text x="480" y="62" text-anchor="middle" class="sub">奇数层在自己图内找地标（Self），偶数层跨图比对候选点（Cross），循环 9 组后注意力跨度缩小超 10 倍</text>

  <!-- Card 1: Self-Attention -->
  <rect x="24" y="88" width="280" height="252" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="164" y="116" text-anchor="middle" class="h" fill="#1E3A8A">① 图内自注意力（Self）</text>

  <rect x="44" y="132" width="240" height="148" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.6"/>
  <text x="164" y="152" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">图像 A 内部连边（Q = S）</text>

  <!-- Attention edges from query i (92, 234) -->
  <line x1="92" y1="234" x2="174" y2="180" stroke="#2563EB" stroke-width="3.6"/>
  <line x1="92" y1="234" x2="160" y2="246" stroke="#60A5FA" stroke-width="2.2"/>
  <line x1="92" y1="234" x2="248" y2="212" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Nodes -->
  <circle cx="92" cy="234" r="11" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="92" y="238" text-anchor="middle" class="mono" font-size="12" fill="#9A3412">i</text>

  <circle cx="174" cy="180" r="8" fill="#2563EB"/>
  <text x="218" y="184" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">显著地标</text>
  <text x="125" y="198" text-anchor="middle" class="mono" font-size="12" fill="#1D4ED8">0.58</text>

  <circle cx="160" cy="246" r="6.5" fill="#60A5FA"/>
  <text x="128" y="263" text-anchor="middle" class="mono" font-size="11.5" fill="#3B82F6">0.29</text>
  <text x="198" y="250" text-anchor="middle" class="s">近邻点</text>

  <circle cx="248" cy="212" r="5.5" fill="#94A3B8"/>
  <text x="248" y="231" text-anchor="middle" class="mono" font-size="11.5" fill="#64748B">0.04</text>

  <text x="164" y="302" text-anchor="middle" class="b" fill="#1E3A8A">动态盯住画面里的显著地标</text>
  <text x="164" y="324" text-anchor="middle" class="s" fill="#1D4ED8">认清自身周围的 3D 几何布局</text>

  <!-- Cycle Arrow 1 <-> 2 -->
  <line x1="308" y1="205" x2="332" y2="205" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <line x1="332" y1="223" x2="308" y2="223" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <!-- Card 2: Cross-Attention -->
  <rect x="338" y="88" width="306" height="252" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="491" y="116" text-anchor="middle" class="h" fill="#065F46">② 跨图交叉注意力（Cross）</text>

  <!-- Mini Frame A (w=104, x=354..458) -->
  <rect x="354" y="132" width="104" height="148" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <text x="406" y="152" text-anchor="middle" class="s" fill="#047857" font-weight="700">图像 A</text>

  <!-- Mini Frame B (w=106, x=522..628), middle gap = 64px (458..522) -->
  <rect x="522" y="132" width="106" height="148" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <text x="575" y="152" text-anchor="middle" class="s" fill="#047857" font-weight="700">图像 B</text>

  <!-- Cross lines between Frame A and Frame B -->
  <line x1="414" y1="204" x2="546" y2="182" stroke="#16A34A" stroke-width="3.4"/>
  <line x1="414" y1="204" x2="564" y2="228" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="414" y1="204" x2="548" y2="254" stroke="#CBD5E1" stroke-width="1.3" stroke-dasharray="4,3"/>

  <!-- Nodes in A and B -->
  <circle cx="406" cy="204" r="10.5" fill="#FFEDD5" stroke="#EA580C" stroke-width="2"/>
  <text x="406" y="208" text-anchor="middle" class="mono" font-size="12" fill="#9A3412">i</text>
  <text x="406" y="233" text-anchor="middle" class="s">查询点</text>

  <circle cx="552" cy="182" r="9.5" fill="#16A34A"/>
  <text x="552" y="186" text-anchor="middle" class="mono" font-size="12" fill="#FFFFFF">j*</text>
  <text x="594" y="186" text-anchor="middle" class="s" fill="#15803D" font-weight="700">真匹配</text>

  <circle cx="566" cy="228" r="5.5" fill="#94A3B8"/>
  <circle cx="550" cy="254" r="5.5" fill="#CBD5E1"/>
  <text x="594" y="256" text-anchor="middle" class="s">干扰点</text>

  <!-- Weight Pill centered cleanly inside 64px gap (458..522 -> center 490) -->
  <rect x="467" y="179" width="46" height="22" rx="11" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2"/>
  <text x="490" y="194" text-anchor="middle" class="mono" font-size="12" fill="#15803D">0.81</text>
  <text x="490" y="268" text-anchor="middle" class="s" fill="#047857" font-weight="700">A ⇄ B</text>

  <text x="491" y="302" text-anchor="middle" class="b" fill="#065F46">图 A 查图 B，同时图 B 对称查图 A</text>
  <text x="491" y="324" text-anchor="middle" class="s" fill="#047857">去掉跨图交互，AUC@20° 狂掉 9.27%</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="644" y1="214" x2="670" y2="214" stroke="#7C3AED" stroke-width="2.4" marker-end="url(#arr-purple)"/>

  <!-- Card 3: Coarse-to-Fine Convergence -->
  <rect x="676" y="88" width="260" height="252" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="806" y="116" text-anchor="middle" class="h" fill="#5B21B6">③ 18 层由粗到细聚焦</text>

  <rect x="694" y="132" width="224" height="148" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <text x="806" y="152" text-anchor="middle" class="s" fill="#6D28D9" font-weight="700">平均注意力像素跨度（附录 D）</text>

  <!-- Layer 0 bar -->
  <text x="730" y="182" text-anchor="end" class="mono" font-size="12" fill="#334155">L0</text>
  <rect x="740" y="168" width="110" height="20" rx="5" fill="#93C5FD"/>
  <text x="858" y="183" class="mono" font-size="12" fill="#1D4ED8">&gt;200px</text>

  <!-- Layer 9 bar -->
  <text x="730" y="220" text-anchor="end" class="mono" font-size="12" fill="#334155">L9</text>
  <rect x="740" y="206" width="58" height="20" rx="5" fill="#A78BFA"/>
  <text x="808" y="221" class="s" fill="#5B21B6" font-weight="700">简单点已锁定</text>

  <!-- Layer 17 bar -->
  <text x="730" y="258" text-anchor="end" class="mono" font-size="12" fill="#334155">L17</text>
  <rect x="740" y="244" width="20" height="20" rx="5" fill="#22C55E"/>
  <text x="770" y="259" class="mono" font-size="12" fill="#15803D">&lt;20px 精准聚焦</text>

  <text x="806" y="302" text-anchor="middle" class="b" fill="#5B21B6">浅层看全图摸清相机相对位姿</text>
  <text x="806" y="324" text-anchor="middle" class="s" fill="#6D28D9">深层逐层收窄，困难点回头找地标</text>

  <!-- Footer -->
  <text x="480" y="370" text-anchor="middle" class="s">每层均采用残差拼接更新 x⁽ˡ⁺¹⁾ = x⁽ˡ⁾ + MLP([x⁽ˡ⁾ ‖ m]) · 天然满足点序置换等变与图像 A/B 交换对称</text>
</svg>
