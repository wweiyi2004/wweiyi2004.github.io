<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 422" width="980" height="422">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="980" height="422" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title" fill="#111827">图 3：核心机制——图拉普拉斯闭式低通滤波与残差放大</text>
  <text x="490" y="60" text-anchor="middle" class="sub" fill="#4B5563">用具体 4 点数值例子看懂：如何用 3 步闭式矩阵乘压扁外点毛刺，再靠残差瞬间揪出误匹配</text>

  <!-- STAGE 1: Raw Observation m -->
  <rect x="24" y="84" width="234" height="246" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="141" y="110" text-anchor="middle" class="h" fill="#1E3A8A">① 原始观测 m（含毛刺）</text>

  <!-- Mini 4-node connected chain -->
  <line x1="68" y1="138" x2="214" y2="138" stroke="#94A3B8" stroke-width="2.2"/>
  <circle cx="68" cy="138" r="11" fill="#2563EB"/><text x="68" y="142" text-anchor="middle" class="s" fill="#FFFFFF" font-weight="700">1</text>
  <circle cx="116" cy="138" r="11" fill="#2563EB"/><text x="116" y="142" text-anchor="middle" class="s" fill="#FFFFFF" font-weight="700">2</text>
  <circle cx="164" cy="138" r="11" fill="#2563EB"/><text x="164" y="142" text-anchor="middle" class="s" fill="#FFFFFF" font-weight="700">3</text>
  <circle cx="214" cy="138" r="11" fill="#DC2626"/><text x="214" y="142" text-anchor="middle" class="s" fill="#FFFFFF" font-weight="700">4*</text>

  <text x="128" y="186" text-anchor="end" class="b" fill="#334155" font-weight="700">P1 (内点)</text>
  <rect x="140" y="164" width="96" height="32" rx="6" fill="#2563EB"/>
  <text x="188" y="185" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">+10.0</text>
  <text x="128" y="224" text-anchor="end" class="b" fill="#334155" font-weight="700">P2 (内点)</text>
  <rect x="140" y="202" width="96" height="32" rx="6" fill="#2563EB"/>
  <text x="188" y="223" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">+10.0</text>
  <text x="128" y="262" text-anchor="end" class="b" fill="#334155" font-weight="700">P3 (内点)</text>
  <rect x="140" y="240" width="96" height="32" rx="6" fill="#2563EB"/>
  <text x="188" y="261" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">+10.0</text>
  <text x="128" y="300" text-anchor="end" class="b" fill="#DC2626" font-weight="700">P4* (外点)</text>
  <rect x="140" y="278" width="96" height="32" rx="6" fill="#DC2626"/>
  <text x="188" y="299" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">-50.0</text>

  <!-- Arrow 1->2 -->
  <line x1="258" y1="210" x2="292" y2="210" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#arr-purple)"/>

  <!-- STAGE 2: Closed-form Graph Low-pass Filter -->
  <rect x="298" y="84" width="342" height="246" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="469" y="110" text-anchor="middle" class="h" fill="#5B21B6">② 闭式低通滤波 s = R(η)m</text>

  <!-- 3 Spectral steps on left -->
  <rect x="312" y="130" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <text x="417" y="152" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">1. 图傅里叶变换 U₃₂ᵀ m</text>
  <text x="417" y="172" text-anchor="middle" class="s" fill="#4B5563">投影到前 32 个低频谱分量</text>

  <line x1="417" y1="182" x2="417" y2="196" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>

  <rect x="312" y="200" width="210" height="54" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="417" y="222" text-anchor="middle" class="b" fill="#4C1D95" font-weight="700">2. 频域衰减 × 1/(1+ηλᵢ)</text>
  <text x="417" y="242" text-anchor="middle" class="s" fill="#5B21B6">低频≈1 保留 · 高频≈0 压扁</text>

  <line x1="417" y1="254" x2="417" y2="268" stroke="#7C3AED" stroke-width="2" marker-end="url(#arr-purple)"/>

  <rect x="312" y="272" width="210" height="46" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <text x="417" y="292" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">3. 逆变换 U₃₂(·) 回节点</text>
  <text x="417" y="310" text-anchor="middle" class="s" fill="#4B5563">从右往左乘，复杂度降为 O(N)</text>

  <!-- Smoothed output column s -->
  <text x="582" y="152" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">平滑值 s</text>
  <rect x="540" y="164" width="84" height="32" rx="6" fill="#7C3AED"/>
  <text x="582" y="185" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">+9.2</text>
  <rect x="540" y="202" width="84" height="32" rx="6" fill="#7C3AED"/>
  <text x="582" y="223" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">+8.8</text>
  <rect x="540" y="240" width="84" height="32" rx="6" fill="#7C3AED"/>
  <text x="582" y="261" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">+7.5</text>
  <rect x="540" y="278" width="84" height="32" rx="6" fill="#EA580C"/>
  <text x="582" y="299" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">+4.0</text>

  <!-- Arrow 2->3 -->
  <line x1="640" y1="210" x2="686" y2="210" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="663" y="198" text-anchor="middle" class="s" fill="#15803D" font-weight="700">算残差</text>

  <!-- STAGE 3: Residual Amplifier -->
  <rect x="692" y="84" width="264" height="246" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="824" y="110" text-anchor="middle" class="h" fill="#166534">③ 高频残差 |s - m|</text>
  <text x="824" y="138" text-anchor="middle" class="s" fill="#15803D">偏离平滑趋势越大，越可能是外点</text>

  <text x="732" y="186" text-anchor="end" class="b" fill="#15803D" font-weight="700">P1</text>
  <rect x="742" y="164" width="78" height="32" rx="6" fill="#16A34A"/>
  <text x="781" y="185" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">0.8</text>
  <text x="832" y="185" class="b" fill="#15803D" font-weight="700">✓ 保留内点</text>
  <text x="732" y="224" text-anchor="end" class="b" fill="#15803D" font-weight="700">P2</text>
  <rect x="742" y="202" width="78" height="32" rx="6" fill="#16A34A"/>
  <text x="781" y="223" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">1.2</text>
  <text x="832" y="223" class="b" fill="#15803D" font-weight="700">✓ 保留内点</text>
  <text x="732" y="262" text-anchor="end" class="b" fill="#15803D" font-weight="700">P3</text>
  <rect x="742" y="240" width="78" height="32" rx="6" fill="#16A34A"/>
  <text x="781" y="261" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">2.5</text>
  <text x="832" y="261" class="b" fill="#15803D" font-weight="700">✓ 保留内点</text>
  <text x="732" y="300" text-anchor="end" class="b" fill="#DC2626" font-weight="700">P4*</text>
  <rect x="742" y="278" width="78" height="32" rx="6" fill="#DC2626"/>
  <text x="781" y="299" text-anchor="middle" class="mono" font-size="13.5" fill="#FFFFFF">54.0</text>
  <text x="832" y="299" class="b" fill="#DC2626" font-weight="700">✗ 揪出外点！</text>

  <!-- Bottom crisp callout -->
  <rect x="24" y="346" width="932" height="58" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8"/>
  <text x="490" y="370" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">升级为可微 CR-Layer：把 2D 运动 m 推广到 128 维特征 fₗ，输出 ContextNorm(fₗ - R(η)fₗ) + Skip；</text>
  <text x="490" y="392" text-anchor="middle" class="b" fill="#9A3412">平滑强度 η（初值 10.0）作为可训练参数随反向传播自动学习，全程纯矩阵乘法，无需任何迭代求解器！</text>
</svg>
