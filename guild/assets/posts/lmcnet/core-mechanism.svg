<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 880" width="1060" height="880" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#374151"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#46A171"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2783DE"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#D5803B"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <filter id="shadow2" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1060" height="880" fill="#FFFFFF"/>

  <!-- Main Title -->
  <text x="530" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111827">LMCNet 核心机制连环画：图拉普拉斯可微平滑与全局/局部协同</text>
  <text x="530" y="56" text-anchor="middle" font-size="12.5" fill="#4B5563">拆解最容易看晕的两大设计：① 为什么 R(η)f 能一键可微滤除外点；② 为什么双边空间 + 局部邻域能搞定分段运动</text>

  <!-- ==================== PART 1: 4-STEP COMIC OF CR-LAYER SPECTRAL FILTERING ==================== -->
  <rect x="20" y="72" width="1020" height="398" rx="12" fill="#FAFAFB" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="38" y="96" font-size="14" font-weight="bold" fill="#1F5138">机制一：CR-Layer（一致性残差层）如何把“图拉普拉斯优化”变成可微低通滤波？</text>
  <text x="38" y="115" font-size="11.5" fill="#4B5563">传统全局方法需要不可微的迭代凸优化；LMCNet 利用图谱定理求闭式解 f' = U · diag(1/(1+ηλ)) · U^T f，等价于四步“图傅里叶低通滤波 + 取残差”</text>

  <!-- Step 1 -->
  <g filter="url(#shadow2)">
    <rect x="36" y="130" width="222" height="252" rx="9" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.4"/>
    <rect x="36" y="130" width="222" height="30" rx="9" fill="#F3F4F6"/>
    <rect x="36" y="150" width="222" height="10" fill="#F3F4F6"/>
    <text x="147" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#111827">第 1 步：输入含噪图信号 f_l</text>

    <!-- Visual plot: smooth curve with outlier spikes -->
    <rect x="52" y="172" width="190" height="114" rx="6" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Axes -->
    <line x1="66" y1="272" x2="230" y2="272" stroke="#9CA3AF" stroke-width="1"/>
    <line x1="66" y1="184" x2="66" y2="272" stroke="#9CA3AF" stroke-width="1"/>
    <!-- Smooth inlier signal bars/dots (green) -->
    <path d="M 78 242 Q 112 224 146 232 T 218 228" fill="none" stroke="#46A171" stroke-width="2" stroke-dasharray="3,2"/>
    <circle cx="80" cy="241" r="4" fill="#46A171"/>
    <circle cx="100" cy="233" r="4" fill="#46A171"/>
    <circle cx="122" cy="229" r="4" fill="#46A171"/>
    <circle cx="164" cy="234" r="4" fill="#46A171"/>
    <circle cx="198" cy="231" r="4" fill="#46A171"/>
    <circle cx="218" cy="228" r="4" fill="#46A171"/>
    <!-- High-freq outlier spikes (red/orange) -->
    <line x1="142" y1="231" x2="142" y2="192" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="2,2"/>
    <circle cx="142" cy="192" r="4.5" fill="#DC2626"/>
    <line x1="180" y1="233" x2="180" y2="262" stroke="#DC2626" stroke-width="1.8" stroke-dasharray="2,2"/>
    <circle cx="180" cy="262" r="4.5" fill="#DC2626"/>
    <text x="148" y="187" font-size="9.5" font-weight="bold" fill="#DC2626">外点毛刺(高频)</text>
    <text x="72" y="264" font-size="9.5" fill="#1F5138">真实内点：沿图平缓变化(低频)</text>

    <text x="50" y="306" font-size="11" fill="#374151">• 节点 = N 条候选对应</text>
    <text x="50" y="324" font-size="11" fill="#374151">• 信号 = d=128 维抽象特征 f_l</text>
    <text x="50" y="342" font-size="11" fill="#374151">• 内点平滑连贯，外点孤立跳变</text>
    <text x="50" y="366" font-size="10.5" font-weight="bold" fill="#111827">张量形状：f_l ∈ R^(N×128)</text>
  </g>

  <!-- Arrow 1->2 -->
  <path d="M 258 256 L 284 256" fill="none" stroke="#2783DE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Step 2 -->
  <g filter="url(#shadow2)">
    <rect x="290" y="130" width="222" height="252" rx="9" fill="#FFFFFF" stroke="#2783DE" stroke-width="1.4"/>
    <rect x="290" y="130" width="222" height="30" rx="9" fill="#E5F2FC"/>
    <rect x="290" y="150" width="222" height="10" fill="#E5F2FC"/>
    <text x="401" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#153B60">第 2 步：图傅里叶变换 U_32^T f_l</text>

    <!-- Visual spectrum plot -->
    <rect x="306" y="172" width="190" height="114" rx="6" fill="#F8FBFF" stroke="#BFDBFE" stroke-width="1"/>
    <line x1="320" y1="266" x2="484" y2="266" stroke="#9CA3AF" stroke-width="1"/>
    <!-- Spectrum bars: left low freq retained, right high freq truncated -->
    <rect x="328" y="200" width="14" height="66" rx="2" fill="#2783DE"/>
    <rect x="348" y="214" width="14" height="52" rx="2" fill="#3B82F6"/>
    <rect x="368" y="226" width="14" height="40" rx="2" fill="#60A5FA"/>
    <rect x="388" y="238" width="14" height="28" rx="2" fill="#93C5FD"/>
    <!-- Cutoff line at k_e = 32 -->
    <line x1="412" y1="180" x2="412" y2="274" stroke="#D5803B" stroke-width="1.6" stroke-dasharray="4,2"/>
    <text x="415" y="191" font-size="9.5" font-weight="bold" fill="#70401C">截断 k_e=32</text>
    <!-- Discarded high freq bars -->
    <rect x="422" y="232" width="12" height="34" rx="2" fill="#FCA5A5" opacity="0.6"/>
    <rect x="440" y="220" width="12" height="46" rx="2" fill="#FCA5A5" opacity="0.6"/>
    <rect x="458" y="228" width="12" height="38" rx="2" fill="#FCA5A5" opacity="0.6"/>
    <text x="364" y="280" text-anchor="middle" font-size="9.5" fill="#153B60">低频 λ_1..λ_32</text>
    <text x="448" y="280" text-anchor="middle" font-size="9.5" fill="#B91C1C">高频直接丢弃</text>

    <text x="304" y="306" font-size="11" fill="#153B60">• 左乘 U_32^T 把特征投到图频域</text>
    <text x="304" y="324" font-size="11" fill="#153B60">• 特征值 λ_i 越小 → 越平滑低频</text>
    <text x="304" y="342" font-size="11" fill="#153B60">• 截断前 32 维：O(N²) 降至 O(N)</text>
    <text x="304" y="366" font-size="10.5" font-weight="bold" fill="#153B60">频域系数：f̃ ∈ R^(32×128)</text>
  </g>

  <!-- Arrow 2->3 -->
  <path d="M 512 256 L 538 256" fill="none" stroke="#46A171" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 3 -->
  <g filter="url(#shadow2)">
    <rect x="544" y="130" width="222" height="252" rx="9" fill="#FFFFFF" stroke="#46A171" stroke-width="1.4"/>
    <rect x="544" y="130" width="222" height="30" rx="9" fill="#E8F1EC"/>
    <rect x="544" y="150" width="222" height="10" fill="#E8F1EC"/>
    <text x="655" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1F5138">第 3 步：可学习低通滤波 &amp; 逆变换</text>

    <!-- Filter response curve 1/(1 + eta * lambda) -->
    <rect x="560" y="172" width="190" height="114" rx="6" fill="#F4FAF6" stroke="#A7F3D0" stroke-width="1"/>
    <line x1="576" y1="266" x2="736" y2="266" stroke="#9CA3AF" stroke-width="1"/>
    <line x1="576" y1="184" x2="576" y2="266" stroke="#9CA3AF" stroke-width="1"/>
    <text x="569" y="192" text-anchor="end" font-size="9" fill="#4B5563">1</text>
    <text x="734" y="278" text-anchor="end" font-size="9" fill="#4B5563">λ 增大 →</text>
    <!-- Decay curve -->
    <path d="M 578 190 C 594 192, 610 232, 646 250 C 676 260, 706 263, 732 264" fill="none" stroke="#46A171" stroke-width="2.5"/>
    <path d="M 578 190 C 594 192, 610 232, 646 250 C 676 260, 706 263, 732 264 L 732 266 L 578 266 Z" fill="#46A171" opacity="0.14"/>
    <text x="665" y="206" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#1F5138">增益 = 1 / (1 + η λ_i)</text>
    <text x="665" y="222" text-anchor="middle" font-size="9.5" fill="#2F6F4E">λ≈0 → 几乎无损保留</text>
    <text x="665" y="236" text-anchor="middle" font-size="9.5" fill="#2F6F4E">λ 大 → 强力衰减压平</text>

    <text x="558" y="306" font-size="11" fill="#1F5138">• 乘以对角阵 diag(1/(1+ηλ_i))</text>
    <text x="558" y="324" font-size="11" fill="#1F5138">• 左乘 U_32 逆变换回节点空间</text>
    <text x="558" y="342" font-size="11" fill="#1F5138">• 平滑强度 η 可端到端反向传播</text>
    <text x="558" y="366" font-size="10.5" font-weight="bold" fill="#1F5138">平滑特征：f'_l = R(η)f_l ∈ R^(N×128)</text>
  </g>

  <!-- Arrow 3->4 -->
  <path d="M 766 256 L 792 256" fill="none" stroke="#D5803B" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Step 4 -->
  <g filter="url(#shadow2)">
    <rect x="798" y="130" width="226" height="252" rx="9" fill="#FFFFFF" stroke="#D5803B" stroke-width="1.5"/>
    <rect x="798" y="130" width="226" height="30" rx="9" fill="#FBEBDE"/>
    <rect x="798" y="150" width="226" height="10" fill="#FBEBDE"/>
    <text x="911" y="150" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#70401C">第 4 步：残差相减 r_l = f_l - f'_l</text>

    <!-- Residual bar chart -->
    <rect x="814" y="172" width="194" height="114" rx="6" fill="#FFFBF7" stroke="#FCD34D" stroke-width="1"/>
    <line x1="826" y1="262" x2="996" y2="262" stroke="#9CA3AF" stroke-width="1"/>
    <!-- Tiny green bars (inliers) -->
    <rect x="836" y="254" width="12" height="8" rx="1.5" fill="#46A171"/>
    <rect x="854" y="256" width="12" height="6" rx="1.5" fill="#46A171"/>
    <rect x="872" y="252" width="12" height="10" rx="1.5" fill="#46A171"/>
    <!-- Huge red bars (outliers) -->
    <rect x="892" y="196" width="14" height="66" rx="1.5" fill="#DC2626"/>
    <rect x="914" y="255" width="12" height="7" rx="1.5" fill="#46A171"/>
    <rect x="934" y="206" width="14" height="56" rx="1.5" fill="#DC2626"/>
    <rect x="956" y="253" width="12" height="9" rx="1.5" fill="#46A171"/>
    <rect x="974" y="256" width="12" height="6" rx="1.5" fill="#46A171"/>
    <text x="900" y="189" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#DC2626">外点残差暴涨</text>
    <text x="911" y="278" text-anchor="middle" font-size="9.5" fill="#1F5138">内点贴合平滑场，残差接近 0</text>

    <text x="812" y="306" font-size="11" fill="#70401C">• 原特征减去平滑特征 = 高频残差</text>
    <text x="812" y="324" font-size="11" fill="#70401C">• 内外点在此被天然拉开巨大鸿沟</text>
    <text x="812" y="342" font-size="11" fill="#70401C">• 经 ContextNorm 提取判别特征</text>
    <text x="812" y="366" font-size="10.5" font-weight="bold" fill="#70401C">不设死阈值，交给网络端到端分类！</text>
  </g>

  <!-- Summary formula strip at bottom of Part 1 -->
  <rect x="36" y="396" width="988" height="58" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2"/>
  <text x="530" y="420" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#70401C">关键洞察：从手工 LMF 到可学习 CR-Layer 的跨越</text>
  <text x="530" y="442" text-anchor="middle" font-size="11.5" fill="#70401C">手工 LMF 仅对 2D 运动 m 做平滑并靠硬阈值 ‖R(η)m - m‖₂ ≤ ϵ 切分；CR-Layer 推广到 128 维抽象特征 f_l，隐式学习局部仿射等高阶运动一致性，无需手工调参</text>

  <!-- ==================== PART 2: BILATERAL GRAPH + LC-LAYER SYNERGY ==================== -->
  <rect x="20" y="486" width="1020" height="374" rx="12" fill="#FAFAFB" stroke="#E5E7EB" stroke-width="1.2"/>
  <text x="38" y="510" font-size="14" font-weight="bold" fill="#153B60">机制二：为什么 4D 双边空间构图 + LC-Layer 局部邻域能攻克“深度突变”与“稀疏不均”？</text>

  <!-- Left Panel: 2D Space vs 4D Bilateral Space -->
  <g filter="url(#shadow2)">
    <rect x="36" y="524" width="484" height="320" rx="10" fill="#FFFFFF" stroke="#2783DE" stroke-width="1.4"/>
    <rect x="36" y="524" width="484" height="32" rx="10" fill="#E5F2FC"/>
    <rect x="36" y="544" width="484" height="12" fill="#E5F2FC"/>
    <text x="278" y="545" text-anchor="middle" font-size="12.8" font-weight="bold" fill="#153B60">① 双边空间 R^4 构图：天然实现“分段平滑”，不怕深度/物体边界</text>

    <!-- Sub-box Left: 2D Spatial Graph (Problem) -->
    <rect x="52" y="568" width="218" height="184" rx="7" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.1"/>
    <text x="161" y="588" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#991B1B">❌ 仅按图 1 坐标 (x, y) 构图</text>
    <!-- Foreground box & Background box -->
    <rect x="66" y="600" width="90" height="84" rx="5" fill="#E8F1EC" stroke="#46A171" stroke-width="1"/>
    <text x="111" y="616" text-anchor="middle" font-size="10" fill="#1F5138">前景近处(大位移)</text>
    <rect x="166" y="600" width="90" height="84" rx="5" fill="#E5F2FC" stroke="#2783DE" stroke-width="1"/>
    <text x="211" y="616" text-anchor="middle" font-size="10" fill="#153B60">背景远处(小位移)</text>
    <!-- Points across boundary -->
    <circle cx="105" cy="645" r="4.5" fill="#46A171"/>
    <circle cx="142" cy="652" r="4.5" fill="#46A171"/>
    <circle cx="176" cy="652" r="4.5" fill="#2783DE"/>
    <circle cx="215" cy="645" r="4.5" fill="#2783DE"/>
    <!-- Wrong cross-boundary edge -->
    <line x1="146" y1="652" x2="172" y2="652" stroke="#DC2626" stroke-width="2.4"/>
    <text x="161" y="676" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#DC2626">误连跨边界边！</text>
    <text x="161" y="704" text-anchor="middle" font-size="10.2" fill="#7F1D1D">边界两侧 (x,y) 挨得很近，</text>
    <text x="161" y="720" text-anchor="middle" font-size="10.2" fill="#7F1D1D">强行平滑会把前景和背景运动</text>
    <text x="161" y="736" text-anchor="middle" font-size="10.2" fill="#7F1D1D">糊在一起，导致边界内点被误杀</text>

    <!-- Sub-box Right: 4D Bilateral Graph (LMCNet) -->
    <rect x="286" y="568" width="218" height="184" rx="7" fill="#F4FAF6" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="395" y="588" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">✓ LMCNet 4D 双边空间 (x,y,u,v)</text>
    <rect x="300" y="600" width="90" height="84" rx="5" fill="#E8F1EC" stroke="#46A171" stroke-width="1"/>
    <text x="345" y="616" text-anchor="middle" font-size="10" fill="#1F5138">前景连通分量</text>
    <rect x="400" y="600" width="90" height="84" rx="5" fill="#E5F2FC" stroke="#2783DE" stroke-width="1"/>
    <text x="445" y="616" text-anchor="middle" font-size="10" fill="#153B60">背景连通分量</text>
    <!-- Points separated in 4D -->
    <circle cx="330" cy="645" r="4.5" fill="#46A171"/>
    <circle cx="366" cy="656" r="4.5" fill="#46A171"/>
    <line x1="334" y1="646" x2="362" y2="655" stroke="#46A171" stroke-width="1.8"/>
    <circle cx="424" cy="656" r="4.5" fill="#2783DE"/>
    <circle cx="462" cy="645" r="4.5" fill="#2783DE"/>
    <line x1="428" y1="655" x2="458" y2="646" stroke="#2783DE" stroke-width="1.8"/>
    <!-- Boundary gap -->
    <line x1="395" y1="604" x2="395" y2="680" stroke="#46A171" stroke-width="1.4" stroke-dasharray="4,3"/>
    <text x="395" y="676" text-anchor="middle" font-size="9.5" font-weight="bold" fill="#166534">终点 (u,v) 远→自动断开</text>
    <text x="395" y="704" text-anchor="middle" font-size="10.2" fill="#14532D">d_ij = ‖c_i - c_j‖₂ 同时度量</text>
    <text x="395" y="720" text-anchor="middle" font-size="10.2" fill="#14532D">两张图的坐标接近程度，</text>
    <text x="395" y="736" text-anchor="middle" font-size="10.2" fill="#14532D">各物体/深度层内部各自平滑！</text>

    <!-- Bottom tip -->
    <rect x="52" y="764" width="452" height="66" rx="6" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
    <text x="64" y="784" font-size="11" font-weight="bold" fill="#111827">核心结论：为什么不仅能做刚体相机位姿，还能做动态汽车/非刚性物体？</text>
    <text x="64" y="803" font-size="10.5" fill="#374151">在 4D 双边空间里，每辆行驶的汽车与静止背景天然形成互不干扰的子图团块；</text>
    <text x="64" y="819" font-size="10.5" fill="#374151">因此 LMCNet 不依赖单一全局基础矩阵/本质矩阵，在 DETRAC 与 DAVIS 动态场景上照样奏效。</text>
  </g>

  <!-- Right Panel: LC-Layer Local Neighbor Support -->
  <g filter="url(#shadow2)">
    <rect x="540" y="524" width="484" height="320" rx="10" fill="#FFFFFF" stroke="#46A171" stroke-width="1.4"/>
    <rect x="540" y="524" width="484" height="32" rx="10" fill="#E8F1EC"/>
    <rect x="540" y="544" width="484" height="12" fill="#E8F1EC"/>
    <text x="782" y="545" text-anchor="middle" font-size="12.8" font-weight="bold" fill="#1F5138">② LC-Layer（局部一致性层）：从 k=8 个支持邻居中“验明正身”</text>

    <!-- Left sub-diagram: Inlier neighborhood -->
    <rect x="556" y="568" width="218" height="184" rx="7" fill="#F4FAF6" stroke="#86EFAC" stroke-width="1.2"/>
    <text x="665" y="588" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#166534">真实内点的局部邻域（齐刷刷）</text>
    <!-- Parallel green motion arrows -->
    <line x1="590" y1="612" x2="646" y2="626" stroke="#46A171" stroke-width="1.6" marker-end="url(#arr-green)"/>
    <line x1="584" y1="636" x2="642" y2="650" stroke="#46A171" stroke-width="1.6" marker-end="url(#arr-green)"/>
    <line x1="600" y1="658" x2="658" y2="672" stroke="#16A34A" stroke-width="2.6" marker-end="url(#arr-green)"/>
    <circle cx="600" cy="658" r="4" fill="#16A34A"/>
    <line x1="594" y1="680" x2="650" y2="694" stroke="#46A171" stroke-width="1.6" marker-end="url(#arr-green)"/>
    <line x1="686" y1="620" x2="740" y2="634" stroke="#46A171" stroke-width="1.6" marker-end="url(#arr-green)"/>
    <line x1="680" y1="654" x2="736" y2="668" stroke="#46A171" stroke-width="1.6" marker-end="url(#arr-green)"/>
