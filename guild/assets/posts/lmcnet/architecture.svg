<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="980" height="400" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title" fill="#111827">图 1：LMCNet 整体工作流程（宏观全景）</text>
  <text x="490" y="60" text-anchor="middle" class="sub" fill="#4B5563">4D 双边构图与拉普拉斯特征分解全网复用 → 4 个 LMCBlock 协同平滑 → 输出内点概率</text>

  <!-- Stage 1: Input -->
  <rect x="24" y="86" width="186" height="256" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="117" y="114" text-anchor="middle" class="h" fill="#1E293B">① 输入候选对应</text>

  <!-- Mini Frame A (Top) & Frame B (Bottom) -->
  <rect x="42" y="128" width="150" height="62" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="52" y="144" class="s" fill="#1D4ED8" font-weight="700">左图 (x, y)</text>
  <rect x="42" y="220" width="150" height="62" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="52" y="274" class="s" fill="#15803D" font-weight="700">右图 (u, v)</text>

  <!-- Candidate lines (inliers solid, outliers dashed red) -->
  <line x1="68" y1="168" x2="74" y2="246" stroke="#2563EB" stroke-width="2.2"/>
  <line x1="114" y1="162" x2="120" y2="242" stroke="#16A34A" stroke-width="2.2"/>
  <line x1="158" y1="170" x2="90" y2="254" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5,4"/>
  <line x1="92" y1="158" x2="168" y2="244" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="5,4"/>

  <!-- Points -->
  <circle cx="68" cy="168" r="5" fill="#2563EB"/><circle cx="74" cy="246" r="5" fill="#2563EB"/>
  <circle cx="114" cy="162" r="5" fill="#16A34A"/><circle cx="120" cy="242" r="5" fill="#16A34A"/>
  <circle cx="158" cy="170" r="4.5" fill="#EF4444"/><circle cx="90" cy="254" r="4.5" fill="#EF4444"/>
  <circle cx="92" cy="158" r="4.5" fill="#EF4444"/><circle cx="168" cy="244" r="4.5" fill="#EF4444"/>

  <text x="117" y="308" text-anchor="middle" class="b" fill="#1E293B" font-weight="700">N 条 4D 坐标（含外点）</text>
  <text x="117" y="328" text-anchor="middle" class="s" fill="#64748B">可选描述子（LMCNet-F）</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="214" x2="242" y2="214" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Bilateral Graph & Spectral Precompute -->
  <rect x="248" y="86" width="206" height="256" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="351" y="114" text-anchor="middle" class="h" fill="#9A3412">② 4D 图谱预处理</text>

  <rect x="264" y="128" width="174" height="70" rx="8" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.8"/>
  <text x="351" y="150" text-anchor="middle" class="h" fill="#C2410C">4D 双边 KNN 图</text>
  <text x="351" y="170" text-anchor="middle" class="s" fill="#4B5563">k=8 近邻 · 高斯边权</text>
  <text x="351" y="188" text-anchor="middle" class="s" fill="#EA580C" font-weight="700">深度边界自动断边</text>

  <line x1="351" y1="198" x2="351" y2="213" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-orange)"/>

  <rect x="264" y="217" width="174" height="70" rx="8" fill="#FFFFFF" stroke="#FB923C" stroke-width="1.8"/>
  <text x="351" y="239" text-anchor="middle" class="h" fill="#C2410C">拉普拉斯截断分解</text>
  <text x="351" y="259" text-anchor="middle" class="s" fill="#4B5563">仅取最小 kₑ=32 特征对</text>
  <text x="351" y="277" text-anchor="middle" class="s" fill="#64748B">低频基底 (U₃₂, Λ₃₂)</text>

  <rect x="264" y="299" width="174" height="30" rx="15" fill="#FFEDD5" stroke="#FB923C" stroke-width="1.5"/>
  <text x="351" y="318" text-anchor="middle" class="s" fill="#9A3412" font-weight="700">每对图只算一次 · 全网复用</text>

  <!-- Arrow 2->3 -->
  <line x1="454" y1="214" x2="490" y2="214" stroke="#EA580C" stroke-width="2.5" marker-end="url(#arr-orange)"/>

  <!-- Stage 3: 4 x LMCBlock -->
  <rect x="496" y="86" width="240" height="256" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="616" y="114" text-anchor="middle" class="h" fill="#1E3A8A">③ 4 × LMCBlock 引擎</text>

  <rect x="514" y="130" width="204" height="64" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="616" y="155" text-anchor="middle" class="h" fill="#047857">局部 LC-Layer（k=8）</text>
  <text x="616" y="178" text-anchor="middle" class="s" fill="#4B5563">贴身邻居特征差作证 · 16× 瓶颈</text>

  <line x1="616" y1="194" x2="616" y2="212" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="514" y="216" width="204" height="64" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="616" y="241" text-anchor="middle" class="h" fill="#1D4ED8">全局 CR-Layer（闭式）</text>
  <text x="616" y="264" text-anchor="middle" class="s" fill="#4B5563">图频域低通滤波 + 残差提取</text>

  <rect x="514" y="294" width="204" height="34" rx="16" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="616" y="315" text-anchor="middle" class="s" fill="#5B21B6" font-weight="700">+ ContextNorm 与 ClusterLayer</text>

  <!-- Arrow 3->4 -->
  <line x1="736" y1="214" x2="768" y2="214" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 4: Output -->
  <rect x="774" y="86" width="182" height="256" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="865" y="114" text-anchor="middle" class="h" fill="#5B21B6">④ 概率预测与剔除</text>

  <rect x="792" y="128" width="146" height="62" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <rect x="792" y="220" width="146" height="62" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>

  <!-- Clean inlier matches -->
  <line x1="818" y1="164" x2="824" y2="250" stroke="#2563EB" stroke-width="2.4"/>
  <line x1="860" y1="156" x2="866" y2="244" stroke="#16A34A" stroke-width="2.4"/>
  <line x1="898" y1="168" x2="904" y2="254" stroke="#7C3AED" stroke-width="2.4"/>
  <circle cx="818" cy="164" r="5" fill="#2563EB"/><circle cx="824" cy="250" r="5" fill="#2563EB"/>
  <circle cx="860" cy="156" r="5" fill="#16A34A"/><circle cx="866" cy="244" r="5" fill="#16A34A"/>
  <circle cx="898" cy="168" r="5" fill="#7C3AED"/><circle cx="904" cy="254" r="5" fill="#7C3AED"/>

  <!-- Pruned outliers with red X -->
  <circle cx="922" cy="146" r="4.5" fill="#CBD5E1"/>
  <line x1="917" y1="141" x2="927" y2="151" stroke="#EF4444" stroke-width="2"/>
  <line x1="927" y1="141" x2="917" y2="151" stroke="#EF4444" stroke-width="2"/>
  <circle cx="808" cy="264" r="4.5" fill="#CBD5E1"/>
  <line x1="803" y1="259" x2="813" y2="269" stroke="#EF4444" stroke-width="2"/>
  <line x1="813" y1="259" x2="803" y2="269" stroke="#EF4444" stroke-width="2"/>

  <text x="865" y="308" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">pᵢ &gt; 0.95 判为内点</text>
  <text x="865" y="328" text-anchor="middle" class="s" fill="#64748B">按需接 RANSAC 估位姿</text>

  <!-- Footer -->
  <text x="490" y="376" text-anchor="middle" class="s" fill="#6B7280">核心突破：将全局图拉普拉斯平滑写成可微闭式矩阵乘，与局部邻域、长程聚类协同剔除误匹配</text>
</svg>
