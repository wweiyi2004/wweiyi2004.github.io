  <text x="480" y="360" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">防塌缩关键细节：每张图 n = 500 个点的权重 w_i = (1/σ_i) / Σ(1/σ_j) 必须归一化到总和严格为 1！</text>
  <text x="480" y="380" text-anchor="middle" class="b" fill="#9A3412">否则网络会故意把所有特征变糊来拉大 σ 逃避 Loss；归一化后彻底堵死偷懒路，逼出高置信清晰匹配</text>

