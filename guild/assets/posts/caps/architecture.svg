<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 404" width="980" height="404">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="404" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">图 1：CAPS 整体工作流程（宏观全景）</text>
  <text x="490" y="60" text-anchor="middle" class="sub">训练时只用相对相机位姿导出极线弱监督 → 推理时卸掉全部匹配层，单图直出 256 维层级描述子</text>

  <!-- Stage 1: Input -->
  <rect x="24" y="86" width="186" height="252" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="117" y="112" text-anchor="middle" class="h" fill="#1E293B">① 输入双图与位姿</text>

  <!-- Mini Image I1 -->
  <rect x="40" y="126" width="154" height="68" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="117" y="145" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">图 I₁（采查询点）</text>
  <circle cx="76" cy="170" r="7" fill="#2563EB"/>
  <text x="95" y="175" class="s" fill="#1E40AF" font-weight="700">x₁</text>
  <circle cx="132" cy="164" r="5" fill="#16A34A"/>
  <circle cx="164" cy="176" r="5" fill="#7C3AED"/>

  <!-- Mini Image I2 -->
  <rect x="40" y="206" width="154" height="68" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.6"/>
  <text x="117" y="225" text-anchor="middle" class="b" fill="#15803D" font-weight="700">图 I₂（不同视角）</text>
  <circle cx="88" cy="252" r="5.5" fill="#2563EB"/>
  <circle cx="136" cy="244" r="5" fill="#16A34A"/>
  <circle cx="166" cy="258" r="5" fill="#7C3AED"/>

  <!-- Pose badge -->
  <rect x="40" y="286" width="154" height="38" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="117" y="310" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">相对位姿 → F</text>

  <!-- Arrow 1->2 -->
  <line x1="210" y1="208" x2="242" y2="208" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: Shared Encoder -->
  <rect x="248" y="86" width="194" height="252" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="345" y="112" text-anchor="middle" class="h" fill="#1E3A8A">② 共享双尺度编码</text>

  <rect x="264" y="124" width="162" height="46" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="345" y="144" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">ResNet-50 主干</text>
  <text x="345" y="162" text-anchor="middle" class="s">双图权重完全共享</text>

  <line x1="345" y1="170" x2="345" y2="188" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="264" y="192" width="162" height="52" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="345" y="213" text-anchor="middle" class="b" fill="#1E40AF" font-weight="700">粗特征图 Mᶜ (1/16)</text>
  <text x="345" y="233" text-anchor="middle" class="s">128 维 · 全局大视野</text>

  <line x1="345" y1="244" x2="345" y2="264" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="387" y="259" text-anchor="middle" class="s" fill="#15803D">上采样融合</text>

  <rect x="264" y="268" width="162" height="52" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
  <text x="345" y="289" text-anchor="middle" class="b" fill="#047857" font-weight="700">细特征图 Mᶠ (1/4)</text>
  <text x="345" y="309" text-anchor="middle" class="s">128 维 · 高清局部细节</text>

  <!-- Arrow 2->3 -->
  <line x1="442" y1="208" x2="474" y2="208" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Coarse-to-Fine Differentiable Matching -->
  <rect x="480" y="86" width="222" height="252" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="591" y="112" text-anchor="middle" class="h" fill="#065F46">③ 粗到细可微匹配</text>

  <rect x="496" y="128" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="591" y="151" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">粗图全图 2D Softmax</text>
  <text x="591" y="171" text-anchor="middle" class="s">锁定峰值 + 粗期望 x̂₂ᶜ</text>

  <line x1="591" y1="184" x2="591" y2="204" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="646" y="198" text-anchor="middle" class="s" fill="#15803D" font-weight="700">峰值 ×4 裁窗</text>

  <rect x="496" y="208" width="190" height="56" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.6"/>
  <text x="591" y="231" text-anchor="middle" class="b" fill="#047857" font-weight="700">细图局部窗 W 精修</text>
  <text x="591" y="251" text-anchor="middle" class="s">输出精细期望坐标 x̂₂ᶠ</text>

  <rect x="496" y="278" width="190" height="44" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="591" y="297" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">免参数方差不确定度 σ²</text>
  <text x="591" y="314" text-anchor="middle" class="s" fill="#9A3412">自动给遮挡点降权</text>

  <!-- Arrow 3->4 -->
  <line x1="702" y1="208" x2="734" y2="208" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Training vs Inference -->
  <rect x="740" y="86" width="216" height="252" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="848" y="112" text-anchor="middle" class="h" fill="#5B21B6">④ 训练监督 vs 推理</text>

  <!-- Training box -->
  <rect x="756" y="126" width="184" height="108" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <text x="848" y="145" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">训练：推向极线 l₂ = F·x₁</text>
  <!-- Mini epipolar sketch (lifted cleanly above bottom text) -->
  <line x1="774" y1="205" x2="922" y2="162" stroke="#2563EB" stroke-width="2.2"/>
  <circle cx="826" cy="162" r="5" fill="#EA580C"/>
  <text x="812" y="166" text-anchor="end" class="s" fill="#C2410C" font-weight="700">x̂₂</text>
  <line x1="829" y1="168" x2="835" y2="184" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <circle cx="878" cy="175" r="4.8" fill="#16A34A"/>
  <text x="902" y="198" text-anchor="middle" class="s" fill="#1D4ED8">极线 l₂</text>
  <text x="848" y="225" text-anchor="middle" class="s">极线 + 循环一致双尺度反传</text>

  <!-- Inference box -->
  <rect x="756" y="246" width="184" height="76" rx="8" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
  <text x="848" y="269" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">推理：全部卸甲！</text>
  <text x="848" y="290" text-anchor="middle" class="s" fill="#4C1D95">单图前向，不要 F 与匹配层</text>
  <text x="848" y="310" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">插值拼接 → 256 维描述子</text>

  <!-- Bottom crisp summary -->
  <text x="490" y="376" text-anchor="middle" class="s">训练期零像素标注，只靠相机位姿驱动双尺度学习；推理期可自由搭配 SIFT / SuperPoint 等任意检测器做欧氏距离匹配</text>

</svg>