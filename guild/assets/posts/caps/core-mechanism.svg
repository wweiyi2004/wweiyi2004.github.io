<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 418" width="980" height="418">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="418" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title">图 2：可微匹配层——用“软期望坐标”取代 argmax 打通梯度</text>
  <text x="490" y="60" text-anchor="middle" class="sub">只给相机位姿（极线在坐标空间）怎么反传给 CNN？看 4×4 概率分布如何把“离散选点”变成“连续可微坐标”</text>

  <!-- Left Panel: 2D Softmax Heatmap -->
  <rect x="28" y="84" width="448" height="250" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="252" y="110" text-anchor="middle" class="h" fill="#1E3A8A">① 全图特征内积 → 2D Softmax 概率分布 p(x|x₁)</text>

  <!-- Mini Image 1 (compact with ample room for arrow & labels) -->
  <rect x="42" y="146" width="96" height="114" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="90" y="168" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">图 1 查询点</text>
  <circle cx="90" cy="204" r="9" fill="#2563EB"/>
  <text x="90" y="208" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">x₁</text>
  <text x="90" y="242" text-anchor="middle" class="s" fill="#1E40AF">向量 M₁(x₁)</text>

  <!-- Arrow to Matrix (generous 62px span so Softmax never touches borders) -->
  <line x1="142" y1="204" x2="198" y2="204" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <text x="170" y="193" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">内积</text>
  <text x="170" y="222" text-anchor="middle" class="s" fill="#1D4ED8">Softmax</text>

  <text x="265.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">u=0</text>
  <text x="319.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">u=1</text>
  <text x="373.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">u=2</text>
  <text x="427.0" y="138" text-anchor="middle" class="s" fill="#334155" font-weight="700">u=3</text>
  <text x="232" y="168.5" text-anchor="end" class="s" fill="#334155" font-weight="700">v=0</text>
  <rect x="240" y="146" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="265.0" y="168.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.01</text>
  <rect x="294" y="146" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="319.0" y="168.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.02</text>
  <rect x="348" y="146" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="373.0" y="168.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.04</text>
  <rect x="402" y="146" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="427.0" y="168.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.01</text>
  <text x="232" y="208.5" text-anchor="end" class="s" fill="#334155" font-weight="700">v=1</text>
  <rect x="240" y="186" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="265.0" y="208.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.02</text>
  <rect x="294" y="186" width="50" height="36" rx="6" fill="#93C5FD" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="319.0" y="208.5" text-anchor="middle" class="mono" font-size="13" fill="#1E3A8A">0.12</text>
  <rect x="348" y="186" width="50" height="36" rx="6" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.2"/>
  <text x="373.0" y="208.5" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">0.56</text>
  <rect x="402" y="186" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="427.0" y="208.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.04</text>
  <text x="232" y="248.5" text-anchor="end" class="s" fill="#334155" font-weight="700">v=2</text>
  <rect x="240" y="226" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="265.0" y="248.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.01</text>
  <rect x="294" y="226" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="319.0" y="248.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.03</text>
  <rect x="348" y="226" width="50" height="36" rx="6" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="373.0" y="248.5" text-anchor="middle" class="mono" font-size="13" fill="#1E40AF">0.09</text>
  <rect x="402" y="226" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="427.0" y="248.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.02</text>
  <text x="232" y="288.5" text-anchor="end" class="s" fill="#334155" font-weight="700">v=3</text>
  <rect x="240" y="266" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="265.0" y="288.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.00</text>
  <rect x="294" y="266" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="319.0" y="288.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.01</text>
  <rect x="348" y="266" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="373.0" y="288.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.01</text>
  <rect x="402" y="266" width="50" height="36" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.2"/>
  <text x="427.0" y="288.5" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.01</text>

  <text x="346" y="321" text-anchor="middle" class="s">图 2 网格概率和 = 1.00（最像处最高）</text>

  <!-- Split Arrows from Left Panel to Right Cards -->
  <path d="M 476 178 C 498 178 498 136 516 136" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
  <path d="M 476 236 C 498 236 498 270 516 270" fill="none" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Right Top Card: argmax (NO) -->
  <rect x="522" y="84" width="430" height="108" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="542" y="110" class="h" fill="#991B1B">✗ 传统 argmax（硬选唯一最大值格子）</text>
  <rect x="542" y="124" width="114" height="52" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5"/>
  <text x="599" y="145" text-anchor="middle" class="s" fill="#991B1B">离散输出</text>
  <text x="599" y="166" text-anchor="middle" class="mono" font-size="14" fill="#DC2626">(2, 1)</text>
  <text x="674" y="144" class="b" fill="#7F1D1D">• 特征微调时坐标纹丝不动</text>
  <text x="674" y="168" class="b" fill="#7F1D1D" font-weight="700">• 梯度为 0 → 反向传播彻底断路！</text>

  <!-- Right Bottom Card: Soft Expectation (YES) -->
  <rect x="522" y="208" width="430" height="126" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="542" y="234" class="h" fill="#166534">✓ CAPS 软期望坐标（对全部网格坐标加权平均）</text>
  <rect x="542" y="248" width="390" height="34" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.5"/>
  <text x="737" y="270" text-anchor="middle" class="mono" font-size="13.5" fill="#15803D">x̂₂ = Σ x · p(x | x₁) = (1.82, 1.13)</text>
  <text x="542" y="302" class="b" fill="#14532D">• 输出连续可微：微调任意格子内积，x̂₂ 立刻平滑移动</text>
  <text x="542" y="322" class="b" fill="#14532D">• 梯度顺着 x̂₂ → Softmax → 特征内积一路回传更新编码器！</text>

  <!-- Bottom Callout -->
  <rect x="28" y="350" width="924" height="52" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="490" y="372" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">梯度直觉：若真实极线在 (2, 2) 下方，Loss 把期望 v̂ 往下拉 → 反向传播自动调高 (2, 2) 特征内积、压低错处内积</text>
  <text x="490" y="392" text-anchor="middle" class="b" fill="#9A3412">无需人工标注正负样本，仅靠二维坐标空间的极线推力，就把真正对应的物理点特征编码得越来越像！</text>

</svg>