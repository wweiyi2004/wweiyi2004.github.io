<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EF4444"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-blue-sm" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green-sm" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-red-sm" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M 0 1.2 L 10 5 L 0 8.8 z" fill="#EF4444"/>
    </marker>
  </defs>

  <rect width="980" height="410" fill="#FFFFFF" rx="12"/>

  <text x="490" y="38" text-anchor="middle" class="title">图 1：ConvMatch 整体工作流程（宏观全景）</text>
  <text x="490" y="62" text-anchor="middle" class="sub">把无序对应点搬上 16×16 规则网格 → 经典 3×3 CNN 像图像去噪一样修运动场 → 对比前后变化揪出外点</text>

  <!-- Stage 1: Input -->
  <rect x="26" y="90" width="192" height="264" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="122" y="117" text-anchor="middle" class="h" fill="#1E293B">① 输入无序运动点</text>

  <!-- Mini 2D scattered motion field -->
  <rect x="44" y="133" width="156" height="130" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <circle cx="66" cy="174" r="4" fill="#16A34A"/>
  <line x1="66" y1="174" x2="94" y2="158" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <circle cx="118" cy="168" r="4" fill="#16A34A"/>
  <line x1="118" y1="168" x2="146" y2="152" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <circle cx="74" cy="226" r="4" fill="#16A34A"/>
  <line x1="74" y1="226" x2="102" y2="210" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <circle cx="136" cy="228" r="4" fill="#16A34A"/>
  <line x1="136" y1="228" x2="164" y2="212" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <!-- 1 rogue red outlier vector -->
  <circle cx="134" cy="195" r="4.5" fill="#EF4444"/>
  <line x1="134" y1="195" x2="96" y2="199" stroke="#EF4444" stroke-width="2.4" marker-end="url(#arr-red-sm)"/>
  <text x="122" y="253" text-anchor="middle" class="s" fill="#475569">N 对无序匹配（含外点）</text>

  <!-- Fixed 16x16 grid badge -->
  <rect x="44" y="278" width="156" height="58" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="122" y="302" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">+ 固定 16×16 网格</text>
  <text x="122" y="323" text-anchor="middle" class="s" fill="#3B82F6">256 个等距中心 X_grid</text>

  <!-- Arrow 1->2 -->
  <line x1="218" y1="222" x2="254" y2="222" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2: 6x Rectifying Conv Layers -->
  <rect x="260" y="90" width="260" height="264" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="390" y="117" text-anchor="middle" class="h" fill="#1E3A8A">② 6 层纠正卷积（L = 6）</text>

  <rect x="280" y="133" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="390" y="153" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">Regularize · GAT 网格化</text>
  <text x="390" y="171" text-anchor="middle" class="s" fill="#4B5563">无序点 → 16×16 规则特征图</text>

  <line x1="390" y1="179" x2="390" y2="196" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="280" y="200" width="220" height="46" rx="8" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.8"/>
  <text x="390" y="220" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">Rectify · 3×ResBlock CNN</text>
  <text x="390" y="238" text-anchor="middle" class="s" fill="#9A3412">3×3 卷积低通去噪，掰正异常格子</text>

  <line x1="390" y1="246" x2="390" y2="263" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="280" y="267" width="220" height="46" rx="8" fill="#FFFFFF" stroke="#34D399" stroke-width="1.8"/>
  <text x="390" y="287" text-anchor="middle" class="b" fill="#047857" font-weight="700">Recover · GAT 采回无序点</text>
  <text x="390" y="305" text-anchor="middle" class="s" fill="#4B5563">规则网格 → 更新后无序特征 f̃</text>

  <text x="390" y="339" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">串联堆叠 6 层，像剥洋葱一样渐进提纯</text>

  <!-- Arrow 2->3 -->
  <line x1="520" y1="222" x2="554" y2="222" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Residual Inlier Predictor -->
  <rect x="560" y="122" width="168" height="200" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
  <text x="644" y="150" text-anchor="middle" class="h" fill="#065F46">③ 残差对比判别</text>

  <rect x="578" y="168" width="132" height="52" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <text x="644" y="190" text-anchor="middle" class="b" fill="#065F46" font-weight="700">特征改变量 Δf</text>
  <text x="644" y="210" text-anchor="middle" class="mono" font-size="12.5" fill="#047857">Δf = f̃ − f</text>

  <line x1="644" y1="220" x2="644" y2="242" stroke="#16A34A" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="578" y="247" width="132" height="54" rx="8" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.6"/>
  <text x="644" y="269" text-anchor="middle" class="b" fill="#065F46" font-weight="700">Inlier Predictor</text>
  <text x="644" y="289" text-anchor="middle" class="s" fill="#4B5563">输出内点分数 ẑ_i</text>

  <!-- Arrow 3->4 -->
  <line x1="728" y1="222" x2="762" y2="222" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: Clean Output -->
  <rect x="768" y="90" width="186" height="264" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="861" y="117" text-anchor="middle" class="h" fill="#5B21B6">④ 输出干净内点</text>

  <rect x="786" y="133" width="150" height="136" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.6"/>
  <circle cx="808" cy="174" r="4" fill="#16A34A"/>
  <line x1="808" y1="174" x2="836" y2="158" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <circle cx="860" cy="168" r="4" fill="#16A34A"/>
  <line x1="860" y1="168" x2="888" y2="152" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <circle cx="816" cy="230" r="4" fill="#16A34A"/>
  <line x1="816" y1="230" x2="844" y2="214" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <circle cx="876" cy="230" r="4" fill="#16A34A"/>
  <line x1="876" y1="230" x2="904" y2="214" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green-sm)"/>
  <!-- Crossed out outlier -->
  <circle cx="874" cy="196" r="5" fill="#CBD5E1"/>
  <line x1="868" y1="190" x2="880" y2="202" stroke="#EF4444" stroke-width="2.4"/>
  <line x1="880" y1="190" x2="868" y2="202" stroke="#EF4444" stroke-width="2.4"/>
  <text x="861" y="259" text-anchor="middle" class="s" fill="#15803D" font-weight="700">✓ 留内点 · ✗ 踢外点</text>

  <rect x="786" y="284" width="150" height="52" rx="8" fill="#EDE9FE" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="861" y="306" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">筛选 ẑ_i &gt; 0</text>
  <text x="861" y="325" text-anchor="middle" class="s" fill="#6D28D9">加权八点法 / RANSAC</text>

  <!-- Footer -->
  <text x="490" y="388" text-anchor="middle" class="s" fill="#6B7280">核心破局：借道“隐式稠密运动场 + 规则网格”，彻底抛弃 MLP 补丁，直接用经典 CNN 捕获局部到全局上下文</text>

</svg>