  <text x="259.0" y="242.0" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.07</text>
  <text x="62" y="284.0" text-anchor="end" class="b" fill="#DC2626" font-weight="700">A4*</text>
  <rect x="72" y="260" width="50" height="38" rx="6" fill="#FFF7ED" stroke="#CBD5E1" stroke-width="1"/>
  <text x="97.0" y="284.0" text-anchor="middle" class="mono" font-size="13" fill="#C2410C">0.22</text>
