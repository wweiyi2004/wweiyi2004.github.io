  <text x="178" y="324" text-anchor="middle" class="s" fill="#475569">L_ds 逼对角线趋近 1 · 白墙 A4* 难分高下</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="294" y1="215" x2="342" y2="215" stroke="#EA580C" stroke-width="2.4" marker-end="url(#arr-orange)"/>
  <text x="318" y="202" text-anchor="middle" class="s" fill="#C2410C" font-weight="700">取最大</text>

  <!-- Middle Panel -->
  <rect x="350" y="114" width="230" height="192" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="362" y="158.0" text-anchor="start" class="s" fill="#334155" font-weight="700">A1 角点</text>
