  <rect x="72" y="176" width="50" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="97.0" y="200.0" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.02</text>
  <rect x="126" y="176" width="50" height="38" rx="6" fill="#2563EB" stroke="#CBD5E1" stroke-width="1"/>
  <text x="151.0" y="200.0" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">0.90</text>
  <rect x="180" y="176" width="50" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="205.0" y="200.0" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.05</text>
  <rect x="234" y="176" width="50" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="259.0" y="200.0" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.03</text>
  <text x="62" y="242.0" text-anchor="end" class="b" fill="#334155" font-weight="700">A3</text>
  <rect x="72" y="218" width="50" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="97.0" y="242.0" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.02</text>
  <rect x="126" y="218" width="50" height="38" rx="6" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
  <text x="151.0" y="242.0" text-anchor="middle" class="mono" font-size="13" fill="#64748B">0.04</text>
  <rect x="180" y="218" width="50" height="38" rx="6" fill="#2563EB" stroke="#CBD5E1" stroke-width="1"/>
  <text x="205.0" y="242.0" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">0.87</text>
