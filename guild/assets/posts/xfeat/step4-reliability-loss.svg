  <rect x="516" y="137" width="50" height="32" rx="6" fill="#16A34A"/>
  <text x="541" y="158.0" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">0.87</text>
  <text x="362" y="200.0" text-anchor="start" class="s" fill="#334155" font-weight="700">A2 窗角</text>
  <text x="470" y="200.0" text-anchor="middle" class="mono" font-size="12" fill="#475569">0.90×0.89 =</text>
  <rect x="516" y="179" width="50" height="32" rx="6" fill="#16A34A"/>
  <text x="541" y="200.0" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">0.80</text>
  <text x="362" y="242.0" text-anchor="start" class="s" fill="#334155" font-weight="700">A3 门楣</text>
  <text x="470" y="242.0" text-anchor="middle" class="mono" font-size="12" fill="#475569">0.87×0.86 =</text>
  <rect x="516" y="221" width="50" height="32" rx="6" fill="#16A34A"/>
  <text x="541" y="242.0" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">0.75</text>
  <text x="362" y="284.0" text-anchor="start" class="s" fill="#DC2626" font-weight="700">A4* 白墙</text>
  <text x="470" y="284.0" text-anchor="middle" class="mono" font-size="12" fill="#475569">0.29×0.25 =</text>
  <rect x="516" y="263" width="50" height="32" rx="6" fill="#EA580C"/>
  <text x="541" y="284.0" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">0.07</text>
  <text x="466" y="324" text-anchor="middle" class="s" fill="#C2410C">双图匹配难度自动变成 0~1 标签</text>

  <!-- Stop-Gradient Bridge 2 -> 3 -->
  <line x1="580" y1="215" x2="652" y2="215" stroke="#DC2626" stroke-width="2.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <rect x="585" y="176" width="66" height="26" rx="13" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.5"/>
  <text x="618" y="193" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">截断梯度</text>
  <text x="618" y="236" text-anchor="middle" class="s" fill="#B91C1C" font-weight="700">Stop-Grad</text>
  <text x="618" y="254" text-anchor="middle" class="s" fill="#64748B">不改描述子</text>

  <!-- Right Panel: Reliability Head -->
  <rect x="660" y="114" width="296" height="192" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>

  <rect x="676" y="128" width="264" height="54" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
  <text x="808" y="151" text-anchor="middle" class="b" fill="#166534" font-weight="700">L1 逼近：σ(R) → max(S) ⊙ max(Sᵀ)</text>
  <text x="808" y="172" text-anchor="middle" class="s" fill="#15803D">逼着单张图提前猜出“将来好不好配”</text>

  <rect x="676" y="194" width="264" height="44" rx="8" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.4"/>
  <text x="808" y="221" text-anchor="middle" class="b" fill="#14532D" font-weight="700">✓ 高分角点（0.87）→ 稀疏 K·R 优先留</text>

  <rect x="676" y="248" width="264" height="44" rx="8" fill="#FEF2F2" stroke="#F87171" stroke-width="1.4"/>
  <text x="808" y="275" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">✗ 低分白墙（0.07）→ 半稠密 10k 剔除</text>

  <text x="808" y="324" text-anchor="middle" class="s" fill="#166534">推理时无需第二张图，单图直接筛出好点</text>

  <!-- Bottom crisp callout -->
  <rect x="32" y="340" width="916" height="52" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/>
  <text x="490" y="363" text-anchor="middle" class="b" fill="#1E3A8A" font-weight="700">原论文重点提醒：为什么 L_rel 必须对目标 max(S) ⊙ max(Sᵀ) 截断梯度？</text>
  <text x="490" y="383" text-anchor="middle" class="b" fill="#1E3A8A">因为可靠性头只能老实拟合描述子的真实匹配难度，绝不能反过来修改描述子（防止网络把描述子学烂来“作弊”迁就低分）！</text>
</svg>