  <rect width="980" height="410" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title" fill="#111827">图 5：可靠性图 R 怎么自监督？拿双向 Softmax 成绩单反哺单图</text>
  <text x="490" y="60" text-anchor="middle" class="sub" fill="#4B5563">训练时直接拿双图最大匹配概率乘积 max(S) ⊙ max(Sᵀ) 当现成标签教可靠性头，并截断梯度保护描述子</text>

  <!-- Step headers -->
  <text x="178" y="98" text-anchor="middle" class="h" fill="#1D4ED8">① 双向 Softmax 概率（4×4 示例）</text>
  <text x="466" y="98" text-anchor="middle" class="h" fill="#C2410C">② 联合置信度 max(S) ⊙ max(Sᵀ)</text>
  <text x="808" y="98" text-anchor="middle" class="h" fill="#166534">③ 监督单图可靠性头 R</text>

  <!-- Matrix -->
  <text x="97.0" y="122" text-anchor="middle" class="b" fill="#334155" font-weight="700">B1</text>
  <text x="151.0" y="122" text-anchor="middle" class="b" fill="#334155" font-weight="700">B2</text>
  <text x="205.0" y="122" text-anchor="middle" class="b" fill="#334155" font-weight="700">B3</text>
  <text x="259.0" y="122" text-anchor="middle" class="b" fill="#DC2626" font-weight="700">B4*</text>
