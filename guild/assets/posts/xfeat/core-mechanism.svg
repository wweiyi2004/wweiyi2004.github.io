<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 412" width="960" height="412">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="412" fill="#FFFFFF" rx="12"/>

  <text x="480" y="36" text-anchor="middle" class="title" fill="#111827">图 2：超轻量主干核心直觉——“早窄晚三倍增”重分配算力</text>
  <text x="480" y="60" text-anchor="middle" class="sub" fill="#4B5563">卷积开销 F_ops = H·W·C_in·C_out·k²：浅层像素数极大，压窄浅层通道让单层算力直砍 256 倍</text>

  <!-- Left Panel: Traditional VGG-style (NO) -->
  <rect x="24" y="86" width="432" height="252" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="240" y="114" text-anchor="middle" class="h" fill="#991B1B">✗ 传统浅层宽通道（如 SuperPoint）</text>

  <rect x="42" y="128" width="396" height="148" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>

  <!-- Alert tag above Block 1 -->
  <rect x="54" y="138" width="152" height="24" rx="12" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.3"/>
  <text x="130" y="155" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">单层 17.7 GFLOPs !</text>

  <!-- 3 Thick Red Feature Slabs (bottom aligned at y=246) -->
  <rect x="78" y="172" width="56" height="74" rx="5" fill="#EF4444" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="106" y="214" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">C=64</text>
  <text x="106" y="264" text-anchor="middle" class="s" fill="#991B1B" font-weight="700">原图 1×</text>

  <line x1="142" y1="214" x2="174" y2="214" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="182" y="190" width="56" height="56" rx="5" fill="#F87171" stroke="#DC2626" stroke-width="1.5"/>
  <text x="210" y="223" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">C=64</text>
  <text x="210" y="264" text-anchor="middle" class="s" fill="#64748B">1/2 尺度</text>

  <line x1="246" y1="218" x2="278" y2="218" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr-gray)"/>

  <rect x="286" y="206" width="84" height="40" rx="5" fill="#FCA5A5" stroke="#EF4444" stroke-width="1.5"/>
  <text x="328" y="231" text-anchor="middle" class="mono" font-size="13" fill="#7F1D1D">C=128</text>
  <text x="328" y="264" text-anchor="middle" class="s" fill="#64748B">1/4 尺度</text>

  <text x="346" y="160" text-anchor="middle" class="s" fill="#B91C1C" font-weight="700">分辨率减半</text>
  <text x="346" y="178" text-anchor="middle" class="s" fill="#B91C1C">通道翻 2 倍</text>

  <text x="240" y="302" text-anchor="middle" class="b" fill="#7F1D1D">• 浅层像素极多却配 64 通道，算力浪费在底层边缘纹理</text>
  <text x="240" y="324" text-anchor="middle" class="b" fill="#7F1D1D">• 笔记本 CPU 仅 3.0 FPS，高分辨率实时匹配跑不动</text>

  <!-- Right Panel: XFeat Backbone (YES) -->
  <rect x="476" y="86" width="460" height="252" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="706" y="114" text-anchor="middle" class="h" fill="#166534">✓ XFeat 算力重分配：6 块通道 {4, 8, 24, 64, 64, 128}</text>

  <rect x="494" y="128" width="424" height="148" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>

  <!-- Top callout tags -->
  <rect x="504" y="136" width="150" height="24" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.3"/>
  <text x="579" y="153" text-anchor="middle" class="s" fill="#166534" font-weight="700">0.069 G（砍 256×）</text>

  <rect x="752" y="136" width="154" height="24" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.3"/>
  <text x="829" y="153" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">0.066 G（更便宜！）</text>

  <!-- Dashed guide lines from tags to B1 & B6 -->
  <line x1="526" y1="160" x2="526" y2="171" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="840" y1="160" x2="840" y2="202" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- 6 Progressive Blocks (bottom aligned at y=246) -->
  <text x="526" y="183" text-anchor="middle" class="mono" font-size="12" fill="#15803D">4</text>
  <rect x="520" y="188" width="12" height="58" rx="3" fill="#22C55E"/>
  <text x="526" y="264" text-anchor="middle" class="s" fill="#166534" font-weight="700">1×</text>

  <text x="568" y="191" text-anchor="middle" class="mono" font-size="12" fill="#15803D">8</text>
  <rect x="560" y="196" width="16" height="50" rx="3" fill="#4ADE80" stroke="#16A34A" stroke-width="1"/>
  <text x="568" y="264" text-anchor="middle" class="s" fill="#64748B">1/2</text>

  <text x="618" y="199" text-anchor="middle" class="mono" font-size="12" fill="#15803D">24</text>
  <rect x="606" y="204" width="24" height="42" rx="4" fill="#86EFAC" stroke="#16A34A" stroke-width="1.2"/>
  <text x="618" y="264" text-anchor="middle" class="s" fill="#64748B">1/4</text>

  <text x="680" y="205" text-anchor="middle" class="mono" font-size="12" fill="#1D4ED8">64</text>
  <rect x="660" y="210" width="40" height="36" rx="4" fill="#93C5FD" stroke="#2563EB" stroke-width="1.3"/>
  <text x="680" y="264" text-anchor="middle" class="s" fill="#1D4ED8">1/8</text>

  <text x="748" y="211" text-anchor="middle" class="mono" font-size="12" fill="#1D4ED8">64</text>
  <rect x="728" y="216" width="40" height="30" rx="4" fill="#60A5FA" stroke="#2563EB" stroke-width="1.3"/>
  <text x="748" y="264" text-anchor="middle" class="s" fill="#1D4ED8">1/16</text>

  <text x="840" y="217" text-anchor="middle" class="mono" font-size="12" fill="#1E3A8A">128</text>
  <rect x="802" y="222" width="76" height="24" rx="4" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.4"/>
  <text x="840" y="264" text-anchor="middle" class="s" fill="#1D4ED8" font-weight="700">1/32</text>

  <text x="706" y="302" text-anchor="middle" class="b" fill="#14532D">• 浅层通道压到 4，保高分辨率同时切掉绝大部分 FLOPs</text>
  <text x="706" y="324" text-anchor="middle" class="b" fill="#14532D">• 低分深层迅速补足 64~128 通道 + FPN 融合，扛住大视角</text>

  <!-- Bottom Highlight Strip -->
  <rect x="24" y="352" width="912" height="44" rx="10" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.6"/>
  <text x="480" y="379" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">惊人算账（600×800）：在 1/32 分辨率跑满 128 通道（0.066 G），比在原图分辨率跑 4 通道（0.069 G）还要便宜！</text>
</svg>