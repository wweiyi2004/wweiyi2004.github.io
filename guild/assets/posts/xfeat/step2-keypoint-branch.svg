<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 398" width="960" height="398">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="960" height="398" fill="#FFFFFF" rx="12"/>

  <text x="480" y="36" text-anchor="middle" class="title" fill="#111827">图 3：为什么关键点分支必须独立？8×8 重排 + 1×1 卷积极简找点</text>
  <text x="480" y="60" text-anchor="middle" class="sub" fill="#4B5563">轻量主干容量紧俏，强行共享会让半稠密精度暴跌；拆出独立极简分支，零信息损失又不干扰主干</text>

  <!-- Left Panel: Shared Backbone (NO) -->
  <rect x="24" y="86" width="332" height="288" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="190" y="114" text-anchor="middle" class="h" fill="#991B1B">✗ 像 SuperPoint 共享小主干</text>

  <rect x="42" y="130" width="296" height="170" rx="8" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.6"/>
  <rect x="78" y="144" width="224" height="40" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.6"/>
  <text x="190" y="169" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">超轻量主干（容量很紧俏）</text>

  <line x1="145" y1="184" x2="112" y2="226" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="235" y1="184" x2="268" y2="226" stroke="#DC2626" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="190" y="214" text-anchor="middle" class="s" fill="#DC2626" font-weight="700">互抢容量！</text>

  <rect x="54" y="232" width="124" height="54" rx="7" fill="#FFF7ED" stroke="#FB923C" stroke-width="1.4"/>
  <text x="116" y="254" text-anchor="middle" class="b" fill="#9A3412" font-weight="700">描述子 F</text>
  <text x="116" y="274" text-anchor="middle" class="s" fill="#C2410C">非角点区域变糊</text>

  <rect x="198" y="232" width="124" height="54" rx="7" fill="#FEF2F2" stroke="#F87171" stroke-width="1.4"/>
  <text x="260" y="254" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">关键点 K</text>
  <text x="260" y="274" text-anchor="middle" class="s" fill="#B91C1C">把特征强行带偏</text>

  <rect x="42" y="312" width="296" height="48" rx="8" fill="#FEE2E2" stroke="#EF4444" stroke-width="1.4"/>
  <text x="190" y="333" text-anchor="middle" class="b" fill="#991B1B" font-weight="700">消融实测：半稠密 XFeat* 惨跌</text>
  <text x="190" y="352" text-anchor="middle" class="s" fill="#B91C1C" font-weight="700">AUC@5°：50.2 → 39.7（狂掉 10.5 分！）</text>

  <!-- Right Panel: Independent Branch (YES) -->
  <rect x="376" y="86" width="560" height="288" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="656" y="114" text-anchor="middle" class="h" fill="#166534">✓ XFeat 独立并行分支（感受野 8×8 · 主干零干扰）</text>

  <!-- Step 1: 8x8 pixel block -->
  <text x="440" y="143" text-anchor="middle" class="s" fill="#166534" font-weight="700">原图切 8×8 块</text>
  <rect x="400" y="152" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="420" y="152" width="18" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="440" y="152" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="460" y="152" width="18" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="400" y="172" width="18" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="420" y="172" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="440" y="172" width="18" height="18" rx="3" fill="#16A34A" stroke="#86EFAC" stroke-width="1"/>
  <rect x="460" y="172" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="400" y="192" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="420" y="192" width="18" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="440" y="192" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="460" y="192" width="18" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="400" y="212" width="18" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="420" y="212" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <rect x="440" y="212" width="18" height="18" rx="3" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1"/>
  <rect x="460" y="212" width="18" height="18" rx="3" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1"/>
  <text x="440" y="252" text-anchor="middle" class="s" fill="#374151">保留全部像素亮度</text>

  <!-- Arrow 1 -> 2 (Unfold) -->
  <line x1="486" y1="192" x2="532" y2="192" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <text x="508" y="181" text-anchor="middle" class="s" fill="#15803D" font-weight="700">Unfold</text>

  <!-- Step 2: 64-ch folded tensor (widened so H/8×W/8 fits with generous margin) -->
  <text x="572" y="143" text-anchor="middle" class="s" fill="#166534" font-weight="700">折进通道</text>
  <rect x="538" y="154" width="68" height="76" rx="7" fill="#16A34A" stroke="#15803D" stroke-width="1.6"/>
  <text x="572" y="187" text-anchor="middle" class="mono" font-size="13" fill="#FFFFFF">64 ch</text>
  <text x="572" y="210" text-anchor="middle" class="s" fill="#DCFCE7" font-weight="700">H/8×W/8</text>
  <text x="572" y="252" text-anchor="middle" class="s" fill="#374151">空间直缩 64×</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="606" y1="192" x2="632" y2="192" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <!-- Step 3: 4x 1x1 Conv -->
  <rect x="638" y="148" width="108" height="88" rx="8" fill="#FFFFFF" stroke="#16A34A" stroke-width="2"/>
  <text x="692" y="176" text-anchor="middle" class="h" fill="#166534">4 层 1×1</text>
  <text x="692" y="198" text-anchor="middle" class="b" fill="#14532D" font-weight="700">极速逐点卷积</text>
  <text x="692" y="220" text-anchor="middle" class="s" fill="#15803D">输出 65 通道</text>
  <text x="692" y="252" text-anchor="middle" class="s" fill="#374151">无昂贵高分 3×3</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="746" y1="192" x2="770" y2="192" stroke="#16A34A" stroke-width="2.2" marker-end="url(#arr-green)"/>

  <!-- Step 4: 64 + 1 dustbin -> Fold -->
  <rect x="776" y="138" width="144" height="114" rx="8" fill="#FFFFFF" stroke="#22C55E" stroke-width="1.8"/>
  <text x="848" y="159" text-anchor="middle" class="b" fill="#166534" font-weight="700">65 维格内分类</text>
  <rect x="790" y="168" width="84" height="22" rx="4" fill="#DCFCE7" stroke="#22C55E" stroke-width="1.2"/>
  <text x="832" y="183" text-anchor="middle" class="s" fill="#166534" font-weight="700">64 像素</text>
  <rect x="878" y="168" width="28" height="22" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="892" y="183" text-anchor="middle" class="s" fill="#475569" font-weight="700">无</text>

  <text x="848" y="213" text-anchor="middle" class="s" fill="#15803D">去 dustbin → Fold</text>
  <rect x="792" y="221" width="112" height="22" rx="6" fill="#16A34A"/>
  <text x="848" y="236" text-anchor="middle" class="s" fill="#FFFFFF" font-weight="700">全图热力图 K</text>

  <!-- Bottom summary inside Right Panel -->
  <rect x="396" y="280" width="524" height="80" rx="8" fill="#FFFFFF" stroke="#86EFAC" stroke-width="1.6"/>
  <text x="658" y="305" text-anchor="middle" class="b" fill="#166534" font-weight="700">怎么训？由轻量教师 ALIKE-Tiny 知识蒸馏（与 8×8 局部角点视野绝配）</text>
  <text x="658" y="328" text-anchor="middle" class="b" fill="#374151">怎么滤噪？推理时联合主干可靠性打分 score = K · R，轻松压掉重复纹理假点</text>
  <text x="658" y="349" text-anchor="middle" class="s" fill="#15803D">半稠密模式 XFeat* 甚至直接跳过该分支，零额外开销！</text>
</svg>