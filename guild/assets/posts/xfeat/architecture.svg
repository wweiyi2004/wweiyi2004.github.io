<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 740" width="1060" height="740">
  <defs>
    <style>
      text {
        font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 12.5px; fill: #4B5563; }
      .section-title { font-size: 13px; font-weight: 700; }
      .node-title { font-size: 13px; font-weight: 700; }
      .node-sub { font-size: 11.5px; }
      .node-dim { font-size: 11px; font-weight: 600; }
      .edge-label { font-size: 11px; fill: #374151; font-weight: 600; }
      .footnote { font-size: 11.5px; fill: #4B5563; }
    </style>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#64748B"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#2783DE"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#46A171"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#D5803B"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.2 L 9 5 L 0 8.8 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect x="0" y="0" width="1060" height="740" fill="#FFFFFF"/>

  <!-- Header -->
  <text x="530" y="32" text-anchor="middle" class="title">XFeat 端到端网络架构与双模式（稀疏 / 半稠密）推理总览</text>
  <text x="530" y="54" text-anchor="middle" class="subtitle">早期极浅通道 + 通道约三倍递增主干 · 独立并行 8×8 关键点分支 · 无高分辨率特征图的轻量 MLP 偏移精修</text>

  <!-- ==================== INPUT NODE ==================== -->
  <rect x="20" y="218" width="124" height="106" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.8"/>
  <text x="82" y="248" text-anchor="middle" class="node-title" fill="#111827">输入灰度图像 I</text>
  <text x="82" y="272" text-anchor="middle" class="node-dim" fill="#374151">[B, 1, H, W]</text>
  <text x="82" y="294" text-anchor="middle" class="node-sub" fill="#4B5563">保持高分辨率输入</text>
  <text x="82" y="311" text-anchor="middle" class="node-sub" fill="#4B5563">训练: 600×800</text>

  <!-- Input Split Arrows -->
  <path d="M 82 218 L 82 146 L 194 146" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="134" y="138" text-anchor="middle" class="edge-label" fill="#153B60">并行分支</text>

  <path d="M 144 271 L 192 271" fill="none" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <text x="168" y="262" text-anchor="middle" class="edge-label" fill="#1F5138">主干</text>

  <!-- ==================== UPPER BRANCH: KEYPOINT HEAD ==================== -->
  <rect x="174" y="72" width="866" height="140" rx="12" fill="#F7FBFF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="192" y="94" class="section-title" fill="#153B60">独立并行关键点分支（Keypoint Head · 专注低层角点/边缘结构，避免与小主干描述子争抢容量）</text>

  <!-- KP Node 1 -->
  <rect x="198" y="108" width="176" height="84" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.6"/>
  <text x="286" y="132" text-anchor="middle" class="node-title" fill="#153B60">8×8 网格重排 (Unfold)</text>
  <text x="286" y="153" text-anchor="middle" class="node-dim" fill="#1E40AF">[B, 64, H/8, W/8]</text>
  <text x="286" y="174" text-anchor="middle" class="node-sub" fill="#153B60">空间缩小 8 倍，保留像素粒度</text>

  <path d="M 374 150 L 406 150" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- KP Node 2 -->
  <rect x="410" y="108" width="176" height="84" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.6"/>
  <text x="498" y="132" text-anchor="middle" class="node-title" fill="#153B60">4 层 1×1 卷积</text>
  <text x="498" y="153" text-anchor="middle" class="node-dim" fill="#1E40AF">[B, 65, H/8, W/8]</text>
  <text x="498" y="174" text-anchor="middle" class="node-sub" fill="#153B60">64 格内位置 + 1 Dustbin</text>

  <path d="M 586 150 L 618 150" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- KP Node 3 -->
  <rect x="622" y="108" width="178" height="84" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.6"/>
  <text x="711" y="132" text-anchor="middle" class="node-title" fill="#153B60">Softmax + 丢弃 Dustbin</text>
  <text x="711" y="153" text-anchor="middle" class="node-dim" fill="#1E40AF">重排还原 (Fold back)</text>
  <text x="711" y="174" text-anchor="middle" class="node-sub" fill="#153B60">64 通道折叠回 8×8 像素块</text>

  <path d="M 800 150 L 832 150" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- KP Output K -->
  <rect x="836" y="108" width="184" height="84" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="928" y="132" text-anchor="middle" class="node-title" fill="#422578">关键点热力图 K</text>
  <text x="928" y="153" text-anchor="middle" class="node-dim" fill="#5B21B6">[B, 1, H, W]</text>
  <text x="928" y="174" text-anchor="middle" class="node-sub" fill="#422578">训练由 ALIKE-Tiny 蒸馏监督</text>

  <!-- ==================== MIDDLE BRANCH: BACKBONE + DESCRIPTOR & RELIABILITY ==================== -->
  <rect x="174" y="226" width="866" height="252" rx="12" fill="#F6FBF8" stroke="#86EFAC" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="192" y="248" class="section-title" fill="#1F5138">超轻量主干网络 + 多尺度 FPN 描述子与可靠性分支（Featherweight Backbone &amp; Descriptor Head）</text>

  <!-- 6 Convolutional Blocks -->
  <!-- Block 1 -->
  <rect x="196" y="264" width="90" height="72" rx="7" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="241" y="285" text-anchor="middle" class="node-title" fill="#153B60">Block 1</text>
  <text x="241" y="304" text-anchor="middle" class="node-dim" fill="#1E40AF">C = 4</text>
  <text x="241" y="322" text-anchor="middle" class="node-sub" fill="#153B60">H × W</text>

  <path d="M 286 300 L 304 300" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Block 2 -->
  <rect x="308" y="264" width="90" height="72" rx="7" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="353" y="285" text-anchor="middle" class="node-title" fill="#153B60">Block 2</text>
  <text x="353" y="304" text-anchor="middle" class="node-dim" fill="#1E40AF">C = 8</text>
  <text x="353" y="322" text-anchor="middle" class="node-sub" fill="#153B60">H/2 × W/2</text>

  <path d="M 398 300 L 416 300" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow-gray)"/>

  <!-- Block 3 -->
  <rect x="420" y="264" width="92" height="72" rx="7" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="466" y="285" text-anchor="middle" class="node-title" fill="#153B60">Block 3</text>
  <text x="466" y="304" text-anchor="middle" class="node-dim" fill="#1E40AF">C = 24</text>
  <text x="466" y="322" text-anchor="middle" class="node-sub" fill="#153B60">H/4 × W/4</text>

  <path d="M 512 300 L 530 300" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- Block 4 (1/8) -->
  <rect x="534" y="264" width="102" height="72" rx="7" fill="#E8F1EC" stroke="#46A171" stroke-width="1.8"/>
  <text x="585" y="285" text-anchor="middle" class="node-title" fill="#1F5138">Block 4 (1/8)</text>
  <text x="585" y="304" text-anchor="middle" class="node-dim" fill="#166534">C = 64</text>
  <text x="585" y="322" text-anchor="middle" class="node-sub" fill="#1F5138">H/8 × W/8</text>

  <path d="M 636 300 L 654 300" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- Block 5 (1/16) -->
  <rect x="658" y="264" width="106" height="72" rx="7" fill="#E8F1EC" stroke="#46A171" stroke-width="1.8"/>
  <text x="711" y="285" text-anchor="middle" class="node-title" fill="#1F5138">Block 5 (1/16)</text>
  <text x="711" y="304" text-anchor="middle" class="node-dim" fill="#166534">C = 64</text>
  <text x="711" y="322" text-anchor="middle" class="node-sub" fill="#1F5138">H/16 × W/16</text>

  <path d="M 764 300 L 782 300" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>

  <!-- Block 6 (1/32) -->
  <rect x="786" y="264" width="110" height="72" rx="7" fill="#E8F1EC" stroke="#46A171" stroke-width="1.8"/>
  <text x="841" y="285" text-anchor="middle" class="node-title" fill="#1F5138">Block 6 (1/32)</text>
  <text x="841" y="304" text-anchor="middle" class="node-dim" fill="#166534">C = 128</text>
  <text x="841" y="322" text-anchor="middle" class="node-sub" fill="#1F5138">H/32 × W/32</text>

  <!-- Basic Layer Note Box -->
  <rect x="912" y="266" width="110" height="68" rx="7" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"/>
  <text x="967" y="285" text-anchor="middle" class="node-dim" fill="#111827">Basic Layer</text>
  <text x="967" y="303" text-anchor="middle" class="node-sub" fill="#4B5563">Conv + ReLU + BN</text>
  <text x="967" y="321" text-anchor="middle" class="node-sub" fill="#4B5563">Stride=2 降采样</text>

  <!-- Three FPN Arrows Going Down & Left to FPN Fusion -->
  <!-- From Block 4 (1/8) -->
  <path d="M 585 336 L 585 358 L 285 358 L 285 384" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="480" y="353" text-anchor="middle" class="edge-label" fill="#1F5138">1/8 直接传入</text>

  <!-- From Block 5 (1/16) -->
  <path d="M 711 336 L 711 368 L 308 368 L 308 384" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="645" y="365" text-anchor="middle" class="edge-label" fill="#1F5138">双线性上采样 2×</text>

  <!-- From Block 6 (1/32) -->
  <path d="M 841 336 L 841 376 L 330 376 L 330 384" fill="none" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)"/>
  <text x="778" y="373" text-anchor="middle" class="edge-label" fill="#1F5138">1×1 降维至 64 + 上采样 4×</text>

  <!-- FPN Sum Node -->
  <rect x="196" y="388" width="194" height="76" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6"/>
  <text x="293" y="411" text-anchor="middle" class="node-title" fill="#1F5138">多尺度 FPN 逐元素相加 (+)</text>
  <text x="293" y="431" text-anchor="middle" class="node-dim" fill="#166534">[B, 64, H/8, W/8]</text>
  <text x="293" y="451" text-anchor="middle" class="node-sub" fill="#1F5138">融合 1/8 + 1/16 + 1/32 感受野</text>

  <path d="M 390 426 L 420 426" fill="none" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Fusion Block -->
  <rect x="424" y="388" width="142" height="76" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6"/>
  <text x="495" y="411" text-anchor="middle" class="node-title" fill="#1F5138">Fusion Block</text>
  <text x="495" y="431" text-anchor="middle" class="node-dim" fill="#166534">3 层 Basic Layer</text>
  <text x="495" y="451" text-anchor="middle" class="node-sub" fill="#1F5138">提炼紧凑局部语义</text>

  <path d="M 566 426 L 596 426" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- Output F: Descriptors -->
  <rect x="600" y="388" width="160" height="76" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="680" y="411" text-anchor="middle" class="node-title" fill="#422578">稠密描述子图 F</text>
  <text x="680" y="431" text-anchor="middle" class="node-dim" fill="#5B21B6">[B, 64, H/8, W/8]</text>
  <text x="680" y="451" text-anchor="middle" class="node-sub" fill="#422578">64 维紧凑浮点特征</text>

  <path d="M 760 426 L 786 426" fill="none" stroke="#46A171" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Reliability Head -->
  <rect x="790" y="394" width="90" height="64" rx="7" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="835" y="421" text-anchor="middle" class="node-title" fill="#1F5138">可靠性头</text>
  <text x="835" y="442" text-anchor="middle" class="node-sub" fill="#1F5138">卷积回归</text>

  <path d="M 880 426 L 902 426" fill="none" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- Output R: Reliability Map -->
  <rect x="906" y="388" width="118" height="76" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8"/>
  <text x="965" y="411" text-anchor="middle" class="node-title" fill="#422578">可靠性图 R</text>
  <text x="965" y="431" text-anchor="middle" class="node-dim" fill="#5B21B6">[B, 1, H/8, W/8]</text>
  <text x="965" y="451" text-anchor="middle" class="node-sub" fill="#422578">可匹配概率</text>

  <!-- ==================== ROUTING ARROWS TO DUAL MODES ==================== -->
  <!-- Routing bus label -->
  <path d="M 680 464 L 680 492 L 266 492 L 266 510" fill="none" stroke="#8B5CF6" stroke-width="1.7" marker-end="url(#arrow-purple)"/>
  <path d="M 965 464 L 965 492 L 792 492 L 792 510" fill="none" stroke="#D5803B" stroke-width="1.7" marker-end="url(#arrow-orange)"/>
  <path d="M 680 492 L 792 492" fill="none" stroke="#D5803B" stroke-width="1.7"/>
  <!-- K routing line along far right edge into Mode 1 tag -->
  <path d="M 1020 150 L 1050 150 L 1050 492 L 965 492" fill="none" stroke="#8B5CF6" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="415" y="488" text-anchor="middle" class="edge-label" fill="#422578">共享同一套预训练权重：输入 K + F + R</text>
  <text x="860" y="488" text-anchor="middle" class="edge-label" fill="#70401C">输入两尺度 F + R（跳过 K）</text>

  <!-- ==================== LOWER LEFT: SPARSE MODE (XFeat) ==================== -->
  <rect x="20" y="514" width="498" height="174" rx="12" fill="#FAF5FF" stroke="#C4B5FD" stroke-width="1.6"/>
  <text x="38" y="538" class="section-title" fill="#422578">推理模式一：稀疏特征匹配 XFeat（使用 K + F + R）</text>

  <rect x="36" y="554" width="144" height="86" rx="8" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5"/>
  <text x="108" y="578" text-anchor="middle" class="node-title" fill="#153B60">联合打分取点</text>
  <text x="108" y="599" text-anchor="middle" class="node-dim" fill="#1E40AF">score = K(i,j)·R(i,j)</text>
  <text x="108" y="620" text-anchor="middle" class="node-sub" fill="#153B60">最多保留 4,096 点</text>

  <path d="M 180 597 L 200 597" fill="none" stroke="#46A171" stroke-width="1.7" marker-end="url(#arrow-green)"/>

  <rect x="204" y="554" width="142" height="86" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="275" y="578" text-anchor="middle" class="node-title" fill="#1F5138">双三次插值采样</text>
  <text x="275" y="599" text-anchor="middle" class="node-dim" fill="#166534">输出 [N, 64]</text>
  <text x="275" y="620" text-anchor="middle" class="node-sub" fill="#1F5138">从粗图 F 读取描述子</text>

  <path d="M 346 597 L 366 597" fill="none" stroke="#8B5CF6" stroke-width="1.7" marker-end="url(#arrow-purple)"/>

  <rect x="370" y="554" width="132" height="86" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="436" y="578" text-anchor="middle" class="node-title" fill="#422578">MNN 稀疏匹配</text>
  <text x="436" y="599" text-anchor="middle" class="node-dim" fill="#5B21B6">27.1 FPS (CPU)</text>
  <text x="436" y="620" text-anchor="middle" class="node-sub" fill="#422578">比 ALIKE 快约 5×</text>

  <text x="38" y="670" class="footnote">适用场景：基于 SfM 地图的视觉定位（HLoc）、SLAM 视觉前端、实时单应配准</text>

  <!-- ==================== LOWER RIGHT: SEMI-DENSE MODE (XFeat*) ==================== -->
  <rect x="542" y="514" width="498" height="174" rx="12" fill="#FFFBF5" stroke="#FDBA74" stroke-width="1.6"/>
  <text x="560" y="538" class="section-title" fill="#70401C">推理模式二：半稠密匹配 XFeat*（0.65 &amp; 1.3 两尺度 · 仅用 F + R）</text>

  <rect x="558" y="554" width="136" height="86" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5"/>
  <text x="626" y="578" text-anchor="middle" class="node-title" fill="#1F5138">按 R 筛 Top-10k</text>
  <text x="626" y="599" text-anchor="middle" class="node-dim" fill="#166534">子集 Fs [M, 64]</text>
  <text x="626" y="620" text-anchor="middle" class="node-sub" fill="#1F5138">可缓存粗特征省算力</text>

  <path d="M 694 597 L 714 597" fill="none" stroke="#D5803B" stroke-width="1.7" marker-end="url(#arrow-orange)"/>

  <rect x="718" y="554" width="150" height="86" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.7"/>
  <text x="793" y="578" text-anchor="middle" class="node-title" fill="#70401C">MNN + MLP 精修</text>
  <text x="793" y="599" text-anchor="middle" class="node-dim" fill="#9A3412">concat(fa, fb) → 128-D</text>
  <text x="793" y="620" text-anchor="middle" class="node-sub" fill="#70401C">预测 8×8 像素偏移 o</text>

  <path d="M 868 597 L 888 597" fill="none" stroke="#8B5CF6" stroke-width="1.7" marker-end="url(#arrow-purple)"/>

  <rect x="892" y="554" width="132" height="86" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.6"/>
  <text x="958" y="578" text-anchor="middle" class="node-title" fill="#422578">半稠密像素匹配</text>
  <text x="958" y="599" text-anchor="middle" class="node-dim" fill="#5B21B6">19.2 FPS (CPU)</text>
  <text x="958" y="620" text-anchor="middle" class="node-sub" fill="#422578">置信度 &gt; 0.2 过滤</text>

  <text x="560" y="670" class="footnote">适用场景：弱纹理相机位姿估计、宽基线匹配、稠密 3D 重建（精修额外开销仅 +11%）</text>

  <!-- ==================== LEGEND BAR ==================== -->
  <g transform="translate(155, 706)">
    <rect x="0" y="0" width="16" height="14" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.3"/>
    <text x="24" y="11" class="footnote">输入 / 基础层</text>

    <rect x="132" y="0" width="16" height="14" rx="3" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.3"/>
    <text x="156" y="11" class="footnote">编码 / 关键点检测</text>

    <rect x="292" y="0" width="16" height="14" rx="3" fill="#E8F1EC" stroke="#46A171" stroke-width="1.3"/>
    <text x="316" y="11" class="footnote">FPN 融合 / 匹配提取</text>

    <rect x="462" y="0" width="16" height="14" rx="3" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.3"/>
    <text x="486" y="11" class="footnote">MLP 偏移精修（核心创新）</text>

    <rect x="658" y="0" width="16" height="14" rx="3" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.3"/>
    <text x="682" y="11" class="footnote">网络输出 / 最终结果</text>
  </g>
</svg>
