<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400">
  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; }
      .sub { font-size: 13.5px; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; }
      .s { font-size: 12px; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="980" height="400" fill="#FFFFFF" rx="12"/>

  <text x="490" y="36" text-anchor="middle" class="title" fill="#111827">图 1：XFeat 整体工作流程（宏观全景）</text>
  <text x="490" y="60" text-anchor="middle" class="sub" fill="#4B5563">单张灰度图双路分流 → 独立关键点分支 + 超轻量主干 FPN → 一套权重按需切换稀疏 / 半稠密匹配</text>

  <!-- Stage 1: Input -->
  <rect x="24" y="86" width="166" height="258" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="107" y="114" text-anchor="middle" class="h" fill="#1E293B">① 灰度图输入</text>

  <!-- Mini grayscale image with building + corners -->
  <rect x="42" y="132" width="130" height="112" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.8"/>
  <polygon points="58,196 102,158 146,196" fill="#CBD5E1" stroke="#64748B" stroke-width="1.5"/>
  <rect x="70" y="196" width="64" height="36" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="94" y="210" width="16" height="22" fill="#94A3B8"/>
  <circle cx="102" cy="158" r="5" fill="#2563EB"/>
  <circle cx="70" cy="196" r="5" fill="#16A34A"/>
  <circle cx="134" cy="196" r="5" fill="#F97316"/>
  <circle cx="134" cy="232" r="5" fill="#7C3AED"/>

  <text x="107" y="272" text-anchor="middle" class="b" fill="#1E293B" font-weight="700">单通道灰度图 I</text>
  <text x="107" y="295" text-anchor="middle" class="s" fill="#6B7280">保住高分辨率输入</text>
  <text x="107" y="316" text-anchor="middle" class="s" fill="#6B7280">不牺牲像素级精度</text>

  <!-- Split arrows 1 -> 2 (clean gray stem + colored branches) -->
  <line x1="190" y1="215" x2="208" y2="215" stroke="#64748B" stroke-width="2.4"/>
  <path d="M 208 215 L 208 172 L 228 172" fill="none" stroke="#16A34A" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <path d="M 208 215 L 208 278 L 228 278" fill="none" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arr-blue)"/>
  <circle cx="208" cy="215" r="3" fill="#64748B"/>

  <!-- Stage 2: Parallel Dual Branches -->
  <rect x="234" y="86" width="246" height="258" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="357" y="114" text-anchor="middle" class="h" fill="#1E3A8A">② 双路并行提取</text>

  <!-- Top Branch: Keypoint Head -->
  <rect x="252" y="130" width="210" height="88" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.8"/>
  <text x="357" y="155" text-anchor="middle" class="h" fill="#166534">独立关键点分支</text>
  <text x="357" y="178" text-anchor="middle" class="b" fill="#14532D" font-weight="700">8×8 重排 + 4 层 1×1 卷积</text>
  <text x="357" y="200" text-anchor="middle" class="s" fill="#15803D">不抢主干容量 · 极速找角点</text>

  <!-- Bottom Branch: Backbone + FPN -->
  <rect x="252" y="232" width="210" height="94" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.8"/>
  <text x="357" y="257" text-anchor="middle" class="h" fill="#1D4ED8">超轻量主干 + FPN</text>
  <text x="357" y="280" text-anchor="middle" class="b" fill="#1E3A8A" font-weight="700">通道 4→8→24→64→64→128</text>
  <text x="357" y="302" text-anchor="middle" class="s" fill="#2563EB">早窄晚宽降算力 · 融合三尺度</text>

  <!-- Arrows 2 -> 3 -->
  <line x1="480" y1="164" x2="516" y2="164" stroke="#16A34A" stroke-width="2.4" marker-end="url(#arr-green)"/>
  <line x1="480" y1="274" x2="516" y2="274" stroke="#2563EB" stroke-width="2.4" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Three Compact Outputs -->
  <rect x="522" y="86" width="174" height="258" rx="12" fill="#FFF7ED" stroke="#F97316" stroke-width="2"/>
  <text x="609" y="114" text-anchor="middle" class="h" fill="#9A3412">③ 三大紧凑输出</text>

  <rect x="538" y="130" width="142" height="58" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.6"/>
  <text x="609" y="154" text-anchor="middle" class="b" fill="#166534" font-weight="700">关键点热力图 K</text>
  <text x="609" y="175" text-anchor="middle" class="s" fill="#15803D">原图分辨率 H×W</text>

  <rect x="538" y="200" width="142" height="58" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="609" y="224" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">粗描述子图 F</text>
  <text x="609" y="245" text-anchor="middle" class="s" fill="#2563EB">1/8 粗网格 · 64 维</text>

  <rect x="538" y="270" width="142" height="58" rx="8" fill="#F5F3FF" stroke="#A78BFA" stroke-width="1.6"/>
  <text x="609" y="294" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">可靠性图 R</text>
  <text x="609" y="315" text-anchor="middle" class="s" fill="#6D28D9">1/8 网格 · 好不好配</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="696" y1="215" x2="732" y2="215" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 4: Dual Inference Modes -->
  <rect x="738" y="86" width="218" height="258" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="847" y="114" text-anchor="middle" class="h" fill="#5B21B6">④ 一套权重 · 双模式</text>

  <!-- Sparse Mode -->
  <rect x="754" y="130" width="186" height="94" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.6"/>
  <text x="847" y="151" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">稀疏模式 XFeat</text>
  <text x="847" y="170" text-anchor="middle" class="s" fill="#374151">K·R 挑 4k 点 → MNN 匹配</text>
  <rect x="772" y="180" width="56" height="34" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <rect x="866" y="180" width="56" height="34" rx="4" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.2"/>
  <line x1="788" y1="190" x2="882" y2="192" stroke="#2563EB" stroke-width="1.8"/>
  <line x1="812" y1="204" x2="904" y2="202" stroke="#16A34A" stroke-width="1.8"/>
  <circle cx="788" cy="190" r="3.5" fill="#2563EB"/><circle cx="882" cy="192" r="3.5" fill="#2563EB"/>
  <circle cx="812" cy="204" r="3.5" fill="#16A34A"/><circle cx="904" cy="202" r="3.5" fill="#16A34A"/>

  <!-- Semi-Dense Mode -->
  <rect x="754" y="236" width="186" height="94" rx="8" fill="#FFFFFF" stroke="#A78BFA" stroke-width="1.6"/>
  <text x="847" y="257" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">半稠密模式 XFeat*</text>
  <text x="847" y="276" text-anchor="middle" class="s" fill="#374151">R 筛 10k 粗配 → MLP 精修</text>
  <rect x="772" y="286" width="56" height="34" rx="4" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <rect x="866" y="286" width="56" height="34" rx="4" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <line x1="784" y1="294" x2="878" y2="294" stroke="#7C3AED" stroke-width="1.5"/>
  <line x1="798" y1="302" x2="892" y2="302" stroke="#2563EB" stroke-width="1.5"/>
  <line x1="812" y1="310" x2="906" y2="309" stroke="#16A34A" stroke-width="1.5"/>
  <line x1="786" y1="312" x2="880" y2="313" stroke="#EA580C" stroke-width="1.5"/>
  <circle cx="784" cy="294" r="3" fill="#7C3AED"/><circle cx="878" cy="294" r="3" fill="#7C3AED"/>
  <circle cx="798" cy="302" r="3" fill="#2563EB"/><circle cx="892" cy="302" r="3" fill="#2563EB"/>
  <circle cx="812" cy="310" r="3" fill="#16A34A"/><circle cx="906" cy="309" r="3" fill="#16A34A"/>
  <circle cx="786" cy="312" r="3" fill="#EA580C"/><circle cx="880" cy="313" r="3" fill="#EA580C"/>

  <!-- Footer -->
  <text x="490" y="376" text-anchor="middle" class="s" fill="#6B7280">全程不维护高分辨率描述子图、零硬件定制：普通笔记本 CPU 实测 27.1 FPS（稀疏）/ 19.2 FPS（半稠密）</text>
</svg>