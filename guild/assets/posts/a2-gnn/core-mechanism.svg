<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 780" width="1080" height="780">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 12.5px; fill: #4B5563; }
      .panel-title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 14.5px; font-weight: 700; fill: #111827; }
      .step-title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .body { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 11.5px; }
      .small { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 10.5px; }
      .code { font-family: Consolas, "Courier New", "Microsoft YaHei", monospace; font-size: 11px; font-weight: 600; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2783DE" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#46A171" />
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D5803B" />
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect x="0" y="0" width="1080" height="780" fill="#FFFFFF" />

  <!-- Main Title -->
  <text x="540" y="32" text-anchor="middle" class="title">A2-GNN 两大核心创新机制拆解图解</text>
  <text x="540" y="53" text-anchor="middle" class="subtitle">机制一：角度-环形卷积自注意力（保留近邻空间拓扑与相机射线夹角） · 机制二：纯方位向量离群点剔除（释放对极几何共识）</text>

  <!-- ========================================================================= -->
  <!-- PART A: ANGLE-ANNULAR CONVOLUTION SELF-ATTENTION                          -->
  <!-- ========================================================================= -->
  <rect x="20" y="68" width="1040" height="456" rx="12" fill="#FAFCFB" stroke="#46A171" stroke-width="1.6" />
  <rect x="34" y="80" width="470" height="26" rx="6" fill="#E8F1EC" stroke="#46A171" stroke-width="1" />
  <text x="48" y="98" class="panel-title" fill="#1F5138">机制一：角度-环形卷积（Angle-Annular Convolution）四步连环拆解</text>
  <text x="520" y="98" class="small" fill="#4B5563">默认超参：近邻数 k = 9，按欧氏距离分 g = 3 环（每环 k/g = 3 个邻居），特征维度 d = 128</text>

  <!-- STEP 1: K-NN RING PARTITIONING -->
  <rect x="34" y="118" width="234" height="390" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.4" />
  <text x="151" y="140" text-anchor="middle" class="step-title" fill="#111827">Step 1 · 建图与距离排序分环</text>
  <text x="151" y="158" text-anchor="middle" class="small" fill="#4B5563">为每个节点找欧氏空间 k=9 最近邻</text>

  <!-- Concentric Rings Visualization -->
  <g transform="translate(151, 258)">
    <!-- Outer ring (Remote) -->
    <circle cx="0" cy="0" r="82" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="5,4" />
    <!-- Middle ring -->
    <circle cx="0" cy="0" r="56" fill="#F0F8FF" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="5,4" />
    <!-- Inner ring (Close) -->
    <circle cx="0" cy="0" r="30" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1.5" stroke-dasharray="4,3" />

    <!-- Rays from center to neighbors -->
    <line x1="0" y1="0" x2="-16" y2="-14" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="20" y2="-6" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="-4" y2="21" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="-42" y2="-20" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="36" y2="-28" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="26" y2="38" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="-66" y2="26" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="10" y2="-72" stroke="#9CA3AF" stroke-width="1" />
    <line x1="0" y1="0" x2="64" y2="34" stroke="#9CA3AF" stroke-width="1" />

    <!-- Close Neighbors (3 dark blue) -->
    <circle cx="-16" cy="-14" r="5.5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="20" cy="-6" r="5.5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="-4" cy="21" r="5.5" fill="#1D4ED8" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Middle Neighbors (3 medium blue) -->
    <circle cx="-42" cy="-20" r="5.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="36" cy="-28" r="5.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />
    <circle cx="26" cy="38" r="5.5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.2" />

    <!-- Remote Neighbors (3 light blue) -->
    <circle cx="-66" cy="26" r="5.5" fill="#93C5FD" stroke="#1E40AF" stroke-width="1.2" />
    <circle cx="10" cy="-72" r="5.5" fill="#93C5FD" stroke="#1E40AF" stroke-width="1.2" />
    <circle cx="64" cy="34" r="5.5" fill="#93C5FD" stroke="#1E40AF" stroke-width="1.2" />

    <!-- Central Node (orange) -->
    <circle cx="0" cy="0" r="7.5" fill="#D5803B" stroke="#FFFFFF" stroke-width="1.6" />
    <text x="0" y="3.5" text-anchor="middle" font-family="Arial" font-size="9" font-weight="700" fill="#FFFFFF">i</text>
  </g>

  <!-- Ring Legend inside Step 1 -->
  <circle cx="54" cy="364" r="5" fill="#D5803B" />
  <text x="66" y="368" class="small" fill="#111827">中心节点 f_i</text>
  <circle cx="156" cy="364" r="5" fill="#1D4ED8" />
  <text x="168" y="368" class="small" fill="#111827">近环 (Close, 3点)</text>

  <circle cx="54" cy="384" r="5" fill="#3B82F6" />
  <text x="66" y="388" class="small" fill="#111827">中环 (Mid, 3点)</text>
  <circle cx="156" cy="384" r="5" fill="#93C5FD" stroke="#1E40AF" stroke-width="1" />
  <text x="168" y="388" class="small" fill="#111827">远环 (Rem, 3点)</text>

  <!-- Edge Feature Formula Box -->
  <rect x="46" y="402" width="210" height="92" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.2" />
  <text x="151" y="422" text-anchor="middle" class="step-title" fill="#111827">按距离从近到远排列边特征</text>
  <text x="151" y="442" text-anchor="middle" class="code" fill="#153B60">e_ij = cat[ f_i , f_i - f_ij ]</text>
  <text x="151" y="460" text-anchor="middle" class="code" fill="#2783DE">形状: [k, 2d] = [9, 256]</text>
  <text x="151" y="480" text-anchor="middle" class="small" fill="#4B5563">隐式编码了“近→中→远”的距离顺序</text>

  <!-- Arrow Step 1 -> Step 2 (upper & lower) -->
  <path d="M 268 230 L 296 230" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <path d="M 268 410 L 296 410" fill="none" stroke="#D5803B" stroke-width="1.8" marker-end="url(#arr-orange)" />

  <!-- STEP 2 UPPER: ANNULAR CONVOLUTION ON EDGE FEATURES -->
  <rect x="299" y="118" width="446" height="196" rx="10" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.5" />
  <text x="522" y="140" text-anchor="middle" class="step-title" fill="#153B60">Step 2A · 环形卷积支路（提取近/中/远三环结构特征 f_ann）</text>

  <!-- 9-column grouped grid -->
  <text x="378" y="162" text-anchor="middle" class="small" fill="#153B60">排序后的 9 条边 [9, 2d]</text>
  <!-- Group 1: Close -->
  <rect x="314" y="170" width="12" height="44" rx="2" fill="#1D4ED8" />
  <rect x="328" y="170" width="12" height="44" rx="2" fill="#1D4ED8" />
  <rect x="342" y="170" width="12" height="44" rx="2" fill="#1D4ED8" />
  <text x="334" y="228" text-anchor="middle" class="small" fill="#1D4ED8">近(3)</text>
  <!-- Group 2: Middle -->
  <rect x="360" y="170" width="12" height="44" rx="2" fill="#3B82F6" />
  <rect x="374" y="170" width="12" height="44" rx="2" fill="#3B82F6" />
  <rect x="388" y="170" width="12" height="44" rx="2" fill="#3B82F6" />
  <text x="380" y="228" text-anchor="middle" class="small" fill="#2563EB">中(3)</text>
  <!-- Group 3: Remote -->
  <rect x="406" y="170" width="12" height="44" rx="2" fill="#93C5FD" stroke="#1E40AF" stroke-width="0.8" />
  <rect x="420" y="170" width="12" height="44" rx="2" fill="#93C5FD" stroke="#1E40AF" stroke-width="0.8" />
  <rect x="434" y="170" width="12" height="44" rx="2" fill="#93C5FD" stroke="#1E40AF" stroke-width="0.8" />
  <text x="426" y="228" text-anchor="middle" class="small" fill="#1E40AF">远(3)</text>

  <!-- Arrow -> g1 -->
  <line x1="450" y1="192" x2="474" y2="192" stroke="#2783DE" stroke-width="1.6" marker-end="url(#arr-blue)" />

  <!-- Conv g1 box -->
  <rect x="477" y="164" width="106" height="58" rx="6" fill="#FFFFFF" stroke="#2783DE" stroke-width="1.2" />
  <text x="530" y="182" text-anchor="middle" class="step-title" fill="#153B60">卷积 g_1</text>
  <text x="530" y="198" text-anchor="middle" class="code" fill="#2783DE">kernel 1×(k/g)</text>
  <text x="530" y="213" text-anchor="middle" class="small" fill="#4B5563">1×3 环内聚合+BN+ReLU</text>

  <!-- Arrow -> 3 ring tokens -->
  <line x1="583" y1="192" x2="603" y2="192" stroke="#2783DE" stroke-width="1.6" marker-end="url(#arr-blue)" />

  <!-- 3 Ring Feature Bars -->
  <rect x="606" y="170" width="12" height="44" rx="2" fill="#1D4ED8" />
  <rect x="621" y="170" width="12" height="44" rx="2" fill="#3B82F6" />
  <rect x="636" y="170" width="12" height="44" rx="2" fill="#93C5FD" stroke="#1E40AF" stroke-width="0.8" />
  <text x="627" y="228" text-anchor="middle" class="code" fill="#153B60">[3, d]</text>

  <!-- Arrow -> g2 -->
  <line x1="652" y1="192" x2="668" y2="192" stroke="#2783DE" stroke-width="1.6" marker-end="url(#arr-blue)" />

  <!-- Conv g2 box -->
  <rect x="671" y="164" width="64" height="58" rx="6" fill="#FFFFFF" stroke="#2783DE" stroke-width="1.2" />
  <text x="703" y="182" text-anchor="middle" class="step-title" fill="#153B60">g_2</text>
  <text x="703" y="198" text-anchor="middle" class="code" fill="#2783DE">1×g</text>
  <text x="703" y="213" text-anchor="middle" class="small" fill="#4B5563">跨环聚合</text>

  <!-- Formula Strip for 2A -->
  <rect x="314" y="248" width="416" height="52" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1" />
  <text x="522" y="268" text-anchor="middle" class="code" fill="#153B60">f_ann^(t+1) = g_2( g_1( e_ij^(t) ) )   →   输出维度 [1, d] = [1, 128]</text>
  <text x="522" y="288" text-anchor="middle" class="small" fill="#374151">先在近/中/远三环内部各提炼 1 个环特征，再跨 3 环融合，把径向层次结构保留下来</text>

  <!-- STEP 2 LOWER: ANGLE EMBEDDING + INDEPENDENT ANNULAR CONV -->
  <rect x="299" y="328" width="446" height="180" rx="10" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.5" />
  <text x="522" y="350" text-anchor="middle" class="step-title" fill="#70401C">Step 2B · 相机射线夹角嵌入支路（补充视角空间角度特征 f_ang）</text>

  <!-- Mini Geometric Diagram (like Fig 3) -->
  <rect x="314" y="362" width="166" height="132" rx="8" fill="#FFFFFF" stroke="#E5B993" stroke-width="1.2" />
  <g transform="translate(332, 468)">
    <!-- Camera centre O -->
    <circle cx="0" cy="0" r="4.5" fill="#111827" />
    <text x="-4" y="16" class="small" fill="#111827">相机光心 O</text>
    <!-- Ray a to Node -->
    <line x1="0" y1="0" x2="118" y2="-16" stroke="#D5803B" stroke-width="2" marker-end="url(#arr-orange)" />
    <circle cx="122" cy="-17" r="4.5" fill="#D5803B" />
    <text x="78" y="-2" class="small" fill="#70401C">节点射线 a</text>
    <!-- Ray b to Neighbor -->
    <line x1="0" y1="0" x2="96" y2="-76" stroke="#2783DE" stroke-width="2" marker-end="url(#arr-blue)" />
    <circle cx="100" cy="-79" r="4.5" fill="#2783DE" />
    <text x="48" y="-66" class="small" fill="#153B60">近邻射线 b</text>
    <!-- Angle arc theta -->
    <path d="M 38 -5 A 38 38 0 0 0 30 -24" fill="none" stroke="#46A171" stroke-width="2" />
    <text x="45" y="-22" class="code" fill="#1F5138">θ</text>
  </g>

  <!-- Angle Calculation & Annular Conv Pipeline -->
  <line x1="480" y1="422" x2="498" y2="422" stroke="#D5803B" stroke-width="1.6" marker-end="url(#arr-orange)" />

  <rect x="501" y="366" width="122" height="58" rx="6" fill="#FFFFFF" stroke="#D5803B" stroke-width="1.2" />
  <text x="562" y="384" text-anchor="middle" class="code" fill="#70401C">cos(θ) = a·b / |a||b|</text>
  <text x="562" y="401" text-anchor="middle" class="small" fill="#4B5563">θ ∈ (0, π) 角度边</text>
  <text x="562" y="416" text-anchor="middle" class="code" fill="#D5803B">E_ang : [9, 1]</text>

  <line x1="623" y1="395" x2="640" y2="395" stroke="#D5803B" stroke-width="1.6" marker-end="url(#arr-orange)" />

  <rect x="643" y="366" width="88" height="58" rx="6" fill="#FFFFFF" stroke="#D5803B" stroke-width="1.2" />
  <text x="687" y="384" text-anchor="middle" class="step-title" fill="#70401C">独立环形卷积</text>
  <text x="687" y="400" text-anchor="middle" class="code" fill="#D5803B">g_4( g_3(·) )</text>
  <text x="687" y="416" text-anchor="middle" class="small" fill="#4B5563">输出 f_ang [1,d]</text>

  <rect x="501" y="438" width="230" height="54" rx="6" fill="#FFFFFF" stroke="#E5B993" stroke-width="1" />
  <text x="616" y="458" text-anchor="middle" class="code" fill="#70401C">f_aa = f_ann + f_ang   [1, 128]</text>
  <text x="616" y="478" text-anchor="middle" class="small" fill="#374151">补齐“同距不同向”时的空间几何区分度</text>

  <!-- Arrows Step 2 -> Step 3 -->
  <path d="M 745 216 L 774 216" fill="none" stroke="#2783DE" stroke-width="1.8" marker-end="url(#arr-blue)" />
  <path d="M 745 418 L 774 418" fill="none" stroke="#D5803B" stroke-width="1.8" marker-end="url(#arr-orange)" />

  <!-- STEP 3: DUAL-TRACK COMPLEMENTARY FUSION -->
  <rect x="777" y="118" width="269" height="390" rx="10" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6" />
  <text x="911" y="140" text-anchor="middle" class="step-title" fill="#1F5138">Step 3 · 双轨互补与 2 次迭代融合</text>
  <text x="911" y="158" text-anchor="middle" class="small" fill="#1F5138">既要“置换不变性”，也要“空间层次感”</text>

  <!-- Track 1: Maxpooling -->
  <rect x="791" y="172" width="241" height="86" rx="8" fill="#FFFFFF" stroke="#46A171" stroke-width="1.2" />
  <text x="911" y="191" text-anchor="middle" class="step-title" fill="#1F5138">轨道 A：Maxpooling 支路</text>
  <text x="911" y="210" text-anchor="middle" class="code" fill="#1F5138">f_max^(t+1) = max h_θ( e_ij^(t) )</text>
  <text x="911" y="229" text-anchor="middle" class="small" fill="#374151">✓ 严格满足点序置换不变性，抗近邻抖动</text>
  <text x="911" y="246" text-anchor="middle" class="small" fill="#6B7280">✗ 单用会丢弃大部分非极大邻居结构</text>

  <!-- Plus icon -->
  <circle cx="911" cy="276" r="12" fill="#46A171" />
  <text x="911" y="281" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#FFFFFF">+</text>

  <!-- Track 2: Angle-Annular -->
  <rect x="791" y="294" width="241" height="86" rx="8" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" />
  <text x="911" y="313" text-anchor="middle" class="step-title" fill="#70401C">轨道 B：角度-环形支路 (f_aa)</text>
  <text x="911" y="332" text-anchor="middle" class="code" fill="#70401C">f_aa^(t+1) = f_ann^(t+1) + f_ang^(t+1)</text>
  <text x="911" y="351" text-anchor="middle" class="small" fill="#70401C">✓ 捕捉近/中/远拓扑与相机射线夹角</text>
  <text x="911" y="368" text-anchor="middle" class="small" fill="#70401C">✓ 2D/3D 同名点拥有相似局部几何指纹</text>

  <!-- Arrow down to final fusion -->
  <line x1="911" y1="380" x2="911" y2="400" stroke="#46A171" stroke-width="1.6" marker-end="url(#arr-green)" />

  <!-- Final Eq (10) Fusion -->
  <rect x="791" y="403" width="241" height="92" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5" />
  <text x="911" y="422" text-anchor="middle" class="step-title" fill="#422578">2 次迭代多尺度拼接融合 (Eq. 10)</text>
  <text x="911" y="441" text-anchor="middle" class="code" fill="#422578">h_θ1(cat[f^(0), f_max^(1), f_max^(2)])</text>
  <text x="911" y="458" text-anchor="middle" class="code" fill="#422578">+ h_θ2(cat[f^(0), f_aa^(1), f_aa^(2)])</text>
  <text x="911" y="481" text-anchor="middle" class="small" fill="#422578">输出 f_self [1, 128] → 送入 Cross-Attention</text>

  <!-- ========================================================================= -->
  <!-- PART B: OUTLIER REJECTION INPUT COMPARISON                                -->
  <!-- ========================================================================= -->
  <rect x="20" y="542" width="1040" height="220" rx="12" fill="#FFFDF9" stroke="#D5803B" stroke-width="1.6" />
  <rect x="34" y="554" width="490" height="26" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1" />
  <text x="48" y="572" class="panel-title" fill="#70401C">机制二：为什么离群点剔除（OR）要把输入改回“纯方位向量”？</text>
  <text x="538" y="572" class="small" fill="#4B5563">MegaDepth Top-10 检索消融实证（原论文 Table 3 &amp; Table 4）</text>

  <!-- Left Comparison Card: Previous Methods -->
  <rect x="34" y="592" width="452" height="154" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.5" />
  <text x="260" y="615" text-anchor="middle" class="step-title" fill="#111827">传统做法（GoMatch / DGC-GNN）：输入 GNN 增强特征</text>
  <line x1="50" y1="624" x2="470" y2="624" stroke="#D1D5DB" stroke-width="1" />

  <rect x="50" y="636" width="180" height="44" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <text x="140" y="655" text-anchor="middle" class="code" fill="#374151">输入: cat[f_p^G, f_q^G]</text>
  <text x="140" y="672" text-anchor="middle" class="small" fill="#6B7280">高维特征（混杂 RGB + 匹配编码）</text>

  <line x1="230" y1="658" x2="254" y2="658" stroke="#4B5563" stroke-width="1.5" marker-end="url(#arr-gray)" />

  <rect x="257" y="636" width="212" height="44" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <text x="363" y="655" text-anchor="middle" class="body" fill="#374151">PointCN 离群点分类器</text>
  <text x="363" y="672" text-anchor="middle" class="small" fill="#6B7280">难以从中还原显式对极几何约束</text>

  <text x="54" y="704" class="body" fill="#374151">• 痛点 1：GNN 特征要同时讨好 OT 匹配和 OR 分类，两个任务目标冲突</text>
  <text x="54" y="726" class="body" fill="#374151">• 痛点 2：RGB 与上下文混合稀释了精确坐标 → 同样 A2-GNN 仅得 AUC@5px = 52.01%</text>

  <!-- Center VS / Arrow -->
