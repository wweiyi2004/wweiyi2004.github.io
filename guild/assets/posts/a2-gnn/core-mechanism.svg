<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 2：角度-环形特征提取（Angle-Annular）——给每个点装上“同心圆雷达”</text>
  <text x="480" y="62" text-anchor="middle" class="sub">传统 k-NN 把近邻远邻混为一锅粥；A2-GNN 按距离切成近/中/远三环并编码射线夹角</text>

  <!-- Left: Traditional Max-pooling -->
  <rect x="28" y="88" width="414" height="280" rx="12" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
  <text x="235" y="118" text-anchor="middle" class="h" fill="#991B1B">✗ 传统 GoMatch：全部 k 近邻一锅端 MaxPool</text>
  <circle cx="235" cy="212" r="76" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.8" stroke-dasharray="5,3"/>
  <circle cx="235" cy="212" r="9" fill="#DC2626"/><text x="235" y="216" text-anchor="middle" fill="#FFF" font-size="11" font-weight="700">p</text>
  <circle cx="212" cy="196" r="5" fill="#64748B"/><circle cx="258" cy="222" r="5" fill="#64748B"/>
  <circle cx="182" cy="176" r="5" fill="#64748B"/><circle cx="288" cy="182" r="5" fill="#64748B"/>
  <circle cx="192" cy="256" r="5" fill="#64748B"/><circle cx="276" cy="260" r="5" fill="#64748B"/>
  <text x="235" y="318" text-anchor="middle" class="b" fill="#7F1D1D">贴身近邻和远圈邻居全混在一起，丢失空间层次！</text>
  <text x="235" y="344" text-anchor="middle" class="s" fill="#991B1B">局部几何指纹区分度弱</text>

  <!-- Right: A2-GNN Annular Rings + Angles -->
  <rect x="466" y="88" width="466" height="280" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="699" y="118" text-anchor="middle" class="h" fill="#166534">✓ A2-GNN：近/中/远三圈环形卷积 + 射线夹角</text>
  <!-- 3 concentric rings -->
  <circle cx="608" cy="216" r="82" fill="#FFF7ED" stroke="#F97316" stroke-width="1.8"/>
  <circle cx="608" cy="216" r="54" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.8"/>
  <circle cx="608" cy="216" r="28" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.8"/>
  <!-- Angle ray indicator (drawn behind center node p) -->
  <line x1="608" y1="216" x2="644" y2="194" stroke="#7C3AED" stroke-width="2"/>
  <line x1="608" y1="216" x2="668" y2="252" stroke="#7C3AED" stroke-width="2"/>
  <circle cx="608" cy="216" r="9" fill="#1E3A8A"/><text x="608" y="220" text-anchor="middle" fill="#FFF" font-size="11" font-weight="700">p</text>
  <!-- Ring dots -->
  <circle cx="592" cy="204" r="4.5" fill="#2563EB"/><circle cx="624" cy="222" r="4.5" fill="#2563EB"/>
  <circle cx="572" cy="188" r="4.5" fill="#16A34A"/><circle cx="644" cy="194" r="4.5" fill="#16A34A"/>
  <circle cx="552" cy="256" r="4.5" fill="#EA580C"/><circle cx="668" cy="252" r="4.5" fill="#EA580C"/>

  <!-- Legend boxes on right side -->
  <rect x="716" y="140" width="194" height="44" rx="7" fill="#EFF6FF" stroke="#3B82F6"/><text x="813" y="167" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">内环（Ring 1）：贴身细节</text>
  <rect x="716" y="194" width="194" height="44" rx="7" fill="#DCFCE7" stroke="#16A34A"/><text x="813" y="221" text-anchor="middle" class="b" fill="#15803D" font-weight="700">中环（Ring 2）：局部骨架</text>
  <rect x="716" y="248" width="194" height="44" rx="7" fill="#FFF7ED" stroke="#F97316"/><text x="813" y="275" text-anchor="middle" class="b" fill="#C2410C" font-weight="700">外环（Ring 3）：外围轮廓</text>
  <text x="699" y="330" text-anchor="middle" class="b" fill="#14532D">分圈独立卷积 + 紫色射线夹角嵌入 → 构造极强旋转不变局部指纹！</text>

</svg>