<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 650" width="1080" height="650">
  <defs>
    <style>
      .title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 12.5px; fill: #4B5563; }
      .sec-title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13.5px; font-weight: 700; }
      .box-title { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 13px; font-weight: 700; }
      .box-text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 11.5px; }
      .dim-text { font-family: Consolas, "Courier New", "Microsoft YaHei", monospace; font-size: 11px; font-weight: 600; }
      .note-text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 11px; fill: #374151; }
      .badge-text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size: 10.5px; font-weight: 700; }
    </style>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4B5563" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#D5803B" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#46A171" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8B5CF6" />
    </marker>
  </defs>

  <!-- Pure White Background -->
  <rect x="0" y="0" width="1080" height="650" fill="#FFFFFF" />

  <!-- Header -->
  <text x="540" y="34" text-anchor="middle" class="title">A2-GNN 端到端无描述子 2D-3D 匹配与视觉重定位架构总览</text>
  <text x="540" y="56" text-anchor="middle" class="subtitle">不存储视觉描述子 · 仅凭方位向量 (BV) 与 RGB 颜色完成匹配 · 参数量 2.7M (~10.6 MB) · 单图推理约 34 ms (V100, k=1)</text>

  <!-- Stage Header Badges -->
  <rect x="24" y="76" width="186" height="24" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1" />
  <text x="117" y="92" text-anchor="middle" class="badge-text" fill="#111827">① 统一输入表征</text>

  <rect x="236" y="76" width="152" height="24" rx="12" fill="#E5F2FC" stroke="#2783DE" stroke-width="1" />
  <text x="312" y="92" text-anchor="middle" class="badge-text" fill="#153B60">② 双流特征编码 (~2 ms)</text>

  <rect x="414" y="76" width="272" height="24" rx="12" fill="#E8F1EC" stroke="#46A171" stroke-width="1" />
  <text x="550" y="92" text-anchor="middle" class="badge-text" fill="#1F5138">③ A2-GNN 几何增强 (~14 ms)</text>

  <rect x="712" y="76" width="154" height="24" rx="12" fill="#E8F1EC" stroke="#46A171" stroke-width="1" />
  <text x="789" y="92" text-anchor="middle" class="badge-text" fill="#1F5138">④ 最优传输 (~9 ms)</text>

  <rect x="892" y="76" width="164" height="24" rx="12" fill="#FBEBDE" stroke="#D5803B" stroke-width="1" />
  <text x="974" y="92" text-anchor="middle" class="badge-text" fill="#70401C">⑤ 剔除与位姿 (~6 ms)</text>

  <!-- ================= COLUMN 1: INPUTS ================= -->
  <!-- 2D Query Input Box -->
  <rect x="24" y="116" width="186" height="156" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6" />
  <text x="117" y="139" text-anchor="middle" class="box-title" fill="#111827">2D 查询图像关键点 P</text>
  <line x1="38" y1="148" x2="196" y2="148" stroke="#D1D5DB" stroke-width="1" />
  <text x="117" y="168" text-anchor="middle" class="box-text" fill="#374151">像素坐标 (u, v) + 相机内参 K</text>
  <rect x="38" y="178" width="158" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <text x="117" y="194" text-anchor="middle" class="dim-text" fill="#111827">[b_p^T, 1]^T = K^-1[u, v, 1]^T</text>
  <text x="117" y="208" text-anchor="middle" class="dim-text" fill="#2783DE">方位向量 b_p : [M, 2]</text>
  <rect x="38" y="222" width="158" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <text x="117" y="238" text-anchor="middle" class="box-text" fill="#374151">关键点处采样像素颜色</text>
  <text x="117" y="252" text-anchor="middle" class="dim-text" fill="#46A171">RGB 颜色 c_p : [M, 3]</text>

  <!-- Middle Modality Pill -->
  <rect x="38" y="286" width="158" height="24" rx="6" fill="#F9FAFB" stroke="#D1D5DB" stroke-dasharray="4,3" stroke-width="1" />
  <text x="117" y="302" text-anchor="middle" class="note-text">统一映射至 z=1 相机射线平面</text>

  <!-- 3D Database Input Box -->
  <rect x="24" y="324" width="186" height="156" rx="10" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.6" />
  <text x="117" y="347" text-anchor="middle" class="box-title" fill="#111827">Top-k 检索 3D 点云 Q</text>
  <line x1="38" y1="356" x2="196" y2="356" stroke="#D1D5DB" stroke-width="1" />
  <text x="117" y="376" text-anchor="middle" class="box-text" fill="#374151">世界坐标 p^w + 检索库位姿 R, t</text>
  <rect x="38" y="386" width="158" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <text x="117" y="402" text-anchor="middle" class="dim-text" fill="#111827">p^c = Rp^w+t, b_q = p^c/p_z^c</text>
  <text x="117" y="416" text-anchor="middle" class="dim-text" fill="#2783DE">方位向量 b_q : [N, 2]</text>
  <rect x="38" y="430" width="158" height="36" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1" />
  <text x="117" y="446" text-anchor="middle" class="box-text" fill="#374151">3D 点自带颜色属性</text>
  <text x="117" y="460" text-anchor="middle" class="dim-text" fill="#46A171">RGB 颜色 c_q : [N, 3]</text>

  <!-- ================= COLUMN 2: ENCODER ================= -->
  <!-- 2D Encoder -->
  <rect x="236" y="132" width="152" height="124" rx="10" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.6" />
  <text x="312" y="156" text-anchor="middle" class="box-title" fill="#153B60">ResNet 特征编码器</text>
  <text x="312" y="176" text-anchor="middle" class="box-text" fill="#153B60">位置分支 F_b(b_p)</text>
  <text x="312" y="194" text-anchor="middle" class="box-text" fill="#153B60">+ 颜色分支 F_c(c_p)</text>
  <rect x="252" y="208" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#2783DE" stroke-width="1" />
  <text x="312" y="223" text-anchor="middle" class="dim-text" fill="#153B60">初始特征 f_p</text>
  <text x="312" y="237" text-anchor="middle" class="dim-text" fill="#2783DE">[M, 128]</text>

  <!-- Shared Weight Connector -->
  <line x1="312" y1="256" x2="312" y2="340" stroke="#2783DE" stroke-width="1.4" stroke-dasharray="4,3" />
  <rect x="266" y="286" width="92" height="22" rx="11" fill="#E5F2FC" stroke="#2783DE" stroke-width="1" />
  <text x="312" y="301" text-anchor="middle" class="badge-text" fill="#153B60">共享编码权重</text>

  <!-- 3D Encoder -->
  <rect x="236" y="340" width="152" height="124" rx="10" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.6" />
  <text x="312" y="364" text-anchor="middle" class="box-title" fill="#153B60">ResNet 特征编码器</text>
  <text x="312" y="384" text-anchor="middle" class="box-text" fill="#153B60">位置分支 F_b(b_q)</text>
  <text x="312" y="402" text-anchor="middle" class="box-text" fill="#153B60">+ 颜色分支 F_c(c_q)</text>
  <rect x="252" y="416" width="120" height="34" rx="6" fill="#FFFFFF" stroke="#2783DE" stroke-width="1" />
  <text x="312" y="431" text-anchor="middle" class="dim-text" fill="#153B60">初始特征 f_q</text>
  <text x="312" y="445" text-anchor="middle" class="dim-text" fill="#2783DE">[N, 128]</text>

  <!-- ================= COLUMN 3: A2-GNN ================= -->
  <rect x="414" y="116" width="272" height="364" rx="12" fill="#F4FAF7" stroke="#46A171" stroke-width="1.8" />
  <text x="550" y="138" text-anchor="middle" class="sec-title" fill="#1F5138">A2-GNN 局部几何与跨模态图网络</text>

  <!-- Self-Attention 2D -->
  <rect x="428" y="152" width="132" height="136" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.4" />
  <text x="494" y="172" text-anchor="middle" class="box-title" fill="#1F5138">2D 自注意力层</text>
  <text x="494" y="190" text-anchor="middle" class="box-text" fill="#1F5138">欧氏 k=9 近邻图</text>
  <rect x="438" y="198" width="112" height="22" rx="4" fill="#FFFFFF" stroke="#46A171" stroke-width="1" />
  <text x="494" y="213" text-anchor="middle" class="box-text" fill="#1F5138">Maxpooling 支路</text>
  <rect x="438" y="226" width="112" height="24" rx="4" fill="#FBEBDE" stroke="#D5803B" stroke-width="1" />
  <text x="494" y="242" text-anchor="middle" class="box-text" fill="#70401C">角度-环形卷积(g=3)</text>
  <text x="494" y="274" text-anchor="middle" class="dim-text" fill="#1F5138">2次更新 → [M, 128]</text>

  <!-- Self-Attention 3D -->
  <rect x="428" y="328" width="132" height="136" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.4" />
  <text x="494" y="348" text-anchor="middle" class="box-title" fill="#1F5138">3D 自注意力层</text>
  <text x="494" y="366" text-anchor="middle" class="box-text" fill="#1F5138">欧氏 k=9 近邻图</text>
  <rect x="438" y="374" width="112" height="22" rx="4" fill="#FFFFFF" stroke="#46A171" stroke-width="1" />
  <text x="494" y="389" text-anchor="middle" class="box-text" fill="#1F5138">Maxpooling 支路</text>
  <rect x="438" y="402" width="112" height="24" rx="4" fill="#FBEBDE" stroke="#D5803B" stroke-width="1" />
  <text x="494" y="418" text-anchor="middle" class="box-text" fill="#70401C">角度-环形卷积(g=3)</text>
  <text x="494" y="450" text-anchor="middle" class="dim-text" fill="#1F5138">2次更新 → [N, 128]</text>

  <!-- Self-Attention note between 2D & 3D -->
  <text x="494" y="312" text-anchor="middle" class="note-text" fill="#1F5138">双轨融合 f_self</text>

  <!-- Cross-Attention Box -->
  <rect x="576" y="176" width="96" height="264" rx="8" fill="#E8F1EC" stroke="#46A171" stroke-width="1.5" />
  <text x="624" y="204" text-anchor="middle" class="box-title" fill="#1F5138">跨模态</text>
  <text x="624" y="222" text-anchor="middle" class="box-title" fill="#1F5138">交叉注意力</text>
  <text x="624" y="242" text-anchor="middle" class="box-text" fill="#1F5138">(Cross-Attn)</text>
  <line x1="588" y1="254" x2="660" y2="254" stroke="#A7D3BC" stroke-width="1" />
  <text x="624" y="276" text-anchor="middle" class="box-text" fill="#1F5138">2D ↔ 3D</text>
  <text x="624" y="294" text-anchor="middle" class="box-text" fill="#1F5138">全连接交互</text>
  <text x="624" y="318" text-anchor="middle" class="dim-text" fill="#1F5138">softmax(q^Tk/√d)</text>
  <text x="624" y="338" text-anchor="middle" class="box-text" fill="#1F5138">+ 残差 MLP</text>
  <line x1="588" y1="354" x2="660" y2="354" stroke="#A7D3BC" stroke-width="1" />
  <text x="624" y="376" text-anchor="middle" class="dim-text" fill="#153B60">f_p^G [M,128]</text>
  <text x="624" y="396" text-anchor="middle" class="dim-text" fill="#153B60">f_q^G [N,128]</text>
  <text x="624" y="422" text-anchor="middle" class="note-text" fill="#1F5138">仅服务于匹配</text>

  <!-- ================= COLUMN 4: OPTIMAL TRANSPORT ================= -->
  <rect x="712" y="152" width="154" height="292" rx="10" fill="#E8F1EC" stroke="#46A171" stroke-width="1.6" />
  <text x="789" y="178" text-anchor="middle" class="box-title" fill="#1F5138">最优传输匹配 (OT)</text>
  <line x1="726" y1="188" x2="852" y2="188" stroke="#A7D3BC" stroke-width="1" />

  <rect x="724" y="200" width="130" height="44" rx="6" fill="#FFFFFF" stroke="#46A171" stroke-width="1" />
  <text x="789" y="218" text-anchor="middle" class="box-text" fill="#1F5138">L2 距离代价矩阵</text>
  <text x="789" y="235" text-anchor="middle" class="dim-text" fill="#1F5138">M : [M, N]</text>

  <line x1="789" y1="244" x2="789" y2="262" stroke="#46A171" stroke-width="1.4" marker-end="url(#arrow-green)" />

  <rect x="724" y="264" width="130" height="46" rx="6" fill="#FFFFFF" stroke="#46A171" stroke-width="1" />
  <text x="789" y="282" text-anchor="middle" class="box-text" fill="#1F5138">扩展 Dustbin 垃圾桶</text>
  <text x="789" y="299" text-anchor="middle" class="dim-text" fill="#1F5138">M' : [M+1, N+1]</text>

  <line x1="789" y1="310" x2="789" y2="328" stroke="#46A171" stroke-width="1.4" marker-end="url(#arrow-green)" />

  <rect x="724" y="330" width="130" height="48" rx="6" fill="#FFFFFF" stroke="#46A171" stroke-width="1" />
  <text x="789" y="349" text-anchor="middle" class="box-text" fill="#1F5138">可微 Sinkhorn 求解</text>
  <text x="789" y="367" text-anchor="middle" class="box-text" fill="#1F5138">+ 互近邻筛选 (MNN)</text>

  <rect x="724" y="392" width="130" height="38" rx="6" fill="#FBEBDE" stroke="#D5803B" stroke-width="1" />
  <text x="789" y="408" text-anchor="middle" class="box-text" fill="#70401C">初始匹配 M_init</text>
  <text x="789" y="423" text-anchor="middle" class="dim-text" fill="#70401C">共 N_c 对候选点</text>

  <!-- ================= COLUMN 5: OUTLIER REJECTION & POSE ================= -->
  <!-- Outlier Rejection Box -->
  <rect x="892" y="136" width="164" height="170" rx="10" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.8" />
  <text x="974" y="160" text-anchor="middle" class="box-title" fill="#70401C">离群点剔除 (OR)</text>
  <text x="974" y="178" text-anchor="middle" class="box-text" fill="#70401C">PointCN 内点分类器</text>
  <line x1="906" y1="188" x2="1042" y2="188" stroke="#E5B993" stroke-width="1" />
  <rect x="904" y="198" width="140" height="48" rx="6" fill="#FFFFFF" stroke="#D5803B" stroke-width="1.2" />
  <text x="974" y="216" text-anchor="middle" class="badge-text" fill="#D5803B">核心创新：改用纯 BV</text>
  <text x="974" y="234" text-anchor="middle" class="dim-text" fill="#70401C">输入 (b_p, b_q): [N_c, 4]</text>
  <text x="974" y="268" text-anchor="middle" class="box-text" fill="#70401C">预测内点概率 p_i</text>
  <text x="974" y="288" text-anchor="middle" class="dim-text" fill="#70401C">筛选 p_i &gt; t (默认 0.5)</text>

  <!-- Output / PnP-RANSAC Box -->
  <rect x="892" y="342" width="164" height="138" rx="10" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.8" />
  <text x="974" y="366" text-anchor="middle" class="box-title" fill="#422578">最终输出与位姿估计</text>
  <line x1="906" y1="376" x2="1042" y2="376" stroke="#C4B5FD" stroke-width="1" />
  <rect x="904" y="386" width="140" height="32" rx="6" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1" />
  <text x="974" y="407" text-anchor="middle" class="box-text" fill="#422578">精炼 2D-3D 匹配 M_final</text>
  <text x="974" y="438" text-anchor="middle" class="box-text" fill="#422578">送入 PnP-RANSAC</text>
  <text x="974" y="460" text-anchor="middle" class="box-title" fill="#422578">6-DoF 相机位姿 (R, t)</text>

  <!-- ================= ARROWS BETWEEN MODULES ================= -->
  <!-- Col 1 -> Col 2 -->
  <line x1="210" y1="194" x2="233" y2="194" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow-dark)" />
  <line x1="210" y1="402" x2="233" y2="402" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow-dark)" />

  <!-- Col 2 -> Col 3 (Self-Attn) -->
  <line x1="388" y1="194" x2="425" y2="194" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow-dark)" />
  <line x1="388" y1="402" x2="425" y2="402" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow-dark)" />

  <!-- Self-Attn -> Cross-Attn -->
  <line x1="560" y1="220" x2="573" y2="220" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <line x1="560" y1="396" x2="573" y2="396" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)" />

  <!-- Cross-Attn -> OT -->
  <line x1="672" y1="248" x2="709" y2="248" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)" />
  <line x1="672" y1="364" x2="709" y2="364" stroke="#46A171" stroke-width="1.6" marker-end="url(#arrow-green)" />

  <!-- OT -> OR (indices of initial matches M_init) -->
  <path d="M 866 411 L 879 411 L 879 221 L 889 221" fill="none" stroke="#4B5563" stroke-width="1.6" marker-end="url(#arrow-dark)" />

  <!-- OR -> Output -->
  <line x1="974" y1="306" x2="974" y2="339" stroke="#8B5CF6" stroke-width="1.8" marker-end="url(#arrow-purple)" />

  <!-- ================= PURE BV SKIP CONNECTION TO OUTLIER REJECTION ================= -->
  <path d="M 117 480 L 117 526 L 950 526 L 950 322 L 950 309" fill="none" stroke="#D5803B" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-orange)" />
  <!-- Also branch from 2D BV box down to the skip bus -->
  <path d="M 24 196 L 12 196 L 12 526 L 117 526" fill="none" stroke="#D5803B" stroke-width="1.8" stroke-dasharray="6,4" />
  <rect x="292" y="512" width="466" height="26" rx="13" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" />
  <text x="525" y="529" text-anchor="middle" class="badge-text" fill="#70401C">纯方位向量 (b_p, b_q) 旁路直连：为离群点剔除提供纯净的对极几何位置约束，避免混入 RGB/匹配特征干扰</text>

  <!-- ================= BOTTOM SUMMARY & LEGEND BAR ================= -->
  <rect x="24" y="556" width="1032" height="76" rx="10" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.2" />

  <!-- Training Loss Callout -->
  <text x="42" y="578" class="sec-title" fill="#111827">训练阶段双目标监督：</text>
  <text x="196" y="578" class="note-text">总损失 L = L_m（基于扩展分配矩阵 P~ 的负对数似然匹配损失） + L_or（基于初始匹配 M_init 的加权二元交叉熵离群点损失）</text>

  <!-- Color Legend -->
  <rect x="42" y="596" width="16" height="16" rx="3" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2" />
  <text x="66" y="608" class="note-text">输入 / 数据表征</text>

  <rect x="190" y="596" width="16" height="16" rx="3" fill="#E5F2FC" stroke="#2783DE" stroke-width="1.2" />
  <text x="214" y="608" class="note-text">特征编码模块</text>

  <rect x="330" y="596" width="16" height="16" rx="3" fill="#E8F1EC" stroke="#46A171" stroke-width="1.2" />
  <text x="354" y="608" class="note-text">GNN 图注意力 / 最优传输匹配</text>

  <rect x="556" y="596" width="16" height="16" rx="3" fill="#FBEBDE" stroke="#D5803B" stroke-width="1.2" />
  <text x="580" y="608" class="note-text">A2-GNN 核心创新 / 离群点剔除</text>

  <rect x="794" y="596" width="16" height="16" rx="3" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.2" />
  <text x="818" y="608" class="note-text">最终匹配结果与 6-DoF 位姿</text>
</svg>
