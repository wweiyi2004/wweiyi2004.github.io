<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390">

  <defs>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", Arial, sans-serif; }
      .title { font-size: 20px; font-weight: 700; fill: #111827; }
      .sub { font-size: 13.5px; fill: #4B5563; }
      .h { font-size: 15px; font-weight: 700; }
      .b { font-size: 13px; fill: #374151; }
      .s { font-size: 12px; fill: #6B7280; }
      .mono { font-family: Consolas, "Courier New", monospace; font-weight: 700; }
    </style>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16A34A"/>
    </marker>
    <marker id="arr-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA580C"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7C3AED"/>
    </marker>
  </defs>

  <rect width="960" height="390" fill="#FFFFFF" rx="12"/>

  <text x="480" y="38" text-anchor="middle" class="title">图 1：A2-GNN（3DV 2025）无描述子视觉重定位整体流程</text>
  <text x="480" y="62" text-anchor="middle" class="sub">把 2D 与 3D 统一成方位向量 → 角度-环形卷积刻画局部指纹 → 跨模态交互与纯方位向量去外点</text>

  <rect x="24" y="94" width="190" height="236" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <text x="119" y="122" text-anchor="middle" class="h" fill="#1E293B">① 模态统一编码</text>
  <rect x="42" y="144" width="154" height="72" rx="8" fill="#EFF6FF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="119" y="170" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">2D/3D 统一方位向量</text>
  <text x="119" y="192" text-anchor="middle" class="s">完全不依赖视觉描述子</text>
  <rect x="42" y="230" width="154" height="72" rx="8" fill="#F0FDF4" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="119" y="256" text-anchor="middle" class="b" fill="#15803D" font-weight="700">双分支 ResNet 编码</text>
  <text x="119" y="278" text-anchor="middle" class="s">初始局部几何特征</text>

  <line x1="214" y1="212" x2="246" y2="212" stroke="#64748B" stroke-width="2.5" marker-end="url(#arr-gray)"/>

  <rect x="252" y="94" width="224" height="236" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="364" y="122" text-anchor="middle" class="h" fill="#1E3A8A">② 角度-环形自注意力</text>
  <rect x="270" y="144" width="188" height="72" rx="8" fill="#FFFFFF" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="364" y="170" text-anchor="middle" class="b" fill="#1D4ED8" font-weight="700">近/中/远同心环卷积</text>
  <text x="364" y="192" text-anchor="middle" class="s">保留清晰的径向空间层次</text>
  <rect x="270" y="230" width="188" height="72" rx="8" fill="#DBEAFE" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="364" y="256" text-anchor="middle" class="b" fill="#1E40AF" font-weight="700">相机射线夹角嵌入</text>
  <text x="364" y="278" text-anchor="middle" class="s">+ MaxPool 双轨融合</text>

  <line x1="476" y1="212" x2="508" y2="212" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <rect x="514" y="94" width="204" height="236" rx="12" fill="#F0FDF4" stroke="#22C55E" stroke-width="2"/>
  <text x="616" y="122" text-anchor="middle" class="h" fill="#166534">③ 跨模态匹配</text>
  <rect x="532" y="144" width="168" height="72" rx="8" fill="#FFFFFF" stroke="#4ADE80" stroke-width="1.5"/>
  <text x="616" y="170" text-anchor="middle" class="b" fill="#15803D" font-weight="700">2D ↔ 3D 交叉注意力</text>
  <text x="616" y="192" text-anchor="middle" class="s">比对双方几何指纹</text>
  <rect x="532" y="230" width="168" height="72" rx="8" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="616" y="256" text-anchor="middle" class="b" fill="#14532D" font-weight="700">最优传输（Sinkhorn）</text>
  <text x="616" y="278" text-anchor="middle" class="s">生成候选 2D-3D 匹配</text>

  <line x1="718" y1="212" x2="750" y2="212" stroke="#16A34A" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <rect x="756" y="94" width="180" height="236" rx="12" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="2"/>
  <text x="846" y="122" text-anchor="middle" class="h" fill="#5B21B6">④ 纯方位去外点</text>
  <rect x="774" y="144" width="144" height="72" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="846" y="170" text-anchor="middle" class="b" fill="#6D28D9" font-weight="700">纯方位向量分类器</text>
  <text x="846" y="192" text-anchor="middle" class="s">不看特征，专剔几何外点</text>
  <rect x="774" y="230" width="144" height="72" rx="8" fill="#EDE9FE" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="846" y="256" text-anchor="middle" class="b" fill="#5B21B6" font-weight="700">PnP + RANSAC</text>
  <text x="846" y="278" text-anchor="middle" class="s">6-DoF 重定位刷新 SOTA</text>

  <text x="480" y="366" text-anchor="middle" class="s">算力比 DGC-GNN 更轻巧，同时用“同心圆环 + 射线夹角”把无描述子重定位精度推向新高</text>

</svg>