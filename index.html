<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>try{var t=localStorage.getItem('guild-theme')}catch(e){}document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: light)').matches?'day':'night')</script>
  <title>wweiyi · 个人主页</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Serif+SC:wght@500;700;900&display=swap">
  <link rel="icon" href="favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" href="img/favicon.png" sizes="192x192">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="css/card.css?v=8">
  <link rel="stylesheet" href="css/about.css?v=8">
</head>
<body>
  <main class="stage" id="stage">
    <svg class="card" id="card" viewBox="0 0 1300 770" role="img" aria-labelledby="card-title">
      <title id="card-title">冒险者卡片</title>
    </svg>
  </main>

  <canvas class="fx" id="fx" aria-hidden="true"></canvas>
  <!-- top-right corner: language and day/night (back side only) and the flip -->
  <div class="corner">
    <button class="medal-btn about__lang" type="button" hidden></button>
    <button class="medal-btn about__theme" type="button" hidden></button>
    <button class="flip-switch" id="flip" type="button"></button>
  </div>

  <!-- the back of the card: a plain academic homepage, filled in by js/about.js -->
  <section class="about" id="about" hidden aria-label="学术主页">
    <nav class="about__nav">
      <div class="about__bar"><a class="about__brand" href="#about"></a><ul class="about__menu"></ul></div>
      <div class="about__band" aria-hidden="true"></div>
    </nav>
    <div class="about__page"></div>
  </section>

  <div class="wand" id="wand" aria-hidden="true">
    <!-- Megumin's staff: crescent-fork head cradling a floating Manatite orb, gold bands,
         a metal-wrapped grip and a long wooden shaft. Drawn lying along +x with the orb
         at the origin, then turned 45° so the orb is the pointer's hot spot. -->
    <svg viewBox="0 0 112 112" width="112" height="112">
      <defs>
        <linearGradient id="staffWood" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox">
          <stop offset="0" stop-color="#a27650"/>
          <stop offset="0.5" stop-color="#7d5536"/>
          <stop offset="1" stop-color="#4f331e"/>
        </linearGradient>
        <linearGradient id="staffGrip" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#d9dde2"/>
          <stop offset="0.55" stop-color="#9097a1"/>
          <stop offset="1" stop-color="#5b616b"/>
        </linearGradient>
        <radialGradient id="manatite" cx="0.38" cy="0.32" r="0.75">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="0.25" stop-color="#cfe2ff"/>
          <stop offset="0.6" stop-color="#7f9fd8"/>
          <stop offset="1" stop-color="#3f5aa0"/>
        </radialGradient>
        <filter id="orbGlow" x="-2" y="-2" width="5" height="5">
          <feGaussianBlur stdDeviation="3.2" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g transform="translate(24 24) rotate(45) scale(0.72)" stroke="#2c1b0e" stroke-width="1.4" stroke-linejoin="round">
        <!-- shaft with a slightly flared foot -->
        <path d="M15 -3.3H128L140 -3L150 -5.2L148 0L150 4.6L140 3L128 3.3H15Z" fill="url(#staffWood)"/>
        <!-- metal-wrapped grip -->
        <rect x="50" y="-3.9" width="30" height="7.8" rx="1.2" fill="url(#staffGrip)"/>
        <path d="M56 -3.9V3.9M63 -3.9V3.9M70 -3.9V3.9M76 -3.9V3.9" stroke="#3d424a" stroke-width="1" fill="none"/>
        <!-- crescent-fork head -->
        <path d="M17 -3.3C12 -15 -4 -19 -18 -13.5L-41 -4.5L-16 -6.6C-7 -10.5 3 -10 8.5 -4.2C9.8 -1.6 9.6 1.8 8 4.2C4 9.2 -2 10.6 -8 9.6L-13 12C-3 16.5 10 14 17 3.3Z" fill="url(#staffWood)"/>
        <!-- three gold bands below the head -->
        <path d="M21 -4.3V4.3M26 -4.3V4.3M31 -4.3V4.3" stroke="#e2b23d" stroke-width="3" stroke-linecap="butt"/>
        <!-- floating Manatite -->
        <circle class="orb-glow" r="9.5" fill="#9cc0ff" opacity="0.45" filter="url(#orbGlow)" stroke="none"/>
        <circle r="6.6" fill="url(#manatite)" stroke="#2a3a6a" stroke-width="1"/>
        <path d="M-3.6 -2.4A4.4 4.4 0 0 1 -0.6 -4.4" stroke="#ffffff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <section class="sr-only" id="sr-profile" aria-label="个人信息"></section>

  <script src="js/glyphs.js?v=8"></script>
  <script src="js/profile.js?v=8"></script>
  <script src="js/card.js?v=8"></script>
  <script src="js/academic.js?v=8"></script>
  <script src="js/about.js?v=8"></script>
</body>
</html>
