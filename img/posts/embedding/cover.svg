<text x="492" y="248" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">Tokenizer → Transformer</text>
<text x="492" y="281" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">Pooling → Normalize</text>
