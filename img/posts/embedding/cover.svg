<text x="72" y="428" fill="#cb7028" font-size="25" text-anchor="start" font-weight="700">关键问题：什么决定“近”？</text>
<text x="72" y="466" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">训练数据给出关联，损失函数定义目标，梯度更新参数。</text>
<text x="72" y="499" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">最终学到的是适合特定任务的表示。</text>
