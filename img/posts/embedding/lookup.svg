<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">01 / Embedding 层的前向计算，就是按 ID 取行</title><desc id="desc">示例词表 V = 6，向量维度 d = 4；表中的数值为教学构造</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6c82a2" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="650" rx="22" fill="#f5f8fc"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="48" y="59" fill="#172b4d" font-size="32" text-anchor="start" font-weight="700">01 / Embedding 层的前向计算，就是按 ID 取行</text>
<text x="48" y="98" fill="#50647e" font-size="20" text-anchor="start" font-weight="400">示例词表 V = 6，向量维度 d = 4；表中的数值为教学构造</text>
<path d="M48,120 L1152,120" stroke="#d5deeb" stroke-width="2.5" fill="none"/>
<rect x="48" y="170" width="225" height="140" rx="16" fill="white" stroke="#d5deeb" stroke-width="2"/>
<text x="70" y="210" fill="#3264d5" font-size="25" text-anchor="start" font-weight="700">输入 token</text>
<text x="70" y="248" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">猫 → ID 1</text>
<text x="70" y="281" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">喜欢 → ID 3</text>
<path d="M288,239 L338,239" stroke="#6c82a2" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<text x="370" y="165" fill="#3264d5" font-size="25" text-anchor="start" font-weight="700">可训练矩阵 E ∈ R⁶ˣ⁴</text>
<rect x="355" y="190" width="485" height="44" rx="7" fill="white" stroke="#d5deeb" stroke-width="2"/>
<text x="372" y="219" fill="#172b4d" font-size="21" text-anchor="start" font-weight="400">0  [PAD]</text>
<text x="530" y="219" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">0.0   0.0   0.0   0.0</text>
<rect x="355" y="239" width="485" height="44" rx="7" fill="#e5efff" stroke="#d5deeb" stroke-width="2"/>
<text x="372" y="268" fill="#172b4d" font-size="21" text-anchor="start" font-weight="400">1  猫</text>
<text x="530" y="268" fill="#3264d5" font-size="21" text-anchor="start" font-weight="400">0.2   0.8  −0.1   0.4</text>
<rect x="355" y="288" width="485" height="44" rx="7" fill="white" stroke="#d5deeb" stroke-width="2"/>
<text x="372" y="317" fill="#172b4d" font-size="21" text-anchor="start" font-weight="400">2  狗</text>
<text x="530" y="317" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">0.3   0.7   0.0   0.5</text>
<rect x="355" y="337" width="485" height="44" rx="7" fill="#e5efff" stroke="#d5deeb" stroke-width="2"/>
<text x="372" y="366" fill="#172b4d" font-size="21" text-anchor="start" font-weight="400">3  喜欢</text>
<text x="530" y="366" fill="#3264d5" font-size="21" text-anchor="start" font-weight="400">0.9  −0.2   0.6   0.1</text>
<rect x="355" y="386" width="485" height="44" rx="7" fill="white" stroke="#d5deeb" stroke-width="2"/>
<text x="372" y="415" fill="#172b4d" font-size="21" text-anchor="start" font-weight="400">4  鱼</text>
<text x="530" y="415" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">0.1   0.5   0.7  −0.3</text>
<rect x="355" y="435" width="485" height="44" rx="7" fill="white" stroke="#d5deeb" stroke-width="2"/>
<text x="372" y="464" fill="#172b4d" font-size="21" text-anchor="start" font-weight="400">5  骨头</text>
<text x="530" y="464" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">0.4   0.6   0.3  −0.1</text>
<path d="M850,259 L898,259" stroke="#6c82a2" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="917" y="204" width="235" height="132" rx="16" fill="white" stroke="#d5deeb" stroke-width="2"/>
<text x="939" y="244" fill="#3264d5" font-size="25" text-anchor="start" font-weight="700">取出第 1 行</text>
<text x="939" y="282" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">[0.2, 0.8,</text>
<text x="939" y="315" fill="#50647e" font-size="21" text-anchor="start" font-weight="400"> −0.1, 0.4]</text>
<rect x="48" y="514" width="1104" height="74" rx="16" fill="#edf7f3" stroke="#b8dcd1" stroke-width="2"/>
<text x="74" y="560" fill="#148071" font-size="24" text-anchor="start" font-weight="400">one-hot × E = E[id]；实际实现直接索引，不必创建巨大的 one-hot。</text>
<text x="48" y="626" fill="#50647e" font-size="17" text-anchor="start" font-weight="400">原创示意图 · 用于解释机制，不代表真实模型的测量结果</text>
</g></svg>