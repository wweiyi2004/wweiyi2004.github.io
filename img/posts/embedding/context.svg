<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">03 / 同一个 token，不同上下文</title><desc id="desc">下图按词展示语义；真实 tokenizer 可能把“苹果”拆成多个 token</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6c82a2" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="680" rx="22" fill="#f5f8fc"/>
<g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<text x="48" y="59" fill="#172b4d" font-size="32" text-anchor="start" font-weight="700">03 / 同一个 token，不同上下文</text>
<text x="48" y="98" fill="#50647e" font-size="20" text-anchor="start" font-weight="400">下图按词展示语义；真实 tokenizer 可能把“苹果”拆成多个 token</text>
<path d="M48,120 L1152,120" stroke="#d5deeb" stroke-width="2.5" fill="none"/>
