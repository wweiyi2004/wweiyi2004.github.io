<text x="862" y="246" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">包含“水果”相关线索</text>
<rect x="840" y="376" width="312" height="125" rx="16" fill="white" stroke="#d5deeb" stroke-width="2"/>
