<text x="510" y="378" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">    残差与归一化</text>
<path d="M770,232 L820,232" stroke="#6c82a2" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M770,440 L820,440" stroke="#6c82a2" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="840" y="168" width="312" height="125" rx="16" fill="white" stroke="#d5deeb" stroke-width="2"/>
