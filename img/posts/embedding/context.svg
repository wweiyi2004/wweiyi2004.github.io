<text x="70" y="416" fill="#148071" font-size="25" text-anchor="start" font-weight="700">苹果发布了新款电脑</text>
<text x="70" y="454" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">提示：发布、电脑、品牌</text>
<path d="M420,232 L470,232" stroke="#6c82a2" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<path d="M420,440 L470,440" stroke="#6c82a2" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
<rect x="488" y="168" width="267" height="333" rx="16" fill="#eaf1ff" stroke="#d5deeb" stroke-width="2"/>
