<text x="510" y="246" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">① token 查表</text>
<text x="510" y="279" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">② 加入位置信息</text>
<text x="510" y="312" fill="#50647e" font-size="21" text-anchor="start" font-weight="400">③ 多层注意力</text>
